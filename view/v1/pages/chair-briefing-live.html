<!--
  체어 브리핑 — 개발데이터(api-v1) · 2026-10-19

  사용자 지시: 「#/clinic/chair-briefing 를 실제 api 와 연동하여 정상적으로 체어 현황 정보를 보고,
  체어마다 클릭하면 환자에게 보여줄 내용이 정상적으로 출력되도록 … 환자마다 알맞게 진료를 판정하여」
  설계: docs/develop/체어브리핑/05_실데이터연동_진료판정.md

  · 셸이 `#/clinic/chair-briefing` 에 이 문서를 iframe 으로 띄운다(라운지·키오스크와 같은 모양).
  · `#chair=<체어ID>` 면 **환자 화면**(체어 모니터용 전체 화면)만 그린다 — 셸 `#/clinic/chair-display/<ID>`.
  🔴 판정은 서버가 한다(`/api-v1/chair-briefings`) — 이 문서는 그리기만 한다(CLAUDE.md §3-2d).
  🔴 체어는 덴트웹 체어 목록 그대로다 — 고정 25칸을 만들지 않는다.
  🔴 판정 근거(등급·불일치)는 **직원 카드에만** 그린다. 환자 화면에는 안내 본문만.
  🔴 조회 실패를 「빈 체어」로 그리지 않는다 — 실패라고 말한다(502 = 덴트웹 연결 실패).
  🔴 CDN 없음 — 병원 내부망은 인터넷이 없을 수 있다.
-->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>체어 브리핑</title>
<style>
  :root{
    --ink:#111827; --sub:#4b5563; --muted:#9ca3af; --line:#e5e7eb; --soft:#f9fafb;
    --blue:#2a85ff; --blue-soft:#eff6ff; --green:#047857; --green-soft:#ecfdf5;
    --amber:#b45309; --amber-soft:#fffbeb; --red:#b91c1c; --red-soft:#fef2f2; --teal:#0f766e; --teal-soft:#f0fdfa;
    --font:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#f3f4f6;color:var(--ink);font:14px/1.5 var(--font)}
  .wrap{padding:20px 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  h1{margin:0;font-size:20px;font-weight:800}
  .desc{color:var(--sub);font-size:13px;margin-top:2px}
  .tiny{font-size:12px;color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:600 13px var(--font);color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;background:#f3f4f6;color:#4b5563;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-blue{background:var(--blue-soft);color:#1d4ed8}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .note{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--sub)}
  .warn{background:var(--amber-soft);border:1px solid #fde68a;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--amber)}
  .err{background:var(--red-soft);border:1px solid #fecaca;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
  .chair{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;min-height:150px}
  .chair:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .chair.on{border-color:#6ee7b7;background:#f7fffb}
  .chair .cn{font-size:16px;font-weight:800}
  .chair .dot{position:absolute;right:14px;top:16px;width:10px;height:10px;border-radius:50%;background:#ef4444}
  .chair.on .dot{background:#10b981}
  /* 활성·비활성 아이콘 — #/admin/chair-briefings/monitoring 과 같은 자산·크기(진료 중 gif 71 · 비어 있음 png 56) */
  .chair .ic{display:flex;justify-content:center;align-items:center;min-height:71px}
  .chair .cn{text-align:center;margin-top:4px}
  .legend{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;margin-right:8px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .pt{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .cn + .pt{border-top:0;padding-top:0}
  .pname{font-weight:800;font-size:15px}
  .tx{margin-top:2px;font-size:13px;color:var(--sub);word-break:break-all}
  .rule{margin-top:4px;font-weight:700;font-size:13.5px}
  .why{margin-top:4px;font-size:12px;color:var(--muted)}
  .idle{margin-top:6px;color:var(--red);font-weight:700;font-size:12.5px;text-align:center}
  /* ── 환자 화면 ── */
  .disp{position:fixed;inset:0;background:#fff;overflow:auto;z-index:10}
  .disp-head{display:flex;align-items:center;justify-content:space-between;padding:22px 36px;border-bottom:1px solid var(--line)}
  .disp-body{padding:28px 36px 40px;max-width:1200px}
  .hello{font-size:34px;font-weight:800}
  .hello b{background:linear-gradient(90deg,#fde68a,#fcd34d);padding:0 6px}
  .tname{margin-top:18px;font-size:26px;font-weight:800;color:var(--teal)}
  .tstep{font-size:16px;font-weight:700;color:var(--muted);margin-left:10px}
  .line{margin-top:14px;border-left:6px solid #2dd4bf;background:var(--teal-soft);padding:16px 20px;font-size:24px;font-weight:700;line-height:1.55}
  .secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-top:24px}
  .sec{border:1px solid var(--line);border-radius:16px;padding:16px 20px}
  .sec h3{margin:0 0 8px;font-size:17px;font-weight:800;color:#0f172a}
  .sec li{font-size:18px;line-height:1.6;margin:4px 0}
  .sec ul{margin:0;padding-left:22px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:700 14px var(--font);background:#fff;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .wait{display:flex;height:100vh;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style>
<body>
<div id="app" class="wrap"><div class="tiny">불러오는 중…</div></div>
<script>
/* ══ 로그인 토큰 자동 첨부 (2026-10-19) — iframe 독립 문서라 셸 래퍼가 안 닿는다.
   localStorage['mw_token'] 를 /api 계열 호출에 Bearer 로 붙이고, 401 이면 최상위 창을
   /login 으로 보낸다(같은 출처만). 상세는 desk-lounge.html 머리말 참조. */
(function(){
  var token=''; try{ token=localStorage.getItem('mw_token')||'' }catch(e){}
  var orig=window.fetch;
  function isApi(u){ try{ var x=new URL(u,location.href); return x.origin===location.origin && /^\/(api|api-v0|api-v1|api-v3)\//.test(x.pathname) }catch(e){ return false } }
  var redir=false;
  window.fetch=function(input,init){
    var u=typeof input==='string'?input:(input&&input.url)||'';
    if(token && isApi(u)){ init=init||{}; var h=new Headers(init.headers||(typeof input!=='string'&&input.headers)||{}); if(!h.has('authorization')) h.set('authorization','Bearer '+token); init.headers=h; if(!init.credentials) init.credentials='same-origin'; }
    return orig.call(this,input,init).then(function(r){
      if(r && r.status===401 && isApi(u) && !/\/api\/auth\//.test(u) && !redir){ redir=true; var from=(window.top||window).location.pathname+(window.top||window).location.hash; (window.top||window).location.replace('/login?from='+encodeURIComponent(from)); }
      return r;
    });
  };
})();
</script>
<script>
(function(){
  'use strict'
  var $app=document.getElementById('app')
  var REFRESH_MS=20000
  var STATE={data:null, err:null, at:null, open:null, openIdx:0, timer:null}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) }
  function displayChair(){ var m=/(?:^|[#&])chair=(\d+)/.exec(location.hash); return m?parseInt(m[1],10):null }
  /* 🔴 미리보기(사용자 지시 2026-10-21 — 진료 판정 스크린 「▶」): `#preview=<규칙ID>` 면 덴트웹 체어 현황을 부르지 않고
     그 규칙의 본문만 받아 **환자 화면(renderDisplay)과 같은 그리기**로 보여 준다. 그리기를 둘로 두지 않는다. */
  function previewRule(){ var m=/(?:^|[#&])preview=([^&]+)/.exec(location.hash); return m?decodeURIComponent(m[1]):null }

  async function load(){
    var pr=previewRule()
    if(pr){
      try{
        var r0=await fetch('/api-v1/chair-briefing/preview?rule='+encodeURIComponent(pr),{headers:{accept:'application/json'},cache:'no-store'})
        var j0=null; try{ j0=await r0.json() }catch(e){}
        if(!r0.ok||!j0||j0.ok===false){ STATE.err='미리보기를 불러오지 못했습니다 ('+r0.status+')'+(j0&&j0.error?' — '+j0.error:''); STATE.data=null }
        else{
          STATE.err=null
          /* 체어 하나·환자 하나로 감싸 실제 환자 화면 그리기에 그대로 태운다. 이름은 자리표시(실환자 아님). */
          STATE.data={ chairs:[{ chairId:0, name:'체어 모니터 미리보기', occupants:[{ name:'환자명', content:j0.data.content }] }] }
          STATE.preview=j0.data
        }
      }catch(e){ STATE.err='미리보기를 불러오지 못했습니다 — '+e.message }
      render(); return
    }
    try{
      var r=await fetch('/api-v1/chair-briefings',{headers:{accept:'application/json'},cache:'no-store'})
      var j=null; try{ j=await r.json() }catch(e){}
      if(!r.ok || !j || j.ok===false){
        var code=j&&j.code, msg=j&&j.error
        STATE.err=(r.status===502?'덴트웹에 연결하지 못했습니다 (502) — 체어 현황을 알 수 없습니다.':('체어 현황 조회 실패 ('+r.status+(code?' · '+code:'')+')'))+(msg?' — '+msg:'')
      }else{ STATE.data=j.data; STATE.err=null; STATE.at=new Date() }
    }catch(e){ STATE.err='체어 현황 조회 실패 — '+e.message }
    render()
  }

  function elapsed(raw){
    if(!raw || raw.length<12) return ''
    var d=new Date(+raw.slice(0,4),+raw.slice(4,6)-1,+raw.slice(6,8),+raw.slice(8,10),+raw.slice(10,12))
    var m=Math.floor((Date.now()-d.getTime())/60000)
    return m>=0?(m+'분째'):''
  }

  function decisionBadge(d){
    if(!d) return ''
    var map={both:['b-green','예약·여정 일치'],reservation:[d.review?'b-red':'b-blue',d.review?'판정 불일치 — 확인':'예약 기준'],journey:['b-blue','여정 기준'],none:['b-amber','판정 못 함']}
    var x=map[d.source]||['','']
    return '<span class="badge '+x[0]+'">'+x[1]+'</span>'
  }
  function journeyBadge(j, model){
    if(!model || !model.installed) return '<span class="badge">여정 모델 없음</span>'
    if(!j) return ''
    if(!j.procs) return '<span class="badge">오늘 기록 전</span>'
    return '<span class="badge '+(j.auto?'b-green':'b-amber')+'">여정 '+esc(j.grade)+(j.journeys.length?' · '+esc(j.journeys.join(' / ')):'')+'</span>'
  }

  function renderGrid(){
    var d=STATE.data, model=d&&d.journeyModel
    var h='<div class="card"><div class="row between"><div><h1>체어 브리핑</h1></div>'
      +'<div class="row"><span class="legend" style="color:#059669"><i style="background:#10b981"></i>진료 중</span>'
      +'<span class="legend" style="color:#e11d48"><i style="background:#ef4444"></i>비어 있음</span>'+(STATE.at?'<span class="tiny">'+STATE.at.toLocaleTimeString('ko-KR')+' 기준 · 20초마다 새로 고침</span>':'')
      +'<button class="btn" data-act="reload">↻ 새로고침</button></div></div>'
    // 요약 배지·여정 모델 안내문은 사용자 지시로 뺐다(2026-10-19). 「확인 필요」만 있을 때 남긴다 — 직원이 봐야 할 경고다.
    if(d && d.summary && d.summary.review){
      h+='<div class="row" style="margin-top:10px"><span class="badge b-red">확인 필요 '+d.summary.review+'</span></div>'
    }
    h+='</div>'
    if(STATE.err) h+='<div class="err" style="margin-top:12px">'+esc(STATE.err)+(d?' · 아래는 마지막으로 받은 현황입니다.':'')+'</div>'
    if(d){
      h+='<div class="grid">'
      ;(d.chairs||[]).forEach(function(c){
        h+='<button type="button" class="chair'+(c.occupied?' on':'')+'" data-chair="'+c.chairId+'"><span class="dot"></span>'
          +'<div class="ic">'+(c.occupied
            ?'<img src="/icon/dentist-chair.gif" alt="진료 중 체어" width="71" height="71">'
            :'<img src="/icon/clinic.png" alt="비어 있는 체어" width="56" height="56">')+'</div>'
          +'<div class="cn">'+esc(c.name||('체어 '+c.chairId))+'</div>'
        if(!c.occupants.length){
          h+='<div class="idle">비어 있음'+(c.queued?' · 배정 대기 '+c.queued+'명':'')+'</div>'
        }
        c.occupants.forEach(function(p){
          var r=p.reservation||{}
          h+='<div class="pt"><div class="row between"><span class="pname">'+esc(p.name)+(p.age!=null?' <span class="tiny">만 '+p.age+'세</span>':'')+'</span>'
            +'<span class="tiny">'+esc(p.startedAt||'')+' '+esc(elapsed(p.startedAtRaw))+'</span></div>'
            +'<div class="tx">'+esc(p.text&&p.text.normalized||'(진료 내용 없음)')+'</div>'
            +'<div class="rule">'+esc((p.content&&p.content.title)||'—')+(p.content&&p.content.step?' <span class="tiny">'+esc(p.content.step)+'</span>':'')+'</div>'
            +'<div class="row" style="margin-top:4px">'+decisionBadge(p.decision)+journeyBadge(p.journey, model)+'</div>'
            +(p.decision&&p.decision.review?'<div class="why">'+esc(p.decision.note)+'</div>':'')
            +'</div>'
        })
        if(c.occupants.length && c.queued) h+='<div class="tiny" style="margin-top:6px">배정 대기 '+c.queued+'명</div>'
        h+='</button>'
      })
      h+='</div>'
      if(!(d.chairs||[]).length) h+='<div class="warn" style="margin-top:12px">덴트웹 체어 목록이 비어 있습니다.</div>'
    }
    $app.innerHTML=h
  }

  function renderDisplay(chairId){
    var d=STATE.data
    if(!d){ $app.innerHTML='<div class="disp"><div class="wait">'+(STATE.err?'<div class="err">'+esc(STATE.err)+'</div>':'<div class="tiny">불러오는 중…</div>')+'</div></div>'; return }
    var c=(d.chairs||[]).filter(function(x){return x.chairId===chairId})[0]
    var standalone=displayChair()!=null||previewRule()!=null
    var close=standalone?'':'<button class="btn" data-act="close">✕ 닫기</button>'
    var openNew=standalone?'':'<button class="btn" data-act="open-new" data-id="'+chairId+'">모니터 화면으로 열기 ↗</button>'
    if(!c){ $app.innerHTML='<div class="disp"><div class="disp-head"><b>체어 '+chairId+'</b>'+close+'</div><div class="disp-body"><div class="err">덴트웹 체어 목록에 이 체어가 없습니다.</div></div></div>'; return }
    var occ=c.occupants||[]
    var head='<div class="disp-head"><div class="row"><span style="font-size:20px;font-weight:800">'+esc(c.name)+'</span>'
      +(occ.length>1?'<span class="tabs">'+occ.map(function(p,i){return '<button class="tab'+(i===STATE.openIdx?' on':'')+'" data-idx="'+i+'">'+esc(p.name)+'</button>'}).join('')+'</span>':'')
      +'</div><div class="row">'+openNew+close+'</div></div>'
    if(!occ.length){
      $app.innerHTML='<div class="disp">'+head+'<div class="wait" style="height:auto;padding:120px 0"><div class="tiny" style="font-size:16px">'+esc(c.name)+'</div><div style="font-size:34px;font-weight:800;margin-top:6px">진료 준비 중입니다</div><div class="tiny" style="margin-top:8px">잠시만 기다려 주세요.</div></div></div>'
      return
    }
    var p=occ[Math.min(STATE.openIdx,occ.length-1)], ct=p.content||{}
    var body='<div class="hello"><b>'+esc(p.name)+'</b>님, 반갑습니다.</div>'
      +'<div class="tname">'+esc(ct.title||'오늘 진료')+(ct.step?'<span class="tstep">'+esc(ct.step)+'</span>':'')+'</div>'
      +(ct.line?'<div class="line">'+esc(ct.line)+'</div>':'')
      +((ct.sections||[]).length?'<div class="secs">'+ct.sections.map(function(s){
          return '<div class="sec"><h3>'+esc(s.title)+'</h3><ul>'+s.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'
        }).join('')+'</div>':'')
      +'<div class="tiny" style="margin-top:28px">궁금하신 점은 언제든 말씀해 주세요. 아프시면 손을 들어 알려 주세요.</div>'
    var pv=STATE.preview
    var pvBar=pv?'<div class="tiny" style="background:#eaf3ff;color:#1d4ed8;border-radius:8px;padding:6px 10px;margin:0 0 10px;font-weight:700">미리보기 — 「'+esc(pv.name)+'」으로 판정된 환자에게 체어 모니터에 이렇게 뜹니다'+(pv.enabled===false?' · ⚠️ 이 규칙은 꺼져 있어 지금은 판정에 쓰이지 않습니다':'')+'</div>':''
    $app.innerHTML='<div class="disp">'+pvBar+head+'<div class="disp-body">'+body+'</div></div>'
  }

  function render(){
    var dc=displayChair()
    if(previewRule()!=null){ renderDisplay(0); return }
    if(dc!=null){ renderDisplay(dc); return }
    if(STATE.open!=null){ renderDisplay(STATE.open); return }
    renderGrid()
  }

  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]')
    if(a){
      var act=a.getAttribute('data-act')
      if(act==='reload'){ load(); return }
      if(act==='close'){ STATE.open=null; STATE.openIdx=0; render(); return }
      if(act==='open-new'){ var id=a.getAttribute('data-id'); window.open('/view-v1/#/clinic/chair-display/'+id,'chair-'+id); return }
    }
    var t=e.target.closest('[data-idx]'); if(t){ STATE.openIdx=+t.getAttribute('data-idx'); render(); return }
    var c=e.target.closest('[data-chair]'); if(c){ STATE.open=+c.getAttribute('data-chair'); STATE.openIdx=0; render(); return }
  })
  window.addEventListener('hashchange',render)

  load()
  if(!previewRule()) STATE.timer=setInterval(load, REFRESH_MS)   // 미리보기는 실시간이 아니다 — 폴링하지 않는다
  window.addEventListener('hashchange',function(){ if(previewRule()) load() })
})();
</script>
</body>
