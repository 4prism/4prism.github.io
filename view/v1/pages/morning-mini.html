<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모닝 — 미니창</title>
<style>
:root{
  --ink:#111827;--sub:#4b5563;--muted:#9ca3af;--line:#e5e7eb;--soft:#f9fafb;
  --blue:#2a85ff;--blue-soft:#eff6ff;--red:#b91c1c;--red-soft:#fef2f2;
  --amber:#b45309;--amber-soft:#fffbeb;--green:#047857;--green-soft:#ecfdf5;
  --font:"Apple SD Gothic Neo",Pretendard,-apple-system,"Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f3f4f6;font:13px/1.4 var(--font);color:var(--ink);max-width:420px}
.wrap{padding:6px;display:flex;flex-direction:column;gap:4px;min-width:220px;max-width:420px}
.role-bar{display:flex;gap:4px;padding:4px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.role-btn{flex:1;border:none;border-radius:6px;padding:5px 6px;font:600 11.5px var(--font);cursor:pointer;background:transparent;color:var(--muted)}
.role-btn.active{background:var(--ink);color:#fff}
.section{display:flex;flex-direction:column;gap:3px}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:5px 10px;
  font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;
}
.chip-green{background:var(--green-soft);border-color:#a7f3d0;color:var(--green)}
.chip-blue{background:var(--blue-soft);border-color:#bfdbfe;color:#1d4ed8}
.chip-amber{background:var(--amber-soft);border-color:#fde68a;color:var(--amber)}
.chip-red{background:var(--red-soft);border-color:#fecaca;color:var(--red)}
.chip-muted{color:var(--muted)}
.panel{background:#fff;border-radius:8px;border:1px solid var(--line);overflow:hidden}
.panel-head{padding:7px 10px;font-size:11.5px;font-weight:800;color:var(--sub);border-bottom:1px solid var(--line);background:var(--soft)}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row-name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;font-weight:600}
.row-desc{font-size:11.5px;color:var(--sub);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-green{background:#10b981}
.dot-amber{background:#f59e0b}
.dot-red{background:#ef4444}
.dot-muted{background:#d1d5db}
.empty-row{padding:10px;text-align:center;color:var(--muted);font-size:12px}
.row-btn{border:none;border-radius:6px;padding:3px 9px;font:600 11px var(--font);cursor:pointer;white-space:nowrap;flex:none}
.btn-call{background:var(--blue-soft);color:#1d4ed8}
.btn-call:hover{background:#dbeafe}
.btn-assign{background:var(--green-soft);color:var(--green)}
.btn-assign:hover{background:#d1fae5}
.btn-send{background:var(--amber-soft);color:var(--amber)}
.btn-send:hover{background:#fde68a}
</style>
<body>
<div class="wrap">
  <div class="role-bar" id="roleBar">
    <button class="role-btn active" onclick="setRole('reception')">접수</button>
    <button class="role-btn" onclick="setRole('outbound')">발신</button>
    <button class="role-btn" onclick="setRole('call')">통화중</button>
  </div>
  <div id="slotArea"></div>
</div>
<script>
'use strict'

/**
 * @typedef {'reception'|'outbound'|'call'} StaffRole
 * @typedef {{ chairId: number, chairName: string, occupied: boolean, idleMinutes: number, receptionPending: boolean, patientName: string|null }} Chair
 * @typedef {{ patientName: string, treatmentLine: string, waitingSince: string }} WaitingPatient
 * @typedef {{ recallId: number, patientName: string, daysOverdue: number, phone: string }} UrgentRecall
 * @typedef {{ callId: string, callerNumber: string, patientName: string|null, missedAt: string }} MissedCall
 * @typedef {{ queueId: number, patientName: string, task: string, role: 'reception'|'outbound' }} QueueItem
 */

/** @type {StaffRole} */
let currentRole = 'reception'

/** @param {string} s */
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
}

/** @param {StaffRole} role */
function setRole(role) {
  currentRole = role
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'))
  const idx = ['reception','outbound','call'].indexOf(role)
  document.querySelectorAll('.role-btn')[idx]?.classList.add('active')
  renderSlots()
}

function emptyData() {
  return { chairs:[], waitingPatients:[], urgentRecalls:[], missedCalls:[], queue:[], activeCall:null }
}

/** @type {ReturnType<typeof emptyData>} */
let data = emptyData()

async function fetchData() {
  try {
    const r = await fetch('/api-v1/mini-work-state', {headers:{accept:'application/json'}, cache:'no-store'})
    if (r.ok) data = await r.json()
  } catch(_) { }
  renderSlots()
}

function renderChairChips() {
  const active = data.chairs.filter(c => c.occupied).length
  const empty = data.chairs.filter(c => !c.occupied).length
  const waiting = data.waitingPatients.length
  const pending = data.chairs.filter(c => c.receptionPending).length
  return `<div class="chip-row">
    <span class="chip chip-green">진료중 ${active}</span>
    <span class="chip${empty > 0 ? ' chip-muted' : ''}">빈 체어 ${empty}</span>
    <span class="chip chip-blue">대기 ${waiting}</span>
    ${pending > 0 ? `<span class="chip chip-amber">접수대기 ${pending}</span>` : ''}
  </div>`
}

function renderWaitingPanel() {
  const rows = data.waitingPatients.length
    ? data.waitingPatients.map(p => `<div class="row">
        <span class="dot dot-amber"></span>
        <span class="row-name">${esc(p.patientName)} 님</span>
        <span class="row-desc">${esc(p.treatmentLine)}</span>
        <button class="row-btn btn-assign" onclick="assignChair(${JSON.stringify(p.patientName)})">체어 배정</button>
      </div>`).join('')
    : '<div class="empty-row">대기 환자 없음</div>'
  return `<div class="panel"><div class="panel-head">접수 대기</div>${rows}</div>`
}

function renderQueuePanel(role) {
  const items = data.queue.filter(q => q.role === role)
  const rows = items.length
    ? items.map(q => `<div class="row">
        <span class="dot dot-green"></span>
        <span class="row-name">${esc(q.patientName)} 님</span>
        <span class="row-desc">${esc(q.task)}</span>
        <button class="row-btn ${role === 'reception' ? 'btn-assign' : 'btn-send'}" onclick="handleQueue(${q.queueId},${JSON.stringify(role)})">${role === 'reception' ? '처리' : '발신'}</button>
      </div>`).join('')
    : '<div class="empty-row">처리할 항목 없음</div>'
  return `<div class="panel"><div class="panel-head">${role === 'reception' ? '오늘 큐 — 접수' : '오늘 큐 — 발신'}</div>${rows}</div>`
}

function renderUrgentRecallPanel() {
  if (!data.urgentRecalls.length) return ''
  const chip = `<div class="chip-row"><span class="chip chip-red">🔔 긴급리콜 ${data.urgentRecalls.length}명</span></div>`
  const rows = data.urgentRecalls.map(r => `<div class="row">
      <span class="dot dot-red"></span>
      <span class="row-name">${esc(r.patientName)} 님</span>
      <span class="row-desc">${r.daysOverdue}일 경과</span>
      <button class="row-btn btn-call" onclick="callRecall(${r.recallId},${JSON.stringify(r.phone)})">발신</button>
    </div>`).join('')
  return chip + `<div class="panel"><div class="panel-head">리콜 긴급 대상</div>${rows}</div>`
}

function renderMissedCallPanel() {
  const chip = data.missedCalls.length
    ? `<div class="chip-row"><span class="chip chip-amber">☎ 미수신 ${data.missedCalls.length}건</span></div>`
    : ''
  const rows = data.missedCalls.length
    ? data.missedCalls.map(c => `<div class="row">
        <span class="dot dot-amber"></span>
        <span class="row-name">${c.patientName ? esc(c.patientName) + ' 님' : esc(c.callerNumber)}</span>
        <span class="row-desc">${c.missedAt}</span>
        <button class="row-btn btn-call" onclick="callMissed(${JSON.stringify(c.callId)},${JSON.stringify(c.callerNumber)})">콜백</button>
      </div>`).join('')
    : '<div class="empty-row">미수신 없음</div>'
  return chip + `<div class="panel"><div class="panel-head">미수신 발신</div>${rows}</div>`
}

function renderActiveCallSlot() {
  if (!data.activeCall) {
    return `<div class="panel"><div class="panel-head">현재 통화</div><div class="empty-row">통화 중 아님</div></div>`
  }
  const c = data.activeCall
  return `<div class="panel" style="border-color:#bfdbfe">
    <div class="panel-head" style="background:var(--blue-soft)">📞 통화 중 — ${c.direction === 'inbound' ? '수신' : '발신'}</div>
    <div class="row">
      <span class="dot dot-green" style="background:#3b82f6"></span>
      <span class="row-name">${c.patientName ? esc(c.patientName) + ' 님' : esc(c.number)}</span>
      <span class="row-desc">${c.elapsed}</span>
    </div>
  </div>`
}

function renderSlots() {
  const area = document.getElementById('slotArea')
  if (!area) return

  let html = ''
  if (currentRole === 'reception') {
    html = [renderChairChips(), renderWaitingPanel(), renderQueuePanel('reception')].join('\n')
  } else if (currentRole === 'outbound') {
    html = [renderUrgentRecallPanel(), renderQueuePanel('outbound'), renderMissedCallPanel()].join('\n')
  } else {
    html = renderActiveCallSlot()
  }
  area.innerHTML = html
}

function assignChair(patientName) {
  fetch('/api-v1/waiting-queue/assign', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({patientName})}).catch(()=>{})
}

function handleQueue(queueId, role) {
  fetch('/api-v1/today-queue/' + queueId + '/done', {method:'POST'}).then(() => fetchData()).catch(()=>{})
}

function callRecall(recallId, phone) {
  fetch('/api-v1/recall/' + recallId + '/call', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone})}).catch(()=>{})
}

function callMissed(callId, number) {
  fetch('/api-v1/missed-calls/' + callId + '/callback', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({number})}).catch(()=>{})
}

renderSlots()
setInterval(() => { if (!document.hidden) fetchData() }, 20000)
fetchData()
</script>
