.mw-sheet .sf{display:flex;gap:8px;align-items:center;padding:8px 16px;background:#f5f7f5}
.mw-sheet .sf .spacer{flex:1}
.mw-sheet .q{font-size:13px;color:var(--s-sub);font-weight:600}
.mw-sheet .cardbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 16px;
  border:1px solid var(--s-soft-line);border-radius:12px;background:#fff;box-shadow:0 3px 9px #253c2e08;cursor:pointer}
.mw-sheet .cardbtn:hover{border-color:#79a891;background:var(--s-soft)}
.mw-sheet .cardbtn .t{flex:1;font-weight:600;font-size:14px}
.mw-sheet .cardbtn .tag{display:inline-block;padding:0 8px;border-radius:50px;font-size:11px;font-weight:600;
  background:var(--s-amber-bg);color:var(--s-amber);border:1px solid var(--s-amber-line);white-space:nowrap}
.mw-sheet .btn.primary{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;
  border-radius:8px;font-weight:600;background:var(--s-green-btn);color:#fff;border:1px solid var(--s-green-btn);cursor:pointer}
.mw-sheet .soon{padding:16px;border:1px dashed var(--s-soft-line);border-radius:12px;color:var(--s-muted);text-align:center;font-size:13px}
.mw-sheet .note{font-size:12px;color:var(--s-muted)}
.mw-sheet textarea{font:inherit;color:inherit;border:1px solid var(--s-soft-line);border-radius:8px;
  background:#fff;padding:8px;width:100%;resize:vertical;min-height:120px}
.mw-sheet .chartline{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--s-ink);color:var(--s-green-bg);
  border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-all}
/* 🔴 실패를 **숨기지 않는다** — 빈 화면이면 「기록이 없다」로 읽힌다. */
.sd-err{font-size:12px;color:#8a1c24;background:var(--red-bg);border:1px solid #f3c9cd;
  border-radius:8px;padding:7px 9px;margin-top:8px;line-height:1.5}
/* 🔴 아래 `.pop …` 규칙을 패널 안에서도 그대로 쓴다 — 내용 모양을 두 벌로 두지 않는다. */
.pop{position:fixed;z-index:700;width:290px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  box-shadow:0 10px 36px rgba(17,20,24,.18);font-size:13px}
.pop .pn,.side-detail .pn{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.pop .pc,.side-detail .pc{font-size:12px;color:var(--dim);margin-left:5px;font-weight:600}
.pop .pr,.side-detail .pr{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pop .pmeta,.side-detail .pmeta{font-size:12.5px;color:#3f4a55;margin-top:7px;line-height:1.6}
.pop .pmeta b,.side-detail .pmeta b{color:var(--tx)}
.pop .pmemo,.side-detail .pmemo{font-size:12.5px;color:#3f4a55;margin-top:7px;line-height:1.5;
  background:#f7f9fa;border-radius:9px;padding:7px 9px;word-break:break-word}
.pop .hint,.side-detail .hint{font-size:11.5px;color:var(--dim2);margin-top:9px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;
  background:#f2f4f6;color:#4e5968;white-space:nowrap}
.tag.new{background:var(--blue-bg);color:var(--blue-d)}
.tag.no{background:var(--red-bg);color:var(--red-d)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.wait{background:var(--red-bg);color:var(--red-d)}
.tag.inq{background:var(--amber-bg);color:var(--amber)}
/* 촬영 — 🔴 경고색을 쓰지 않는다. 진행된 일이지 할 일이 아니다. */
.tag.xr{background:#f3efff;color:#7c3aed}
/* 🔴 문진 꼬리표는 **중립색**이다 — 사용자가 색을 나중에 정한다. 경고색을 쓰지 않는다. */
.tag.ik{background:#eef6f1;color:var(--green)}
.tag.ik-no{background:#f2f4f6;color:#4e5968}

/* ── 이동 로그 ──────────────────────────────────────────────────────── */
/* R7 「환자와 직원이 어떻게 움직이는지」 — 지금 위치만으로는 답이 안 된다.
   🔴 화면 메모리에만 둔다(새로고침하면 지워진다) — 저장하려면 테이블이 필요하고
      그건 요구에 없다. */
/* ══ 칸별 환자 목록 표 (사용자 지시 2026-10-16) ═══════════════════════
   🔴 칸(위 격자)을 누르면 여기가 펼쳐진다. 네모를 누르면 **상세패널**이다 —
      둘은 **다른 동작**이라 서로 가로채면 안 된다(bindZoneList 주석 참고). */
/* 🔴 이동 기록(.movelog) 과 이 표(.zlist) 사이 여백 — 예약하기↔이동 기록 간격과 맞춘다
   (사용자 지시 2026-10-19). 붙어 있으면 두 컴포넌트가 한 덩어리로 보인다. */
.zlist{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;margin-top:11px;margin-bottom:11px}
.zl-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* 🔴 요청 표 날짜 달력(사용자 지시 2026-10-20) — 제목 오른쪽, 닫기 왼쪽. */
.zl-dp{display:inline-flex;align-items:center;gap:6px;margin-left:8px}
.zl-date{font:inherit;font-size:12.5px;color:var(--tx);background:var(--card);
  border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer}
.zl-date:hover{border-color:var(--blue)}
/* 🔴 모닝웹 자동발송 토글 — 닫기 ✕ 좌측. **비활성**이라 꺼진 모습으로 고정(2026-10-23). */
/* 🔴 `margin-left:auto` 로 **오른쪽 끝**으로 보내고, 닫기 ✕ 와 **붙여** 둔다
   (사용자 지시: 닫기 바로 좌측). 사이가 벌어지면 둘이 다른 묶음처럼 보인다. */
.zl-sw{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:0 2px 0 0}
.zl-sw + .zl-x{margin-left:6px}
.zl-sw-l{font-size:12px;color:var(--dim)}
.zl-sw-v{font-size:11.5px;color:var(--dim2);font-weight:700}
.zl-tg{width:34px;height:19px;border-radius:999px;border:1px solid var(--line);
  background:var(--done-bg);position:relative;padding:0;cursor:not-allowed;opacity:.65}
.zl-tg i{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;
  background:#fff;border:1px solid var(--line);transition:left .15s}
.zl-tg[aria-pressed="true"]{background:var(--green-bg);border-color:var(--green-line)}
.zl-tg[aria-pressed="true"] i{left:16px}
/* 🔴 발송 버튼 — 모닝웹 출처 행에만. 되돌릴 수 없는 외부 발송이라 눈에 띄게. */
.mt-send{font:inherit;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:7px;
  border:1px solid var(--blue);background:var(--card);color:var(--blue);cursor:pointer;white-space:nowrap}
.mt-send:hover{background:var(--blue);color:#fff}
.mt-send[disabled]{opacity:.5;cursor:default;background:var(--card);color:var(--dim2);border-color:var(--line)}
/* 🔴 「발송 예정」 — 미발송(빨강)과 **다른 색**이라야 「기다리면 된다」가 보인다. */
.mt-st.pending{background:var(--blue-bg,#eef4ff);color:var(--blue);border:1px solid var(--blue-line,#c7dbff)}
.zl-today{font-size:12px;font-weight:700;color:var(--blue-d);background:var(--blue-bg);
  border:1px solid #cfe0ee;border-radius:7px;padding:3px 9px;cursor:pointer}
.zl-today:hover{background:#e3edfb}
.zl-tab{font-size:12px;font-weight:700;color:var(--dim);background:#f4f6f8;
  border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;
  display:flex;align-items:center;gap:5px}
.zl-tab:hover{background:#eef1f5;color:var(--tx)}
/* 🔴 **켜진 칸은 색으로만 말하지 않는다** — 테두리도 굵게 한다(색각이상 대비). */
.zl-tab.on{background:var(--blue-bg);color:var(--blue-d);border-color:var(--blue);
  box-shadow:inset 0 0 0 1px var(--blue)}
.zl-n{font-variant-numeric:tabular-nums;font-weight:800;font-size:11.5px;opacity:.8}
.zl-x{margin-left:auto;font-size:11.5px;color:var(--dim2);background:none;
  border:0;cursor:pointer;padding:4px 2px}
.zl-x:hover{color:var(--tx)}
/* 🔴 **표가 길면 안쪽에서 스크롤**한다 — 수납완료는 하루 50건이 넘는다(실측 53).
   그대로 두면 페이지가 끝없이 길어져 **칸 격자가 화면 밖으로 밀린다**(실측: 머리글이
   통째로 사라졌다). 표는 「펼쳐 보는 것」이지 화면을 차지하는 것이 아니다.
   ⚠️ 머리글(`thead`)은 **붙여 둔다** — 스크롤하면 무슨 열인지 잊는다. */
.zl-body{margin-top:8px;max-height:46vh;overflow-y:auto}
/* 🔴 예약 현황 상세(캘린더)는 **자기 스크롤(.sch-scroll)** 하나만 쓴다 — zl-body 의
   세로 스크롤을 꺼서 **스크롤이 둘로 겹치지 않게** 한다(사용자 지시 2026-10-19). */
.zl-body.cal{max-height:none;overflow:visible}
.zl-tb thead th{position:sticky;top:0;background:var(--card);z-index:1}
.zl-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.zl-tb th{text-align:left;font-size:11.5px;font-weight:700;color:var(--dim2);
  padding:4px 8px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.zl-tb td{padding:5px 8px;border-bottom:1px solid #f4f6f8;color:#3f4a55}
/* 🔴 마지막 열(내용·알림톡)은 길다 — **줄바꿈을 허용**하고 나머지는 붙여 둔다. */
.zl-tb td:not(:last-child){white-space:nowrap}
.zl-tb tr.hit{cursor:pointer}
/* 🔴 정렬 가능한 컬럼 머리 — **누를 수 있다는 것이 보여야** 한다(커서·호버·화살표). */
.zl-tb th.zl-th{cursor:pointer;user-select:none}
.zl-tb th.zl-th:hover{color:var(--blue);background:var(--blue-bg,#eef4ff)}
.zl-tb th.zl-th.on{color:var(--blue)}
.zl-tb th .zl-ar{font-size:10px;letter-spacing:-.5px}
/* 수납 대기 「요청」 라벨 — 체크하면 흐리게·취소선(정리함). 사용자 지시 2026-10-19 */
.rq-chips{display:flex;flex-wrap:wrap;gap:4px;white-space:normal}
.rq-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;
  background:var(--blue-bg);color:var(--blue);font-size:11.5px;font-weight:700;cursor:pointer;
  border:1px solid transparent;user-select:none}
.rq-chip input{margin:0;width:13px;height:13px;accent-color:var(--blue);cursor:pointer}
.rq-chip.done{background:var(--soft);color:var(--dim2);text-decoration:line-through;border-color:var(--line)}
.rq-chip.busy{opacity:.55;pointer-events:none}
/* ── 알림톡 이력·자동 알림톡 표(사용자 지시 2026-10-20) ── */
.mt-src{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.mt-src.dw{background:#f1f5f9;color:#475569}
.mt-src.mw{background:#eaf3ff;color:#2a85ff}
.mt-trail{display:flex;flex-wrap:wrap;gap:3px;align-items:center;white-space:normal;max-width:520px}
.mt-c{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);white-space:nowrap}
.mt-c small{color:var(--dim);font-size:10.5px}
.mt-c.bk{background:#f1f5f9;color:#475569}
.mt-c.sd{background:var(--blue-bg);border-color:#cfe0ff;color:var(--blue-d)}
.mt-c.sd.fail{background:#fdecec;border-color:#f5c2c2;color:#b42318}
.mt-c.rp{background:#ecfdf3;border-color:#bfe8cf;color:#067647}
.mt-ar{color:var(--dim2);font-size:10px}
.mt-st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.mt-st.sent{background:#ecfdf3;color:#067647}
.mt-st.failed,.mt-st.unsent{background:#fdecec;color:#b42318}
.mt-st.notyet{background:#f1f5f9;color:#64748b}
/* 🔴 「종류」 컬럼(사용자 지시 2026-10-29) — L17·L19·L20 셋을 색으로도 구분한다. */
.notice-kind{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.notice-kind.appt_1h_notice{background:#fff4e5;color:#b76e00}
.notice-kind.booking_confirm_new{background:#eaf3ff;color:#2a85ff}
.notice-kind.booking_confirm_returning{background:#f0ecff;color:#6941c6}
.zl-note{font-size:12px;color:var(--dim);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:0 0 8px}
.rq-none{color:var(--dim2)}
.zl-tb tr.hit:hover td{background:var(--blue-bg)}
.zlist .none{font-size:12px;color:var(--dim2);padding:8px 2px}

/* ── 예약 현황 상세 = 날짜 캘린더 그리드 (Monday .sch 참고) ──────────────────── */
.sch{display:flex;flex-direction:column;background:var(--card);border-radius:10px;overflow:hidden}
.sch-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:6px 10px;
  background:#f4f6f8;border-bottom:1px solid var(--line)}
.sch-title{margin:0;font-size:14px;font-weight:700}
.sch-date{font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.sch-sum{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
.sch-nav{display:inline-flex;gap:4px}
.sch-navb{width:24px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:6px;
  cursor:pointer;font-size:15px;line-height:1;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;padding:0}
.sch-navb:hover{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.sch-lg{display:flex;flex-wrap:wrap;gap:0 8px;font-size:11px;color:var(--dim2);margin-left:auto}
.sch-lg .lgi{display:inline-flex;align-items:center;gap:4px}
.sch-sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--soft-line)}
.sch-sw.pre{background:#edf4fa;border-color:#cfe0ee}
.sch-sw.wait{background:#fbf3e0;border-color:#ecd8a6}
.sch-sw.room{background:#e9f4ee;border-color:#cfe5d9}
.sch-sw.done{background:#eef1ef;border-color:var(--soft-line)}
.sch-sw.chg{background:repeating-linear-gradient(135deg,#fbeae7 0 5px,#fff 5px 10px);border-color:#f0c6bf}
.sch-scroll{max-height:56vh;overflow:auto}
/* 🔴 인라인 상세표는 창을 −1h~+3h(4시간)로 줄였으니 **세로 스크롤을 두지 않는다**
   (사용자 지시 2026-10-20: 「스크롤 안 나오는 정도로만」). 가로(담당의 열 많음)만 둔다.
   max-height 를 풀어 내용(≈270px) 높이만큼만 차지 → .sch-scroll 안 세로 막대 사라짐. */
/* ⚠️ overflow-x:auto + overflow-y:visible 는 브라우저가 visible 을 auto 로 승격해 세로
   막대가 되살아난다 — 그래서 **hidden** 을 쓴다. 내용(4시간≈240px)이 컨테이너를 2~3px
   넘는 건 sticky 머리줄 때문이라 블록은 안 잘린다. 바닥 2px 패딩으로 그마저 없앤다. */
.sch.inline .sch-scroll{max-height:none;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.sch-tbl{display:grid;min-width:min-content}
/* 머리줄 — 모서리 + 담당의 헤더(붙박이) */
.sch-corner,.sch-colh{position:sticky;top:0;z-index:4;background:#eef1ef;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);height:30px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  gap:4px;font-weight:700;font-size:12px}
.sch-corner{left:0;z-index:6}
.sch-colh .dc{font-size:11px;font-weight:600;color:var(--dim2)}
/* 시간 거터(세로) */
.sch-gut{position:sticky;left:0;z-index:3;background:var(--canvas,#f7f9fb);border-right:1px solid var(--line)}
.sch-gut .sch-ghl{position:absolute;right:4px;transform:translateY(-7px);font-size:11px;font-weight:700;
  color:var(--dim);font-variant-numeric:tabular-nums;line-height:1}
.sch-gut .sch-gnow{position:absolute;left:0;right:0;transform:translateY(-8px);background:var(--red-d,#d34);
  color:#fff;font-size:10px;font-weight:700;text-align:center;border-radius:3px;line-height:15px;z-index:2}
/* 담당의 열 */
.sch-col{position:relative;border-right:1px solid var(--line)}
.sch-col .sch-sl{position:absolute;left:0;right:0;height:0;border-top:1px dotted var(--line)}
.sch-col .sch-nowl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red-d,#d34);z-index:3;pointer-events:none}
/* 예약 블록 */
.sch-blk{position:absolute;box-sizing:border-box;left:1px;right:1px;padding:1px 5px;border-radius:5px;
  border:1px solid var(--soft-line);border-left-width:4px;text-align:left;font:inherit;font-size:11px;line-height:1.25;
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:0;z-index:2;background:#fff}
/* 🔴 겹침 레인 블록 — 인라인 left/width 로 좌우 배치하므로 right 를 푼다(안 그러면 폭이 꼬인다).
   폭이 좁아져 제목만 보이기 쉬우니 l3(메모)는 숨겨 이름·시각이 안 가리게 한다. */
.sch-blk.lane{right:auto}
.sch-blk.lane .l3{display:none}
/* 🔴 hover 하면 **선택된 것처럼** 하이라이트(사용자 지시 2026-10-20) — 접수 네모(.rdot)와
   같은 느낌으로 파란 테두리 링 + 살짝 띄운다. 색 배경이 있는 블록이라 흰 링 대신 파란 링. */
.sch-blk:hover,.sch-blk:focus-visible{z-index:5;outline:none;
  box-shadow:0 0 0 2px var(--blue),0 2px 10px rgba(0,0,0,.2)}
/* 🔴 예약변경 — 평소 숨김, 블록에 hover 하면 우상단에 뜬다(사용자 지시 2026-10-19). */
.sch-chg{position:absolute;top:2px;right:2px;display:none;z-index:6;
  padding:1px 7px;border-radius:5px;border:1px solid var(--blue);background:var(--blue);color:#fff;
  font-size:10.5px;font-weight:700;line-height:17px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sch-blk:hover .sch-chg,.sch-chg:hover{display:inline-block}

/* ══ 로그인 토큰 자동 첨부 (2026-10-19) ═══════════════════════════════════════

 *    닿지 않는다. 쿠키가 막히는 환경(CORS·시크릿)에서 세션이 안 붙으므로, 로그인 화면이
 *    `localStorage['mw_token']` 에 저장한 토큰을 **이 문서의 모든 API 호출에 Bearer 로** 붙인다.
 * 🔴 401 이면 **로그인 화면으로** 보낸다(세션 없음/만료). ⚠️ 같은 출처 `/api` 계열에만.
 * (다른 화면 페이지도 데이터를 부른다면 이 블록을 똑같이 맨 위에 둔다.) */

  var orig=window.fetch;
  function isApi(u){ try{ var x=new URL(u,location.href); return x.origin===location.origin && /^\/(api|api-v0|api-v1|api-v3)\//.test(x.pathname) }catch(e){ return false } }
  var redir=false;
  window.fetch=function(input,init){
    var u=typeof input==='string'?input:(input&&input.url)||'';

      if(!h.has('authorization')) h.set('authorization','Bearer '+token);

const MSG_HIST = new Map();     // pid → 이벤트 배열
const MSG_AT = new Map();       // pid → 받은 시각(캐시)
async function loadMsgHistory(pid) {
  const key = String(pid);
  if (MSG_HIST.has(key) && Date.now() - (MSG_AT.get(key) || 0) < 60000) return MSG_HIST.get(key);
  try {
    const j = await fetch(api('/api-v1/lounge/messages?days=365&patientIds=' + encodeURIComponent(key)),
      { headers: { accept: 'application/json' } }).then(r => r.json());
    const d = (j && (j.data || j)) || {};
    const ev = ((d.history || {})[key]) || [];
    MSG_HIST.set(key, ev);
    MSG_AT.set(key, Date.now());
    return ev;
  } catch (e) {
    /* ⚠️ 실패해도 **상세는 살린다** — 메신저에 발송 이력만 안 붙는다. */
    return MSG_HIST.get(key) || [];
  }
}

/* ── 문진 ──────────────────────────────────────────────────────────────
 *
 * 🔴 **완료는 `status ∈ {delivered, skipped}` 다.** `arrived`·`confirming` 은
 *    응답은 왔지만 **확인·차트 전달이 안 끝난** 상태 — 운영본도 「문진 확인」 할 일로
 *    띄운다. ⚠️ 이걸 완료로 세면 **진료실이 문진 없이 환자를 본다.**
 *    (서버가 이미 `done` 으로 내려준다 — 화면은 다시 판정하지 않는다.)
 *
 * 🔴 **같은 날 예약이 2개 이상인 환자는 「예약별로」 가른다** — 실측 2026-10-16:
 *    오늘만 **29명**이 2회 이상 예약돼 있다. 하루 단위로 판정하면 **첫 예약 때 낸
 *    문진이 두 번째 방문까지 완료로 덮는다**(운영 실사고 — 차트 8383). 그러면 데스크가
 *    두 번째 진료의 문진을 묻지 않고 넘긴다.
 *    규칙: 문진은 **제출 시각에 가장 가까운 예약**의 것. 같은 거리면 **이른 쪽**.
 *    (운영본 `src/lib/checkinScope.ts` 와 **같은 규칙** — 한쪽을 고치면 다른 쪽도.)
 *
 * 🔴 **애매하면 「미완료」 쪽으로 틀린다.** 두 오답의 무게가 다르다:
 *      · 완료인데 미완료로 보임 → 데스크가 한 번 더 묻는다(성가심)
 *      · 미완료인데 완료로 보임 → **아무도 안 묻는다. 진료실에 문진이 없다.**
 */
function hmToMin(hm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || '').trim());
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  return (h > 23 || mi > 59) ? null : h * 60 + mi;
}
/** `YYYYMMDDHHmm…` → 'HH:MM'. */
function hmOf(s) {
  const t = String(s || '').replace(/\D/g, '');
  return t.length >= 12 ? t.slice(8, 10) + ':' + t.slice(10, 12) : '';
}
/** UTC 문자열 → KST 'HH:MM'. 🔴 reach_checkin.created_at 은 **UTC 저장**이다. */
function kstHm(utc) {
  if (!utc) return '';
  const t = String(utc).replace(' ', 'T');
  const d = new Date(/[Zz]|[+-]\d\d:?\d\d$/.test(t) ? t : t + 'Z');
  return isNaN(d) ? '' : pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
/** 제출 시각에 가장 가까운 예약. 같은 거리면 **이른 쪽**(안전한 쪽). */
function nearestApptHm(hms, submitHm) {
  const t = hmToMin(submitHm);
  if (t === null) return null;
  let best = null, bestD = Infinity;
  for (const a of hms.slice().sort()) {        // 이른 것부터 — 동점이면 먼저 본 쪽이 남는다
    const v = hmToMin(a);
    if (v === null) continue;
    const d = Math.abs(v - t);
    if (d < bestD) { bestD = d; best = a; }
  }
  return best;
}
/** patientRef → {done, status, submitHm, apptHm}. 예약이 둘 이상이면 가까운 예약에만 붙인다. */
function buildIntake(items, appts) {
  const byPid = new Map();
  for (const a of (appts || [])) {
    const pid = String(a.patientId ?? '');
    if (!pid || pid === '0') continue;
    const hm = hmOf(a.scheduledAt);
    if (!hm) continue;
    const list = byPid.get(pid) || [];
    if (!list.includes(hm)) list.push(hm);
    byPid.set(pid, list);
  }
  const out = new Map();
  for (const it of items) {
    const pid = String(it.patientRef ?? '');
    if (!pid) continue;
    const submitHm = kstHm(it.createdAt);
    const hms = byPid.get(pid) || [];
    /* 🔴 예약이 **하나뿐이면 손대지 않는다**(운영본 주석과 같은 이유) — 하루 단위와
       결과가 같고, 괜히 시각 파싱에 기대면 형식이 어긋난 날 멀쩡하던 표시가 깨진다. */
    const apptHm = hms.length > 1 ? nearestApptHm(hms, submitHm) : (hms[0] || '');
    const prev = out.get(pid);
    // 같은 환자가 여러 번 냈으면 **이른 완료분**을 남긴다(안전한 쪽).
    if (prev && prev.done && (!submitHm || prev.submitHm <= submitHm)) continue;
    out.set(pid, { done: !!it.done, status: it.status, submitHm, apptHm, multi: hms.length > 1 });
  }
  return out;
}

function upcomingHTML() {

function packLanes(appts) {
  // [start, end) 분 단위. end = start + max(20, duration).
  const items = appts.map(a => {
    const s = apptMinOf(a.scheduledAt);
    const e = (s == null) ? null : s + Math.max(20, a.durationMin || 30);
    return { a, s, e };
  }).filter(it => it.s != null).sort((x, y) => x.s - y.s || x.e - y.e);
  const out = new Map();           // a → {lane, lanes}
  let i = 0;
  while (i < items.length) {
    // 묶음: 연쇄적으로 겹치는 블록들(앞 블록의 최대 end 를 넘는 start 가 나오면 끊는다).
    const cluster = [items[i]];
    let clusterEnd = items[i].e;
    let j = i + 1;
    while (j < items.length && items[j].s < clusterEnd) {
      cluster.push(items[j]);
      if (items[j].e > clusterEnd) clusterEnd = items[j].e;
      j++;
    }
    // 묶음 안에서 빈 레인에 꽂는다. laneEnd[k] = 레인 k 에 놓인 마지막 블록의 end.
    const laneEnd = [];
    for (const it of cluster) {
      let lane = laneEnd.findIndex(end => end <= it.s);   // 비어 있는(겹치지 않는) 레인
      if (lane === -1) { lane = laneEnd.length; laneEnd.push(it.e); }
      else laneEnd[lane] = it.e;
      out.set(it.a, { lane });
    }
    const lanes = laneEnd.length;
    for (const it of cluster) out.get(it.a).lanes = lanes;   // 묶음 전원 같은 칸 총수
    i = j;
  }
  return out;
}

    /* 🔴 **+예약** — 크게 보기 좌측(사용자 지시 2026-10-20, Monday 참고). 누르면 새 예약 창. */
    + '<button type="button" class="sch-add" data-schadd="1" title="새 예약을 넣습니다">+ 예약</button>'
    + (full
      ? '<button type="button" class="sch-close" data-schfull="0">닫기</button>'
      : '<button type="button" class="sch-big" data-schfull="1" title="예약표를 화면 가득 크게 봅니다">예약표 크게 보기</button>')
    + '</div>';
  if (!list.length) return '<div class="sch ' + mode + '">' + top + '<div class="none">오늘 예약이 없어요.</div></div>';
  /* ── 시간 범위 — 가장 이른~늦은 예약(정시). 🔴 역순(늦은 시각 위) — Monday 와 같다. ── */
  const mins = list.map(a => apptMinOf(a.scheduledAt)).filter(m => m != null);
  const starts = list.map(a => (apptMinOf(a.scheduledAt) || 0) - Math.max(20, a.durationMin || 30));
  let lo = Math.floor(Math.min(...starts, nowM) / 60) * 60;     // 🔴 블록이 아래로 내려가므로 소요만큼 아래 여유
  let hi = Math.ceil((Math.max(...mins, nowM) + 30) / 60) * 60;
  /* 🔴 **인라인 상세표는 좁은 창**이다 — 하루 전체(9~18시)를 1min=1px 로 그리면 540px+ 라
     .sch-scroll 안에서 세로 스크롤이 생긴다(사용자 지적 2026-10-20: 「스크롤 3개」).
     그래서 인라인은 **지금 −1시간 ~ +3시간**(4시간)만 그린다 — 데스크가 당장 볼 구간이다.
     ⚠️ `full`(크게 보기)은 **하루 전체** 그대로 — 거기선 세로 스크롤이 정상이다. */
  if (!full) {
    lo = Math.max(lo, Math.floor((nowM - 60) / 60) * 60);
    hi = Math.min(hi, Math.ceil((nowM + 180) / 60) * 60);
    if (hi <= lo) hi = lo + 60;
  }
  const span = Math.max(60, hi - lo);
  /* 담당의 열 — 예약 많은 순. 🔴 인라인은 **창 안에 예약이 있는 담당의만** 열로 둔다
     (창 밖만 있는 담당의 열은 비어 빈 칸만 차지 — 가로 스크롤도 준다). */
  const inWin = a => { const m = apptMinOf(a.scheduledAt); return m != null && m >= lo && m <= hi; };
  const colList = full ? list : list.filter(inWin);
  const byStaff = new Map();
  for (const a of colList) {
    const k = String(a.staffId == null ? '' : a.staffId);
    if (!byStaff.has(k)) byStaff.set(k, []);
    byStaff.get(k).push(a);
  }
  const cols = [...byStaff.keys()].sort((x, y) => byStaff.get(y).length - byStaff.get(x).length);
  /* 창 안에 예약이 하나도 없으면(이른 아침·늦은 저녁) 빈 격자 대신 안내 — 전체는 「크게 보기」로. */
  if (!cols.length) return '<div class="sch ' + mode + '">' + top
    + '<div class="none">지금 −1시간 ~ +3시간 예약이 없어요. 하루 전체는 <b>예약표 크게 보기</b>로.</div></div>';
  const H = Math.round(span * PX);
  const yTop = m => Math.round((hi - m) * PX);
  let gutter = '<div class="sch-gut" style="height:' + H + 'px">';
  for (let m = lo; m <= hi; m += 30) {
    gutter += m % 60 === 0
      ? '<div class="sch-ghl" style="top:' + yTop(m) + 'px">' + Math.floor(m / 60) + '시</div>'
      : '<div class="sch-ght" style="top:' + yTop(m) + 'px">:30</div>';
  }
  if (nowM >= lo && nowM <= hi) gutter += '<div class="sch-gnow" style="top:' + yTop(nowM) + 'px">' + nowHm() + '</div>';
  gutter += '</div>';
  const colEls = cols.map(k => {
    // 🔴 byStaff 가 이미 창(inWin)으로 걸러져 있다(인라인) — 블록은 그대로 전부 그린다.
    const appts = byStaff.get(k).slice().sort((a, b) => apptMinOf(b.scheduledAt) - apptMinOf(a.scheduledAt));
    const lanesOf = packLanes(appts);   // 🔴 겹치면 좌우로 나눈다
    let lines = '';
    for (let m = lo; m <= hi; m += 30) lines += '<div class="sch-sl' + (m % 60 ? ' hf' : '') + '" style="top:' + yTop(m) + 'px"></div>';
    const nowl = (nowM >= lo && nowM <= hi) ? '<div class="sch-nowl" style="top:' + yTop(nowM) + 'px"></div>' : '';
    const blks = appts.map(a => {
      const m = apptMinOf(a.scheduledAt);
      const dmin = Math.max(20, a.durationMin || 30);
      const cls = schStatusCls(a);
      const lane = resvLane(a.note);
      const hm = hhmmOfAppt(a.scheduledAt);
      const cat = resvCatOf(a);
      const late = cls === 'pre' && m <= nowM;
      const nm = esc(a.name || '이름 없음') + (a.chartNumber ? ' (' + esc(a.chartNumber) + ')' : '');
      /* 🔴 레인 — 겹침 묶음 안에서 좌우 위치. lanes 개로 나눠 lane 번째. 1개면 0%/100%.
         ⚠️ 폭에 2px 안쪽 여백(calc)을 둬 레인끼리 선이 보이게 한다. */
      const L = lanesOf.get(a) || { lane: 0, lanes: 1 };
      const wPct = (100 / L.lanes);
      const laneStyle = L.lanes > 1
        ? 'left:calc(' + (wPct * L.lane).toFixed(4) + '% + 1px);width:calc(' + wPct.toFixed(4) + '% - 2px);'
        : '';
      /* 🔴 블록 윗변 = 시작 시각, 아래로 소요만큼 — **Monday 와 같다**(원본 실측: 08:30 블록 top 2156px ·
         열 2240px). 역순 축이라 블록이 이른 시각 쪽으로 내려간다 — 고치지 말 것(두 화면이 달라진다). */
      return '<button class="sch-blk ' + cls + ' ' + lane + (late ? ' late' : '') + (L.lanes > 1 ? ' lane' : '') + '" data-pid="' + esc(a.patientId) + '"'
        + ' style="top:' + yTop(m) + 'px;height:' + Math.round(dmin * PX) + 'px;' + laneStyle + '"'
        + ' title="' + esc((a.name || '') + ' ' + hm + ' · ' + dmin + '분 · ' + SCH_STATUS_KO[cls] + (late ? '(지각)' : '') + ' · ' + cat.label
          + ' (' + cat.src + ')' + (a.note ? ' · ' + a.note : '')) + '">'
        + '<span class="l1"><span class="nm">' + nm + '</span>'
        + (cat.key !== 'none' ? '<span class="stg c-' + esc(cat.key) + '">' + esc(cat.label) + '</span>' : '') + '</span>'
        + '<span class="l2">' + esc(hm) + ' · ' + dmin + '분 · ' + SCH_STATUS_KO[cls] + (late ? ' · 지각' : '') + '</span>'
        + (a.note ? '<span class="l3">' + esc(String(a.note).slice(0, full ? 80 : 40)) + '</span>' : '')
        + '<span class="sch-chg" data-chg="' + esc(a.patientId) + '" role="button" tabindex="-1" title="예약변경">예약변경</span>'
        + '</button>';
    }).join('');
    return '<div class="sch-col" style="height:' + H + 'px">' + lines + nowl + blks + '</div>';
  }).join('');
  /* 🔴 **오늘 휴무(추정) 직원** — 예약표 제목 아래에 표기(사용자 지시 2026-10-20).
     덴트웹에 개인 휴무표가 없어(전수 조사) **서버가 예약 이력으로 추정**한다(/api/dw/off-doctors):
     최근 28일 3일+ 일한 담당 중 오늘 예약 0. 「휴무(추정)」로 — 확정 아님을 밝힌다. */
  const offLabel = offStaffHTML();
  const colHeads = cols.map(k => {
    const nm = k ? (staffName(k) || ('담당 ' + k)) : '담당 미지정';
    return '<div class="sch-colh"><span class="dn">' + esc(nm) + '</span><span class="dc">' + byStaff.get(k).length + '건</span></div>';
  }).join('');
  /* 🔴 좌·우 버튼은 **열 제목줄의 양 끝**에 하나씩(사용자 지시 2026-10-19) — 누르면 한 열씩 넘긴다.
     ⚠️ 시간 거터(56px) 오른쪽부터가 열이다 — 왼쪽 버튼을 거터 위에 두면 「시간을 넘기는 버튼」으로 읽힌다. */
  const nav = '<button type="button" class="sch-navb prev" data-schnav="-1" title="왼쪽 담당의 열" aria-label="왼쪽 담당의 열">‹</button>'
    + '<button type="button" class="sch-navb next" data-schnav="1" title="오른쪽 담당의 열" aria-label="오른쪽 담당의 열">›</button>';
  return '<div class="sch ' + mode + '" data-cols="' + cols.length + '">' + top
    + (offLabel ? '<div class="sch-offrow">' + offLabel + '</div>' : '')
    + '<div class="sch-wrap">' + nav
    + '<div class="sch-scroll" data-sch="' + mode + '" data-now="' + (nowM >= lo && nowM <= hi ? yTop(nowM) : 0) + '">'
    + '<div class="sch-tbl" style="grid-template-columns:56px repeat(' + cols.length + ',' + SCH_MIN_COL[mode] + 'px)">'
    + '<div class="sch-corner"></div>' + colHeads
    + gutter + colEls
    + '</div></div></div></div>';
}
/** 열 폭을 보이는 폭에 맞춘다 — 그린 뒤·창 크기 바뀔 때. ‹ › 는 끝에 닿으면 꺼진다. */
function fitSch() {
  document.querySelectorAll('.sch').forEach(sch => {
    const sc = sch.querySelector('.sch-scroll'), tbl = sch.querySelector('.sch-tbl');
    if (!sc || !tbl) return;
    const mode = sch.classList.contains('full') ? 'full' : 'inline';
    const n = +sch.dataset.cols || 1;
    const W = sc.clientWidth - 56;
    if (W <= 0) return;
    const fit = Math.max(1, Math.min(n, Math.floor(W / SCH_MIN_COL[mode])));
    const colw = Math.floor(W / fit);
    tbl.style.gridTemplateColumns = '56px repeat(' + n + ',' + colw + 'px)';
    sch.dataset.colw = colw;
    schNavState(sch);
  });
}
window.addEventListener('resize', () => fitSch());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SCH_FULL) { SCH_FULL = false; render(); } });
function schNavState(sch) {
  const sc = sch.querySelector('.sch-scroll');
  const p = sch.querySelector('.sch-navb.prev'), nx = sch.querySelector('.sch-navb.next');
  if (!sc || !p || !nx) return;
  const max = sc.scrollWidth - sc.clientWidth;
  p.disabled = sc.scrollLeft <= 1;
  nx.disabled = sc.scrollLeft >= max - 1;
  const hide = max <= 1;
  p.hidden = hide; nx.hidden = hide;
}
/** 'YYYY-MM-DD (요일) · 오늘' — 캘린더 머리 날짜. */
function todayDateLabel() {
  const d = new Date();
  const w = '일월화수목금토'[d.getDay()];
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' (' + w + ') · 오늘';
}

      + '</div>';

/* ══ 예약 ════════════════════════════════════════════════════════════

          + esc(d.dow) + '</span><span class="bcnt">' + open + '칸</span></div>';
        if (!(d.slots || []).length) {
          /* 🔴 **빈 이유를 구분한다** — 지난 날은 휴진이 아니라 **지나간** 것이다. */
          inner += (d.date < todayKey())
            ? '<div class="bnone">지난 날이에요 — 예약은 오늘부터</div>'
            : '<div class="bnone">진료 시간이 없어요</div>';
        } else {
          inner += '<div class="bslots">';
          for (const sl of d.slots) {
            /* 🔴 **열린 의사만** 태그로 띄운다 — 닫힌 의사까지 보이면 고를 수 없는
               자리가 눈에 들어와 혼란스럽다. 찬 현황은 title 로 보여준다. */
            const openDocs = (sl.doctors || []).filter(x => x.open);
            const tags = openDocs.map(x => '<span class="dtag" title="' + esc(x.name)
              + ' — ' + x.booked + '/' + x.capacity + '명">' + esc(x.name) + '</span>').join('');
            const full = (sl.doctors || []).filter(x => !x.open)
              .map(x => x.name + ' ' + x.booked + '/' + x.capacity).join(' · ');
            const can = sl.available && openDocs.length;
            inner += '<button type="button" class="bslot' + (can ? '' : ' full') + '"'
              + (can ? '' : ' disabled')
              + ' data-date="' + esc(d.date) + '" data-time="' + esc(sl.time) + '"'
              + ' data-label="' + esc(d.label) + ' ' + esc(d.dow) + '"'
              + (full ? ' title="찬 자리 — ' + esc(full) + '"' : '')
              + " data-docs='" + esc(JSON.stringify(openDocs.map(x =>
                  ({ id: x.staffId, n: x.name, b: x.booked, c: x.capacity })))) + "'>"
              + '<span class="bt">' + esc(sl.time) + '</span>'
              + '<span class="btags">' + (tags || '<span class="bfull">예약 마감</span>') + '</span>'
              + '</button>';
          }
          inner += '</div>';
        }
        inner += '</div>';
      }
      inner += '</div>';
    }
  }
  return inner;
}

function bookSection() {
  /* 🔴 예약하기는 **흰 배경 그대로** — 네모를 **받는** 칸이다(사용자 지시 2026-10-16).
     접수·진료실·수납 대기와 같은 쪽이다. ⚠️ `ro` 를 붙이지 말 것. */
  return '<details class="bookwrap" id="bookWrap"' + (BOOK_OPEN ? ' open' : '') + '>'
    + '<summary><span class="caret">▶</span>예약하기</summary>' + bookGridHTML() + '</details>';
}

/* 🔴 **수집이 살아 있나** — 「문진 0건」의 뜻을 가르는 유일한 근거.
 *
 * 사용자 지시(2026-10-16): 「문진 여부는 **데이터를 갖고 있어야** 합니다」
 * 데이터를 「갖고 있다」는 건 값뿐 아니라 **그 값이 믿을 만한가**까지다.
 *
 * 🔴 수집이 멈췄는데 「문진 없음」이라고 적으면 **고장이 사실로 둔갑한다** —
 *    데스크가 환자에게 문진을 다시 받으러 간다. 실제로 서버 PC 에서 3개월간
 *    0건이 회수됐는데 아무도 몰랐다(reach_checkin_watcher.rs:45).
 * ⚠️ `state` 가 빈 값이면 **아직 한 번도 안 돈 것**이다(기동 직후 ~40초).
 *    그때도 「없음」이라 단정하지 않는다 — 모르는 건 모른다고 한다. */
function intakeCollecting() {
  return !!(INTAKE_HEALTH && INTAKE_HEALTH.state === 'ok');
}
/** 띠에 적을 한 줄. 정상이면 조용하고, 아니면 **이유를 적는다**. */
function intakeHealthLine() {
  const h = INTAKE_HEALTH;
  if (!h || !h.state) return { cls: 'warn2', text: '문진 수집: <b>확인 중</b> — 아직 첫 조회 전이에요' };
  if (h.state === 'ok') {
    return { cls: '', text: '문진 수집: 정상' + (h.lastOkAt ? ' · 마지막 ' + esc(h.lastOkAt.slice(11, 16)) : '') };
  }
  // 🔴 멈췄으면 **이유를 그대로** 보여준다 — 「고장」만 적으면 누가 무엇을 고칠지 모른다.
  return {
    cls: 'warn2',
    text: '🔴 문진 수집 <b>멈춤</b>' + (h.detail ? ' — ' + esc(h.detail) : '')
      + (h.lastOkAt ? ' <span style="color:var(--dim2)">(마지막 정상 ' + esc(h.lastOkAt.slice(5, 16)) + ')</span>' : ''),
  };
}

/** 이 환자의 **이번 방문** 문진. 🔴 2회 예약자는 예약이 맞아야 완료로 친다. */
function intakeOf(r) {
  const v = INTAKE.get(String(r.patientId));
  if (!v) return null;
  if (v.multi) {
    /* 같은 날 2회 이상 예약 — 이번 접수와 **짝이 맞는 예약**의 문진인지 본다.
       ⚠️ 접수 행에는 예약 시각이 `appointmentTime`(HHmm)으로 온다. 비면 판정할 수
          없으므로 **완료로 치지 않는다**(애매하면 미완료 쪽). */
    const mine = String(r.appointmentTime || '').replace(/\D/g, '');
    const hm = mine.length >= 4 ? mine.slice(0, 2) + ':' + mine.slice(2, 4) : '';
    if (!hm || !v.apptHm || hm !== v.apptHm) return { ...v, done: false, other: true };
  }
  return v;
}

/** 이름 — ⚠️ `staffId 0` 은 **미지정**이다. 「0번 직원」이라고 적지 않는다.
 *  ⚠️ 이름으로 직원을 잇지 않는다(덴트웹에 동명이 실제로 있다) — staffId 로 잇는다. */
const staffName = id => (!id || String(id) === '0') ? '' : (STAFF.get(String(id)) || '');

function chairName(id) {
  const k = String(id ?? '');
  if (!k || k === '0') return '';
  const c = CHAIRS.find(x => String(x.chairId) === k);
  return c ? c.name : '체어 미상';
}

/* ── 그리기 ────────────────────────────────────────────────────────── */
function render() {
  const rooms = CHAIRS.filter(c => !isXray(c)).sort(byOrder);
  const { cuts, basis } = waitCuts(BASELINE);

  // 사람을 칸으로 가른다. 🔴 placeOf 가 유일한 판정자다.
  const byZone = { wait: [], desk: [] }, byChair = new Map();
  let shown = 0, cntUrg = 0, cntWarn = 0, cntIntake = 0;
  VIEWS = new Map();

  for (const r of ROWS) {
    const place = placeOf(r);
    if (!place) continue;                       // 수납완료 — 맵에서 내린다
    const inqs = inquiriesOf(r.patientId, ACTIONS);
    const level = urgencyOf(r, inqs, cuts);
    const v = { r, inqs, level, place, color: colorOf(r, level) };
    VIEWS.set(String(r.patientId), v);
    shown++;
    if (level === 2) cntUrg++; else if (level === 1) cntWarn++;

    if (place.zone === 'chair') {
      const k = String(place.chairId || 0);
      if (!byChair.has(k)) byChair.set(k, []);
      byChair.get(k).push(v);
    } else {
      byZone[place.zone].push(v);
    }
  }
  // 오래 기다린 사람이 먼저 보이게 — 눈이 왼쪽부터 읽는다.
  const byWait = (a, b) => (waitedMin(b.r) ?? 0) - (waitedMin(a.r) ?? 0);
  byZone.wait.sort(byWait); byZone.desk.sort(byWait);

  trackMoves();

  const totalAll = ROWS.length;
  /* 🔴 문진 제출 = **오늘 접수 전체** 중 제출(수납완료 포함). 맵에서 내린 사람을 빼면 오후로 갈수록 숫자가 줄었다. */
  for (const r of ROWS) { const ik = intakeOf(r); if (ik && ik.done) cntIntake++; }
  /* 🔴 수납완료는 **맵에서 내린 사람**이다(placeOf 가 null) — 그래서 점으로는 안 보인다.
     전용 칸에서 **목록으로** 보여준다. 늦게 끝난 사람이 위(최근 순). */
  const donePts = ROWS.filter(r => r.status === 4)
    .sort((a, b) => String(b.treatEndAt || b.receivedAt || '')
      .localeCompare(String(a.treatEndAt || a.receivedAt || '')));
  const done = donePts.length;

  let h = '';
  h += '<div class="touchnote">네모를 <b>눌러서</b> 상세를 엽니다(마우스가 있으면 올리기만 해도 열려요).</div>';

  // ── 위 띠 ──
  /* 🔴 **요청 KPI 를 앞·강하게, 지켜볼 수는 뒤로**.
     🔴 **급함·대기·수납 대기·진료 중·수납완료 KPI 는 뺐다**(사용자 지시 2026-10-20) —
        그 수는 아래 지도(접수·진료실·수납 대기·수납완료 칸)에서 네모로 이미 보인다.
        그 자리에 **예약변경·문서요청·클레임** 요청 KPI 를 넣고, **누르면 아래 표에**
        해당 요청의 환자 목록이 펼쳐진다(접수·진료실 칸을 누르는 것과 같은 동작).
     · 예약변경·문서요청은 문의·요청 보드(APPT·INSURANCE) 실데이터.
     · 클레임은 출처가 없어 `?` — 0 으로 그리면 「불만이 없다」로 오독된다.
     ⚠️ 미처리 문의(알림톡 응답)·오늘 촬영·문진 제출은 **그대로 둔다**(요청과 다른 집계). */
  /* 🔴 KPI 는 **항상 오늘** 건수(사용자 지시 2026-10-20: 「당일 것만 표기」). 표의 달력이
     다른 날짜를 봐도 KPI 숫자는 오늘로 둔다 — KPI 는 「오늘 처리할 일」이기 때문이다. */
  /* 🔴 KPI = **오늘 처리할 일** → 미처리(PENDING)만 센다. 처리된 요청까지 세면 숫자가 줄지 않는다
     (리뷰 2026-10-20: 수납 대기 「요청」 칩은 이미 미처리만 본다 — 같은 기준으로). 못 받았으면 null(?). */
  const cntChg = SRC_OK.qb ? qByTag('APPT', todayKey()).filter(r => !qDone(r)).length : null;
  const cntDoc = SRC_OK.qb ? qByTag('INSURANCE', todayKey()).filter(r => !qDone(r)).length : null;
  h += '<div class="top">'
    /* 🔴 환자 찾기 — **맨 앞**(사용자 지시 2026-10-20). 누르면 input 이 펼쳐지고,
       치면 좌측 위에 유사 환자 목록이 뜬다. 목록 클릭(또는 1건일 때 엔터)→상세패널. */
    + searchKpiHTML()
    + '<div class="kpi-div" aria-hidden="true"></div>'
    /* ① 요청 KPI — 누르면 아래 표에 목록(사용자 지시 2026-10-20) */
    + kpiBtn(cntChg, '예약 변경', 'chg', cntChg ? 'warn' : 'calm')
    + kpiBtn(cntDoc, '문서요청', 'docs', cntDoc ? 'warn' : 'calm')
    + kpiBtn(null, '클레임', 'claim', 'calm')          // 출처 없음 → `?`
    /* 🔴 「온라인문의」 KPI 는 제거(사용자 지시 2026-10-22) — 같은 목록(INQ_ALL)을
       **관리 컴포넌트의 「문의」 아이콘**에서 그대로 볼 수 있어, 상단 KPI 는 뺀다.
       (inq 표 DEF 와 관리 「문의」 아이콘·클릭 경로는 그대로 둔다.) */
    + '<div class="kpi-div" aria-hidden="true"></div>'
    /* ② 집계 KPI — 지켜보는 것(지나간 수).
       🔴 누르면 아래 표에 **그 환자 목록**(사용자 지시 2026-10-22) — 요청 KPI 와 같은 동작(kpiBtn). */
    + (SRC_OK.xr ? kpiBtn(XRAYS.size, '오늘 촬영', 'xray', 'calm') : kpi(null, '오늘 촬영', 'calm'))
    /* 🔴 수집이 멈췄으면 **숫자 대신 `?`** 다 — 0 은 「아무도 안 냈다」는 사실 주장이다.
       그때는 누를 수도 없다 — 펼칠 목록이 「제출자 0명」으로 읽힌다. */
    + (intakeCollecting()
        ? kpiBtn(cntIntake, '문진 제출', 'intake', 'calm')
        : '<div class="kpi"><div class="n"><span class="unk" title="수집이 멈춰 셀 수 없어요">?</span></div>'
          + '<div class="l">문진 제출</div></div>')
    + '</div>';

  /* 🔴 덴트웹이 끊겼거나 문진 수집이 멈추면 **접지 않고** 눈에 보이게 띄운다.
     정상일 때만 조용하다 — 평소에 띠가 없어야 고장이 눈에 띈다. */
  const alerts = [];
  if (!connOk) alerts.push('🔴 덴트웹 끊김 — ' + esc(lastErr));
  { const hh = INTAKE_HEALTH;
    if (hh && hh.state && hh.state !== 'ok') alerts.push(intakeHealthLine().text); }
  if (alerts.length) h += '<div class="alertbar">' + alerts.join(' · ') + '</div>';

  // ── 범례 — 🔴 숫자를 **URGENCY 에서 읽어** 쓴다(손으로 적으면 기준과 어긋난다) ──
  h += '<div class="legend">'
    /* 🔴 `i` — 띠에서 걷어낸 설명을 여기 담는다(사용자 지시). 평소엔 접혀 있고
       누르면 펼친다. ⚠️ **버튼**이어야 한다 — div 로 두면 키보드로 못 연다. */
    + '<button class="infoi" id="infoBtn" type="button" aria-expanded="false"'
    + ' aria-controls="infoBox" title="이 화면 설명" aria-label="이 화면 설명">i</button>'
    + '<span><i style="background:#7f8c9b"></i>일반</span>'
    + '<span><i style="background:var(--blue)"></i>신환</span>'
    + '<span><i style="background:var(--green)"></i>진료 중</span>'
    + '<span><i style="background:#7c3aed"></i>진료완료</span>'
    + '<span><i class="big" style="background:#f0a73a"></i>주의 — 대기 ' + cuts[0] + '분+ / 문의 ' + URGENCY.INQ_WARN_MIN + '분+</span>'
    + '<span><i class="big" style="background:var(--red)"></i>급함 — 대기 ' + cuts[1] + '분+ / 문의 ' + URGENCY.INQ_URG_MIN + '분+</span>'
    + '<span style="color:var(--dim2)">· 네모가 클수록 급하다 (칸 크기는 모두 같다)</span>'
    + '</div>';

  /* 설명 상자 — 🔴 띠에 있던 내용을 **그대로** 담는다. 줄인 건 자리지 정보가 아니다. */
  { const hl = intakeHealthLine();
    h += '<div class="infobox" id="infoBox" hidden>'
      + '<div><b>데이터</b> · ' + (connOk ? '덴트웹 연결됨 · ' + esc(nowHm()) + ' 기준'
          : '🔴 덴트웹 끊김 — ' + esc(lastErr)) + '</div>'
      + '<div><b>위치 출처</b> · 덴트웹 상태 — <b>CCTV 미연동</b>'
      + '<span class="dim"> (환자 위치는 접수 상태로만 정합니다. CCTV 는 아직 붙지 않았습니다)</span></div>'
      /* ⚠️ 제목이 이미 「문진 수집」이라 본문의 접두를 **뗀다** —
         안 떼면 「문진 수집 · 문진 수집: 정상」으로 두 번 나온다(실측). */
      + '<div><b>문진 수집</b> · ' + hl.text.replace(/^문진 수집: /, '').replace(/^🔴 문진 수집 /, '🔴 ') + '</div>'
      + '<div><b>급함 기준</b> · 대기 <b>' + cuts[0] + '분</b>(주의)/<b>' + cuts[1] + '분</b>(급함)'
      + ' · 문의 <b>' + URGENCY.INQ_WARN_MIN + '분</b>/<b>' + URGENCY.INQ_URG_MIN + '분</b>'
      + '<span class="dim"> — ' + esc(basis) + '. 대기는 최근 '
      + URGENCY.WAIT_WINDOW_DAYS + '일 분포의 상위 ' + (100 - URGENCY.WAIT_PCTL_WARN) + '%/'
      + (100 - URGENCY.WAIT_PCTL_URG) + '% 입니다</span></div>'
      + '<div><b>네모 크기</b> · 급할수록 커집니다(16→22→28px). 칸은 모두 같아 줄이 흔들리지 않습니다</div>'
      + '</div>'; }

  // ── 대기실 ── (요구: 「대기실 1개를 자동으로」 = 고정 1칸)
  /* 🔴 **좌 = 접수(2) · 우 = 내원 전(1)** (사용자 확정 2026-10-16).
     ⚠️ 좁은 화면(≤760px)에서는 한 줄로 접힌다 — 비율을 고집하면 글자가 뭉개진다. */
  /* 🔴 **한 줄에 고르게**(사용자 지시 2026-10-16): 내원 전 · 접수 · 수납 대기 · 문의.
     ⚠️ 칸을 더해도 **여기 한 줄만 고치면** 된다 — `.row` 가 `1fr` 반복이라
        개수를 세지 않고 **저절로 같은 폭**으로 나뉜다(지시: 「나중에 추가할 컴포넌트가
        있으면 **동일한 비율로 한 줄**로」).
     🔴 순서는 **환자가 거치는 순**이다 — 내원 전 → 접수 → 수납 대기 → 문의.
        왼쪽부터 읽으면 흐름이 되므로 데스크가 매번 자리를 다시 찾지 않는다. */
  /* 진료실 체어 — 🔴 **자동 생성**. 사람이 칸을 정의하지 않는다. */
  let seats = '';
  for (const c of rooms) {
    const list = byChair.get(String(c.chairId)) || [];
    const busy = list.length > 0;
    const v = list[0];
    /* 🔴 **콤팩트하게**(사용자 지시 2026-10-16) — 시간·담당을 **한 줄**로 합치고
       빈 체어는 「비어 있음」 대신 **점선 고리만** 둔다(글자가 자리를 먹는다). */
    /* 🔴 체어 칸은 좁다 — 시간을 **분으로만** 적는다(「1시간 4분」(8자) → 「64분」(3자)).
       ⚠️ `dur()` 를 고치지 않는다 — 말풍선·다른 칸은 「1시간 4분」이 읽기 좋다.
          여기서만 짧게 쓴다. 전체 값은 `title` 에 남는다. */
    const tmin = busy ? treatMin(v.r) : null;   // 🔴 빈 체어면 v 가 undefined 다
    /* 🔴 ② 줄 = **환자 이름**(사용자 지시 2026-10-22: 「소요시간·위생사 이름 대신 환자 이름」).
       한 체어에 둘 이상이면 쉼표로 잇는다(칸이 좁으면 CSS 말줄임). 소요시간·담당은 지우지 않고
       **title(마우스 올림)** 으로 옮겼다 — 정보는 남기고 자리만 비운다. */
    const sub = busy ? list.map(x => x.r.name || '이름 없음').join(', ') : '';
    const meta = busy
      ? [(tmin === null ? '' : tmin + '분'), staffName(v.r.staffId)].filter(Boolean).join(' · ')
      : '';
    /* 🔴 **2줄**이다(사용자 지시 2026-10-16): ① 체어명 + 네모가 **같은 줄** ② 부가설명 한 줄.
       전엔 3줄(이름/네모/설명)이라 칸이 길었다. */
    /* 🔴 각 체어는 **드롭 대상**이다 — data-lane=room·data-chair=그 체어(사용자 지시 2026-10-20).
       네모를 이 체어에 떨구면 「진료 중 + 이 체어」로 바뀐다. */
    seats += '<div class="seat' + (busy ? ' busy' : '') + '" data-lane="room" data-chair="' + esc(c.chairId) + '" title="' + esc(c.name + (sub ? ' · ' + sub + (meta ? ' · ' + meta : '') : ' · 비어 있음')) + '">'
      /* 🔴 ① 줄은 **이름만** — 네모와 나란히 두니 「수술방」이 12px 로 잘렸다(실측 8/10).
         체어는 **이름으로 부른다**(「9번 체어로 가세요」) — 이름이 먼저다.
         ② 줄에 네모 + 시간·담당을 함께 둔다. */
      /* 🔴 ① 이름 + 네모(오른쪽 끝) ② 설명이 **한 줄을 통째로** 쓴다(사용자 지시).
         2열이라 칸이 넓어져 이름과 네모가 같은 줄에 들어가고, 설명은 잘리지 않는다. */
      + '<span class="srow"><span class="sn">' + esc(c.name) + '</span>'
      + '<span class="sd">' + (busy ? list.map(pplHTML).join('') : '<span class="hole"></span>') + '</span></span>'
      + '<span class="sm">' + esc(sub || ' ') + '</span>'
      + '</div>';
  }

  h += '<div class="row4">'
    /* 🔴 **문의 → 내원 전 → 접수 → 수납 대기** (사용자 지시 2026-10-16: 「문의를
       내원 전 **좌측**에」). 앞의 둘은 「아직 안 온/처리 못 한 일」, 뒤의 둘은
       「지금 와 있는 사람」이다 — 왼쪽이 할 일, 오른쪽이 현재 상태로 갈린다. */
    /* 🔴 **타임라인과 네모만**(사용자 지시 2026-10-16: 「정보 목록 부분은 제거하고,
       타임라인과 네모박스만 표기」). 직전엔 그래프 아래에 카드 목록을 같이 뒀는데,
       한 줄 여섯 칸이라 칸이 좁아(≈150px) 카드가 **두 줄씩 접혀** 그래프를 눌렀다.
       ⚠️ 「무슨 요청인지」는 **네모에 얹은 제목(title)** 으로 읽는다 — 점마다
          「이름 · 예약 변경 요청 · 2시간 경과 · 내용…」이 들어 있다(inqPlotHTML).
          지우지 말 것. 이걸 빼면 점이 **아무 뜻도 없는 색 덩어리**가 된다. */
    /* 🔴 **문의 칸 제거**(사용자 지시 2026-10-19) — 「관리」 컴포넌트의 문의 아이콘으로 옮겼다.
       대신 **접수 좌측에 「예약 현황」**(Monday 예약 현황 참고)을 둔다. */
    + reservationHTML()
    /* 🔴 접수 — 「문진 없음 N명」 보조수치 **제거**(사용자 지시 2026-10-19). */
    + zoneBox('접수', '',
        byZone.wait.length, recvPlotHTML(byZone.wait), 'z-recv', false, '', 'recv')
    /* 🔴 인원수 바로 오른쪽에 **수납완료**. 맵에서는 내린 사람이라(status 4) 점으로는
       안 보이지만, 「오늘 몇 명 끝났나」는 데스크가 보는 수다. */
    /* 🔴 **진료실을 접수 우측**으로(사용자 지시 2026-10-16) — 한 줄 안으로 들어왔다.
       제목에서 「체어 N개」는 빼고(2026-10-19) 제목 우측에 **「상담 N명」**(클릭 → 아래 표)을 둔다. */
    /* 🔴 「상담 N명」은 **버튼이 아니라 글자**(사용자 지시 2026-10-19: 「일반 텍스트로 색상만 바꿔서」).
       누르면 상담 표가 열리는 동작은 그대로 둔다. */
    + zoneBox('진료실', '',
        sumChair(byChair), '<div class="grid">' + seats + '</div>' + roomSubsHTML(byChair, rooms), 'z-room', false,
        /* 🔴 제목 오른쪽 「상담 N명」 제거(사용자 지시 2026-10-20) — 아래 「상담」 서브 칸에 같은 수가 있다.
           상담 표는 그 서브 칸을 눌러 연다(.sub-consult · data-zl="consult"). */
        '', 'room')
    /* 🔴 **시간축 그래프**(사용자 지시 2026-10-16). 전엔 점밭이라 「수납이 얼마나
       밀렸나」를 **전혀 알 수 없었다** — 점은 있는데 시간이 없었다. */
    /* 🔴 수납 대기 **안 아래**에 「수납 완료」 칸(사용자 지시 2026-10-19) — 관리의 수납완료 아이콘을 옮겼다. */
    + zoneBox('수납 대기', '',
        byZone.desk.length, payPlotHTML(byZone.desk) + doneSubHTML(done), 'z-pay', false, '', 'pay')
    /* 🔴 **수납완료 칸 제거**(사용자 지시 2026-10-19) — 「관리」 컴포넌트의 수납완료
       아이콘으로 옮겼다. 거기 아이콘을 누르면 아래 표에 목록이 뜬다. */
    /* 🔴 **관리(옛 「내원 전」)를 수납완료 우측**(맨 끝)으로(사용자 지시 2026-10-16).
       이름은 「관리」로 바꾸고(2026-10-19), 환자 목록 대신 **아이콘+수치**로 보여준다
       (Monday 후속 모양). 기존 내원 전 환자는 「자동」 분류 아이콘이다. */
    /* 🔴 칸 숫자를 뺐다(리뷰 2026-10-20) — 예전엔 「관리 N명」이 내원 전(UPCOMING) 수라 아이콘 다섯(문의·자동·
       해피콜·안내·케어)과 무관했다. 분류별 수는 아이콘에 있다. */
    + zoneBox('관리', '',
        null, manageHTML(), 'z-up ro', true)
    + '</div>';


  /* ── 수납 대기(2) · 문의(1) — 위 줄과 **같은 비율**이라 세로선이 맞는다 ── */


  /* 🔴 **예약하기·이동기록 컴포넌트 제거**(사용자 지시 2026-10-19: 「예약 현황 아래에 있는 예약하기 컴포넌트,
     이동기록 컴포넌트를 제거」). 그리지 않을 뿐 함수(bookSection·trackMoves)는 남긴다 — 이동 감지(MOVES)는
     상세패널·말풍선이 쓸 수 있고, bindBook/bindMove 는 요소가 없으면 조용히 빠진다. */

  /* ── 🔴 **칸별 환자 목록 표** — 「**이동기록 컴포넌트 아래에**」(사용자 지시 2026-10-16)
     ⚠️ 이동기록 **위**에 두지 말 것. 한 번 위에 뒀다가 지시와 어긋났다. */
  h += zoneListSection(byZone, byChair, donePts, rooms);
  /* 🔴 「예약표 크게 보기」 — 화면 가득 덮는다(Monday 예약표와 같은 자리). 10초 폴링에도 열린 채 다시 그린다. */
  if (SCH_FULL) h += '<div class="schfull-back">' + schCalendarHTML('full') + '</div>';
  document.body.classList.toggle('sch-open', SCH_FULL);

  /* 🔴 다시 그려도 예약표 스크롤 자리를 지킨다 — 안 지키면 10초마다 맨 위·맨 왼쪽으로 튄다. */
  const keep = {};
  document.querySelectorAll('.sch-scroll[data-sch]').forEach(sc => { keep[sc.dataset.sch] = [sc.scrollLeft, sc.scrollTop]; });
  /* 🔴 **하단 표(.zl-body)도** 스크롤을 지킨다(UIUX 리뷰 2026-10-19) — 전엔 10초마다
     읽던 표가 맨 위로 튀어, 수납완료(50건+) 를 훑다 매번 처음으로 돌아갔다. */
  const zlTop = (document.querySelector('.zl-body') || {}).scrollTop || 0;
  $('app').innerHTML = h;
  fitSch();
  document.querySelectorAll('.sch-scroll[data-sch]').forEach(sc => {
    const k = keep[sc.dataset.sch];
    if (k) { sc.scrollLeft = k[0]; sc.scrollTop = k[1]; }
    else sc.scrollTop = Math.max(0, (+sc.dataset.now || 0) - sc.clientHeight / 2);   // 처음엔 지금 시각을 가운데로
    schNavState(sc.closest('.sch'));
  });
  { const zb = document.querySelector('.zl-body'); if (zb && zlTop) zb.scrollTop = zlTop; }
  bindPpl();
  bindInfo();
  bindBook();
  bindMove();
  bindZoneList();
  bindSearch();
  bindFlowDrag();
  syncFrameHeight();
}

/* ══ 🔴 드래그로 상태 변경 (사용자 지시 2026-10-20) ═════════════════════════════
 * 네모(.ppl/.rdot[data-stdrag]) 를 끌어 접수/진료실(체어)/수납 대기/수납 완료 칸([data-lane])에
 * 떨구면 **덴트웹 상태를 바꾼다**(POST /api/app/reception/stage — Task 3 과 같은 경로).
 *   recv→0(접수) · room→2(진료 중, data-chair 체어) · pay→3(수납 대기) · done→4(수납 완료).
 * 🔴 끄는 동안 **다른 네모는 숨긴다**(사용자 지시) — body.dragging-flow 로 CSS 가 감춘다.
 * ⚠️ 델리게이트로 **한 번만** 묶는다(render 가 매번 부르므로 _done 가드). */
let DRAG_PID = null;
function bindFlowDrag() {
  if (bindFlowDrag._done) return;
  bindFlowDrag._done = true;

  document.addEventListener('dragstart', e => {
    const box = e.target.closest('[data-stdrag][data-pid]');
    if (!box) return;
    DRAG_PID = String(box.dataset.pid);
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG_PID); } catch (_) {}
    box.classList.add('drag-me');
    document.body.classList.add('dragging-flow');   // 🔴 다른 네모 숨김(CSS)
    pinned = null; hidePop();                        // 드래그 중엔 상세 안 띄운다
  });
  document.addEventListener('dragend', () => {
    DRAG_PID = null;
    document.body.classList.remove('dragging-flow');
    document.querySelectorAll('.drag-me').forEach(x => x.classList.remove('drag-me'));
    document.querySelectorAll('[data-lane].lane-over').forEach(x => x.classList.remove('lane-over'));
  });
  document.addEventListener('dragover', e => {
    if (!DRAG_PID) return;
    const lane = e.target.closest('[data-lane]');
    if (!lane) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
    document.querySelectorAll('[data-lane].lane-over').forEach(x => { if (x !== lane) x.classList.remove('lane-over'); });
    lane.classList.add('lane-over');
  });
  document.addEventListener('dragleave', e => {
    const lane = e.target.closest('[data-lane]');
    if (lane && !lane.contains(e.relatedTarget)) lane.classList.remove('lane-over');
  });
  document.addEventListener('drop', async e => {
    const lane = e.target.closest('[data-lane]');
    if (!lane || !DRAG_PID) return;
    e.preventDefault();
    const pid = DRAG_PID;
    const laneKey = lane.dataset.lane;
    const chairId = lane.dataset.chair ? Number(lane.dataset.chair) : null;
    lane.classList.remove('lane-over');
    document.body.classList.remove('dragging-flow');
    await dropToLane(pid, laneKey, chairId);
  });
}

/* 네모를 레인에 떨궜을 때 — 상태 계산 후 변경. 진료실은 체어가 있어야 한다. */
async function dropToLane(pid, laneKey, chairId) {
  const flow = FLOW_LANES[laneKey];
  if (!flow) return;
  const v = VIEWS.get(String(pid)) || offMapViewOf(pid);
  const row = v && v.r;
  if (!row || !row.patientId) { flowToast('그 환자를 찾지 못했어요 — 새로고침해 주세요.', true); return; }
  // 🔴 「체어 없음」 칸(data-chair="0")에 떨구면 **체어 미선택 + 진료 중**(사용자 지시 2026-10-19).
  //    체어를 고르게 하지 않는다 — POST /api-v1/reception/no-chair 가 n체어ID 를 0 으로 비운다.
  if (laneKey === 'room' && chairId === 0) {
    if (Number(row.status) === 2 && !(Number(row.chairId) > 0)) { flowToast('이미 체어 없음 · 진료 중이에요.', false); return; }
    applyDrop(row, 2, 0);
    return;
  }
  if (Number(row.status) === flow.status && !(laneKey === 'room' && chairId && chairId !== row.chairId)) {
    flowToast('이미 ' + flow.label + '예요.', false); return;
  }
  // 🔴 진료실인데 **특정 체어가 아니라 칸 전체**(칸 배경·상담)에 떨궜으면 체어를 고르게 한다.
  if (laneKey === 'room' && (!chairId || chairId <= 0)) {
    pickChairThen(row, cid => applyDrop(row, flow.status, cid));
    return;
  }
  applyDrop(row, flow.status, laneKey === 'room' ? chairId : null);
}
async function applyDrop(row, statusCode, chairId) {
  flowToast('바꾸는 중…', false);
  const res = await changePatientStatus(row, statusCode, chairId);
  if (!res.ok) { flowToast(res.error, true); return; }
  flowToast('상태를 바꿨어요.', false);
  try { await load(); } catch (_) {}
  render();
}
/* 드래그 결과를 **잠깐** 띄우는 토스트(상세패널이 아니라 보드 위에). */
let FLOW_TOAST_T = null;
function flowToast(msg, bad) {
  let t = $('flowToast');
  if (!t) { t = document.createElement('div'); t.id = 'flowToast'; document.body.appendChild(t); }
  t.className = 'flow-toast' + (bad ? ' bad' : '');
  t.textContent = msg; t.hidden = false;
  clearTimeout(FLOW_TOAST_T);
  FLOW_TOAST_T = setTimeout(() => { t.hidden = true; }, bad ? 3500 : 1600);
}

/* 🔴 **스크롤을 하나로** — 이 화면은 셸의 iframe 안에서 돈다(사용자 지적 2026-10-20:
 *   「스크롤이 2개 더 보인다」). iframe 이 뷰포트 높이(calc(100vh-56px))에 **고정**이라
 *   내용(상세표 펼침)이 넘치면 **iframe 안에서 한 번, 셸에서 또 한 번** 스크롤이 생겼다.
 *   iframe 높이를 **내용 높이에 맞춰 키우면** iframe 안 스크롤이 사라지고, 넘칠 때는
 *   **셸(메인 페이지) 스크롤 하나만** 남는다. 같은 출처라 부모 iframe 을 직접 만질 수 있다.
 *   ⚠️ 셸이 아니라 직접 연 경우(frameElement 없음)엔 아무것도 안 한다 — body 가 알아서 스크롤. */
function syncFrameHeight() {
  const fe = window.frameElement;
  if (!fe) return;
  /* 🔴 **크게 보기(full)가 열려 있으면 iframe 을 키우지 않는다**(사용자 보고 2026-10-20:
     「크게 보기 때 컬럼 제목이 밀려 안 보인다」). full 은 `schfull-back{position:fixed;inset:0}`
     오버레이인데, iframe 을 내용(뒤의 인라인 캘린더 포함)에 맞춰 키우면 **fixed 기준이 늘어난
     iframe(982px)** 이 돼 오버레이가 보이는 화면보다 커지고, 셸이 스크롤되며 sticky 제목이
     위로 밀린다. full 동안은 iframe 을 **보이는 영역 높이로 고정**해 오버레이가 화면만 덮게 한다. */
  if (SCH_FULL) {
    let vh = 0;
    try { const sw = window.top && window.top.document && window.top.document.querySelector('.simplebar-content-wrapper'); if (sw && sw.clientHeight) vh = sw.clientHeight; } catch (_) {}
    if (!vh) { try { vh = (window.top ? window.top.innerHeight : window.innerHeight) - 56; } catch (_) { vh = window.innerHeight - 56; } }
    const want = vh + 'px';
    if (fe.style.height !== want) fe.style.height = want;
    const wrap0 = fe.parentElement;
    if (wrap0 && wrap0.style && wrap0.style.height !== 'auto') wrap0.style.height = 'auto';
    return;
  }
  /* 내용이 **보이는 영역보다 짧으면** iframe 을 그 영역 높이로 둔다 — 보드가 화면을 꽉
     채운다(빈 아래 여백·불필요한 스크롤 없음). **넘치면** 내용 높이로 키운다 — iframe 안
     스크롤이 사라지고 셸(메인) 스크롤 하나만, **넘칠 때만** 생긴다(사용자 지시 2026-10-20).
     🔴 기준 높이 = 셸의 **실제 스크롤 영역 높이**(.simplebar-content-wrapper). 전엔
        `window.innerHeight−56` 로 어림해 실제(749)보다 8~64px 커서, 보드만 떠 있어도
        셸이 늘 조금 스크롤됐다. 같은 출처라 부모에서 그 값을 직접 읽는다. */
  let avail = 0;
  try {
    const sw = window.top && window.top.document && window.top.document.querySelector('.simplebar-content-wrapper');
    if (sw && sw.clientHeight) avail = sw.clientHeight;
  } catch (_) { /* 크로스오리진 등 — 아래 폴백 */ }
  if (!avail) { try { avail = (window.top ? window.top.innerHeight : window.innerHeight) - 56; } catch (_) { avail = window.innerHeight - 56; } }
  // 🔴 내용 높이는 **body.scrollHeight** 로 잰다. documentElement.scrollHeight 는 iframe 이
  //    고정 높이일 때 그 높이로 **내려 깎일** 수 있어 내용을 못 넘는다 — body 는 내용대로다.
  const content = document.body ? document.body.scrollHeight : 0;
  const want = Math.max(avail, content) + 'px';
  if (fe.style.height !== want) fe.style.height = want;
  /* 부모 래퍼(wrapper div: height:calc(100vh-56px)) 와 그 위 `main.h-full`(= 100% = 창
     전체 813px)이 **셸 영역(749px)보다 커서** 보드만 떠 있어도 셸이 64px 스크롤됐다.
     둘 다 **내용 높이에 맡긴다**(height:auto) — iframe 이 이미 제 높이를 정하므로. */
  const wrap = fe.parentElement;
  if (wrap && wrap.style && wrap.style.height !== 'auto') wrap.style.height = 'auto';
  const mainEl = wrap && wrap.parentElement;   // setMain 의 <main class="h-full">
  if (mainEl && mainEl.tagName === 'MAIN' && mainEl.classList.contains('h-full')) {
    mainEl.classList.remove('h-full');
    mainEl.style.height = 'auto';
  }
}

/* 칸 class(`z-inq` 등) → 표 key. 🔴 **칸을 더하면 여기도 더한다** — 없는 칸은
   그냥 안 눌릴 뿐이라 조용히 빠진다(에러가 안 난다). */
const ZONE_LIST_KEY = { resv: 'resv', inq: 'inq', recv: 'recv', room: 'room', pay: 'pay', done: 'done', up: 'up' };

/* ══ 칸별 환자 목록 표 ═══════════════════════════════════════════════
 *
 * 사용자 지시(2026-10-16): 「이동기록 컴포넌트 아래에 문의·접수·진료실·수납 대기·
 * 수납완료·내원 전 컴포넌트 누르면 **해당 컴포넌트의 환자 목록이 뜨는 표**를 펼쳐라.
 * 환자 네모박스를 누르면 **상세패널**, 네모박스 외에 해당 컴포넌트를 누르면
 * 하단에 **환자 목록 표**가 펼쳐지는 구조」
 *
 * 🔴 **칸마다 보여줄 열이 다르다.** 한 가지 모양으로 찍으면 빈 칸투성이가 된다 —
 *    접수는 「얼마나 기다렸나」, 수납완료는 「언제 끝났나」, 내원 전은 「예약이 언제인가」다.
 * 🔴 표의 행을 눌러도 **상세패널이 열린다** — 네모와 같은 동작이라야 헷갈리지 않는다.
 *    ⚠️ 단 맵에 없는 사람(내원 전·일부 문의)은 접수 행이 없어 열 수 있는 것과
 *       없는 것이 갈린다 — `offMapViewOf` 가 **문의·내원 전 둘 다** 메운다.
 */
/* ══ 수납 대기 「요청」 라벨 + 정리 체크 (사용자 지시 2026-10-19) ══════════════════
 * 「수납대기 상세 표에 요청 컬럼 · 어떤 요청을 했는지 라벨 · 라벨을 체크박스로 정리했는지 표시」.
 * 요청 출처 — 🔴 **이미 받은 것만** 쓴다(지어내지 않는다):
 *   ① 문의(reach-action, INQ_ALL) 미처리 — 예약 변경 요청·지각 신고·리콜 응답
 *   ② 문의·요청 보드(QBOARD) 그 환자 것 —
 *      · APPT(예약 취소·변경·노쇼) **미처리(PENDING)** 만 → 「예약 취소」 등
 *      · INSURANCE(서류 발급) **오늘** 것 → 「서류 발급」
 *      · 그 밖(전화 문의) **미처리** → 「전화 문의」
 * 체크 상태는 모닝웹 로컬(/api-v1/lounge/request-checks). key 는 요청 내용으로 만든다 —
 *   덴트웹 보드 행 id 는 조회마다 순번이라 **안정 키가 아니다**(api_v1_pages appt_items).
 */
let REQ_CHECKS = {};   // key → {done, byName, updatedAt}
function reqsOf(pid) {
  const key = String(pid);
  const out = [];
  INQ_ALL.filter(a => String(a.patientRef ?? '') === key).forEach(a => {
    out.push({ key: 'inq:' + a.id, label: inqLabel(a.actionType), title: String(a.note || '') });
  });
  const today = todayKey();
  QBOARD.filter(r => String(r.patientId ?? '') === key).forEach(r => {
    const created = String(r.createdAt || '');
    let label = null;
    if (qHasTag(r, 'APPT')) { if (!qDone(r)) label = '예약 ' + apptActionLabel(r.appointmentAction); }
    else if (qHasTag(r, 'INSURANCE')) { if (created.slice(0, 10) === today) label = '서류 발급'; }
    else if (!qDone(r)) label = '전화 문의';
    if (!label) return;
    const tag = qHasTag(r, 'APPT') ? 'APPT' : qHasTag(r, 'INSURANCE') ? 'INSURANCE' : 'CALL';
    out.push({ key: 'q:' + tag + ':' + key + ':' + created + ':' + (r.appointmentAction || ''),
               label, title: qMessageLine(r.message) });
  });
  /* ③ 🔴 **직원이 발급한 서류**(2026-10-21) — 세 번째 출처.
     「영수증 떼 주세요」는 보드에 안 남고 **데스크에서 말로** 들어온다.
     발급 기록(`doc:` 키)은 모닝웹 로컬에 있고, 체크표가 **라벨까지** 돌려주므로
     새로고침 뒤에도 복원된다(이 화면 세션의 `DOC_ISSUED` 는 즉시 반영용). */
  Object.entries(REQ_CHECKS).forEach(([k, c]) => {
    if (!k.startsWith('doc:')) return;
    if (String(c && c.patientId) !== key) return;
    out.push({ key: k, label: (c && c.label) || '서류 발급', title: '데스크에서 발급' });
  });
  DOC_ISSUED.filter(x => x.patientId === key)
    .forEach(x => out.push({ key: x.key, label: x.label, title: '방금 발급' }));

  // 같은 키 중복 제거(같은 시각 같은 요청이 두 번 올 때)
  const seen = new Set();
  return out.filter(x => !seen.has(x.key) && seen.add(x.key));
}
function reqChipsHTML(pid) {
  const list = reqsOf(pid);
  if (!list.length) return '<span class="rq-none">—</span>';
  return '<span class="rq-chips">' + list.map(x => {
    const c = REQ_CHECKS[x.key];
    const done = !!(c && c.done);
    const tip = (x.title ? x.title + '\n' : '') + (done ? '정리함' + (c.byName ? ' · ' + c.byName : '') : '체크하면 정리한 것으로 남깁니다');
    return '<label class="rq-chip' + (done ? ' done' : '') + '" title="' + esc(tip) + '">'
      + '<input type="checkbox" data-rqkey="' + esc(x.key) + '" data-pid="' + esc(pid) + '" data-label="' + esc(x.label) + '"'
      + (done ? ' checked' : '') + '>' + esc(x.label) + '</label>';
  }).join('') + '</span>';
}
async function loadReqChecks() {
  const pids = (ROWS || []).map(r => r.patientId).filter(Boolean);
  if (!pids.length) { REQ_CHECKS = {}; return; }
  try {
    const j = await fetch(api('/api-v1/lounge/request-checks?patientIds=' + encodeURIComponent(pids.join(','))),
      { headers: { accept: 'application/json' } }).then(r => r.json());
    if (j && j.ok && j.data && Array.isArray(j.data.checks)) {
      const m = {};
      j.data.checks.forEach(c => { m[c.key] = c; });
      REQ_CHECKS = m;
    }
  } catch (_) { /* 직전 값 유지 */ }
}
async function loadMessages() {
  if (MOCK) return;   // 목업 레인엔 이 출처가 없다 — 지어내지 않는다(「?」로 둔다)
  const pids = [...new Set((ROWS || []).map(r => r.patientId).filter(Boolean))].sort((a, b) => a - b);
  const key = pids.join(',');
  if (LMSG && key === LMSG_KEY && Date.now() - LMSG_AT < 60000) return;
  try {
    const j = await fetch(api('/api-v1/lounge/messages?patientIds=' + encodeURIComponent(key)),
      { headers: { accept: 'application/json' } }).then(r => r.json());
    if (j && j.ok && j.data) { LMSG = j.data; LMSG_KEY = key; LMSG_AT = Date.now(); }
  } catch (_) { /* 직전 값 유지 */ }
}
/** 'YYYYMMDDHHmm' → 'M/D HH:MM'(오늘이면 'HH:MM'). */
function mtAt(at) {
  const t = String(at || '').replace(/\D/g, '');
  if (t.length < 12) return '';
  const hm = t.slice(8, 10) + ':' + t.slice(10, 12);
  return t.slice(0, 8) === todayKey().replace(/\D/g, '') ? hm : (+t.slice(4, 6)) + '/' + (+t.slice(6, 8)) + ' ' + hm;

/* ── 상세표 **컬럼 클릭 정렬** (사용자 지시 2026-10-23) ──────────────────────
 *
 * 「상세표 컬럼을 선택하면 선택한 컬럼으로 내림/오름 차순 정렬 · 다른 컴포넌트의
 *  상세표도 동일하게」 → **표를 그리는 곳이 한 군데**(`zlistHTML`)라 거기만 고친다.
 *
 * 🔴 **표의 글자로 정렬한다.** 셀은 HTML 이라 태그를 걷어내고 본다. 숫자·시각처럼
 *    보이면 **숫자로**, 아니면 **글자(한국어)로** 비교한다 — 「10:30」이 「9:30」보다
 *    뒤에 오게 하려면 글자 비교로는 안 된다.
 * ⚠️ 정렬 상태는 **표(칸)마다 따로** 기억한다 — 접수 표에서 고른 정렬이 수납 표에
 *    따라가면 「왜 이 순서지」가 된다.
 * ⚠️ 10초 폴링으로 다시 그려도 **유지**된다(`ZL_SORT` 가 화면 메모리에 남는다).
 */
let ZL_SORT = null;   // { key: 표 키, col: 컬럼 index, dir: 1 오름 / -1 내림 }

/** 셀 HTML → 비교용 문자열(태그 제거 · 공백 정리). */
function zlCellText(html) {
  const d = document.createElement('div');
  d.innerHTML = String(html == null ? '' : html);
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
/** 숫자처럼 보이면 숫자로 — 「1,200원」·「10:30」·「#8383」·「+5분」 전부 다룬다. */
function zlCellNum(t) {
  const s = String(t);
  /* 시각(HH:MM)은 분으로 — 글자 비교면 9:30 > 10:30 이 된다. */
  const hm = s.match(/(\d{1,2}):(\d{2})/);
  if (hm) return (+hm[1]) * 60 + (+hm[2]);
  /* 날짜(M/D 또는 YYYY-MM-DD) */
  const ymd = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (ymd) return (+ymd[1]) * 10000 + (+ymd[2]) * 100 + (+ymd[3]);
  const n = s.replace(/[^\d.-]/g, '');
  if (n === '' || n === '-' || n === '.') return null;
  const v = Number(n);
  return Number.isFinite(v) ? v : null;
}
/** 고른 컬럼으로 정렬한다. 고른 게 없으면 **원래 순서 그대로**(각 표의 기본 정렬). */
function zlSortRows(cur, rows) {
  if (!ZL_SORT || !cur || ZL_SORT.key !== cur.key) return rows;
  const i = ZL_SORT.col, dir = ZL_SORT.dir;
  /* 🔴 `slice()` — 원본 배열을 뒤집지 않는다(다른 곳이 같은 배열을 본다). */
  return rows.slice().sort((a, b) => {
    const ta = zlCellText((a.cells || [])[i]), tb = zlCellText((b.cells || [])[i]);
    /* 빈 칸(—·공백)은 **항상 뒤로** — 오름/내림과 무관하게 아래 모인다. */
    const ea = (ta === '' || ta === '—'), eb = (tb === '' || tb === '—');
    if (ea !== eb) return ea ? 1 : -1;
    if (ea && eb) return 0;
    const na = zlCellNum(ta), nb = zlCellNum(tb);
    if (na != null && nb != null && na !== nb) return (na - nb) * dir;
    return ta.localeCompare(tb, 'ko') * dir;
  });
}

/** 그 행의 **시각**(정렬 기준) — 보낸 건은 발송시각, 아직이면 예약시각. */
const mtTime = r => String(r.sentAt || r.apptAt || '');

/** 🔴 **모닝앱이 보낼 예정인가**(사용자 지시 2026-10-23: 「보낼 예정인 것도 표기」)
 *
 * 모닝앱의 「예약 1시간 전」(SSDC_L17)은 **예약 1시간 전**에 나간다. 그러니 아직 그
 * 시점이 안 된 환자는 **「예정」**으로 보여야 한다 — 안 그러면 「미발송」만 보고
 * 직원이 **손으로 또 보낸다**(환자는 같은 안내를 두 번 받는다).
 *
 * 판정(전부 **이미 있는 값**으로 — 지어내지 않는다):
 *   · 아직 안 보냈고(`status !== 'sent'`)
 *   · **모닝앱이 이미 보낸 적 없고**(`morningSent` 가 아니고)
 *   · 예약시각이 있고, **지금이 「예약 1시간 전」보다 이르다**
 * ⚠️ 1시간 전이 **지났는데도** 안 나갔으면 「예정」이 아니다 — 그건 진짜 **미발송**이다
 *    (예정이라고 적으면 안 온 안내를 기다리게 된다).
 */
function mtPending(r) {
  if (!r || r.status === 'sent' || r.morningSent) return false;
  /* 🔴 「1시간 전」은 L17(appt_1h_notice) 전용 개념이다 — 예약확정(L19·L20)은 예약을
     **잡은 직후** 나가야 하는 안내라 방문시각까지 기다릴 이유가 없다(사용자 지시
     2026-10-29, 알림톡 종류 컬럼 신설과 함께 분리). L19/L20 행은 늘 지금 보낼 수 있다. */
  if (r.noticeKind && r.noticeKind !== 'appt_1h_notice') return false;
  const t = String(r.apptAt || '');
  if (t.length < 12) return false;
  const appt = (+t.slice(8, 10)) * 60 + (+t.slice(10, 12));
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  /* 내일 예약은 오늘 기준으로 **아직 한참 남았다** — 무조건 예정. */
  if (r.target === 'tomorrow') return true;
  return cur < appt - 60;
}
/** 예정이면 「몇 시에 나갈 예정」인지. (예약 1시간 전) */
function mtPendingHm(r) {
  const t = String(r.apptAt || '');
  if (t.length < 12) return '';
  let m = (+t.slice(8, 10)) * 60 + (+t.slice(10, 12)) - 60;
  if (m < 0) m += 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/** 「관리 → 자동」 표 행 — 🔴 **기본은 시각 내림차순**(사용자 지시 2026-10-23).
 *  ⚠️ 컬럼을 누르면 `ZL_SORT` 가 생겨 그쪽이 우선한다(아래 `zlSortRows`). */

  const chip = cb.closest('.rq-chip');
  const done = cb.checked;

  try {
    const r = await fetch(api('/api-v1/lounge/request-checks'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: cb.dataset.rqkey, patientId: Number(cb.dataset.pid), label: cb.dataset.label, done }),
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) throw new Error((j && (j.error || j.message)) || ('HTTP ' + r.status));
    REQ_CHECKS[cb.dataset.rqkey] = { done, byName: j.data && j.data.byName };
    chip.classList.toggle('done', done);

    /* 🔴 문서요청 — 문의·요청 보드의 INSURANCE(보험서류 발급 요청). 선택 날짜 기준. */
    /* 🔴 덴트웹 서류발급 기록에서 온 행은 **이미 발급된 것**이다 — 시각은 「발급」. 홈페이지 요청만 미처리가 있다. */
    { key: 'docs', title: '문서요청', unit: '건', n: qByTag('INSURANCE').length, datePick: true,
      cols: ['환자', '차트', '시각', '상태', '내용'],
      rows: () => qByTag('INSURANCE').slice().sort((a, b) => qDone(a) - qDone(b)).map(r => ({ pid: r.patientId, cells: [
        esc(r.patientName || r.name || '이름 없음'),
        r.chartNo ? '#' + esc(r.chartNo) : '—',
        esc(fmtQHm(r.createdAt) ? (/^DENTWEB/.test(String(r.source || '')) ? '발급 ' : '접수 ') + fmtQHm(r.createdAt) : '—'),
        qDone(r) ? '<span class="mt-st notyet">처리됨</span>' : '<span class="mt-st unsent">미처리</span>',
        esc(qMessageLine(r.message)) ] })) },
    /* 🔴 오늘 촬영 — 상단 KPI 「오늘 촬영」을 누르면(사용자 지시 2026-10-22). 출처는 KPI 와 같은
       XRAYS(덴트웹 TB_이미지 · 오늘). 최근 촬영이 위. 이름·차트는 오늘 접수/예약에서 잇는다 —
       촬영 기록엔 환자ID 만 있다. 못 이으면 「이름 미확인」(지어내지 않는다). */
    { key: 'xray', title: '오늘 촬영', unit: '명', n: SRC_OK.xr ? XRAYS.size : null,
      cols: ['환자', '차트', '촬영', '장수', '마지막 촬영', '지금'],
      rows: () => [...XRAYS.values()].slice()
        .sort((a, b) => String(b.lastAt || '').localeCompare(String(a.lastAt || '')))
        .map(x => { const p = patientLite(x.patientId);
          return { pid: x.patientId, cells: [
            p.name ? esc(p.name) : '<span class="unk" style="font-weight:600">이름 미확인</span>',
            p.chartNumber ? '#' + esc(p.chartNumber) : '—',
            esc(x.kinds || '—'), esc(String(x.shots ?? '—')) + '장',
            esc(hhmm(x.lastAt) || '—'), esc(p.where) ] }; }) },
    /* 🔴 문진 제출 — 상단 KPI 「문진 제출」을 누르면(사용자 지시 2026-10-22). KPI 숫자와
       **같은 판정**(오늘 접수 전체 중 intakeOf(r).done)으로 고른다 — 다르면 숫자와 행 수가 어긋난다. */
    { key: 'intake', title: '문진 제출', unit: '명', n: intakeCollecting() ? ROWS.filter(r => { const ik = intakeOf(r); return ik && ik.done; }).length : null,
      cols: ['환자', '차트', '제출', '예약', '지금', '알림톡 이력'],
      rows: () => ROWS.map(r => ({ r, ik: intakeOf(r) })).filter(x => x.ik && x.ik.done)
        .sort((a, b) => String(b.ik.submitHm || '').localeCompare(String(a.ik.submitHm || '')))
        .map(({ r, ik }) => ({ pid: r.patientId, cells: [
          esc(r.name || '이름 없음') + (r.isNewPatient ? ' <span class="ub-new">신환</span>' : ''),
          r.chartNumber ? '#' + esc(r.chartNumber) : '—',
          esc(ik.submitHm || '—'),
          (t => t.length >= 4 ? esc(t.slice(0, 2) + ':' + t.slice(2, 4)) : '—')(String(r.appointmentTime || '').replace(/\D/g, '')),
          esc(rowWhere(r)),
          msgTrailHTML(r.patientId) ] })) },
    /* 🔴 클레임 — **출처 없음**(불만 분류는 전수조사에서 전부 null, api_v1_spec.rs:361).
       0 건으로 그리면 직원이 「불만이 없다」로 오독한다 → 표 대신 「준비 중」 안내.
       n:null 로 둬 KPI 가 `?` 를 띄우게 한다(0 이 아님). */
    { key: 'claim', title: '클레임', n: null,
      cols: [], rows: () => [], empty: '덴트웹에 불만 데이터 출처가 아직 없어 준비 중입니다.' },
    /* 🔴 「관리」 표 — 지금 고른 분류(MANAGE_SEL)에 따라 내용이 다르다.
       · 자동: 방문예정(예약·알림톡 판정은 카드와 같다 — sent/예정/지남).
       · 해피콜·안내·케어: 서버 followups 의 그 분류 목록(환자·라벨). */
    { key: 'up',
      title: '관리',
      unit: MANAGE_SEL === 'auto' ? '건' : '명',
      n: (() => { const c = MANAGE_CATS.find(c => c[0] === MANAGE_SEL); const l = c ? c[2]() : null; return l == null ? null : l.length; })(),
      /* 🔴 자동 = 환자 기준 **자동 발송 알림톡** 발송·실패·미발송(사용자 지시 2026-10-20). 출처 안내는 note. */
      /* 🔴 출처 두 갈래(사용자 지시 2026-10-21): 덴트웹 발송 원장 + 모닝앱(메센트) 결과. 메센트를 못 읽었으면
         **0건으로 덮지 않고** 사유를 note 에 붙인다. */
      note: MANAGE_SEL === 'auto' ? (LMSG ? (LMSG.note + (LMSG.morning && LMSG.morning.error ? ' ⚠️ 모닝앱 알림톡은 못 불러왔어요 — ' + LMSG.morning.error : (LMSG.morning ? ' · 모닝앱 ' + LMSG.morning.count + '건(' + LMSG.morning.license + ')' : ''))) : '문자·알림톡 기록을 아직 받지 못했어요(덴트웹 연결을 확인하세요).') : null,
      /* 🔴 「보내기」는 **발송(시각) 바로 오른쪽**(사용자 지시 2026-10-23).
         🔴 「종류」 — 1시간전 안내·예약확정(신환)·예약확정(구환)을 컬럼으로 구분한다
            (사용자 지시 2026-10-29). 값은 서버 noticeKind(없으면 「그 밖」 — 리콜·지각
            등 이번 범위 밖 자동발송). */
      cols: MANAGE_SEL === 'auto' ? ['환자', '종류', '출처', '대상', '예약', '자동 알림톡', '발송', '보내기', '결과'] : ['환자', '분류', '차트', '할 일'],
      rows: () => {
        if (MANAGE_SEL === 'auto') {
          return (autoMsgRows() || []).map(a => ({ pid: a.patientId, cells: [
            esc(a.name || '이름 없음') + (a.chartNumber ? ' <span class="zl-ch">#' + esc(a.chartNumber) + '</span>' : ''),
            a.noticeKind
              ? '<span class="notice-kind ' + esc(a.noticeKind) + '">' + esc(a.noticeLabel || a.noticeKind) + '</span>'
              : '<span class="zl-dash" title="1시간전 안내·예약확정 외의 자동발송(리콜·지각 등)">그 밖</span>',
            a.source === 'morning' ? '<span class="mt-src mw" title="모닝앱이 메센트로 보낸 알림톡">모닝앱 · 메센트</span>'
              : '<span class="mt-src dw" title="덴트웹 발송 원장(TB_SMS전송결과)">덴트웹</span>',
            esc(MT_TARGET[a.target] || '—'),
            esc(mtAt(a.apptAt) || '—'),
            '<span class="mtag" title="' + esc(a.source === 'morning' ? ('템플릿 ' + (a.templateCode || '') + (a.route ? ' · ' + a.route : '') + (a.rsltCode ? ' · 결과코드 ' + a.rsltCode : '') + ' — 본문은 메센트가 주지 않습니다') : String(a.text || '').replace(/\s+/g, ' ').slice(0, 200)) + '">' + esc(a.label || '알림톡') + '</span>',
            esc(mtAt(a.sentAt) || '—'),
            /* 🔴 **발송 버튼을 「보낼 수 있는 행」에 붙인다**(2026-10-23 · 사용자 보고로 수정).
               처음엔 `source === 'morning'` 인 행에만 붙였는데 **그게 틀렸다** —
               실측: `unsent` 9건 · `notyet` 3건이 **전부 `source:'dentweb'`** 이라
               「아직 안 보낸 사람」에게 버튼이 **하나도 안 붙었다**(김준석 #8383 10:30 건으로 드러남).
               🔴 **출처는 「누가 이미 보냈나」**이고, 버튼은 **「지금 모닝웹이 보낼까」**다 — 축이 다르다.
                  모닝웹이 보내면 그 건의 출처는 그때 모닝웹이 된다.
               → ① **아직 안 보낸 행**(unsent·notyet) = 보내야 할 대상 → 「발송」
                 ② **모닝웹이 이미 보낸 행** = 다시 보낼 수 있다(사용자 지시) → 「다시 발송」
                 ③ **덴트웹이 이미 보낸 행** = 버튼 없음 — 덴트웹이 보낸 걸 우리가 겹쳐 보내면
                    환자가 같은 안내를 두 번 받는다(출처를 섞지 않는다).
               ⚠️ 되돌릴 수 없는 **외부 발송**이라 누르면 **한 번 확인**을 받는다. */
            /* ⚠️ **예정 행에는 버튼을 두지 않는다** — 모닝앱이 곧 보낸다. 지금 손으로 보내면
               환자가 **같은 안내를 두 번** 받는다(사용자 지시의 취지). */
            mtPending(a)
              ? '<span class="zl-dash" title="모닝앱이 ' + esc(mtPendingHm(a)) + '에 보낼 예정입니다 — 지금 보내면 두 번 갑니다">—</span>'
              : (a.status !== 'sent' || a.source === 'morning')
              ? '<button type="button" class="mt-send" data-send-pid="' + esc(a.patientId)
                + '" data-send-name="' + esc(a.name || '') + '" data-send-chart="' + esc(a.chartNumber || '')
                + '" data-send-tpl="' + esc(a.templateCode || '')
                + '" data-notice-kind="' + esc(a.noticeKind || '')
                + '" data-appt-at="' + esc(a.apptAt || '')
                + '" data-appt-care="' + esc(a.apptCare || '') + '"'
                + ' title="' + esc((a.status === 'sent' ? '이미 발송된 건입니다 — 다시 보냅니다. '
                      : '아직 안내가 나가지 않은 환자입니다. ')
                    + '실제 환자에게 알림톡이 나갑니다.') + '">'
                + (a.status === 'sent' ? '다시 발송' : '발송') + '</button>'
              : '<span class="zl-dash" title="덴트웹이 이미 보낸 건입니다 — 겹쳐 보내면 환자가 같은 안내를 두 번 받습니다">—</span>',
            (mtPending(a)
              /* 🔴 **모닝앱이 보낼 예정** — 「미발송」으로만 두면 직원이 손으로 또 보낸다. */
              ? '<span class="mt-st pending" title="' + esc('모닝앱이 예약 1시간 전(' + mtPendingHm(a) + ')에 자동 발송할 예정입니다 — 기다리면 됩니다.') + '">발송 예정 ' + esc(mtPendingHm(a)) + '</span>'
              : '<span class="mt-st ' + esc(a.status) + '">' + esc(MT_STATUS[a.status] || a.status) + '</span>')
              /* 덴트웹 예약 안내는 없지만 모닝앱 알림톡은 나간 환자 — 「미발송」만 보면 아무것도 안 받은 줄 안다 */
              + (a.morningSent ? ' <span class="mt-src mw" title="덴트웹 예약 안내는 없지만, 오늘 모닝앱(메센트) 알림톡이 나갔습니다">모닝앱 발송 있음</span>' : '') ] }));
        }
        /* 해피콜·안내·케어 — 서버 목록. 각 item: {patientId, name, chartNumber, label}. */
        const catLabel = { happycall: '해피콜', notice: '안내', care: '케어' }[MANAGE_SEL] || MANAGE_SEL;
        const list = (MANAGE_CATS.find(c => c[0] === MANAGE_SEL) || [null, null, () => []])[2]() || [];
        return list.map(x => ({ pid: x.patientId, cells: [
          esc(x.name || '이름 없음'),
          '<span class="mtag">' + esc(catLabel) + '</span>',
          x.chartNumber ? '<span class="zl-ch">#' + esc(x.chartNumber) + '</span>' : '—',
          esc(x.label || '') ] }));
      } },
  ];

  const cur = DEFS.find(d => d.key === LIST_ZONE) || null;
  /* 🔴 칸 이름 꼬리표(예약 현황·문의·접수·…) **제거**(사용자 지시 2026-10-19) — 대신 **눌러서 들어간 칸**에
     그림자 하이라이트(.zone.sel · .zsub.sel)를 줘 「이 칸의 표구나」를 칸 쪽에서 보여 준다. */

  let body;
  if (!cur) {
    body = '<div class="none">위 칸을 누르면 그 칸의 환자 목록이 여기 펼쳐집니다.</div>';
  } else if (cur.key === 'resv') {
    /* 🔴 예약 현황 상세 = **전체 날짜 캘린더 그리드**(Monday 와 동일). 표가 아니다(사용자 지시). */
    body = schCalendarHTML();
  } else if (cur.empty) {
    /* 🔴 출처가 없는 칸(클레임) — 0 건으로 그리지 않고 **왜 비었는지**를 적는다.
       「준비 중」을 0 과 섞으면 「불만이 없다」로 오독된다(사용자 지시 2026-10-20). */
    body = '<div class="none">' + esc(cur.title) + ' — ' + esc(cur.empty) + '</div>';
  } else {
    const rows = cur.rows();
    /* 🔴 날짜 표는 **그 날짜**에 없다고 적는다 — 「지금 아무도」는 당일 전용 칸의 말이다. */
    const emptyMsg = cur.datePick
      ? esc(cur.title) + ' — ' + esc(dateLabelKo(QBOARD_DATE)) + ' 접수된 요청이 없어요.'
      : esc(cur.title) + ' — 지금 아무도 없어요.';
    const noteHTML = cur.note ? '<div class="zl-note">ⓘ ' + esc(cur.note) + '</div>' : '';
    /* 🔴 **컬럼 클릭 정렬**(사용자 지시 2026-10-23) — 이 표는 **모든 상세표가 공유**하는
       한 곳이라, 여기만 고치면 문의·접수·진료실·수납·관리 표가 **전부 같이** 된다.
       (CLAUDE.md 의 「판정기를 둘로 만들지 않는다」와 같은 취지 — 정렬기를 표마다 만들지 않는다.) */
    const sorted = zlSortRows(cur, rows);
    body = noteHTML + (!rows.length
      ? '<div class="none">' + emptyMsg + '</div>'
      : '<table class="zl-tb"><thead><tr>'
        + cur.cols.map((c, i) => {
            const on = ZL_SORT && ZL_SORT.key === cur.key && ZL_SORT.col === i;
            const ar = on ? (ZL_SORT.dir < 0 ? ' ▼' : ' ▲') : '';
            return '<th class="zl-th' + (on ? ' on' : '') + '" data-zlsort="' + i + '"'
              + ' title="' + esc(c + ' 기준으로 정렬 — 누를 때마다 오름/내림이 바뀝니다') + '">'
              + esc(c) + '<span class="zl-ar">' + ar + '</span></th>';
          }).join('')
        + '</tr></thead><tbody>'
        + sorted.map(r => '<tr' + (r.pid ? ' class="hit" data-pid="' + esc(r.pid) + '"' : '')
            + '>' + r.cells.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('')
        + '</tbody></table>');
  }

  const bodyCls = (cur && cur.key === 'resv') ? 'zl-body cal' : 'zl-body';
  /* 🔴 **표가 스스로 어느 칸인지 말한다**(UIUX 리뷰 2026-10-19) — 아래로 스크롤하면
     위 칸은 안 보여, 수치만 있으면 「이게 접수였나 수납이었나」를 잊는다. 제목을 단다. */
  const ttl = cur
    ? '<span class="zl-ttl"><b>' + esc(cur.title) + '</b> '
      + (cur.n == null ? '<span class="unk" title="출처가 없어 셀 수 없어요">?</span>' : cur.n + '<small>' + (cur.unit || '명') + '</small>')
      + '</span>'
    : '';
  /* 🔴 날짜 선택 달력(사용자 지시 2026-10-20) — 예약변경·문서요청 표에만.
     접수일(createdAt) 기준으로 그 날짜의 요청만 본다. 기본은 오늘. 「오늘」 버튼으로 복귀. */
  const dpick = (cur && cur.datePick)
    ? '<span class="zl-dp">'
      + '<input type="date" class="zl-date" value="' + esc(QBOARD_DATE) + '" aria-label="날짜 선택" title="접수 날짜로 거릅니다">'
      + (QBOARD_DATE !== todayKey()
          ? '<button type="button" class="zl-today" data-zl-today="1">오늘</button>' : '')
      + '</span>'
    : '';
  /* 🔴 **모닝웹 자동발송 토글**(사용자 지시 2026-10-23) — 「자동」 표에만, 닫기 ✕ **바로 좌측**.
     ⚠️ **지금은 비활성**이다(사용자 지시). 누를 수 없지만 **숨기지 않는다** —
        직원이 「자동이 도는 줄」 알고 수동 발송을 건너뛰면 환자가 안내를 못 받는다.
     근거: 모닝웹엔 **발송 루프가 없고**(CLAUDE.md) 마스터 토글 키도 없다(실측 0행 = OFF). */
  const autoSw = (cur && cur.key === 'up' && MANAGE_SEL === 'auto')
    ? '<span class="zl-sw" title="모닝웹 자체 자동 발송입니다. 지금은 꺼져 있고 켜는 기능은 아직 열지 않았습니다 — 발송은 각 행의 「발송」 버튼으로 하세요.">'
      + '<span class="zl-sw-l">모닝웹 자동발송</span>'
      + '<button type="button" class="zl-tg" disabled aria-pressed="false" aria-label="모닝웹 자동발송 — 꺼짐(변경 불가)">'
      +   '<i></i></button>'
      + '<span class="zl-sw-v">꺼짐</span>'
      + '</span>'
    : '';
  return '<div class="zlist' + (cur ? ' on' : '') + '">'
    + (cur ? '<div class="zl-tabs">' + ttl + dpick + autoSw
      + '<button class="zl-x" data-zl="">닫기 ✕</button></div>' : '')
    + '<div class="' + bodyCls + '">' + body + '</div></div>';
}
/** 체어 번호 → 이름(진료실 표). 🔴 `rooms` 에서 찾는다 — 번호만 적으면 「수술방」이 「7번」이 된다.
 *  🔴 이름을 `chairName` 으로 두면 안 된다 — 같은 스크립트의 `chairName(id)`(위)를 **덮어써서**

function chairNameIn(cid, rooms) {
  const k = String(cid ?? '');

  const c = (rooms || []).find(x => String(x.chairId) === k) || (CHAIRS || []).find(x => String(x.chairId) === k);
  return c ? (c.name || (k + '번')) : '체어 미상(' + k + ')';

/* ── 환자 찾기 동작 ──────────────────────────────────────────────────────
 * 🔴 입력할 때마다 `/api/dw/patients?q=` 로 유사 환자를 받아 목록을 띄운다.
 *   목록은 **오른쪽으로** 펼쳐 급함·미처리 문의 위에 **반투명**으로 덮는다(사용자 지시).
 *   목록 클릭 또는 **1건일 때 엔터** → 상세패널. (검색 환자는 SEARCH_HITS 에 담아
 *   offMapViewOf 가 열 수 있게 한다.) ⚠️ 폴링 재렌더로 요소가 새로 그려지므로 **매번** 바인딩.
 */
let SEARCH_T = null, SEARCH_SEQ = 0, SEARCH_RESULTS = [];
function bindSearch() {
  const kpiBtn = $('searchKpi');
  if (kpiBtn) {
    kpiBtn.addEventListener('click', e => {
      e.stopPropagation(); SEARCH_OPEN = true; render();
      setTimeout(() => { const el = $('searchInput'); if (el) el.focus(); }, 20);
    });
  }
  const inp = $('searchInput');
  if (!inp) return;
  // 펼친 직후·재렌더 후 포커스·커서 끝으로. 입력값은 SEARCH_Q 로 복원돼 있다.
  const close = () => { SEARCH_OPEN = false; SEARCH_Q = ''; SEARCH_RESULTS = []; SEARCH_HITS.clear(); render(); };
  const xb = $('searchClose'); if (xb) xb.addEventListener('click', e => { e.stopPropagation(); close(); });

  inp.addEventListener('input', () => {
    SEARCH_Q = inp.value;
    clearTimeout(SEARCH_T);
    SEARCH_T = setTimeout(() => runSearch(SEARCH_Q), 220);   // 디바운스 — 글자마다 안 친다
  });
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      /* 🔴 1건이면 바로 상세. 여러 건이면 **맨 위** 1건을 연다(가장 유사·최근 내원). */
      if (SEARCH_RESULTS.length) openSearchHit(SEARCH_RESULTS[0]);
    }
  });
  // 재렌더 후에도 결과 목록을 다시 그린다(폴링으로 input 이 새로 생겼을 때).
  if (SEARCH_Q && SEARCH_RESULTS.length) paintSearchList();
  // 포커스 유지
  if (document.activeElement !== inp) { try { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (_) {} }
}

async function runSearch(q) {
  q = (q || '').trim();
  const box = $('searchList');
  if (!q) { SEARCH_RESULTS = []; if (box) { box.hidden = true; box.innerHTML = ''; } return; }
  const seq = ++SEARCH_SEQ;
  try {
    const j = await (await fetch(api('/api/dw/patients?q=' + encodeURIComponent(q)),
      { headers: { accept: 'application/json' } })).json();
    if (seq !== SEARCH_SEQ) return;                  // 🔴 늦게 온 옛 응답은 버린다(순서 역전 방지)
    SEARCH_RESULTS = (j && j.ok && Array.isArray(j.data)) ? j.data : [];
    // 검색 결과를 SEARCH_HITS 에 담는다 → 상세패널이 열린다.
    for (const p of SEARCH_RESULTS) SEARCH_HITS.set(String(p.patientId),
      { name: p.name, chartNumber: p.chartNumber, isNewPatient: false });
    paintSearchList();
  } catch (_) {
    if (seq !== SEARCH_SEQ) return;
    SEARCH_RESULTS = [];
    if (box) { box.hidden = false; box.innerHTML = '<div class="ps-none">검색에 실패했어요.</div>'; }
  }
}

function paintSearchList() {
  const box = $('searchList');
  if (!box) return;
  if (!SEARCH_Q.trim()) { box.hidden = true; box.innerHTML = ''; return; }
  if (!SEARCH_RESULTS.length) { box.hidden = false; box.innerHTML = '<div class="ps-none">일치하는 환자가 없어요.</div>'; return; }
  box.hidden = false;
  box.innerHTML = SEARCH_RESULTS.slice(0, 20).map((p, i) =>
    '<button type="button" class="ps-row' + (i === 0 ? ' first' : '') + '" data-pspid="' + esc(p.patientId) + '">'
    + '<span class="ps-nm">' + esc(p.name || '이름 없음') + '</span>'
    + (p.chartNumber ? '<span class="ps-ch">#' + esc(p.chartNumber) + '</span>' : '')
    + (p.lastVisitDate ? '<span class="ps-lv">최종 ' + esc(fmtYmd(p.lastVisitDate)) + '</span>' : '')
    + '</button>').join('')
    + (SEARCH_RESULTS.length > 20 ? '<div class="ps-more">상위 20명만 — 더 좁혀 주세요</div>' : '');
  box.querySelectorAll('.ps-row[data-pspid]').forEach(r => {
    r.addEventListener('click', e => {
      e.stopPropagation();
      const p = SEARCH_RESULTS.find(x => String(x.patientId) === r.dataset.pspid);
      if (p) openSearchHit(p);
    });
  });
}

function openSearchHit(p) {
  if (!p) return;
  SEARCH_HITS.set(String(p.patientId), { name: p.name, chartNumber: p.chartNumber, isNewPatient: false });
  showPop({ dataset: { pid: String(p.patientId) } }, true);
}

/** 'YYYYMMDD' / 'YYYY-MM-DD' → 'MM/DD'(짧게). 빈 값이면 ''. */
function fmtYmd(s) {
  const d = String(s || '').replace(/\D/g, '');
  return d.length >= 8 ? (d.slice(4, 6) + '/' + d.slice(6, 8)) : '';
}
function sumChair(byChair) {
  let n = 0; byChair.forEach(v => { n += v.length; }); return n;
}
/* ══ 🔴 드래그 이동 대비 구조 (사용자 지시 2026-10-19) ═════════════════════════
 * 「나중에 드래그로 접수, 진료실, 수납대기, 수납완료까지 네모박스로 이동과 상태변경이 가능하게 할 것」

/** 진료실 아래 — 「체어 없음」(체어 미배정 진료 중 네모) | 「상담」(인원). 위 체어와 줄로 가른다. */

       상태가 따로 없다(상담 중 = 진료 중 + 진료내용에 상담). data-lane=room 으로 체어를 고르게 한다. */

/** 수납 대기 아래 — 「수납 완료」 인원. 위 그래프와 줄로 가른다. */

/** @param ro true 면 「네모를 **받지 않는** 칸」임을 꼬리표로 말한다(색만으로 전하지 않는다). */
/**

function zoneBox(title, sub, count, body, cls, ro, extra, lane) {

/* ── 접수 — **시간 축 그래프** (사용자 지시 2026-10-16 · 192.168.0.N2:8790 참고) ──

/* 🔴 **세 칸이 같은 그래프를 쓴다**(사용자 지시 2026-10-16: 「문의·수납 대기도 접수
 *    컴포넌트처럼 주의·급함 라인을 만들어 얼마나 지연되었는지 표기」).

 *    두면 눈금·겹침 보정·상한 규칙이 **따로 흘러간다**(이 저장소에서 반복된 실패).
 *
 * 🔴 **경계는 칸마다 다르다 — 축의 뜻이 다르기 때문이다.**

 * @param items [{ key, mins, color, level, label }]  — 이미 풀어서 넘긴다

function plotHTML(items, cuts, zero, drag) {
  if (!items.length) return '<div class="pool empty"></div>';
  const warn = cuts[0], urg = cuts[1];
  /* 축 위끝 = 급함 경계의 **2배까지만**. 가장 오래된 사람을 그대로 위끝으로 쓰면
