<!--
  라운지 — 전체 모니터링 맵 (2026-10-16)

  사용자 지시: 「reception-intake-2 를 토대로 전체 모니터링 페이지. **직관적·인터랙티브**한
  디자인. 나중에 CCTV 로 치과를 스캔해 2D 맵에 환자·직원 이동을 표기할 것이고, 지금은
  **현재 활성화된 체어(진료실) + 대기실 1개를 자동으로** 만들어 **마인크래프트처럼 맵**이
  만들어지게. 대기 시간 많은 환자·문의 환자는 **네모 아이콘이 크게**(여백 포함 칸은 동일),
  **hover 상세는 그대로**. 데스크 탭 아래 **라운지** 서브탭」

  기획·작업·근거: docs/develop/라운지모니터링/{01,02,03}  — 아래 🔴 는 전부 실측 근거가 있다.

  🔴 **이 화면은 읽기 전용이다.** 덴트웹에 쓰지 않는다. 토대 화면(app_v3)의 「점을 끌어
     예약」은 **가져오지 않았다** — 모니터링 화면에서 실수로 끌면 예약이 잡힌다.

  🔴 **칸은 「진료 체어 + 대기실 + 수납데스크」뿐이다.** 촬영실 칸을 만들지 않는다 —
     보존 전수 1,544건 중 엑스레이 배정 **0건**이고, 촬영은 자리가 아니라 **사건**으로
     남는다(하루치 교차검증: 99명 중 43명이 촬영했으나 전원 자기 체어에 배정된 채였다).

  🔴 **위치의 주인은 `status` 다 — `chairId` 가 아니다.** chairId 는 「배정값」이라
     대기 환자도 값을 갖는다(실측: status 0 에 chairId 4·9·10). chairId 로 놓으면
     ① 대기 환자가 체어 안에 그려지고 ② 한 체어가 2명으로 보인다.

  🔴 **CCTV 는 아직 없다.** cctvPlaceOf() 가 항상 null 이고, 화면은 그 사실을 띠에 적는다.
     「미연동」을 적지 않으면 「CCTV 가 돌고 있다」로 읽힌다 — 가장 위험한 오독이다.

  ⚠️ CDN 없음 — 병원 내부망은 인터넷이 없을 수 있다. 자산을 전부 인라인한다.
-->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>라운지 — 전체 모니터링</title>
<style>
/* ── 토대 화면(app_v3)과 **같은 토큰**을 쓴다. 두 화면이 같은 환자를 다른 색으로
      보여주면 「다른 뜻인가」로 읽힌다. ───────────────────────────────────── */
:root{
  --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --tx:#191f28;
  --dim:#6b7785; --dim2:#8b95a1;
  --blue:#3182f6; --blue-d:#1b64da; --blue-bg:#eff6ff;
  --red:#f04452; --red-bg:#fff4f4; --red-d:#c9303c;
  --green:#00875a; --green-bg:#e7f7f0;
  --amber:#b45309; --amber-bg:#fff6e5;
  /* 🔴 표식 모서리 — **원이 아니라 둥근 네모**다(사용자 지시 2026-10-07).
     한 화면에 원과 네모가 섞이면 「다른 뜻인가」로 읽힌다. 50% 로 적지 말 것. */
  --mark-r:5px; --mark-r-sm:3px;
  /* 🔴 **한 줄 칸들의 최소 내용 높이**. 체어가 적은 치과(2~3개)에서 줄이 너무 납작해
     지지 않게 하는 **바닥값**이다.
     ⚠️ 예전엔 이것이 **상한**이었다(`max-height`). 그래서 체어 10개인 치과에서
        칸은 273px 인데 본문이 132px 에서 끊겨 **83px 이 비었다**(사용자 지적
        2026-10-16, 실측). 상한은 창 높이에서 **추정**한 값이라 진료실이 실제로
        얼마나 커졌는지 알 수 없다 — 지금은 본문이 `flex:1 1 auto` 로 **줄에서
        직접 받는다**(§.upgrid 주석). 다시 `max-height` 로 쓰지 말 것. */
  --zone-h:clamp(132px, 20vh, 200px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);
  font:14px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:14px 16px 20px}
/* 🔴 좁은 폭에서도 가로 스크롤이 생기지 않게 — iframe 안이라 더 쉽게 넘친다 */
.wrap{max-width:1600px;margin:0 auto}

/* ── 위 띠 ──────────────────────────────────────────────────────────── */
/* 🔴 KPI 칸은 **좌우를 꽉 채운다**(사용자 지시 2026-10-16) — 예전엔 `flex:0 0 auto`
   라 내용만큼만 차지해 오른쪽이 비었다. 이제 남는 폭을 **고르게 나눈다**.
   ⚠️ `wrap` 은 유지한다 — 좁은 화면에서 9칸을 한 줄에 욱여넣으면 숫자가 잘린다.
      접히면 그 줄끼리 다시 고르게 나뉜다(한 줄에 2칸만 남아도 둘이 반반). */
.top{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-bottom:11px}
/* 🔴 `flex:1 1 0` + `min-width` — 1 1 auto 로 두면 **내용이 긴 칸이 더 넓어진다**
   (「미처리 문의」가 「급함」보다 넓어져 들쭉날쭉). 0 을 기준으로 나눠야 균등해진다.
   ⚠️ `min-width` 를 빼면 안 된다 — 0 이 되어 라벨이 세로로 쪼개진다. */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;min-width:84px;flex:1 1 0;white-space:nowrap}
/* ⚠️ `max-width` 를 두지 않는다. 두면 줄이 접혔을 때 **마지막 줄 오른쪽이 빈다**
   (실측: 700px 에서 2칸만 남아 우측 244px 공백). 요구는 「좌우를 꽉 채운다」이므로
   마지막 줄이 넓어지는 쪽을 택한다 — 비는 것보다 낫다. */
.kpi .n{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px}
.kpi.warn{background:var(--red-bg);border-color:#f6c9cd}
.kpi.warn .n{color:var(--red-d)}
.kpi.calm .n{color:var(--dim)}
/* 🔴 **누르는 KPI**(예약변경·문서요청·클레임, 사용자 지시 2026-10-20) — 버튼이라
   기본 버튼 모양을 지우고 kpi 모양을 따른다. 호버에 테두리, 눌러 들어가면(.on) 파란 그림자. */
.kpi-act{cursor:pointer;text-align:left;font:inherit;color:inherit;appearance:none}
.kpi-act:hover{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue-line)}
.kpi-act.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-line);background:var(--blue-bg,#eef4ff)}
.kpi-act.on .l{color:var(--blue)}
/* 🔴 행동 KPI ↔ 집계 KPI 구분선(UIUX 리뷰 2026-10-19) — 앞의 넷은 지금 손댈 것,
   뒤는 지켜볼 것. 좁아져 줄이 접히면(세로 선이 어색) 가로 선으로 바뀐다. */
.kpi-div{flex:0 0 auto;align-self:stretch;width:1px;background:var(--line);margin:2px 2px}
@media(max-width:760px){.kpi-div{width:100%;height:1px;margin:2px 0}}
/* ── 🔴 환자 찾기 컴포넌트(사용자 지시 2026-10-20) ─────────────────────────────── */
.kpi-search{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;font:inherit;color:inherit;flex:0 0 auto;min-width:112px}
.kpi-search .ps-ic{font-size:17px;line-height:1}
.kpi-search:hover{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue-line)}
.kpi-search.open{cursor:default;align-items:stretch;min-width:160px;flex:0 0 auto}
.kpi-search.open:hover{border-color:var(--line);box-shadow:none}
.kpi-search .ps-box{display:flex;align-items:center;gap:5px}
.kpi-search .ps-box .ps-ic{font-size:14px}
.kpi-search input{flex:1 1 0;min-width:0;border:0;outline:none;background:transparent;font:inherit;
  font-size:14px;font-weight:700;color:var(--tx);padding:2px 0}
.kpi-search input::placeholder{color:var(--dim2);font-weight:500}
.kpi-search .ps-x{border:0;background:none;cursor:pointer;color:var(--dim2);font-size:13px;padding:0 2px;line-height:1}
.kpi-search .ps-x:hover{color:var(--tx)}
.kpi-search.open .l{text-align:left}
/* 🔴 결과 목록 — **오른쪽으로** 펼쳐 급함·미처리 문의 **위에 반투명으로** 덮는다
   (사용자 지시 2026-10-20: 「우측에, 뒤 컴포넌트가 비치게」). 좌측 위 기준(top:0 left:100%). */
.psearch-list{position:absolute;top:-1px;left:calc(100% + 1px);z-index:30;
  min-width:260px;max-width:420px;max-height:min(420px,70vh);overflow-y:auto;
  background:rgba(255,255,255,.80);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--blue-line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,45,.18);padding:4px}
.ps-row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;font:inherit;padding:7px 10px;border-radius:8px;color:var(--tx)}
.ps-row:hover,.ps-row:focus-visible{outline:none;background:var(--blue-bg)}
.ps-row.first{background:rgba(49,130,246,.10)}
.ps-row.first:hover{background:var(--blue-bg)}
.ps-row .ps-nm{font-size:13.5px;font-weight:700;white-space:nowrap}
.ps-row .ps-ch{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.ps-row .ps-lv{margin-left:auto;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-none{padding:10px;font-size:12.5px;color:var(--dim2);text-align:center}
.ps-more{padding:6px 10px;font-size:11px;color:var(--dim2);text-align:center}
/* 좁은 화면에선 아래로 떨어뜨린다(오른쪽에 공간이 없다). */
@media(max-width:620px){.psearch-list{left:0;top:calc(100% + 4px);min-width:min(92vw,320px)}}
/* 못 센 값은 `?` — 🔴 0 으로 적지 않는다. 0 은 「한 건도 없다」는 사실 주장이다. */
.unk{color:var(--dim2);font-weight:800}

.src{margin-left:auto;display:flex;flex-direction:column;justify-content:center;
  gap:3px;font-size:11.5px;color:var(--dim);text-align:right;padding:2px 0}
.src b{color:var(--tx);font-weight:700}
.src .warn2{color:var(--amber)}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:var(--mark-r-sm);
  background:var(--green);margin-right:4px;vertical-align:1px}
.dot-live.off{background:var(--red)}

/* ── 맵 ─────────────────────────────────────────────────────────────── */
/* 🔴 「마인크래프트처럼」 = 같은 크기 **블록 칸**이 격자로 붙어 한 공간이 된다.
      실제 평면도가 아니다(요구: 「실제 맵이 아니라 화면에 직관적으로 표기」). */
.zone{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;margin-bottom:11px}
.zh{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.zh .zt{font-size:14px;font-weight:700}
.zh .zs{font-size:11.5px;color:var(--dim)}
.zh .zc{margin-left:auto;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.zh .zc small{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:2px}
/* 🔴 **보조 수치** — 인원수 **바로 오른쪽**(사용자 지시 2026-10-16, 토대 화면 app_v3
   의 `.c warn` 과 같은 자리). 「문진 없음 n명」·「수납완료 n명」.
   ⚠️ `margin-left:auto` 를 주지 않는다 — 주면 본 수치와 떨어져 반대편 끝으로 간다. */
.zh .zc2{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:9px}
.zh .zc2 small{font-size:11px;font-weight:600;margin-left:2px;opacity:.75}
.zh .zc2.warn{color:var(--amber)}
.zh .zc2.calm{color:var(--dim)}

/* ── 🔴 **옮길 수 있는 곳 / 없는 곳** (사용자 지시 2026-10-16) ──────────
 *
 * 「접수·진료실·수납 대기·예약하기는 네모를 **이동할 수 있는 영역**이니 흰 배경,
 *   이동기록·내원 전·문의는 **이동할 수 없는 영역**이니 비활성 회색」
 *
 * 🔴 **색만으로 전하지 않는다.** 회색은 「흐릿하다」로도 읽혀, 못 옮기는 것인지
 *    데이터가 없는 것인지 헷갈린다. 그래서 칸 제목 옆에 **「받지 않음」 꼬리표**를
 *    같이 둔다 — 드래그를 붙이기 전에도 뜻이 통한다.
 * ⚠️ **글자는 흐리게 하지 않는다.** 배경만 회색으로 둔다 — 데스크는 서서 보고,
 *    opacity 를 내리면 환자 이름이 안 읽힌다(이 저장소에서 반복된 실패).
 * ⚠️ 안쪽 카드(.upbox)는 **흰색으로 남긴다.** 회색 위 회색이면 카드 경계가 사라진다.
 */
.zone.ro, .movelog.ro, .bookwrap.ro{background:#f4f6f8;border-color:#e1e5ea}
.zone.ro .upbox{background:#fff}
/* 제목 옆 꼬리표 — 🔴 모양으로도 말한다(색각이상이면 회색·흰색 차이가 약하다). */
.ro-tag{font-size:10.5px;font-weight:700;color:var(--dim2);background:#e8ecf0;
  border-radius:5px;padding:1px 5px;white-space:nowrap}

/* ── 좌우 반 — 좌 「내원 전」 · 우 「접수」 (사용자 지시 2026-10-16) ──
   ⚠️ 좁은 화면에서는 **한 줄로 접힌다** — 반반을 고집하면 글자가 뭉개진다. */
/* 🔴 **한 줄에 고르게** (사용자 지시 2026-10-16): 내원 전 · 접수 · 수납 대기 · 문의.
 *
 * 🔴 `auto-fit` + `1fr` 이라 **칸을 더해도 CSS 를 안 고친다** — 개수를 세지 않고
 *    저절로 같은 폭으로 나뉜다(지시: 「나중에 추가할 컴포넌트가 있으면 **동일한
 *    비율로 한 줄**로」). 5개가 되면 5등분, 6개면 6등분이다.
 * ⚠️ `minmax(170px, 1fr)` — **최소 폭**이 있어야 한다. 없으면 칸이 늘수록 한없이
 *    좁아져 제목과 인원수가 겹친다. 🔴 220px 으로 뒀더니 **5칸부터 줄이 접혔다**
 *    (실측 1185px 폭: 4칸까지만 한 줄). 지시는 「**한 줄**로」이므로 170px 으로 낮춰
 *    **6칸까지 한 줄**에 들어가게 했다 — 그 아래로는 글자가 뭉개져 접는 편이 낫다.
 * ⚠️ `auto-fill` 이 아니라 **`auto-fit`** 이다 — auto-fill 은 칸이 적을 때 **빈 칸을
 *    남겨** 4개인데 6칸처럼 보인다. auto-fit 은 있는 것만 늘린다.
 */
/* 🔴 칸 폭을 **용도별로** 다르게 준다(사용자 지시 2026-10-19):
   예약 현황(넓게) · 접수(2/3) · 진료실 · 수납 대기(2/3) · 관리.
   순서 = DOM 순서(z-resv · z-recv · z-room · z-pay · z-up). 접수·수납대기는 0.67fr(≈2/3). */
.row4{display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(0,.67fr) minmax(0,1.25fr) minmax(0,.67fr) minmax(0,1fr);
  gap:11px;margin-bottom:11px}
/* 좁은 화면에선 자동 줄바꿈으로 되돌린다(고정 5열이 넘치지 않게). */
@media(max-width:1000px){
  .row4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
}
/* 🔴 칸 자체의 아래 여백은 **0** — 바깥 `.row4` 가 11px 을 갖는다.
   둘 다 가지면 진료실 사이만 22px 로 벌어진다(사용자 지적: 「진료실과 수납대기
   사이와 **동일하게**」). */
.row4 .zone{margin-bottom:0}
/* 🔴 두 칸의 키를 맞춘다 — 한쪽만 길면 격자가 들쭉날쭉해 보인다. */
/* 🔴 본문이 `flex:1 1 auto` 로 **남는 높이를 받는 구조**다. 칸이 flex 컨테이너여야
   성립한다 — `display:block` 으로 되돌리면 본문이 다시 내용 높이로 줄어든다. */
.row4 .zone{display:flex;flex-direction:column}
/* 🔴 줄 높이는 **진료실 칸이 정한다.** 체어 격자는 스크롤하지 않으므로(앞선 지시)
   체어 수만큼 자라고, 한 줄 격자라 나머지 칸이 **같은 높이로 늘어난다** — 그 높이를
   본문이 `flex:1 1 0` 으로 받는다. 그래서 「체어가 10개라 칸은 큰데 내용은 132px」
   이던 빈 공간이 사라진다.
   ⚠️ **바닥값은 진료실에만** 준다. 모든 칸에 `min-height` 를 주면 **모두가** 그
      값을 하한으로 삼아 줄이 그만큼 커진다(체어가 적어도 줄이 안 줄어든다).
      체어가 2~3개인 치과에서 줄이 너무 납작해지지 않게 하는 용도다. */
.row4 .zone.z-room{min-height:calc(var(--zone-h) + 46px)}

/* 내원 전 — **네모 박스**(사용자 지시) */
/* 🔴 칸이 너무 길었다(사용자 지적 2026-10-16) — 카드가 **3줄 74px** 이라 260px 상자에
   세 줄밖에 안 들어갔다. **2줄**로 눕히고(이름·시각을 한 줄에) 상자도 줄인다.
   ⚠️ 글자 크기는 **줄이지 않는다** — 데스크는 서서 본다(11px 미만은 안 읽힌다). */
/* 🔴 **1열**이다(사용자 지시 2026-10-16) — 2열이면 좁은 칸(1)에서 글자가 잘린다.
   ⚠️ `repeat(auto-fill, …)` 로 두지 않는다 — 폭이 넓어지면 저절로 2열이 된다. */
/* 🔴 높이를 **화면에 비례**시킨다(사용자 지시 2026-10-16: 「접수·내원 전·진료실이
   **1080 안에** 존재해야」·「비율적으로 배치」). 고정 px 이면 큰 화면에서 자리가
   남고 작은 화면에서 넘친다.
   계산: 1080 − 헤더56 − KPI띠62 − 범례17 − 여백 ≒ 920 을 **위줄 40% · 진료실 30% ·
   아래줄 30%** 로 나눈다. 칸 제목(35px)을 빼면 목록이 쓸 수 있는 높이다.
   ⚠️ `clamp(최소, 비례, 최대)` 다 — **최소가 없으면 짧은 창에서 카드가 통째로 잘린다**
      (실측: 창 높이 595px 에서 26vh=155px 라 목록이 안 보였다). 최대가 없으면 세로가
      아주 긴 화면에서 한 칸이 끝없이 늘어 아래 칸이 밀린다. 양쪽을 다 막는다. */
/* 🔴 **진료실과 같은 높이**(사용자 지시 2026-10-16: 「진료실이 길어진 만큼 문의·
   내원전·접수·수납대기 컨텐츠도 그 크기만큼」). 한 줄에 다섯 칸이라 **키가 서로 끌어
   당긴다** — 한 칸만 길면 나머지가 빈 채로 늘어난다. 같은 값을 쓴다. */
/* 🔴 **고정 상한(`max-height:var(--zone-h)`)을 쓰지 않는다**(사용자 지적 2026-10-16:
   「진료실 체어가 10개라서인지 문의·내원전·접수·수납완료 칸에 위아래 길이만큼
   컨텐츠가 담겨 있지 않다」). 실측으로 칸은 **273px** 인데 본문은 **132px** 에서
   끊겨 83px 이 비어 있었고, 그 안에서 2420px(수납완료 46건)이 스크롤되고 있었다.
   원인: `--zone-h` 는 **창 높이에서 계산한 추정치**라 진료실 체어 격자가 실제로
   얼마나 커졌는지 모른다(585px 창에서 20vh=117px → 132px, 체어는 215px).
   → `flex:1 1 auto` + `min-height:0` 으로 **줄이 준 높이를 그대로 받는다.**
     한 줄 격자라 줄 높이는 **가장 큰 칸(진료실)** 이 정한다 — 체어가 늘면 본문도
     같이 늘어 「체어가 길어진 만큼 나머지도」라는 앞선 지시가 저절로 지켜진다.
   🔴 **`flex:1 1 0` 이다 — `auto` 로 두면 안 된다.** `flex-basis:auto` 는 **내용
      높이**를 기준으로 잡아, 수납완료(2420px)가 그대로 기준이 되어 **줄이 2531px 로
      불었다**(실측, 내가 한 번 그렇게 틀렸다). basis 를 0 으로 두면 남는 높이만
      나눠 받고 넘치는 내용은 스크롤된다.
   ⚠️ `min-height:0` 도 함께 필요하다 — flex 항목의 기본 `min-height:auto` 가
      내용 높이를 하한으로 삼아 같은 폭주를 만든다. */
.upgrid{display:grid;grid-template-columns:1fr;gap:5px;
  align-content:flex-start;flex:1 1 0;min-height:0;overflow-y:auto}
.upgrid::-webkit-scrollbar{width:7px}
.upgrid::-webkit-scrollbar-thumb{background:#d5dbe1;border-radius:4px}
.upbox{border:1.5px solid var(--line);border-radius:9px;padding:5px 8px;background:#fbfcfd;
  min-width:0;font-size:12px;line-height:1.35}
/* 🔴 상태를 **색이 아니라 왼쪽 띠**로도 말한다 — 색만으로 전하지 않는다. */
.upbox.done{border-left:3px solid var(--green)}
.upbox.wait{border-left:3px solid #c3cbd4}
.upbox.late{border-left:3px solid var(--amber);background:var(--amber-bg)}
.upbox.warn{border-left:3px solid #f0a73a}
.upbox.warn .ub-nt{color:var(--amber)}
/* 문의 본문은 두 줄까지 — 한 줄로 자르면 무슨 요청인지 못 읽는다. */
.z-inq .ub-nt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ub-top{display:flex;align-items:baseline;gap:4px;min-width:0}
.ub-top b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ub-ch{color:var(--dim2);font-size:11px;flex:0 0 auto}
.ub-new{font-size:10.5px;font-weight:700;color:var(--blue-d);background:var(--blue-bg);
  border-radius:4px;padding:0 3px;flex:0 0 auto}
/* 🔴 예약 시각을 **첫 줄 오른쪽**으로 — 한 줄이 통째로 줄어든다. */
.ub-at{margin-left:auto;flex:0 0 auto;color:#3f4a55;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.ub-left{color:var(--dim2);font-size:11px;font-weight:500}
.ub-nt{margin-top:3px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upbox.done .ub-nt{color:var(--green)}
.upbox.late .ub-nt{color:var(--amber)}

/* ── 접수 시간 축 그래프 ────────────────────────────────────────────
   🔴 위가 **오래 기다린 쪽**이다(급한 쪽이 위). 예약 현황과 축의 뜻이 반대라
      눈금 글자로 분명히 말한다 — 「방금」이 아래, 분 수가 위. */
/* 🔴 그래프 높이도 **줄에서 받는다**(위 `.upgrid` 와 같은 이유). `height:var(--zone-h)`
   면 칸이 273px 인데 축이 132px 에서 끝나, 점이 위쪽 절반에만 몰려 있었다.
   ⚠️ 점은 `top:%` 로 놓이므로 축이 길어지면 **간격도 같이 벌어진다** — 따로 고칠 것이 없다. */
.rplot{position:relative;flex:1 1 0;min-height:110px;margin-top:2px}
/* 🔴 문의 칸은 **그래프 + 카드** 둘이 쌓인다(지연 축 + 무슨 요청인지).
   그래프는 **고정 몫**(위), 카드가 남는 높이를 받는다 — 둘 다 `flex:1 1 0` 이면
   반씩 갈라 그래프 눈금(「15분」)이 카드와 겹쳐 읽힌다. */
/* 🔴 문의 칸은 이제 **그래프만**이다(사용자 지시 2026-10-16: 「정보 목록 부분은
   제거하고, 타임라인과 네모박스만 표기」). 그래서 높이를 **96px 로 묶지 않는다** —
   다른 칸처럼 줄 높이를 꽉 채운다(`.rplot` 기본값 `flex:1 1 0`).
   ⚠️ `flex:0 0 96px` 로 되돌리지 말 것 — 카드와 나눠 쓰던 시절의 값이다. 눈금 셋이
      96px 안에 몰려 「7분」과 「15분」이 붙어 읽혔다.
   ⚠️ 네모 크기(`--dw`)는 **그대로 작게 둔다** — 칸이 좁아(≈150px) 한 눈금대에
      여럿 서면 큰 네모는 서로 민다. 급함이 더 크다는 규칙(R10)은 비율로 유지된다. */
.z-inq .rdot{--dw:11px}
.z-inq .rdot.l1{--dw:14px}
.z-inq .rdot.l2{--dw:17px}
.rtk{position:absolute;left:0;right:0;height:0;border-top:1px dashed #e4e8ec}
.rtk span{position:absolute;left:0;top:-7px;font-size:10px;color:var(--dim2);
  background:var(--card);padding-right:4px}
.rtk.warn{border-top-color:#f0d49a}
.rtk.warn span{color:var(--amber)}
.rtk.urg{border-top-color:#f6c9cd}
.rtk.urg span{color:var(--red-d)}
.rdots{position:absolute;inset:0;margin-left:34px}
/* 🔴 점도 **둥근 네모**다 — 맵의 네모와 같은 문법이라야 같은 환자로 읽힌다. */
/* 🔴 가로 위치 = **남는 폭을 같은 줄 인원(--n)으로 나눈 몫 × 순번(--i)**.
   점 폭(--dw)을 빼고 나누므로 **몇 명이든 축 안**에 들어오고 서로 겹치지 않는다.
   ⚠️ 고정 px·고정 % 로 두지 말 것 — 좁은 칸에서 한쪽을 고치면 다른 쪽이 났다
      (24px → 축 밖 1개 · 15% → 겹침 5쌍, 둘 다 실측).
   🔴 **한 줄에 많이 몰리면 네모를 줄인다.** 좁은 칸(≈150px)에 10명이 같은 눈금대에
      서면 21px × 10 = 210px 라 **물리적으로 안 들어간다**(실측 겹침 8쌍). 자리를
      나눈 몫(`--step`)보다 네모가 크면 그 몫에 맞춘다 — 겹쳐서 몇 명인지 못 세는
      것보다, 작아도 **세어지는** 편이 낫다.
   ⚠️ 급함이 더 크다는 규칙(R10)은 **비율로 유지된다** — l2 가 l1 보다 항상 크다. */
.rdot{position:absolute;width:13px;height:13px;border-radius:var(--mark-r-sm);
  --dw:13px; --i:0; --n:1;
  --step:calc((100% - var(--dw)) / max(var(--n), 1));
  left:calc(var(--step) * var(--i));
  border:0;padding:0;cursor:pointer;transform:translateY(-50%);
  transition:width .12s ease,height .12s ease}
.rdot.l1{--dw:17px}
.rdot.l2{--dw:21px}
/* 🔴 실제 크기 = **원래 크기와 자리 몫 중 작은 쪽**. 몰리면 저절로 작아진다.
   ⚠️ 8px 밑으로는 안 줄인다 — 그보다 작으면 색이 안 읽혀 점의 뜻이 사라진다. */
/* ⚠️ 몫(`--step`)과 **같은 크기**로 두면 변이 맞닿아 겹침으로 센다(실측: 몫 11.1px,
   폭 11px → 9개 중 7쌍 접촉). **2px 를 뺀 자리**에 그려 틈을 남긴다. */
.rdot{width:max(8px, min(var(--dw), calc(var(--step) - 2px)));
  height:max(8px, min(var(--dw), calc(var(--step) - 2px)))}
.rdot:hover,.rdot:focus-visible{box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.25);outline:none}
/* 🔴 **맵에 없는 사람** — 상세를 띄울 수 없다(아직 안 온 환자의 문의).
   눌리는 것처럼 보이지 않게 커서를 떼고 hover 강조도 끈다. 지연 위치는 그대로 보인다. */
.rdot.nohit{cursor:default}
.rdot.nohit:hover{box-shadow:none}
.rdot.s-ok{background:#7f8c9b} .rdot.s-new{background:var(--blue)}
.rdot.s-in{background:var(--green)} .rdot.s-pay{background:#7c3aed}
.rdot.s-warn{background:#f0a73a} .rdot.s-urg{background:var(--red)}

/* 대기실·데스크 — 사람이 격자로 흐른다(자리가 정해져 있지 않다) */
/* 🔴 점밭도 **상한**을 둔다 — 환자가 몰리는 날 칸이 끝없이 늘어 아래가 밀린다.
   ⚠️ `min-height` 는 남긴다(비어도 칸 모양이 유지돼야 격자가 안 흔들린다). */
/* 🔴 점밭도 **줄 높이를 채운다**(위와 같은 이유) — 수납 대기 본문이 40px 이라
   칸 273px 안에서 233px 이 비어 있었다.
   ⚠️ `min-height` 는 남긴다 — 비어도 칸 모양이 유지돼야 격자가 안 흔들린다. */
.pool{display:flex;flex-wrap:wrap;gap:0;align-content:flex-start;
  min-height:40px;flex:1 1 0;overflow-y:auto}
.pool.empty::after{content:'비어 있음';font-size:12.5px;color:var(--dim2);padding:8px 2px}

/* ── 「예약 현황」 컴포넌트 — 시간축(세로) × 진료 종류 레인(가로) 산점도 (Monday 참고) ── */
.z-resv .zc2.calm{background:#eef1ef;color:var(--dim)}
.rv-lanehd{position:relative;height:16px;margin:2px 0 1px;font-size:10.5px}
.rv-lh{position:absolute;text-align:center;color:var(--dim2);font-weight:700;white-space:nowrap;overflow:hidden;
  border-bottom:2px solid var(--line)}
.rv-lh.rv-gen{border-color:#9bb7d8}      /* 일반 파랑 */
.rv-lh.rv-surgery{border-color:#c98a8a}  /* 수술 적 */
.rv-lh.rv-prosth{border-color:#c9b06a}   /* 보철 금 */
.rv-plot{position:relative;flex:1 1 0;min-height:60px;overflow:hidden;margin-top:1px}
.rv-tk{position:absolute;left:0;right:0;border-top:1px dotted var(--line);
  font-size:10px;color:var(--dim2);padding-left:1px;line-height:1;transform:translateY(-1px)}
.rv-now{position:absolute;left:0;right:0;border-top:2px solid var(--red-d,#d34);z-index:2}
.rv-dot{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);
  border:1.5px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.08);z-index:1}
/* 상태색 — 예약 파랑 · 도착(대기) 노랑 · 진료중 초록 · 완료 회색 · 취소 빨강 */
.rv-dot.rv-pre{background:#2f6690}
.rv-dot.rv-wait{background:#d9a300}
.rv-dot.rv-room{background:#2d8a5f}
.rv-dot.rv-done{background:#9aa4ad}
.rv-dot.rv-chg{background:#c0392b}
/* 예약 현황 표 안 칩 */
.rv-tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.rv-tag.rv-gen{background:#eef4fa;color:#2f6690;border-color:#cfe0ee}
.rv-tag.rv-surgery{background:#fbeae7;color:#c0392b;border-color:#f0c6bf}
.rv-tag.rv-prosth{background:#fbf3e0;color:#a96a00;border-color:#ecd8a6}
.rv-st{font-weight:700;font-size:12px}
.rv-st.rv-pre{color:#2f6690}.rv-st.rv-wait{color:#a86a00}.rv-st.rv-room{color:#2d8a5f}
.rv-st.rv-done{color:#8a93a0}.rv-st.rv-chg{color:#c0392b}

/* ── 「관리」 컴포넌트 아이콘(Monday 「후속」 모양) — 분류별 원+라벨 ──────────────
   🔴 아이콘을 **컴포넌트 전체 영역**에 상하좌우로 흩는다(그리드 wrap, 가운데 정렬).
   원(.fud)은 건수에 비례해 커진다(크기는 인라인 style). 누르면 아래 표가 그 분류로 펼쳐진다. */
.fudots{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px 14px;
  align-items:center;align-content:center;justify-content:center;
  padding:8px 4px;flex:1 1 0;overflow-y:auto}
.fucell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  border:0;background:none;padding:0}
.fucell.zero{opacity:.45}
.fucell.zero .fud{background:var(--dim2,#9aa4ad)}
/* 🔴 수납완료 아이콘 — 이미 끝난 사람이라 **덜 중요**하게(가라앉은 회녹색 + 라벨 연하게). */
.fucell.muted .fud{background:#b7c2bd;color:#fff}
.fucell.muted .ful{color:var(--dim2,#9aa4ad);font-weight:600}
.fucell.muted:hover .fud{box-shadow:0 0 0 3px #e6ece8}
.fucell.muted.on .fud{background:#8fa39a;box-shadow:0 0 0 3px #cfe5d9}
.fud{border-radius:50%;background:var(--blue-d,#2563eb);color:#fff;font-weight:800;
  font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  transition:box-shadow .12s}
.fucell:hover .fud{box-shadow:0 0 0 3px var(--blue-bg)}
.fucell.on .fud{box-shadow:0 0 0 3px var(--blue)}
.ful{font-size:11px;color:var(--dim);font-weight:600}
.fucell.on .ful{color:var(--blue-d);font-weight:700}
/* 표 안 분류 꼬리표(자동 등) + 차트번호 */
.mtag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--blue-bg);
  color:var(--blue-d);font-size:11px;font-weight:700;border:1px solid #cfe0ee}
.zl-ch{font-size:11px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
/* 🔴 예약변경 요청 동작 태그(취소·변경·재예약, 사용자 지시 2026-10-20) */
.q-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.q-tag.q-chg{background:#fbeae7;color:#c0392b;border-color:#f0c6bf}
.q-tag.q-inq{background:#eaf2fb;color:#2f6690;border-color:#cfe0ee}

/* 체어 격자 — 🔴 **블록처럼 같은 크기**. 6열에서 접힌다. */
/* 🔴 **진료실은 스크롤하지 않는다**(사용자 지시 2026-10-16) — 체어는 「지금 어디가
   비었나」를 **한눈에** 보는 칸이다. 스크롤에 가려지면 안 보이는 체어가 생겨
   그 칸의 존재 이유가 없어진다. 체어가 늘면 **칸이 길어지는 쪽**을 택한다.
   ⚠️ `max-height`·`overflow` 를 다시 넣지 말 것. */
/* 🔴 **콤팩트하게**(사용자 지시 2026-10-16) — 한 줄 안으로 들어와 칸이 좁아졌다.
   150 → **86px** 로 줄여 좁은 칸에서도 2~3열이 들어간다. */
/* 🔴 체어 격자도 **같은 높이**(--zone-h)를 쓴다. 상한이 없으면 체어 10개가 2열로
   쌓여 584px 이 되고, 한 줄 격자라 **나머지 다섯 칸이 전부 그만큼 늘어난다**(실측).
   ⚠️ 그래도 **스크롤은 만들지 않는다**(앞선 지시) — 좁으면 열을 더 쪼갠다. */
/* 🔴 **열 수를 고정**한다 — `auto-fill` 은 칸 폭에 따라 2열이 돼 10개가 5줄(=250px)이
   되고, 한 줄 격자라 **다른 칸까지 전부 늘어났다**(실측 584px).
   3열 × 4줄이면 --zone-h 안에 **10개가 전부 보인다** — 🔴 스크롤을 만들지 않는다
   (앞선 지시: 「진료실 안에서 스크롤이 있어서는 안 된다」).
   ⚠️ 좁은 칸에서도 3열을 유지하려 체어 글자를 10.5px 로 둔다 — 그 아래는 안 읽힌다. */
/* 🔴 **1줄에 2개**(사용자 지시 2026-10-16). 3열은 칸이 좁아 설명이 잘렸다.
   2열이면 한 칸이 넓어져 **「1시간 20분 · s김민정」이 한 줄에 다 들어간다.**
   ⚠️ 체어 10개 ÷ 2열 = 5줄 → `--zone-h` 안에 들어가게 칸 높이를 낮춰 둔다(아래 .seat). */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;
  align-content:flex-start}
/* 🔴 74 → **54px**. 여백·간격을 줄이고 빈 체어의 「비어 있음」 글자를 뺐다
   (점선 고리가 같은 말을 한다). ⚠️ 글자 크기는 그대로 — 데스크는 서서 본다. */
/* 🔴 **2줄 고정** — 54 → **40px**. ① 이름+네모 ② 설명.
   ⚠️ 설명이 비어도 `&nbsp;` 로 **줄을 지킨다** — 빈 체어만 낮아지면 격자가 들쭉날쭉해진다. */
/* ⚠️ 좌우 여백 6 → **3px**. 설명이 **4px 모자라** 잘렸다(실측 「66분 · s김민정」 61/65).
   🔴 글자 크기를 줄이는 대신 **여백을 깎는다** — 데스크는 서서 본다. */
.seat{border:1.5px solid var(--line);border-radius:8px;padding:3px 3px;background:#fbfcfd;
  min-width:0;display:flex;flex-direction:column;gap:0;min-height:38px}
/* ① 줄 — 이름(왼쪽) + 네모(오른쪽). 네모가 이름을 밀지 않게 이름에 min-width:0. */
.seat .srow{display:flex;align-items:center;gap:4px;min-width:0}
.seat .srow .sd{margin-left:auto}
/* 🔴 쓰는 중인 체어는 **색으로** 구분한다 — 비어 있는 칸과 한눈에 갈려야 한다 */
.seat.busy{background:var(--green-bg);border-color:#9fd9bd}
.seat .sn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.seat .sd{display:flex;gap:2px;align-items:center;flex:0 0 auto}
/* 빈 자리 — 점선 고리로 「여기 비었다」를 **모양으로** 말한다(색만으로 전하지 않는다) */
/* 🔴 체어 안에서는 `.ppl` 칸을 **22px** 로 줄인다 — 30px 이면 2줄이 안 된다.
   ⚠️ 네모(i) 비율은 그대로 둔다(급함이 커지는 규칙은 맵 전체와 같아야 한다). */
/* ⚠️ 칸 키를 **22px 로 고정**해야 빈 체어(점선 고리)와 키가 같다 —
   안 맞추면 쓰는 체어만 8px 커져 격자가 들쭉날쭉해진다(실측 48 vs 40). */
.seat .sd{min-height:18px;flex:0 0 auto}
.seat .ppl{width:18px;height:18px}
.seat .ppl i{width:12px;height:12px}
.seat .ppl.l1 i{width:15px;height:15px}
.seat .ppl.l2 i{width:17px;height:17px}
.seat .hole{width:11px;height:11px;border-radius:var(--mark-r-sm);
  border:1.5px dashed #c3cbd4;flex:0 0 auto}
/* ⚠️ 설명이 비면 높이가 **0** 이 돼 체어마다 키가 달라진다 — 줄을 지킨다. */
.seat .sm{min-height:13px;width:100%;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}

/* ── 사람 네모 ──────────────────────────────────────────────────────── */
/* 🔴 요구 R10: 「환자마다 할당된 네모 아이콘(**여백 포함**)은 동일하나, 대기시간·문의
      환자는 **여백이 줄고 네모가 커지는** 형태」
      → 칸(.ppl)은 **30×30 고정**. 네모(i)만 16→22→28. 여백은 가운데 정렬의 **결과**다.
      ⚠️ 여백을 따로 주면 둘이 어긋나 총 크기가 깨진다 — place-items:center 로만 둔다.
      🔴 칸이 고정이라 격자가 흔들리지 않는다. 네모만 키우면 줄이 밀려 **다른 환자의
         자리가 움직인다** — 1초 보는 화면에서 자리가 움직이면 눈이 다시 세야 한다. */
.ppl{width:30px;height:30px;display:grid;place-items:center;border:0;background:none;
  padding:0;cursor:pointer;position:relative;flex:0 0 auto}
.ppl i{display:block;width:16px;height:16px;border-radius:var(--mark-r);
  transition:width .14s ease,height .14s ease,box-shadow .12s ease}
.ppl.l1 i{width:22px;height:22px}
.ppl.l2 i{width:28px;height:28px}
.ppl:hover i,.ppl:focus-visible i{box-shadow:0 0 0 3px #fff,0 2px 10px rgba(0,0,0,.26)}
.ppl:focus-visible{outline:none}
.ppl[data-stdrag]{cursor:grab}
/* ── 🔴 드래그로 상태 변경(사용자 지시 2026-10-20) ─────────────────────────────── */
.rdot[data-stdrag]{cursor:grab}
/* 끄는 동안 **다른 네모는 숨긴다** — 끌고 있는 것(.drag-me)만 남긴다. */
body.dragging-flow .ppl:not(.drag-me),
body.dragging-flow .rdot[data-stdrag]:not(.drag-me){visibility:hidden}
.drag-me{opacity:.45}
/* 받는 칸 하이라이트 — 떨굴 수 있는 자리를 파랗게. */
[data-lane].lane-over{outline:2px dashed var(--blue);outline-offset:-2px;background:var(--blue-bg)!important}
.seat[data-lane].lane-over{box-shadow:inset 0 0 0 2px var(--blue)}
/* 드래그 결과 토스트 */
.flow-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;
  background:#111418;color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90vw}
.flow-toast.bad{background:#c0392b}
/* 색 = 그 환자의 지금 상태. 🔴 app_v3 의 dotClass 우선순위를 그대로 쓴다. */
.ppl i.s-ok  {background:#7f8c9b}
.ppl i.s-new {background:var(--blue)}
.ppl i.s-in  {background:var(--green)}
.ppl i.s-pay {background:#7c3aed}
/* 급함 — 🔴 **색만으로 뜻을 전하지 않는다**(색각이상이면 빨강·초록이 같아 보인다).
   고리를 둘러 **모양으로도** 구분되게 한다. */
.ppl i.s-warn{background:#f0a73a;box-shadow:0 0 0 2px #fff,0 0 0 3.5px rgba(240,167,58,.4)}
.ppl i.s-urg {background:var(--red);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(240,68,82,.38)}
/* 숨 — 가만히 있는 화면에서 움직이는 것 하나는 눈이 반드시 찾아낸다 */
@keyframes bre{0%,100%{opacity:1}50%{opacity:.45}}
.ppl i.s-urg{animation:bre 1.9s ease-in-out infinite}
/* ⚠️ 움직임을 끌 수 있게 둔다 — 멀미·주의력 문제로 끄는 사람이 있다 */
@media(prefers-reduced-motion:reduce){.ppl i.s-urg{animation:none}.ppl i{transition:none}}

/* ── 범례 ───────────────────────────────────────────────────────────── */
.legend{display:flex;gap:11px;flex-wrap:wrap;margin:2px 0 11px;font-size:11.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:var(--mark-r-sm);display:inline-block}
.legend .big{width:15px;height:15px}
/* ── `i` 설명 버튼 — 🔴 띠에서 걷어낸 내용을 여기 담는다(사용자 지시 2026-10-16) ──
   ⚠️ 범례 글자와 **같은 줄에 앉아야** 한다 — 따로 뜨면 범례가 두 줄이 된다. */
.infoi{width:17px;height:17px;flex:0 0 auto;border:1px solid var(--line);border-radius:50%;
  background:var(--card);color:var(--dim);font:700 11px/1 Georgia,serif;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:2px}
.infoi:hover{background:#f2f4f6;color:var(--tx);border-color:#d5dbe1}
.infoi[aria-expanded="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin:-4px 0 11px;font-size:12.5px;line-height:1.75;color:#3f4a55}
.infobox b{color:var(--tx)}
.infobox .dim{color:var(--dim2)}
/* 🔴 고장은 **접지 않는다** — 접어 두면 아무도 안 본다. 평소엔 아예 없다. */
/* ── 예약 컴포넌트 ──────────────────────────────────────────────────
   토대 화면(app_v3 slotsSection)의 모양을 가져오되, **끌어서 예약하지 않는다**(§아래). */
.bookwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;margin-bottom:11px}
.bookwrap summary{font-size:12.5px;font-weight:700;cursor:pointer;color:var(--dim);
  display:flex;align-items:center;gap:8px;list-style:none}
.bookwrap summary::-webkit-details-marker{display:none}
.bookwrap summary .caret{font-size:10px;color:var(--dim2)}
.bookwrap[open] summary{margin-bottom:9px}
.bookhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.bookhead .brange{font-size:12.5px;font-weight:700;color:var(--blue-d);font-variant-numeric:tabular-nums}
.bookhead .bsub{margin-left:auto;font-size:11.5px;color:var(--dim)}
.wnav{border:1px solid var(--line);background:#fbfcfd;border-radius:8px;
  width:26px;height:24px;cursor:pointer;color:#4e5968;font-size:11px;padding:0}
.wnav:hover{background:#f2f4f6;color:var(--tx)}
.wnow{border:1px solid #cfe3ff;background:var(--blue-bg);border-radius:7px;
  font-weight:700;font-size:11px;color:var(--blue-d);padding:3px 8px;cursor:pointer}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.bday{min-width:0}
.bdh{display:flex;align-items:baseline;gap:5px;padding:0 2px 6px}
.bdh b{font-size:12.5px;font-variant-numeric:tabular-nums}
.bdow{font-size:11.5px;color:var(--dim);font-weight:700}
.bdow.sat{color:var(--blue-d)} .bdow.sun{color:var(--red-d)}
.bcnt{margin-left:auto;font-size:11.5px;color:var(--dim)}
/* 🔴 슬롯은 **스크롤 상자** 안에 — 하루치를 통째로 펼치면 예약만 화면 몇 배가 된다. */
.bslots{overflow-y:auto;overscroll-behavior:contain;padding-right:3px;max-height:188px}
.bslots::-webkit-scrollbar{width:7px}
.bslots::-webkit-scrollbar-thumb{background:#d5dbe1;border-radius:4px}
.bslot{border:1.5px solid #eef1f4;border-radius:9px;padding:5px 6px;margin-bottom:5px;
  background:#fff;cursor:pointer;text-align:left;width:100%;display:block;font:inherit}
.bslot:hover:not(.full){border-color:var(--blue);background:var(--blue-bg)}
.bslot:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.bslot.full{background:#f7f9fa;opacity:.72;cursor:default}
.bslot .bt{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-bottom:3px}
.btags{display:flex;gap:3px;flex-wrap:wrap}
/* ⚠️ 11px 이상을 지킨다 — 데스크가 서서 볼 때 10px 은 안 읽힌다(토대 화면 실측). */
.dtag{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);
  border:1px solid #bfe6d4;border-radius:5px;padding:0 4px;white-space:nowrap}
.bfull{font-size:11px;color:var(--dim2);font-weight:600}
.bnone,.bempty{font-size:12px;color:var(--dim2);padding:8px 2px}

/* 예약 확인 창 */
.modalback{position:fixed;inset:0;z-index:900;background:rgba(15,23,42,.45);
  display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{background:var(--card);border-radius:14px;max-width:380px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.sheet .mh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.sheet .mh b{font-size:15px}
.sheet .mh .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--dim2)}
.sheet .mb{padding:14px 16px}
.bkrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:13.5px}
.bkrow .k{font-size:12px;color:var(--dim);min-width:38px}
.bkrow .dim{color:var(--dim2);font-size:12.5px}
.bkrow select{font-weight:600;font-size:13px;padding:4px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);max-width:210px}
.bkfield{display:block;padding:8px 0 2px}
.bkfield .k{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.bkfield input{width:100%;box-sizing:border-box;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
.bkfield input:focus{outline:none;border-color:var(--blue)}
/* 🔴 새 예약 — 날짜·시작·소요 한 줄(사용자 지시 2026-10-20). */
.bkrow2{display:flex;gap:8px;padding:6px 0}
.bkrow2 label{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:0}
.bkrow2 .k{font-size:12px;color:var(--dim)}
.bkrow2 input,.bkrow2 select{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--tx);width:100%;box-sizing:border-box}
.bkrow2 input:focus,.bkrow2 select:focus{outline:none;border-color:var(--blue)}
/* 🔴 「시간표에서 고르기」 — 날짜·시각을 슬롯 표에서 눈으로 고르는 버튼(사용자 지시 2026-10-20). */
.nb-pick{width:100%;margin-top:6px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;
  border:1px solid var(--blue-line);border-radius:10px;background:var(--blue-bg);color:var(--blue-d)}
.nb-pick:hover{background:#dcebfd;border-color:var(--blue)}
/* 예약 내용 빠른 선택 chip */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--dim)}
.chips .chip:hover{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-d)}
/* 🔴 새 예약 모달 — 환자 **검색**(사용자 지시 2026-10-20). 고르면 잠긴 칩, ✕ 로 해제. */
.nbpat-wrap{position:relative}
.nbpat-wrap input[type=search]{width:100%;box-sizing:border-box;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
.nbpat-wrap input[type=search]:focus{outline:none;border-color:var(--blue)}
.nbpat-sel{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--blue-line);
  border-radius:10px;background:var(--blue-bg)}
.nbpat-sel .nm{font-size:13.5px;font-weight:700;color:var(--tx)}
.nbpat-sel .nm em{font-style:normal;font-weight:500;color:var(--dim);font-size:12px}
.nbpat-sel .nbpat-x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--dim);font-size:13px;line-height:1;padding:2px}
.nbpat-sel .nbpat-x:hover{color:var(--red-d)}
.nbpat-list{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:5;max-height:240px;overflow-y:auto;
  background:var(--card);border:1px solid var(--blue-line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,45,.16);padding:4px}
/* 🔴 실패 이유를 **창 안에** 보여준다 — 토스트로 띄우면 창을 닫아야 읽히는데,
   그러면 데스크가 방금 친 내용을 다시 쳐야 한다(토대 화면 주석). */
.bkmsg:empty{display:none}
.bkmsg{margin-top:10px;font-size:12.5px;line-height:1.55;padding:9px 11px;border-radius:10px}
.bkmsg.bad{color:#8a1c24;background:var(--red-bg);border:1px solid #f3c9cd}
.bkmsg.good{color:#0b5c3f;background:var(--green-bg);border:1px solid #bfe6d4}
.sheet .mf{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet .btn{flex:1;font-weight:600;font-size:13px;padding:10px;cursor:pointer;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:#4e5968}
.sheet .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sheet .btn:disabled{opacity:.6;cursor:default}

.alertbar{background:var(--red-bg);border:1px solid #f6c9cd;color:#8a1c24;
  border-radius:12px;padding:9px 13px;margin-bottom:11px;font-size:12.5px;font-weight:600}

/* ── 말풍선 ─────────────────────────────────────────────────────────── */
/* 🔴 `position:fixed` — 칸 안에 absolute 로 넣으면 맵의 overflow 에 **잘린다**
      (토대 화면 주석의 실사고). */
/* ── 우측 상세 패널 (사용자 지시 2026-10-16 · 192.168.0.N2:8790 참고) ──────
   🔴 말풍선을 **대체**한다. 떠다니는 창은 다른 네모를 가리고, 화면 끝에서 위치를
      보정해야 하고, 열어 둔 채 다른 환자를 비교할 수 없다. 패널은 **자리가 고정**이다.
   ⚠️ `position:fixed` — 맵 안에 넣으면 칸의 `overflow` 에 잘린다.
   🔴 **폭은 화면의 5/6**(사용자 지시 2026-10-16 — 처음 4/5 로 했다가 바로 넓혔다).
      전엔 26vw(≈1/4)라 치아기록·상담·메모가 좁은 칸에서 여러 줄로 접혔다.
      83.333vw 면 한 줄에 다 들어간다. ⚠️ `80vw`(4/5) 로 되돌리지 말 것.
   ⚠️ 뒤의 맵은 **대부분 가려진다** — 그래서 바깥을 누르면 닫히는 동작(`hidePop`)을
      그대로 둔다. 패널이 열린 채로 다른 환자를 비교하는 용도가 아니게 됐다.
   ⚠️ `min` 은 남긴다 — 좁은 화면(태블릿)에서 80vw 가 280px 밑으로 내려가면 글자가
      뭉개진다. `max` 는 두지 않는다(4/5 라는 비율이 지시이므로 큰 화면에서도 비율을
      지킨다). */
/* ══ 상세패널 — Monday 데스크(192.168.0.N2:8790/patient-panel.css)와 **동일** ══════
   사용자 지시 2026-10-19: 「동일하게 구현하시오」. 라이브 DOM·CSS 를 그대로 받아와
   구조·클래스·색을 Monday 와 일치시킨다. 모든 규칙을 `.side-detail` 안으로 **스코프**해
   보드(네모·그래프) 스타일과 섞이지 않게 한다.
   🔴 데이터 출처는 그대로 — api-v1(덴트웹 DB) · /api/dw/xray-image. 색만 Monday 팔레트. */
.side-detail{--pp-ink:#24382f;--pp-sub:#65796c;--pp-muted:#85918a;
  --pp-canvas:#f5f7f5;--pp-card:#fff;--pp-soft:#f1f6f2;--pp-line:#e6ece8;--pp-soft-line:#dfe8e1;
  --pp-blue:#2f6690;--pp-blue-bg:#edf4fa;--pp-blue-line:#cfe0ee;
  --pp-done:#65796c;--pp-done-bg:#eef1ef;
  --pp-amber:#a96a00;--pp-amber-bg:#fbf3e0;--pp-amber-line:#ecd8a6;
  --pp-red:#c0392b;--pp-red-bg:#fbeae7;--pp-red-line:#f0c6bf;
  --pp-green:#28634f;--pp-green-bg:#e9f4ee;--pp-green-line:#cfe5d9;
  --pp-green-btn:#2d6a54;--pp-green-btn-h:#245741;
  --pp-focus:#8fb9a7;--pp-focus-line:#79a891;
  --pp-r-sm:8px;--pp-r-md:12px;--pp-r-pill:50px;
  --pp-sh-card:0 3px 9px #253c2e08;--pp-sh-pop:0 16px 50px #28463230;
  /* 🔴 폭 = **메인 영역(nav 제외)의 5/6**(사용자 지시 2026-10-22). 이 페이지는 iframe 이라
        `vw` 가 곧 **nav 를 뺀 메인 영역 폭**이다.
     🔴 예전 `min(1120px,72vw)` + 「1180px 밑에서 96vw」 는 nav 를 펼치면 iframe 이 좁아져
        96vw 로 넘어가 **패널이 오히려 넓어졌다**(실측: 창 1440 — nav 접힘 979px · 펼침 1104px).
        좁은 화면용 폭 덮어쓰기를 없애고 어느 폭에서나 같은 비율을 쓴다.
     ⚠️ `max(320px,…)` — 아주 좁은 화면에서 글자가 뭉개지지 않게 하한만 둔다. */
  position:fixed;top:0;right:0;bottom:0;width:max(320px,83.333vw);max-width:100vw;
  background:var(--pp-canvas);box-shadow:var(--pp-sh-pop);z-index:700;
  display:flex;flex-direction:column;
  color:var(--pp-ink);font-size:15px;line-height:1.5;
  animation:sdin .14s ease-out}
@keyframes sdin{from{transform:translateX(12px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.side-detail{animation:none}}

/* 🧪 목업 배지 */
.side-detail .pmock{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  background:#fef3c7;color:#92400e;border:1px solid #fcd34d;
  font:700 11px/1.6 system-ui,sans-serif;vertical-align:middle}

/* ── 헤더 .sum ──────────────────────────────────────────────────────── */
.side-detail .sum{background:var(--pp-card);box-shadow:var(--pp-sh-card);position:relative;z-index:1;
  padding:8px 16px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.side-detail .sum .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side-detail .sum .back{height:32px;padding:0 8px;border-radius:var(--pp-r-sm);
  border:1px solid var(--pp-soft-line);background:var(--pp-card);color:var(--pp-sub);font-size:13px;cursor:pointer}
.side-detail .sum .back:hover{background:var(--pp-soft)}
.side-detail .sum .nm{font-size:18px;font-weight:700;letter-spacing:-.45px}
.side-detail .sum .sub{color:var(--pp-sub);font-size:13px}
.side-detail .sum .acts{margin-left:auto;display:flex;gap:4px}
.side-detail .sum .act{height:32px;padding:0 16px;border-radius:var(--pp-r-pill);
  border:1px solid var(--pp-soft-line);background:var(--pp-card);color:var(--pp-green);
  font-weight:600;font-size:13px;cursor:pointer}
.side-detail .sum .act:hover{background:var(--pp-green-bg)}
.side-detail .sum .x{width:32px;height:32px;border-radius:var(--pp-r-sm);color:var(--pp-sub);
  font-size:18px;border:0;background:none;cursor:pointer}
.side-detail .sum .acts + .x{margin-left:0}
.side-detail .sum .x:hover{background:var(--pp-soft)}
/* 🔴 머리 액션 토글 — 문서·메시지·차팅. ✕ 왼쪽, margin-left:auto 로 우측에 붙인다.
   toss 느낌: **모서리만 살짝 둥근 직각**(pill 아님). */
.side-detail .sum .acttog{margin-left:auto;display:inline-flex;gap:0;
  border:1px solid var(--pp-soft-line);border-radius:var(--pp-r-sm);overflow:hidden;background:var(--pp-card)}
.side-detail .sum .acttog + .x{margin-left:4px}
.side-detail .sum .atbtn{height:30px;padding:0 14px;border:0;background:transparent;border-radius:0;
  color:var(--pp-green);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.side-detail .sum .atbtn + .atbtn{border-left:1px solid var(--pp-soft-line)}
.side-detail .sum .atbtn:hover{background:var(--pp-green-bg)}
.side-detail .sum .atbtn.on{background:var(--pp-green-btn);color:var(--pp-card)}
/* 🔴 상태 토글 — 다음 예약 셀 오른쪽 칸(.statcell) 안에서 **세로(상하)** 로.
   toss 느낌 직각 + 버튼 좌우 **짧게**(padding 줄이고 꽉 채우지 않는다). */
.side-detail .statcell .statog{display:flex;flex-direction:column;gap:4px;margin-top:2px;align-items:stretch}
.side-detail .statcell .stbtn{height:24px;padding:0 6px;border:1px solid var(--pp-soft-line);
  border-radius:var(--pp-r-sm);background:var(--pp-card);color:var(--pp-sub);
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-align:center}
.side-detail .statcell .stbtn:hover{background:var(--pp-soft)}
.side-detail .statcell .stbtn.on{background:var(--pp-green-btn);border-color:var(--pp-green-btn);color:var(--pp-card)}
.side-detail .statcell .statmsg{margin-top:4px;font-size:11px;line-height:1.4}
.side-detail .statcell .statmsg.wait{color:var(--pp-sub)}
.side-detail .statcell .statmsg.good{color:#0b7a4b}
.side-detail .statcell .statmsg.bad{color:#c0392b}
/* 진료 중 체어 고르기 창 */
.chairpick{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.chairpick .cp{padding:11px 8px;font-size:13.5px;font-weight:700;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}
.chairpick .cp:hover{background:var(--blue-bg);border-color:var(--blue)}
.chairpick .cp.busy{opacity:.45;cursor:not-allowed;background:var(--soft)}
/* 「체어 없음」 — 맨 아래 한 줄 전체 폭(사용자 지시 2026-10-19). 체어와 구별되게 점선. */
.chairpick .cp.cp-none{grid-column:1/-1;border-style:dashed;color:var(--dim);margin-top:4px}
.side-detail .l0{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:4px 0 0;font-size:13px}
.side-detail .l0 .k{font-size:11px;font-weight:700;color:var(--pp-muted)}
.side-detail .l0 .v{margin-right:8px}
.side-detail .l0 .v.red{color:var(--pp-red);font-weight:700}
/* 🔴 l2 열폭 — 주의(전신병력)·상태 칸은 **좁게**, 나머지(다음 할 일·미수·다음 예약)를 넓힌다.
   순서: 다음 할 일 · 주의 · 미수 · 다음 예약 · 상태. */
.side-detail .sum .l2{display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.15fr) minmax(0,.62fr);gap:8px}
.side-detail .statcell{display:flex;flex-direction:column}
/* 상태 칸은 내용(짧은 버튼)만큼만 — padding 줄여 좌우 영역을 작게. */
.side-detail .statcell{padding:8px 6px}
.side-detail .cell{border:1px solid var(--pp-line);border-radius:var(--pp-r-md);
  padding:8px;background:var(--pp-canvas);min-width:0}
.side-detail .cell h3{font-size:11px;color:var(--pp-muted);font-weight:600;margin-bottom:4px}
.side-detail .cell.next{border-color:var(--pp-green-line);background:var(--pp-green-bg)}
.side-detail .cell.next.late{background:var(--pp-red-bg);border-color:var(--pp-red-line)}
.side-detail .cell.next.remind{background:var(--pp-amber-bg);border-color:var(--pp-amber-line)}
.side-detail .cell .lab{font-size:15px;font-weight:700}
.side-detail .cell .why{font-size:13px}
.side-detail .cell .why.red{color:var(--pp-red);font-weight:700}
.side-detail .cell .rule{font-size:11px;color:var(--pp-muted);word-break:break-all}
.side-detail .cell .big{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.side-detail .cell .big.warn{color:var(--pp-red)}
.side-detail .achip{display:inline-flex;align-items:center;border-radius:var(--pp-r-pill);
  padding:0 8px;font-size:13px;border:1px solid var(--pp-line);background:var(--pp-done-bg);color:var(--pp-sub)}
.side-detail .achip.red{background:var(--pp-red-bg);border-color:var(--pp-red-line);color:var(--pp-red);font-weight:600}
.side-detail .sum .l3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side-detail .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;
  padding:0 16px;border-radius:var(--pp-r-sm);font-weight:500;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.side-detail .btn.primary{background:var(--pp-green-btn);color:var(--pp-card);border-color:var(--pp-green-btn)}
.side-detail .btn.primary:hover{background:var(--pp-green-btn-h)}
.side-detail .btn.secondary{background:var(--pp-card);color:var(--pp-sub);border-color:var(--pp-soft-line)}
.side-detail .btn.secondary:hover{background:var(--pp-soft)}
.side-detail .btn.small{min-height:28px;padding:0 8px;font-size:13px;border-radius:var(--pp-r-pill)}

/* ── 본문 .pbody : 좌 5fr / 우 6fr ───────────────────────────────────── */
.side-detail .pbody{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:8px;padding:8px 16px 16px}
.side-detail .pane{min-height:0;display:flex;flex-direction:column;background:var(--pp-card);
  border:1px solid var(--pp-line);border-radius:var(--pp-r-md);overflow:hidden}
.side-detail .pane>h2{font-size:13px;font-weight:650;padding:8px 16px;background:var(--pp-soft);
  display:flex;align-items:center;gap:8px;color:var(--pp-sub);margin:0}
.side-detail .pscroll{flex:1;min-height:0;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}

/* 치아 차트 */
.side-detail .arch{display:flex;flex-direction:column;gap:4px}
.side-detail .arch .lbl{font-size:11px;color:var(--pp-muted)}
.side-detail .trow{display:flex;gap:8px}
.side-detail .trow .half{flex:1;display:flex;gap:4px;min-width:0}
.side-detail .tooth{flex:1 1 0;min-width:0;max-width:40px;height:42px;border-radius:9px;
  border:1px solid var(--pp-soft-line);background:var(--pp-card);color:var(--pp-sub);
  font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.side-detail .tooth:hover{box-shadow:0 0 0 2px var(--pp-focus)}
.side-detail .tooth.on{outline:3px solid var(--pp-green);outline-offset:1px}
.side-detail .tooth[class*="cat-"]{background:var(--pp-done-bg);color:var(--pp-ink);
  border-color:var(--pp-sub);flex-direction:column;gap:0;line-height:1.2}
.side-detail .tooth[class*="cat-"]::after{font-size:11px;font-weight:700;color:var(--pp-sub)}
.side-detail .tooth.cat-implant::after{content:"임"}
.side-detail .tooth.cat-endo::after{content:"신"}
.side-detail .tooth.cat-prosth::after{content:"보"}
.side-detail .tooth.cat-restore::after{content:"충"}
.side-detail .tooth.cat-extract::after{content:"발"}
.side-detail .tooth.cat-perio::after{content:"주"}
.side-detail .tooth.cat-exam::after{content:"검"}
.side-detail .tooth.cat-other::after{content:"기"}
.side-detail .legend{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--pp-sub)}
.side-detail .legend span{display:inline-flex;align-items:center;gap:4px}
.side-detail .sw[class*="cat-"]{width:16px;height:16px;border-radius:4px;background:var(--pp-done-bg);
  border:1px solid var(--pp-sub);color:var(--pp-sub);font-size:11px;font-weight:700;line-height:14px;text-align:center;display:inline-block}
.side-detail .sw.cat-implant::before{content:"임"}
.side-detail .sw.cat-endo::before{content:"신"}
.side-detail .sw.cat-prosth::before{content:"보"}
.side-detail .sw.cat-restore::before{content:"충"}
.side-detail .sw.cat-extract::before{content:"발"}
.side-detail .sw.cat-other::before{content:"기"}

/* 섹션·목록 */
.side-detail .sec h3{font-size:13px;font-weight:650;margin-bottom:4px}
.side-detail .li{border-left:3px solid var(--pp-soft-line);padding:0 0 0 8px;margin-bottom:4px}
.side-detail .li .d{font-size:11px;color:var(--pp-muted);font-variant-numeric:tabular-nums}
.side-detail .li .ti{font-size:13px;font-weight:600;word-break:break-word}
.side-detail .li .de{font-size:13px;color:var(--pp-sub);white-space:pre-wrap;word-break:break-word}
.side-detail .tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:0}
.side-detail .tchip{height:20px;padding:0 8px;border-radius:var(--pp-r-pill);
  border:1px solid var(--pp-blue-line);background:var(--pp-blue-bg);color:var(--pp-blue);font-size:11px;font-weight:600}
.side-detail .muted{color:var(--pp-muted);font-size:13px}
.side-detail .plink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.side-detail .pq-row{display:flex;align-items:center;gap:8px;margin:4px 0}
/* 치주 이력 — 각 줄: 날짜 · 사분면 글리프 · 치료명 (Monday phist). */
.side-detail .phist{margin-top:4px;border-left:2px solid var(--pp-line);padding-left:8px}
.side-detail .phist .li{display:flex;align-items:center;gap:8px;border-left:0;padding:2px 0;margin-bottom:0}
.side-detail .phist .li .d{font-size:11px;color:var(--pp-muted);font-variant-numeric:tabular-nums;min-width:74px}
.side-detail .phist .li .ti{font-size:13px;font-weight:600}
.side-detail .qglyph{flex:none;color:var(--pp-sub)}
.side-detail .pq{display:grid;grid-template-columns:repeat(2,16px);grid-template-rows:repeat(2,16px);gap:0}
.side-detail .pq-c{display:block;border:1px solid var(--pp-soft-line);border-radius:3px;background:var(--pp-card)}
.side-detail .pq-c.on{background:var(--pp-sub);border-color:var(--pp-sub)}

/* 파노라마 */
.side-detail .pano .panoh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-detail .panonav{display:flex;align-items:center;gap:4px}
.side-detail .panoat{font-size:11px;color:var(--pp-muted);white-space:nowrap}
.side-detail .pbtn{border:1px solid var(--pp-line);background:var(--pp-card);border-radius:8px;
  padding:4px 8px;font-size:11px;cursor:pointer;color:var(--pp-sub)}
.side-detail .pbtn:disabled{opacity:.35;cursor:default}
.side-detail .panobar{display:flex;gap:0;margin-top:4px}
.side-detail .panobar i{flex:1;height:4px;border-radius:2px;background:var(--pp-line)}
.side-detail .panobar i.on{background:var(--pp-blue)}
.side-detail .panoimg{display:block;width:100%;aspect-ratio:2.1/1;object-fit:contain;
  background:var(--pp-ink);border-radius:10px;margin-top:4px;cursor:zoom-in}
.side-detail .panoload,.side-detail .panoerr{display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:2.1/1;background:var(--pp-ink);border-radius:10px;margin-top:4px;color:#9aa4ad;font-size:12px}
.side-detail .panoerr{color:#f2b8b8}

/* 구내 사진 */
.side-detail .photo .panoh{flex-wrap:wrap}
.side-detail .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px;max-width:300px}
.side-detail .pcell{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--pp-ink);cursor:zoom-in}
.side-detail .pcell img{display:block;width:100%;height:100%;object-fit:cover}
.side-detail .pcell.empty{background:var(--pp-line);opacity:.55;cursor:default}
.side-detail .pcell.empty img{display:none}
.side-detail .plb{position:absolute;left:4px;top:4px;font-size:11px;font-weight:700;line-height:1;
  padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--pp-ink) 70%,transparent);color:var(--pp-card);pointer-events:none}
.side-detail .pcell.empty .plb{background:transparent;color:var(--pp-muted)}

/* 우측 탭 */
.side-detail .ptabs{display:flex;gap:0;flex-wrap:wrap}
.side-detail .ptab{height:28px;padding:0 8px;border-radius:var(--pp-r-pill);font-size:13px;
  font-weight:600;color:var(--pp-sub);border:1px solid transparent;background:none;cursor:pointer}
.side-detail .ptab:hover{background:var(--pp-soft)}
.side-detail .ptab.on{background:var(--pp-green-btn);color:var(--pp-card)}
.side-detail .tfbar{display:flex;gap:4px;padding:8px 16px 0}
.side-detail .fchip{height:26px;padding:0 8px;border-radius:var(--pp-r-pill);
  border:1px solid var(--pp-soft-line);background:var(--pp-card);color:var(--pp-sub);font-size:13px;cursor:pointer}
.side-detail .fchip.on{background:var(--pp-green-btn);border-color:var(--pp-green-btn);color:var(--pp-card)}
.side-detail .thread{flex:1;min-height:0;overflow:auto;padding:8px 16px;display:flex;
  flex-direction:column;gap:8px;background:var(--pp-canvas)}
/* 🔴 숨긴 탭 패널 — `.thread{display:flex}` 가 hidden 기본값을 덮으므로 **명시로 숨긴다**
   (이 페이지엔 전역 `[hidden]` 리셋이 없다 — 없으면 5개 탭이 전부 겹쳐 보인다). */
.side-detail .thread[hidden]{display:none!important}
.side-detail .pane.tabpane>.thread{padding-top:8px}
.side-detail .day{align-self:center;font-size:11px;color:var(--pp-sub);
  background:var(--pp-done-bg);border-radius:var(--pp-r-pill);padding:0 8px;margin:4px 0}
.side-detail .more{align-self:center}
.side-detail .msg{max-width:82%;display:flex;flex-direction:column;gap:0}
.side-detail .msg.clinic{align-self:flex-end;align-items:flex-end}
.side-detail .msg.patient{align-self:flex-start;align-items:flex-start}
.side-detail .msg .meta{font-size:11px;color:var(--pp-muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.side-detail .bub{padding:8px;border-radius:14px;font-size:13px;word-break:break-word;white-space:pre-wrap}
.side-detail .bub .bt{font-weight:650;font-size:13px}
.side-detail .msg.clinic .bub{background:var(--pp-green-btn);color:var(--pp-card);border-bottom-right-radius:4px}
.side-detail .msg.patient .bub{background:var(--pp-card);border:1px solid var(--pp-soft-line);border-bottom-left-radius:4px}
.side-detail .rec{align-self:center;width:min(92%,460px);background:var(--pp-card);
  border:1px solid var(--pp-line);border-radius:var(--pp-r-md);padding:4px 8px;display:flex;flex-direction:column;gap:0}
.side-detail .rec .rh{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--pp-muted)}
.side-detail .rec .rk{font-weight:700;color:var(--pp-green)}
.side-detail .rec .rt{font-weight:600;font-size:13px;word-break:break-word}
.side-detail .rec .rx{font-size:13px;color:var(--pp-sub);white-space:pre-wrap;word-break:break-word}
.side-detail .rec .rwho{color:var(--pp-muted)}
/* 여정(journey) 단계 카드 — 머리 라벨을 더 진하게, 「여정」 꼬리표. */
.side-detail .rec.jr{border-color:var(--pp-green-line);background:var(--pp-green-bg)}
.side-detail .rec .rk.jr{color:var(--pp-green);font-weight:800}
.side-detail .jtag{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:var(--pp-r-pill);
  background:var(--pp-green-bg);color:var(--pp-green);border:1px solid var(--pp-green-line);font-size:11px;font-weight:700}
.side-detail .msg .jtag{background:var(--pp-card)}
.side-detail .msec{border:1px solid var(--pp-line);border-radius:var(--pp-r-md);padding:8px;background:var(--pp-card);margin-bottom:4px}
.side-detail .msec h3{font-size:13px;font-weight:650;margin-bottom:4px}
.side-detail .msec.hid{background:var(--pp-amber-bg);border-color:var(--pp-amber-line)}
.side-detail .msec.hid h3{color:var(--pp-amber)}
.side-detail .mi{padding:8px;margin-top:4px;background:var(--pp-soft);border-radius:var(--pp-r-sm)}
.side-detail .mi .d{font-size:11px;color:var(--pp-muted);font-variant-numeric:tabular-nums}
.side-detail .mi .x{font-size:13px;white-space:pre-wrap;word-break:break-word}
.side-detail .fl{display:flex;gap:4px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.side-detail .fl .fk{color:var(--pp-muted);font-size:13px;min-width:110px}
.side-detail .fl .fv{font-weight:650}
.side-detail .empty{font-size:13px;color:var(--pp-muted);padding:14px 4px;text-align:center}

/* 공통 배지 */
.side-detail .badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;
  border-radius:var(--pp-r-pill);font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.side-detail .badge.new{background:var(--pp-green-bg);color:var(--pp-green);border-color:var(--pp-green-line);height:20px}
.side-detail .badge.plain{background:var(--pp-done-bg);color:var(--pp-sub);border-color:var(--pp-line);font-weight:500}
.side-detail .badge.warn{background:var(--pp-amber-bg);color:var(--pp-amber);border-color:var(--pp-amber-line);height:20px}
.side-detail .badge.pq-full{background:var(--pp-green-bg);color:var(--pp-green)}

/* 좁은 화면 — 1180px 밑에서 1단. 🔴 폭(5/6)은 **덮어쓰지 않는다** — 96vw 로 바꾸던 것이
   nav 를 펼치면 패널이 넓어지는 원인이었다(위 .side-detail 주석). */
@media(max-width:1180px){
  .side-detail .sum .l2{grid-template-columns:1fr 1fr}
  .side-detail .pbody{grid-template-columns:1fr;overflow:auto}
  .side-detail .pane{min-height:420px}
}

/* ── 문서·메시지·차팅 서랍(.sheet) — Monday 와 같은 오른쪽 서랍 ─────────────── */
.mw-sheetscrim{position:fixed;inset:0;background:var(--sd-scrim,#24382f30);z-index:720}
.mw-sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;
  box-shadow:0 16px 50px #28463230;z-index:721;display:flex;flex-direction:column;
  --s-ink:#24382f;--s-sub:#65796c;--s-muted:#85918a;--s-soft:#f1f6f2;--s-line:#e6ece8;--s-soft-line:#dfe8e1;
  --s-green:#28634f;--s-green-bg:#e9f4ee;--s-green-line:#cfe5d9;--s-green-btn:#2d6a54;
  --s-amber:#a96a00;--s-amber-bg:#fbf3e0;--s-amber-line:#ecd8a6;
  color:var(--s-ink);font-size:15px;line-height:1.5}
.mw-sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--s-soft)}
.mw-sheet .sh h2{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0}
.mw-sheet .sh .sx{margin-left:auto;width:32px;height:32px;border-radius:8px;color:var(--s-sub);
  font-size:18px;border:0;background:none;cursor:pointer}
.mw-sheet .sh .sx:hover{background:var(--s-soft)}
.mw-sheet .steps{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--s-muted)}
.mw-sheet .steps span{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:50px;background:#eef1ef}
.mw-sheet .steps span.on{background:var(--s-green-btn);color:#fff;font-weight:700}
.mw-sheet .sb{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}

/* ══ 서류 발급 — 문서 서랍 + A4 서식 (사용자 지시 2026-10-21) ══════════
   🔴 **A4 실치수**로 그린다(210×297mm) — 화면에서 본 대로 인쇄돼야 한다.
      화면이 좁으면 **줄여서** 보여주되(scale) 종이 비율은 건드리지 않는다. */
/* 🔴 **영역을 나눈다**(사용자 지시 2026-10-21 — 「좌우로 꽉차고 직관적으로」).
   ①무슨 문서 ②기간 ③발급 — 각 구역에 제목을 달고 가로를 꽉 채운다. */
.doc-sec{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card)}
.doc-sec + .doc-sec{margin-top:9px}
.doc-h{margin:0 0 8px;font-size:12px;font-weight:800;color:var(--dim)}
.doc-kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.doc-kinds .cardbtn{width:auto;justify-content:flex-start}
.doc-kinds .cardbtn.on{border-color:var(--blue);background:var(--blue-bg)}
.doc-kinds .cardbtn.off{opacity:.55}
.doc-kinds .tag.off{background:#fdecec;color:#b42318}
.doc-range{display:flex;gap:8px;align-items:center}
.doc-range input{flex:1 1 0;min-width:0}   /* 🔴 좌우를 꽉 채운다 */
.doc-range .tl{color:var(--dim2);flex:0 0 auto}
.doc-quick{display:flex;gap:6px;margin-top:8px}
.qbtn{flex:1 1 0;border:1px solid var(--line);background:var(--soft);border-radius:8px;
  padding:5px 0;font:600 12px Pretendard;cursor:pointer;color:var(--tx)}
.qbtn:hover{border-color:var(--blue);color:var(--blue-d)}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 12px;font:600 12.5px Pretendard;cursor:pointer;color:var(--tx)}
.chipbtn.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
.doc-range input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
/* 🔴 발급 신청 · A4 인쇄를 **한 줄에 반반** — 둘 다 가로를 꽉 채운다. */
.doc-act{display:flex;gap:8px}
.doc-act .btn{flex:1 1 0;justify-content:center}
.doc-act .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.doc-act .btn.ghost:disabled{opacity:.45;cursor:not-allowed}
.doc-hint{margin:9px 0 0;font-size:11.5px;color:var(--dim2);line-height:1.6}
.doc-pick-hint{margin:10px 2px 2px;font-size:12.5px;color:var(--dim)}
.doc-pages{font-size:11.5px;font-weight:700;color:var(--blue-d)}
.doc-out{margin-top:10px}

/* ── 동의서 작성 전체화면 오버레이(사용자 지시 2026-10-22) ──────────────────── */
#cb-overlay{position:fixed;inset:0;z-index:11000;display:none}
#cb-overlay.on{display:block}
#cb-overlay .cb-back{position:absolute;inset:0;background:rgba(15,23,42,.45);opacity:0;transition:opacity .18s}
#cb-overlay.on .cb-back{opacity:1}
#cb-overlay .cb-card{position:absolute;inset:3vh 4vw;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.3);
  display:flex;flex-direction:column;overflow:hidden;transform:translateY(12px);opacity:0;transition:transform .2s,opacity .2s;
  font:14px Pretendard,-apple-system,system-ui,sans-serif}
#cb-overlay.on .cb-card{transform:none;opacity:1}
#cb-overlay .cb-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
#cb-overlay .cb-head h2{margin:0;font-size:17px;font-weight:800;color:var(--tx)}
#cb-overlay .cb-nav{display:flex;gap:6px;flex-wrap:wrap}
#cb-overlay .cb-st{font-size:12px;font-weight:700;color:var(--dim2);background:#f1f4f8;border-radius:999px;padding:3px 11px}
#cb-overlay .cb-st.on{background:var(--blue);color:#fff}
#cb-overlay .cb-st.done{background:#e6f7f0;color:#0ea371}
#cb-overlay .cb-x{margin-left:auto;width:34px;height:34px;border:0;background:#f4f6f8;border-radius:9px;cursor:pointer;color:#5b6572;font-size:15px}
#cb-overlay .cb-x:hover{background:#e9edf2}
#cb-overlay .cb-body{flex:1 1 auto;overflow-y:auto;padding:16px 20px 24px;background:#f8fafc}
/* 🔴 푸터 — 운영 서비스 배치(왼쪽 이전 · 가운데 진행/안내 · 오른쪽 주 버튼). */
#cb-overlay .cb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}
#cb-overlay .cb-pg{flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:700;color:var(--dim)}
#cb-overlay .cb-why{font-weight:500;color:var(--dim2)}
#cb-overlay .cb-rbtns{display:inline-flex;gap:8px}
#cb-overlay .cb-btn{height:44px;padding:0 20px;border-radius:12px;border:1px solid #d1d5db;background:#fff;color:#4b5563;font:inherit;font-weight:700;cursor:pointer}
#cb-overlay .cb-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
#cb-overlay .cb-btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
#cb-overlay .cb-btn.pri:hover:not(:disabled){filter:brightness(.95);color:#fff}
#cb-overlay .cb-btn:disabled{opacity:.45;cursor:not-allowed}
/* 단계별 머리글 — consent-manual stephd 와 동일. */
#cb-overlay .cb-stephd{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
#cb-overlay .cb-stephd .cb-t{font-size:18px;font-weight:800;color:var(--tx)}
#cb-overlay .cb-stephd .cb-n{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--blue)}
#cb-overlay .cb-msg{padding:24px;text-align:center;color:var(--dim)}
#cb-overlay .cb-msg.bad{color:var(--red-d)}
#cb-overlay .cb-sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
#cb-overlay .cb-sec h4{margin:0 0 9px;font-size:13.5px;font-weight:800;color:var(--tx)}
#cb-overlay .cb-req{color:var(--red)}
#cb-overlay .cb-hint{font-size:12px;color:var(--dim);margin-bottom:6px}
#cb-overlay .cb-row{display:flex;gap:10px;flex-wrap:wrap}
#cb-overlay .cb-fld{flex:1 1 150px}
#cb-overlay .cb-fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
#cb-overlay .cb-fld input,#cb-overlay textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;box-sizing:border-box}
#cb-overlay textarea{margin-top:8px;min-height:54px;resize:vertical}
#cb-overlay .cb-warn{margin-top:9px;font-size:11.5px;color:#b42318;background:#fdecec;border-radius:8px;padding:7px 10px}
#cb-overlay .cb-plan{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
#cb-overlay .cb-plan.on{border-color:var(--blue);background:var(--blue-bg)}
#cb-overlay .cb-pt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
#cb-overlay .cb-pm{font-size:11.5px;color:var(--dim);margin-top:2px}
#cb-overlay .cb-pi{font-size:11.5px;color:#4b5563;margin-top:3px}
#cb-overlay .cb-tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:#eef2f6;color:#5b6572}
#cb-overlay .cb-tag.g{background:#e6f7f0;color:#0ea371}#cb-overlay .cb-tag.b{background:#fff4e5;color:#b7791f}
/* 🔴 치아 배치 그리드(consent-manual 과 동일) — 라벨 | 4분면 | 라벨 | 4분면 | 라벨 5열, 윗줄 상악·아랫줄 하악. */
#cb-overlay .cb-teeth{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:7px 10px;align-items:center}
#cb-overlay .cb-tq{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#cb-overlay .cb-th{height:34px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:12.5px;font-weight:700;color:#374151;cursor:pointer;font-variant-numeric:tabular-nums}
#cb-overlay .cb-th.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#cb-overlay .cb-lb{font-size:11px;color:var(--dim);white-space:nowrap}
@media(max-width:720px){#cb-overlay .cb-teeth{grid-template-columns:1fr}#cb-overlay .cb-lb{margin-top:4px}}
#cb-overlay .cb-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#cb-overlay .cb-chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:#fff;font:inherit;font-size:12px;cursor:pointer}
#cb-overlay .cb-chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-d)}
#cb-overlay .cb-chip.sm{font-size:11px;padding:3px 9px}
#cb-overlay .cb-grp{font-size:11px;font-weight:700;color:var(--dim);margin:8px 0 2px}
#cb-overlay .cb-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
#cb-overlay .cb-cat{text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;cursor:pointer;font:inherit}
#cb-overlay .cb-cat.on{border-color:var(--blue);background:var(--blue-bg)}
#cb-overlay .cb-cat b{display:block;font-size:14px}#cb-overlay .cb-cat span{font-size:11.5px;color:var(--dim)}
#cb-overlay .cb-rec{color:var(--blue);font-weight:700}
#cb-overlay .cb-bundles{margin-top:14px}
#cb-overlay .cb-bgrp{margin-bottom:12px}#cb-overlay .cb-bgrp h5{margin:0 0 6px;font-size:12.5px}
#cb-overlay .cb-bnd{display:inline-block;text-align:left;border:1px solid var(--line);border-radius:9px;padding:7px 11px;margin:0 6px 6px 0;background:#fff;cursor:pointer;font:inherit}
#cb-overlay .cb-bnd.on{border-color:var(--blue);background:var(--blue-bg)}
#cb-overlay .cb-bnd b{display:block;font-size:12.5px}#cb-overlay .cb-bnd small{font-size:11px;color:var(--dim)}
#cb-overlay .cb-doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
#cb-overlay .cb-doc h3{margin:0 0 4px;font-size:17px;font-weight:800}
#cb-overlay .cb-dsub{font-size:12px;color:var(--dim);margin-bottom:12px}
#cb-overlay .cb-sum dl{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;margin:0 0 14px;font-size:13px}
#cb-overlay .cb-sum dt{color:var(--dim);font-weight:600}#cb-overlay .cb-sum dd{margin:0;color:#1f2937}
#cb-overlay .cb-dstep{margin-bottom:14px}#cb-overlay .cb-dstep h4{margin:0 0 7px;font-size:13.5px;font-weight:800;border-bottom:1px solid #eef1f5;padding-bottom:5px}
#cb-overlay .cb-dcard{padding:7px 0 7px 12px;border-left:2px solid #e6eaef;margin:0 0 6px 2px}
#cb-overlay .cb-ct{font-size:12.5px;font-weight:700;color:#4b5563}#cb-overlay .cb-cb{font-size:13px;line-height:1.6;color:#374151}
#cb-overlay .cb-note{font-size:11px;color:var(--dim2);margin-top:10px}
#cb-overlay .cb-sigdoc{max-height:40vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
#cb-overlay .cb-sigpad{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#cb-overlay .cb-sigpad-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:700}
#cb-overlay .cb-sigpad-h button{margin-left:auto}
#cb-overlay #cbSig{width:100%;max-width:520px;height:180px;border:1px dashed #b9c4d0;border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
#cb-overlay .cb-sighint{font-size:12px;color:var(--dim);margin-top:6px}
.doc-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.doc-note{font-size:11.5px;color:var(--dim2)}
.doc-out .empty{padding:14px;color:var(--dim2);font-size:12.5px}
.doc-out .empty.bad{color:#b42318}

/* ══ 보험문서 작성기(IB) 오버레이 — 동의서(CB)와 같은 틀을 쓴다(2026-10-28) ══
   🔴 CB 의 모든 `.cb-*` 규칙을 `#ib-overlay` 에도 적용되게 한 벌 더 가리킨다(복붙 대신
      선택자 공유). IB 전용(편집표·보험사칩·문서블록)만 뒤에 따로 둔다. */
#ib-overlay{position:fixed;inset:0;z-index:11000;display:none}
#ib-overlay.on{display:block}
#ib-overlay .cb-back{position:absolute;inset:0;background:rgba(15,23,42,.45);opacity:0;transition:opacity .18s}
#ib-overlay.on .cb-back{opacity:1}
#ib-overlay .cb-card{position:absolute;inset:3vh 4vw;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.3);

/* ── A4 용지 ── */
.a4{width:210mm;min-height:297mm;background:#fff;color:#111;padding:16mm;box-sizing:border-box;
  border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.08);
  font:13px/1.7 Pretendard,-apple-system,sans-serif;
  /* 🔴 서랍이 A4 보다 좁다 — **비율을 지키며** 줄여 보여준다(인쇄는 원치수). */
  transform-origin:top left;transform:scale(var(--a4s,.46))}
/* 🔴 `transform` 은 **자리를 줄이지 않는다** — A4 원래 높이(297mm)만큼 빈 칸이 남아
   미리보기 아래가 텅 비어 보였다(실측). 감싸는 칸이 **줄어든 크기만큼만** 차지하게 한다. */
.doc-out{--a4s:.46}
.doc-out:has(.a4){height:auto}
.a4-wrap{overflow:hidden}
/* 줄인 비율만큼 높이를 되돌린다 — 210mm×0.46 ≒ 97mm 폭, 297mm×0.46 ≒ 137mm 높이 */
/* 🔴 **길면 길어진 만큼** 자리를 준다 — 한 장 높이로 고정하면 2장째가 잘린다.
   `--a4h` 는 JS 가 실제 내용 높이로 채운다(없으면 한 장). */
.doc-out .a4-wrap{height:calc(var(--a4h, 297mm) * var(--a4s));width:calc(210mm * var(--a4s))}
/* 🔴 2장 이상이면 **여기서 스크롤**한다(사용자 지시 2026-10-21). */
.a4-scroll{max-height:62vh;overflow:auto;background:#eef1f5;padding:10px;border-radius:10px}
.a4-scroll::-webkit-scrollbar{width:9px}
.a4-scroll::-webkit-scrollbar-thumb{background:#c9d2db;border-radius:5px}
/* 표가 장 경계에서 잘리지 않게 — 인쇄할 때 줄 단위로 넘긴다. */
.a4 .p-tb tr{break-inside:avoid;page-break-inside:avoid}
.a4 .p-issuer{break-inside:avoid;page-break-inside:avoid}
@media (min-width:1500px){ .doc-out{--a4s:.6} }

/* 🔴 **종이에 찍은 도장처럼** — 「(인)」 글자 **위에 겹쳐** 살짝 기울여 얹는다.
   `multiply` 로 종이 결이 비치고, 아주 옅은 회전·투명도로 「찍은 자국」을 낸다.
   ⚠️ 너무 또렷하면 스티커처럼 보인다 — opacity .88 · 2.5도가 실측상 자연스러웠다. */
.a4 .p-sealwrap{position:relative;display:inline-block;margin-left:10px;vertical-align:middle}
.a4 .p-stamp{position:absolute;left:50%;top:50%;width:52px;height:52px;object-fit:contain;
  /* 🔴 배경을 **진짜로 지운 뒤**(destampBg) 얹는다. 예전엔 스캔 배경이 그대로라
     multiply 로 가리려다 **반투명 검은 네모**가 보였다(사용자 지적 2026-10-21).
     지금 multiply 는 가리개가 아니라 **인주가 종이에 먹은 느낌**을 내는 용도다. */
  transform:translate(-50%,-50%) rotate(-3.5deg);mix-blend-mode:multiply;opacity:.8;
  pointer-events:none}
