  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>보험문서 — ' + (IB.name || '') + '</title><style>' + css + '</style></head><body>' + html + '</body></html>');
  w.document.close();
  /* 도장 배경 제거 후 인쇄. 🔴 세 양식의 직인을 **모두** 처리한다 — 좌표(.ibcoord-seal)·
     라이나(.linaf-seal)·PDF배경(.ibpdf-seal). 예전엔 .ibcoord-seal 만 지워, 라이나·삼성
     인쇄물에서 도장 PNG 의 흰 배경이 **불투명 네모**로 남았다(실사고 2026-10-29 사용자 보고).
     destampBg 는 로드 완료 후에만 동작하므로(naturalWidth 필요) 로드를 기다렸다 인쇄한다. */
  const doPrint = () => { try { w.focus(); w.print(); } catch (e) {} };
  const seals = [...w.document.querySelectorAll('img.ibcoord-seal[data-stamp-raw], img.linaf-seal[data-stamp-raw], img.ibpdf-seal[data-stamp-raw]')];
  const sealDone = () => Promise.all(seals.map(im => new Promise(res => {
    const run = () => { try { destampBg(im); } catch (e) {} res(); };
    if (im.complete && im.naturalWidth) return run();
    im.addEventListener('load', run, { once: true });
    im.addEventListener('error', () => res(), { once: true });
    setTimeout(res, 3000);   // 안전망
  })));
  /* 🔴 공식 PDF 배경(.ibpdf-bg)을 인쇄 창에 직접 채운다 — 인쇄 창은 ibBind/ibFillPdfBg
     이벤트 밖이라, 여기서 캐시의 PNG 를 넣지 않으면 삼성 등 PDF 양식이 배경 없이
     데이터만 찍힌다(실사고 2026-10-29). 캐시가 없으면 렌더를 끝내고 인쇄한다. */
  const pdfEls = [...w.document.querySelectorAll('.ibpdf[data-ibpdf]')];
  const fillPrintPdfBg = () => Promise.all(pdfEls.map(el => {
    const key = el.dataset.ibpdf, pg = +el.dataset.ibpdfPage || 0;
    return ibRenderPdfBg(key, 2).then(pages => new Promise(res => {
      const img = el.querySelector('.ibpdf-bg'); if (!img || !pages[pg]) return res();
      /* 🔴 배경이 로드 완료된 뒤에 인쇄해야 한다 — src 만 걸고 바로 print 하면
         빈 배경으로 찍힌다(내장 PNG 는 URL 이라 비동기 로드). */
      if (img.complete && img.naturalWidth) { img.src = pages[pg].png; return res(); }
      img.addEventListener('load', () => res(), { once: true });
      img.addEventListener('error', () => res(), { once: true });
      img.src = pages[pg].png;
      setTimeout(res, 3000);   // 안전망: 로드가 늦어도 3초 뒤 인쇄 진행
    })).catch(() => {});   // 배경을 못 만들어도 인쇄는 진행(데이터만이라도)
  }));
  /* 🔴 인쇄 창의 QR 칸(.linaf-qr)도 여기서 채운다 — 인쇄 창은 ibFillQr(화면용) 밖이고,
     QRMini.svg 는 순수 문자열이라 w.document 에 직접 넣는다. */
  const qrBoxes = [...w.document.querySelectorAll('.linaf-qr[data-qr]')];
  const fillPrintQr = () => ibLoadQrMini().then(QR => {
    if (!QR) return;
    qrBoxes.forEach(b => { try { const m = QR.encode(b.dataset.qr); if (m) b.innerHTML = QR.svg(m, 52); } catch (e) {} });
  }).catch(() => {});
  /* 🔴 배경·QR·직인이 **모두** 준비된 뒤에 인쇄한다 — 하나라도 덜 되면 그 요소가
     빈 채로/흰 네모로 찍힌다. */
  const run = () => Promise.all([fillPrintPdfBg(), fillPrintQr(), sealDone()]).then(() => setTimeout(doPrint, 120));
  if (pdfEls.length || qrBoxes.length || seals.length) run();
  else setTimeout(doPrint, 220);
}

function ibBind() {
  const o = document.getElementById('ib-overlay'); if (!o) return;
  /* 직인 PNG 배경 지우기(서류발급과 같은 함수) — 「(인)」 위에 인영만 남긴다. */
  o.querySelectorAll('img.ibcoord-seal[data-stamp-raw], img.linaf-seal[data-stamp-raw]').forEach(im => {
    if (im.complete && im.naturalWidth) destampBg(im);
    else im.addEventListener('load', () => destampBg(im), { once: true });
  });
  /* 공식 PDF 배경 비동기 채우기. */
  ibFillPdfBg(o);
  /* 라이나 등 HTML 양식의 QR 칸 채우기. */
  ibFillQr(o);
  const g = fn => e => { e.preventDefault(); e.stopPropagation(); fn(e); };
  const $$ = s => o.querySelectorAll(s);
  const nx = o.querySelector('[data-ibnext]');
  if (nx) nx.addEventListener('click', g(() => {
    ibReadStep1();
    if (IB.step === 0) { if (!ibCanNext(0)) return; IB.step = 1; ibRender(); o.querySelector('.cb-body').scrollTop = 0; ibLoadData(); }
    else if (IB.step === 1) { ibReadEdits(); IB.step = 2; ibRender(); o.querySelector('.cb-body').scrollTop = 0; }
  }));
  const pv = o.querySelector('[data-ibprev]');
  if (pv) pv.addEventListener('click', g(() => { if (IB.step === 1) ibReadEdits(); if (IB.step > 0) IB.step--; ibRender(); }));
  const pr = o.querySelector('[data-ibprint]'); if (pr) pr.addEventListener('click', g(() => ibPrint()));
  /* STEP1 — 문서 종류 토글 */
  $$('[data-ibkind]').forEach(b => b.addEventListener('click', g(() => {
    const k = b.dataset.ibkind; const i = IB.kinds.indexOf(k);
    if (i >= 0) IB.kinds.splice(i, 1); else IB.kinds.push(k);
    ibRender();
  })));
  /* 보험사 토글 */
  $$('[data-ibcarrier]').forEach(b => b.addEventListener('click', g(() => {
    const k = b.dataset.ibcarrier; IB.carriers.has(k) ? IB.carriers.delete(k) : IB.carriers.add(k); ibRender();
  })));
  /* 기간 빠른 선택 */
  $$('[data-ibmon]').forEach(b => b.addEventListener('click', g(() => {
    ibReadStep1();
    const m = Number(b.dataset.ibmon); const d = new Date();
    IB.to = docToday(); const s = new Date(d.getFullYear(), d.getMonth() - m, d.getDate());
    IB.from = s.getFullYear() + '-' + String(s.getMonth() + 1).padStart(2, '0') + '-' + String(s.getDate()).padStart(2, '0');
    ibRender();
  })));
  /* 편집 셀(contenteditable) — blur 에 거둬들인다 */
  $$('[data-ibed]').forEach(el => el.addEventListener('blur', () => { IB.edit[el.dataset.ibed] = el.textContent; }));
  const nt = o.querySelector('#ibNote'); if (nt) nt.addEventListener('input', () => { IB.note = nt.value; });
}

/* STEP1 입력칸 거둬들이기(재렌더 전에 안 사라지게). */
function ibReadStep1() {
  const o = document.getElementById('ib-overlay'); if (!o) return;
  const v = id => { const el = o.querySelector('#' + id); return el ? el.value : null; };
  const n = v('ibName'); if (n != null) IB.name = n;
  const c = v('ibChart'); if (c != null) IB.chart = c;
  const b = v('ibBirth'); if (b != null) IB.birth = b;
  const f = v('ibFrom'); if (f != null) IB.from = f;
  const t = v('ibTo'); if (t != null) IB.to = t;
}
/* STEP2 편집값 거둬들이기(미리보기로 넘어가기 전). */
function ibReadEdits() {
  const o = document.getElementById('ib-overlay'); if (!o) return;
  o.querySelectorAll('[data-ibed]').forEach(el => { IB.edit[el.dataset.ibed] = el.textContent; });
  const nt = o.querySelector('#ibNote'); if (nt) IB.note = nt.value;
}

/* 🔴 상세패널 「예약」 서랍 — 예약하기와 **같은 동작**을 서랍 안에서 돌린다.
 *   ① SLOTS 가 없으면 받아서 다시 채운다 ② 주 넘김(◀▶) ③ 시간 칸 → 예약 확인 창
 *   (이 환자를 **미리 골라** 둔다 — 예약변경이니 누구 건지 이미 안다). */
function bindResvSheet(sheet, name) {
  const fill = () => {
    const box = sheet.querySelector('.resv-book');
    if (!box) return;
    box.innerHTML = bookGridHTML();   // 🔴 bookGridHTML 이 머리(◀▶)까지 포함한다 — 겹치지 않게 한 번만.
    bindInner();
  };
  const bindInner = () => {
    sheet.querySelectorAll('.resv-book [data-week]').forEach(b => {
      b.addEventListener('click', async e => {
        e.preventDefault(); e.stopPropagation();
        const v = b.dataset.week;
        weekOff = (v === 'now') ? 0 : weekOff + Number(v);
        SLOTS = null; fill();                 // 「불러오는 중…」 먼저
        await loadSlots(); fill();
      });
    });
    sheet.querySelectorAll('.resv-book .bslot:not(.full)').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        /* 🔴 상세패널 예약 버튼 → 시간칸 → **+예약 모달**에 **고른 환자·날짜·시각을 채워** 연다
           (사용자 지시 2026-10-20: 「선택된 정보를 갖고 +예약 모달에 표현」). openBookSheet
           대신 openNewBooking(prefill) 로 통일한다. 담당은 그 슬롯에서 열린 의사 1명이면 미리 고른다. */
        const pid = DETAIL_ROW_PID ? String(DETAIL_ROW_PID) : '';
        const row = pid ? (DETAIL_ROW[pid] || (offMapViewOf(pid) || {}).r || {}) : {};
        let docs = []; try { docs = JSON.parse(el.dataset.docs || '[]'); } catch (_) { docs = []; }
        closeActSheet();   // 서랍을 닫고 모달을 띄운다
        openNewBooking({
          patientId: pid || undefined,
          name: row.name || name,
          chartNumber: row.chartNumber,
          date: el.dataset.date,        // YYYY-MM-DD
          time: el.dataset.time,        // HH:MM
          doctorId: (docs.length === 1 ? docs[0].id : undefined),
        });
      });
    });
  };
  if (!SLOTS) { loadSlots().then(fill); } else { bindInner(); }
}

/* 🔴 **시간표에서 날짜·시각 고르기**(사용자 지시 2026-10-20) — 상세패널 예약 슬롯 표를
 *   오른쪽 서랍으로 띄우고, 슬롯을 누르면 `onPick({date,time,doctorId})` 를 부른다.
 *   +예약 모달에서 「시간표에서 고르기」로 열어 모달의 날짜·시작 칸을 채운다(새 모달 X).
 *   bindResvSheet 와 같은 bookGridHTML 을 쓰되 **콜백만 다르다** — 모양·동작은 동일. */
function openSlotPicker(onPick, onClose) {
  closeActSheet();   // 다른 서랍이 떠 있으면 닫는다
  let picked = false;
  const close = () => { closeActSheet(); if (!picked && onClose) onClose(); };
  const scrim = document.createElement('div');
  scrim.className = 'mw-sheetscrim';
  scrim.addEventListener('click', close);
  const sheet = document.createElement('aside');
  sheet.className = 'mw-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<div class="sh"><h2>시간표에서 고르기</h2><button class="sx" aria-label="닫기">✕</button></div>'
    + '<div class="sb"><div class="q">예약할 날짜·시각을 누르세요 — 고르면 예약 창으로 돌아갑니다.</div>'
    + '<div class="resv-book">' + bookGridHTML() + '</div></div>';
  sheet.querySelector('.sx').addEventListener('click', close);
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);

  const fill = () => {
    const box = sheet.querySelector('.resv-book');
    if (!box) return;
    box.innerHTML = bookGridHTML();
    bindInner();
  };
  const bindInner = () => {
    sheet.querySelectorAll('.resv-book [data-week]').forEach(b => {
      b.addEventListener('click', async e => {
        e.preventDefault(); e.stopPropagation();
        const v = b.dataset.week;
        weekOff = (v === 'now') ? 0 : weekOff + Number(v);
        SLOTS = null; fill(); await loadSlots(); fill();
      });
    });
    sheet.querySelectorAll('.resv-book .bslot:not(.full)').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        let docs = []; try { docs = JSON.parse(el.dataset.docs || '[]'); } catch (_) { docs = []; }
        picked = true; closeActSheet();
        onPick({ date: el.dataset.date, time: el.dataset.time, doctorId: (docs.length === 1 ? docs[0].id : undefined) });
      });
    });
  };
  if (!SLOTS) { loadSlots().then(fill); } else { bindInner(); }
}
let DETAIL_ROW_PID = null;   // 지금 열린 환자 id (차팅 서랍이 차트 캐시를 찾는 데 쓴다)

/* ── 🔴 **오늘 안 온 사람도 상세를 연다** (사용자 지시 2026-10-16) ──────────
 *
 * 문의 칸은 **아직 안 온 사람**도 보여준다. 그 사람은 오늘 접수 행이 없어
 * `VIEWS`(맵에 있는 사람)에 없고, 그래서 패널이 **안 열렸다**.
 *
 * 🔴 그런데 **상세는 열 수 있다** — `/api-v1/patient/:id/detail` 은 접수와 무관하게
 *    환자 ID 로 답한다(실측 2026-10-16: 문의 환자 2813 → 200).
 *    치아기록·상담·성향은 「오늘 왔는지」와 상관없는 정보다.
 * → 문의 행으로 **합성 뷰**를 만들어 같은 renderer 를 태운다.
 *
 * ⚠️ **없는 것을 지어내지 않는다.** 접수 시각·체어·담당의는 **없다**(오늘 안 왔으니까).
 *    `r` 에 그 필드를 비워 두면 showPop 이 알아서 그 줄을 건너뛴다.
 * ⚠️ `place` 를 **주지 않는다** — 위치가 없는 게 사실이다. 「대기실」로 적으면 거짓이다.
 * ⚠️ `status` 는 덴트웹 값이 아니라 **-1**(내원 전)로 둔다. 0(접수)으로 적으면
 *    「접수한 사람」으로 읽혀 데스크가 찾으러 간다.
 */
function offMapViewOf(pid) {
  if (!pid) return null;
  const key = String(pid);
  const inqs = INQ_ALL.filter(a => String(a.patientRef) === key);
  /* 🔴 **내원 전(방문예정) 환자도** 연다 — 아래 목록 표의 행에서 들어온다.
     문의가 없어도 「오늘 예약은 몇 시인가」를 보려고 누른다. */
  const up = UPCOMING.find(u => String(u.patientId) === key);

  /* 🔴 **수납완료(status 4)도** 연다 — `placeOf` 가 맵에서 **일부러 내린 사람**이라
     `VIEWS` 에 없다(「끝난 사람을 맵에 두면 지금 있는 사람과 섞인다」).
     하지만 접수 행은 **진짜로 있다** — 합성하지 말고 `ROWS` 에서 그대로 쓴다.
     ⚠️ 합성하면 담당의·차트·진료 시각을 잃는다. 있는 것을 지어낼 이유가 없다. */
  const real = ROWS.find(x => String(x.patientId) === key);
  if (real) {
    return { r: real, inqs, level: 0, place: null, color: colorOf(real, 0) };
  }

  /* 🔴 **예약(APPTS)만 있는 환자도** 연다 — 예약 현황의 네모를 누르면 상세가 떠야 한다
     (사용자 지시 2026-10-19). UPCOMING(방문예정)에 없어도 오늘 예약이 있으면 그 정보로 연다. */
  const ap = (APPTS || []).find(a => String(a.patientId) === key);
  /* 🔴 **환자 찾기로 고른 환자도** 연다(사용자 지시 2026-10-20) — 오늘 보드에 없어도
     검색 결과로 상세패널을 띄운다. 상세 데이터는 `/api-v1/patient/:id/detail` 이 pid 로 준다. */
  const hit = SEARCH_HITS.get(key);
  /* 🔴 **예약변경·문서요청(QBOARD) 환자도** 연다(사용자 지시 2026-10-20) — 요청 KPI 표의
     행을 누르면 상세패널이 떠야 한다. 상세 데이터는 `/api-v1/patient/:id/detail` 이 pid 로 준다.
     ⚠️ 보드 환자는 오늘 안 온 사람(예약 취소 등)이 많아 ROWS/APPTS/UPCOMING 에 없다. */
  const q = QBOARD.find(x => String(x.patientId) === key);
  /* 🔴 **오늘 촬영(XRAYS)만 있는 환자도** 연다(사용자 지시 2026-10-22) — 「오늘 촬영」 표의 행.
     촬영 기록엔 이름이 없어 머리는 「이름 없음」으로 열린다(상세 본문은 pid 로 받는다).
     ⚠️ 실측(10-22) 촬영 11명은 전부 오늘 접수자라 이 갈래는 아직 실제로 탄 적이 없다. */
  const xr = XRAYS.get(key);
  if (!inqs.length && !up && !ap && !hit && !q && !xr) return null;
  const r = {
    patientId: key,
    name: (inqs[0] && inqs[0].patientName) || (up && up.name) || (ap && ap.name) || (hit && hit.name)
      || (q && (q.patientName || q.name)) || '이름 없음',
    chartNumber: up ? up.chartNumber : (ap ? ap.chartNumber : (hit ? hit.chartNumber : (q ? q.chartNo : undefined))),
    isNewPatient: up ? up.isNewPatient : (ap ? ap.isNewPatient : (hit ? hit.isNewPatient : undefined)),
    note: ap ? ap.note : undefined,
    status: -1,                 // 🔴 내원 전/비내원 — 덴트웹 상태가 아니다
    chairId: 0,
  };
  const ages = inqs.map(a => minsSinceUtc(a.createdAt)).filter(x => x !== null);
  const age = ages.length ? Math.max.apply(null, ages) : 0;
  const level = !inqs.length ? 0 : (age >= URGENCY.INQ_URG_MIN ? 2 : 1);
  return { r, inqs, level, place: null,
    color: level === 2 ? 's-urg' : level === 1 ? 's-warn' : 's-ok' };
}

/* 🔴 예약변경 — 그 환자의 상세패널을 **고정**으로 열고, 머리의 「예약」 서랍을 바로 편다
 *   (사용자 지시 2026-10-19). 상세패널은 비동기로 그려지므로 `.atbtn[data-sheet=resv]`
 *   가 나타날 때까지 잠깐 기다렸다가 누른 것처럼 처리한다. */
function openResvChange(pid) {
  showPop({ dataset: { pid: String(pid) } }, true);
  const tryOpen = (tries) => {
    const btn = document.querySelector('.side-detail .atbtn[data-sheet="resv"]');
    if (btn) {
      const panel = btn.closest('.side-detail');
      const nm = panel ? (panel.querySelector('.nm') || {}).textContent : '';
      /* 🔴 `.on` 은 openActSheet **뒤에** 단다 — openActSheet 가 처음에 closeActSheet 로
         모든 atbtn 의 `.on` 을 지우기 때문이다(먼저 달면 지워진다). */
      openActSheet('resv', nm);
      panel.querySelectorAll('.atbtn').forEach(x => x.classList.remove('on'));
      btn.classList.add('on');
    } else if (tries > 0) {
      setTimeout(() => tryOpen(tries - 1), 40);
    }
  };
  tryOpen(10);
}

let LAST_POP_PID = null;
function showPop(el, pin) {
  hidePop();
  const v = VIEWS.get(String(el.dataset.pid)) || offMapViewOf(el.dataset.pid);
  if (!v) return;
  pinned = pin ? String(el.dataset.pid) : null;
  /* 🔴 다른 환자를 열면 치아 선택·치주 펼침을 풀어 준다 — 전역이라 A 의 #16 펼침이 B 에 남았다(리뷰 2026-10-20). */
  if (LAST_POP_PID !== String(el.dataset.pid)) { TOOTH_SEL = null; PERIO_OPEN = false; LAST_POP_PID = String(el.dataset.pid); }
  const r = v.r, w = waitedMin(r), tm = treatMin(r);

  const tags = [];
  /* 🔴 모르면(문의·검색으로 연 환자 — isNewPatient 없음) 꼬리표를 달지 않는다 */
  if (r.isNewPatient === true) tags.push('<span class="tag new">신환</span>');
  else if (r.isNewPatient === false) tags.push('<span class="tag">재진</span>');
  /* 🔴 「N분 대기」 빨간 꼬리표는 **대기가 실제로 길 때만** 단다.
     ⚠️ `v.level` 로 판정하면 **문의 때문에 level 이 오른 사람**에게도 붙어,
        4분 기다린 사람이 「4분 대기」를 빨갛게 달고 있게 된다(실측으로 잡았다).
        대기 시간은 아래 pmeta 에 항상 적히므로 정보가 사라지지 않는다. */
  if (r.status <= 1 && w !== null && w >= waitCuts(BASELINE).cuts[0]) {
    tags.push('<span class="tag wait">' + dur(w) + ' 대기</span>');
  }
  for (const a of v.inqs) {
    const age = minsSinceUtc(a.createdAt);
    tags.push('<span class="tag inq">' + esc(inqLabel(a.actionType))
      + (age !== null ? ' · ' + dur(age) + ' 경과' : '') + '</span>');
  }

  /* 🟢 촬영 — **꼬리표로만** 보여준다.
     🔴 급함(level)에 넣지 않는다. 촬영은 「기다리게 하는 일」이 아니라 **진행된 일**이다 —
        빨간 네모로 만들면 「처리해야 할 환자」와 섞여 데스크가 헛걸음한다. */
  const xray = XRAYS.get(String(r.patientId));
  if (xray) {
    tags.push('<span class="tag xr">' + esc(xray.kinds) + ' ' + xray.shots + '장'
      + (xray.lastAt ? ' · ' + esc(hhmm(xray.lastAt)) : '') + '</span>');
  }
  /* 🟢 문진 — **꼬리표로만**. 🔴 급함(level)에 넣지 않고 **색도 칠하지 않는다**
     (사용자 지시 2026-10-16: 「색상은 나중에 정하겠습니다」). 지금은 사실만 적는다.
     ⚠️ 수집이 멈췄으면 「문진 없음」이라고 **단정하지 않는다** — 모르는 것이다. */
  const ik = intakeOf(r);
  if (ik && ik.done) {
    tags.push('<span class="tag ik">문진 제출' + (ik.submitHm ? ' ' + esc(ik.submitHm) : '') + '</span>');
  } else if (ik && ik.other) {
    // 같은 날 다른 예약의 문진 — 이번 방문 것이 아니다(실사고 차트 8383).
    tags.push('<span class="tag ik-no">이번 예약 문진 없음<span style="font-weight:500"> · 다른 예약분 '
      + esc(ik.submitHm) + '</span></span>');
  } else if (ik) {
    tags.push('<span class="tag ik-no">문진 확인 대기<span style="font-weight:500"> · ' + esc(ik.status) + '</span></span>');
  } else if (intakeCollecting()) {
    tags.push('<span class="tag ik-no">문진 없음</span>');
  }

  const meta = [];
  if (r.receivedAt) meta.push('접수 <b>' + esc(hhmm(r.receivedAt)) + '</b>');
  if (r.status <= 1 && w !== null) meta.push('대기 <b>' + dur(w) + '</b>');
  const cn = chairName(r.chairId);
  /* 🔴 대기 중인데 chairId 가 있으면 **「배정」**이라고 적는다. 그냥 「체어 3번」이라
     적으면 **거기 앉아 있다**는 뜻이 되는데, 실제로는 아직 대기실에 있다(실측 함정). */
  if (cn) meta.push((r.status === 2 ? '체어 <b>' : '배정 <b>') + esc(cn) + '</b>');
  if (tm !== null) meta.push('진료 <b>' + dur(tm) + '</b>');
  const dr = staffName(r.doctorId);
  if (dr) meta.push('담당의 <b>' + esc(dr) + '</b>');
  /* 🔴 직원은 「담당」 꼬리표로만 — 위치를 말하지 않는다. 1명이 동시에 여러 환자에
     걸려(실측 3건) 「거기 서 있다」고 하면 거짓이다. 트래킹은 CCTV 도입 때. */
  const st = staffName(r.staffId);
  if (st) meta.push('담당 <b>' + esc(st) + '</b>');
  const age = ageOf(r.birthDate);
  if (age !== null) meta.push(age + '세 ' + (r.gender === 'F' ? '여' : r.gender === 'M' ? '남' : ''));

  const memo = r.treatmentDetail || r.note || '';
  const inqNotes = v.inqs.filter(a => a.note).map(a => a.note);

  /* 🔴 **작은 창(말풍선)이 아니라 우측 패널**이다(사용자 지시 2026-10-16 ·
     `192.168.0.N2:8790` 참고). 떠다니는 창은 ① 다른 네모를 가리고 ② 화면 끝에서
     위치를 보정해야 하고 ③ 열어 둔 채 다른 환자를 비교할 수 없다.
     패널은 **자리가 고정**이라 눈이 매번 같은 곳을 본다.
     ⚠️ `position:fixed` 로 **오른쪽에 붙인다** — 맵 안에 넣으면 칸의 overflow 에 잘린다. */
  const p = document.createElement('div');
  p.className = 'side-detail';
  p.dataset.pid = String(r.patientId);   // 🔴 응답이 늦게 와도 **그 환자**인지 확인한다
  DETAIL_ROW[String(r.patientId)] = r;   // 메신저 상태 이벤트(도착·진료실)에 쓴다
  DETAIL_ROW_PID = String(r.patientId);  // 차팅 서랍이 쓰는 「지금 열린 환자」

  /* ── 헤더 .sum — Monday 와 **동일한 구조**(.l1 / .l0 / .l2 4칸 / .l3 접수) ──
     🔴 .l2 4칸(다음 할 일·주의·미수·다음 예약)은 **상세 데이터**가 와야 채워진다.
        여기선 「불러오는 중」으로 두고 loadDetail→fillSummary 가 채운다(id 로). */
  const subBits = [];
  subBits.push(esc(STAGE_NAME[r.status] || ('상태 ' + r.status)));
  if (r.receivedAt) subBits.push('접수 ' + esc(hhmm(r.receivedAt)));
  const cn0 = chairName(r.chairId);
  if (cn0) subBits.push((r.status === 2 ? '체어 ' : '배정 ') + esc(cn0));
  const sub = subBits.join(' · ');

  const l0bits = [];
  /* ⚠️ meta·tags 는 **이미 esc() 한 값을 `<b>`/`<span>` 으로 감싼 HTML** 이다 —
     여기서 다시 esc() 하면 `<b>0번</b>` 이 글자로 보인다. 그대로 넣는다. */
  if (meta.length) l0bits.push('<span class="v">' + meta.join(' · ') + '</span>');
  if (tags.length) l0bits.push('<span class="v">' + tags.join(' ') + '</span>');
  if (inqNotes.length) l0bits.push('<span class="k">문의</span><span class="v red">' + esc(inqNotes.join(' / ')) + '</span>');
  if (memo) l0bits.push('<span class="k">메모</span><span class="v">' + esc(String(memo).slice(0, 80)) + '</span>');

  /* 🔴 머리 액션 토글 — 문서 · 메시지 · 차팅 (✕ 왼쪽). 누르면 우측 서랍(.sheet)이 열려
     Monday 와 **같은 내용**을 보여준다(문서 서식 / 메시지 문안 / 차팅 입력). */
  /* 🔴 **예약**을 문서·메시지·차팅 **좌측에** 둔다(사용자 지시 2026-10-19) — 누르면
     예약하기와 동일한 주간 표가 서랍에 뜬다. */
  const ACT_TOGGLES = [['resv', '예약'], ['doc', '문서'], ['msg', '메시지'], ['chart', '차팅']];
  const actToggle = '<div class="acttog" role="group" aria-label="예약·문서·메시지·차팅">'
    + ACT_TOGGLES.map(([k, label]) =>
        '<button class="atbtn" data-sheet="' + k + '">' + label + '</button>').join('')
    + '</div>';

  p.innerHTML = '<div class="sum">'
    + '<div class="l1">'
    +   '<button class="back" id="sdBack" aria-label="보드로">← 보드</button>'
    +   '<span class="nm">' + esc(r.name || '이름 없음') + '</span>'
    +   (MOCK ? '<span class="pmock" title="/api-v3 합성 데이터 · 덴트웹을 읽지 않습니다">목업</span>' : '')
    +   '<span class="sub">' + (r.chartNumber ? '#' + esc(r.chartNumber) + ' · ' : '') + esc(sub) + '</span>'
    +   actToggle
    +   '<button class="x" id="sdX" aria-label="닫기">✕</button>'
    + '</div>'
    + (l0bits.length ? '<div class="l0">' + l0bits.join('') + '</div>' : '')
    + '<div class="l2" id="sdSum">'
    +   '<div class="cell next"><h3>다음 할 일</h3><div class="lab muted">불러오는 중…</div></div>'
    +   '<div class="cell"><h3>주의 (전신병력)</h3><div class="chips muted">—</div></div>'
    +   '<div class="cell"><h3>미수</h3><div class="big muted">—</div></div>'
    +   '<div class="cell"><h3>다음 예약</h3><div class="big muted">—</div></div>'
    +   '<div class="cell statcell"><h3>상태</h3><div class="muted">—</div></div>'
    + '</div>'
    + '</div>'
    /* 🔴 본문 .pbody — 열 때 상세를 받아 채운다(폴링에 안 태운다). */
    + '<div class="pbody" id="sdMore"><section class="pane"><div class="empty">상세 불러오는 중…</div></section></div>';
  document.body.appendChild(p);
  loadDetail(r.patientId);
  const x = p.querySelector('#sdX');
  if (x) x.onclick = e => { e.stopPropagation(); pinned = null; hidePop(); };
  const bk = p.querySelector('#sdBack');
  if (bk) bk.onclick = e => { e.stopPropagation(); pinned = null; hidePop(); };

  /* 🔴 위치 보정이 **필요 없다** — 패널은 오른쪽에 고정이다.
     (말풍선일 때는 화면 끝에서 넘치지 않게 매번 계산해야 했다.) */
}
function ageOf(birth) {
  const b = String(birth || '').replace(/\D/g, '');
  if (b.length < 8) return null;
  const y = +b.slice(0, 4), mo = +b.slice(4, 6), d = +b.slice(6, 8);
  const n = new Date();
  let a = n.getFullYear() - y;
  if (n.getMonth() + 1 < mo || (n.getMonth() + 1 === mo && n.getDate() < d)) a--;
  return (a >= 0 && a < 130) ? a : null;
}

/* ── 폴링 ──────────────────────────────────────────────────────────────
 * 🔴 **토대 화면과 같은 간격**(10초). 같은 데이터를 두 화면이 다른 주기로 받으면
 *    숫자가 어긋나 보인다.
 * 🔴 **상세패널이 열려 있어도 보드는 계속 갱신한다**(UIUX 리뷰 2026-10-19 — 공통 지적):
 *    모니터링 보드가 패널 하나 열었다고 **조용히 멈추면** 데스크·진료실이 낡은 화면을
 *    사실로 읽는다. 상세패널(.side-detail)·서랍(.mw-sheet)은 **position:fixed 로 #app 밖**에
 *    있어, #app 만 다시 그려도 패널은 그대로 남는다(옛 「말풍선이 허공에 뜬다」 문제는
 *    말풍선을 맵 안에 absolute 로 두던 시절 얘기 — 지금 패널은 고정이라 해당 없음). */
/* 🔴 **폴링이 겹쳐 쌓이지 않게** 한다 (사용자 보고 2026-10-21 · ③).
   한 바퀴(`load()`)가 10초를 넘으면 다음 `setInterval` 이 그 위에 또 얹혔다 —
   실측으로 **같은 9개 묶음이 두 벌** 뜨는 것을 네트워크 기록에서 확인했다.
   덴트웹 커넥션이 사실상 1개라 큐가 길어질수록 **쓸수록 느려진다**.
   → 앞 바퀴가 아직 돌고 있으면 이번 틱은 **건너뛴다**(다음 틱에 다시 온다).
   ⚠️ `finally` 로 반드시 내린다 — 중간에 던져도 플래그가 남으면 화면이 영영 안 는다. */
let TICK_BUSY = false;
async function tick() {
  if (TICK_BUSY) return;            // 앞 바퀴가 아직 돈다 — 쌓지 않는다
  TICK_BUSY = true;
  try {
    await load();
    connOk = true; lastErr = '';
    render();
  } catch (e) {
    connOk = false;
    lastErr = (e && e.message) || '알 수 없는 오류';
    /* 🔴 **맵을 통째로 지우지 않는다** — 이미 그려 둔 것이 있으면 띠에만 「끊김」을
       띄운다. 전부 지우면 깜빡 끊긴 네트워크에 화면이 백지가 된다.
       ⚠️ 첫 적재가 실패하면 그릴 게 없으므로 그때만 에러를 보여준다. */
    if (!ROWS.length) {
      $('app').innerHTML = '<div class="err"><b>불러오지 못했어요</b><br>' + esc(lastErr)
        + (e && e.code === 'DENTWEB_DOWN'
          ? '<br><span style="font-size:12.5px">덴트웹에 닿지 않습니다 — 0건이 아니라 <b>조회 실패</b>입니다.</span>'
          : '') + '</div>';
    } else {
      render();
    }
  } finally {
    TICK_BUSY = false;   // 🔴 던져도 반드시 내린다 — 남으면 화면이 영영 안 는다
  }
}
tick();
setInterval(tick, URGENCY.POLL_MS);

/* ── SSE — 「움직였다」를 **즉시** 받는다 (2단계) ────────────────────────
 *
 * `/api/events` 는 환자ID→status 해시가 바뀔 때 `receptions_changed` 를 쏜다
 * (`watcher.rs:88`). 그게 곧 **이 맵이 기다리는 신호**다 — 누가 체어로 들어가거나
 * 진료가 끝나면 10초를 기다리지 않고 바로 그려진다.
 *
 * 🔴 **폴링을 대체하지 않는다 — 덧붙인다.** SSE 는 끊길 수 있고(프록시·절전·서버 재시작)
 *    끊긴 걸 모르면 화면이 **조용히 멈춘다**. 선례도 SSE 가 끊기면 폴링으로 되돌린다
 *    (`openapi.rs:2130`). 그래서 10초 폴링은 **그대로 두고** SSE 는 「더 빨리」만 한다.
 *
 * ⚠️ **말풍선이 고정돼 있으면 건너뛴다** — tick() 과 같은 이유(가리키던 네모가 사라진다).
 * ⚠️ **몰아치면 묶는다**(600ms) — 여러 환자가 동시에 바뀌면 이벤트가 연달아 오는데
 *    그때마다 다시 그리면 화면이 깜빡이고 조회가 쏟아진다.
 * ⚠️ EventSource 는 끊기면 **스스로 재연결**한다 — 우리가 재연결 코드를 쓰지 않는다.
 */
(function () {
  if (typeof EventSource === 'undefined') return;   // 아주 오래된 브라우저 — 폴링으로 충분하다
  let burst = null;
  try {
    const es = new EventSource(api('/api/events'));
    es.onmessage = ev => {
      let kind = '';
      try { kind = (JSON.parse(ev.data) || {}).kind || ''; } catch (_) { return; }
      if (kind !== 'receptions_changed') return;    // 다른 이벤트는 이 맵과 무관하다
      /* 🔴 상세패널이 열려 있어도 보드는 갱신한다(tick 과 같은 이유). */
      clearTimeout(burst);
      burst = setTimeout(tick, 600);
    };
    /* ⚠️ 에러를 콘솔에 쏟지 않는다 — EventSource 는 재연결할 때마다 error 를 올리는데
       그걸 그대로 두면 「에러 0건」 검사가 **매번 실패**한다(끊김은 정상 동작이다).
       폴링이 살아 있으므로 화면은 계속 돈다. */
    es.onerror = () => { /* 재연결은 브라우저가 한다 */ };
  } catch (_) { /* SSE 를 못 열어도 폴링으로 돈다 */ }
})();
</script>
