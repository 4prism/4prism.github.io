    /* 🔴 **「발급 신청」을 누른 순간 기록한다**(사용자 지시 2026-10-21) —
       「직원이 환자의 서류를 발급 요청했다는 정보를 기록에 남겨야」.
       인쇄까지 기다리지 않는다: 신청해 놓고 나중에 뽑는 일이 흔하고,
       기록이 없으면 **누가 무엇을 신청했는지** 아무도 모른다. */
    await markDocIssued(pid, j.data);
    /* 🔴 미리보기가 생겼으니 실행 줄의 「A4 인쇄」를 **켠다**. */
    const pr2 = sheet.querySelector('#docPrint2');
    if (pr2) { pr2.disabled = false; pr2.removeAttribute('title'); }
    /* 🔴 인쇄 버튼은 **실행 줄에 하나만** 둔다(사용자 지시 — 영역을 나눠 직관적으로).
       미리보기 안에 또 두면 같은 버튼이 두 개라 어느 것이 진짜인지 헷갈린다. */
  } catch (e) {
    out.innerHTML = '<div class="empty bad">덴트웹에 닿지 못했습니다 — 잠시 후 다시 시도하세요.</div>';
  }
}

/** 발급한 서류를 **요청 기록**으로 남긴다 — 라운지 「요청」 라벨의 세 번째 출처.
 *  key = `doc:<종류>:<환자>:<발급일>` — 같은 날 같은 서류를 두 번 떼도 한 줄이다.
 *  🔴 모닝웹 **로컬에만** 쓴다(덴트웹 아님) — `lounge_checks` 와 같은 표를 쓴다. */
async function markDocIssued(pid, d) {
  const b = (d && d.data) || {};
  /* 🔴 **신청 경로를 키에 담는다**(사용자 정정 2026-10-21).
     이 화면(데스크 상세패널)에서 만든 신청은 **언제나 `doc:staff:`** 다 —
     「환자가 모바일로 직접」이 아니라 **로그인한 직원이** 신청한 것이기 때문이다.
     환자 폰 신청이 붙으면 그쪽이 `doc:patient:` 를 쓴다.
     ⚠️ 라벨에만 적으면 라벨이 바뀌는 순간 출처가 사라진다 — **키가 사실**이다. */
  const key = 'doc:' + DOC_CHANNEL + ':' + (b.doc || '') + ':' + pid + ':' + (d.issueDate || '');
  const label = (b.docName || '서류') + ' · 직원 신청';
  try {
    await fetch(api('/api-v1/lounge/request-checks'), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key, patientId: Number(pid), label, done: false }),
    });
    /* 보드가 바로 반영되게 체크 상태를 다시 받는다(폴링을 기다리지 않는다). */
    await loadReqChecks();
    DOC_ISSUED.push({ key, patientId: String(pid), label });
    render();
  } catch (e) { /* 기록 실패가 인쇄를 막지는 않는다 */ }
}
/* 🔴 이번 화면 세션에서 발급한 것 — 서버가 체크표만 주고 **요청 자체**는 안 주므로
   (요청 출처는 화면이 만든다는 기존 규칙) 여기서 들고 있는다.
   ⚠️ 새로고침하면 사라진다 — 체크 표시는 서버에 남지만 라벨은 다시 안 뜬다.
      서버가 `doc:` 키를 라벨과 함께 돌려주므로 `reqsOf` 가 그것으로 복원한다. */
let DOC_ISSUED = [];

/* ── A4 서식 (의료법 시행규칙 별지 모양) ───────────────────────────────
 * 🔴 **금액은 서버가 준 확정값만** 찍는다 — 화면에서 더하거나 빼지 않는다.
 * 🔴 발급 이력이 없으면 **빈 영수증을 그리지 않는다** — 「발급 이력이 없습니다」라 적는다.
 * ⚠️ 서명·도장은 **종이에 직접** 날인한다(이미지 미포함 — PHI·보유율 문제).
 */
function docPaperHTML(d) {
  const iss = d.issuer || {};
  const b = d.data || {};
  /* 🔴 환자 이름·차트는 세 곳을 **차례로** 본다 — 맵에 없는 사람(내원 전·수납완료)도
     서류를 뽑기 때문이다. 실측 버그: `VIEWS` 만 보다가 성명이 빈칸으로 인쇄됐다.
     ③ 상세패널 머리글은 **지금 열려 있는 그 환자**라 가장 확실하다. */
  let pat = (VIEWS.get(String(d.patientId)) || {}).r
    || (ROWS || []).find(r => String(r.patientId) === String(d.patientId));
  if (!pat) {
    const sd = document.querySelector('.side-detail');
    const nm = sd && sd.querySelector('.nm');
    const sub = sd && sd.querySelector('.sub');
    const chart = sub ? (String(sub.textContent).match(/#(\S+)/) || [])[1] : '';
    pat = { name: nm ? nm.textContent.trim() : '', chartNumber: chart || '' };
  }
  /* ⚠️ 생년월일은 맵에 없을 때 **빈칸으로 둔다** — 지어내지 않는다. */
  const head = ''
    + '<div class="p-head">'
    +   '<div class="p-title">' + esc(b.docName || '') + '</div>'
    + '</div>'
    + '<table class="p-tb p-pat"><tbody>'
    +   '<tr><th>성명</th><td>' + esc(pat.name || '') + '</td>'
    +       '<th>차트번호</th><td>' + esc(pat.chartNumber || '') + '</td></tr>'
    +   '<tr><th>생년월일</th><td>' + esc(ymdDash(pat.birthDate) || '') + '</td>'
    +       '<th>발급일</th><td>' + esc(ymdKo(d.issueDate)) + '</td></tr>'
    + '</tbody></table>';

  let bodyHTML = '';
  if (b.doc === 'visit_confirm') {
    const vs = b.visits || [];
    bodyHTML = '<table class="p-tb"><tbody>'
      + '<tr><th>진료 기간</th><td>' + esc(ymdKo(b.from)) + ' ~ ' + esc(ymdKo(b.to)) + '</td></tr>'
      + '<tr><th>내원 횟수</th><td><b>' + (b.visitCount || 0) + '회</b></td></tr>'
      + '</tbody></table>'
      /* 🔴 **날짜마다 그날 받은 진료**를 같이 적는다(사용자 지시 2026-10-21) —
         날짜만 있으면 보험사가 「무슨 치료였나」를 되묻는다.
         ⚠️ 진료명이 없는 날은 **비워 둔다**(지어내지 않는다). */
      + (vs.length
          ? '<div class="p-sub">내원일 및 진료 내용</div>'
            + '<table class="p-tb p-visits"><thead><tr><th>내원일</th><th>진료 내용</th></tr></thead><tbody>'
            + vs.map((v, i) => '<tr><td class="c">' + esc(ymdDash(v.date)) + '</td>'
                + '<td>' + ((v.treatments || []).length
                    ? esc(v.treatments.join(', '))
                    : '<span class="dim">—</span>') + '</td></tr>').join('')
            + '</tbody></table>'
          : '<div class="p-none">이 기간에 내원 기록이 없습니다.</div>');
  } else if (b.doc === 'receipt') {
    const rs = b.receipts || [];
    if (!rs.length) {
      /* 🔴 **지어내지 않는다** — 덴트웹이 발급한 적이 없으면 영수증이 없다. */
      bodyHTML = '<div class="p-none">발급 이력이 없습니다.<br>'
        + '<small>덴트웹에서 영수증을 발급한 기록이 있는 진료만 재발행할 수 있습니다. '
        + '수납은 했지만 영수증을 인쇄한 적이 없으면 여기 나오지 않습니다 — 덴트웹에서 먼저 발급하세요.</small></div>';
    } else {
      const r = rs[0];
      bodyHTML = '<table class="p-tb"><tbody>'
        + '<tr><th>영수증번호</th><td>' + esc(r.receiptNo || '') + '</td>'
        +     '<th>진료기간</th><td>' + esc(ymdDash(r.fromYmd)) + ' ~ ' + esc(ymdDash(r.toYmd)) + '</td></tr>'
        + '</tbody></table>'
        + '<table class="p-tb p-amt"><thead><tr><th>구분</th><th>금액</th></tr></thead><tbody>'
        + '<tr><td>급여 — 본인부담</td><td class="r">' + wonN(r.ownTotal - r.uncovered) + '</td></tr>'
        + '<tr><td>급여 — 공단부담</td><td class="r">' + wonN(r.insurer) + '</td></tr>'
        + '<tr><td>비급여</td><td class="r">' + wonN(r.uncovered) + '</td></tr>'
        + (r.vat ? '<tr><td>부가세</td><td class="r">' + wonN(r.vat) + '</td></tr>' : '')
        + '<tr class="sum"><td>환자 부담 총액</td><td class="r">' + wonN(r.patientTotal) + '</td></tr>'
        + '<tr><td>납부액 (카드·현금·통장)</td><td class="r">' + wonN(r.paid) + '</td></tr>'
        + (r.unpaid ? '<tr class="due"><td>미납액</td><td class="r">' + wonN(r.unpaid) + '</td></tr>' : '')
        + '</tbody></table>'
        /* ⚠️ A/B 줄은 **참고**다 — 더해도 합계와 안 맞는다(반올림). 그래서 합계 칸에 넣지 않는다. */
        + (r.coveredLines && r.coveredLines.length
            ? '<div class="p-sub">급여 항목 분해 <small>(참고 — 반올림으로 합계와 다를 수 있습니다)</small></div>'
              + '<table class="p-tb p-lines"><thead><tr><th>항목</th><th>본인부담</th><th>공단부담</th></tr></thead><tbody>'
              + r.coveredLines.map(l => '<tr><td>' + esc(l.code) + '</td><td class="r">' + wonN(l.own)
                  + '</td><td class="r">' + wonN(l.insurer) + '</td></tr>').join('')
              + '</tbody></table>' : '')
        + (r.uncoveredText ? '<div class="p-sub">비급여 내역</div><div class="p-free">' + esc(r.uncoveredText) + '</div>' : '')
        + (rs.length > 1 ? '<div class="p-more">이 환자의 발급 이력 ' + rs.length + '건 중 가장 최근 1건입니다.</div>' : '');
    }
  }

  const foot = ''
    + '<div class="p-stmt">위와 같이 진료하였음을 확인합니다.</div>'
    + '<div class="p-issuer">'
    +   '<div class="p-iname">' + esc(iss.name || '(병원명 설정 필요)') + '</div>'
    +   '<div class="p-irow">'
    +     (iss.institutionNo ? '<span>요양기관번호 ' + esc(iss.institutionNo) + '</span>' : '')
    +     (iss.bizNo ? '<span>사업자등록번호 ' + esc(iss.bizNo) + '</span>' : '')
    +   '</div>'
    +   (iss.address ? '<div class="p-irow"><span>' + esc(iss.address) + '</span></div>' : '')
    +   '<div class="p-irow">'
    +     (iss.phone ? '<span>전화 ' + esc(iss.phone) + '</span>' : '')
    +     (iss.fax ? '<span>팩스 ' + esc(iss.fax) + '</span>' : '')
    +   '</div>'
    /* 🔴 **도장은 덴트웹 것**이다(`TB_직원정보.i도장이미지` PNG) — 다른 데서 가져오지 않는다.
       🔴 **종이에 찍은 것처럼** 보여야 한다(사용자 지시 2026-10-21: 「(인) 텍스트 위에
          도장을 찍은 것처럼」). 그래서 「(인)」을 **지우지 않고 그대로 두고**, 그 위에
          도장을 **겹쳐**(absolute) 살짝 기울여 얹는다 — 실제 날인이 그렇게 생겼다.
       ⚠️ 없으면 「(인)」만 남는다. 가짜 도장을 그리지 않는다. */
    +   '<div class="p-sign">대표자 ' + esc(iss.ceoName || '')
    +     '<span class="p-sealwrap">'
    +       '<span class="p-seal">(인)</span>'
    +       (d.stampPng ? '<img class="p-stamp" src="' + esc(d.stampPng) + '" alt="" data-stamp-raw="1">' : '')
    +     '</span>'
    +   '</div>'
    + '</div>';

  return '<div class="doc-toolbar">'
    +   '<span class="doc-pages" id="docPages"></span>'
    +   '<span class="doc-note">' + esc(d.signatureNote || '') + '</span>'
    + '</div>'
    /* 🔴 **2장 이상이면 스크롤로 본다**(사용자 지시 2026-10-21).
       A4 한 장(297mm)에 안 들어가면 종이가 **길어지는** 게 아니라 **장이 늘어난다** —
       미리보기는 그 길이를 그대로 두고 **창에서 스크롤**해 보게 한다(`.a4-scroll`).
       ⚠️ 인쇄는 브라우저가 알아서 장을 나눈다(`@page` + `break-inside:avoid`). */
    + '<div class="a4-scroll"><div class="a4-wrap"><div class="a4" id="docPaper">'
    +   head + bodyHTML + foot + '</div></div></div>';
}

/* 인쇄 — 새 창에 A4 서식만 담아 띄운다.
 * 🔴 현재 창을 `window.print()` 하지 않는다 — 라운지 보드가 통째로 인쇄된다.
 * ⚠️ 팝업이 막히면 그 사실을 알린다(조용히 아무 일도 안 일어나면 「고장」으로 읽힌다). */
/** 도장 PNG 의 **배경을 지운다** — 종이에 찍은 인영만 남긴다.
 *
 * 🔴 **왜 필요한가**(실측 2026-10-21): 덴트웹 `i도장이미지` 는 도장을 **스캔한 사진**이라
 *    투명 영역이 **0%** 이고 바탕이 회색이다. 그 상태로 `multiply` 를 걸면 그 회색이
 *    곱해져 **반투명 검은 네모**가 생긴다(사용자 지적).
 *
 * 🔴 **밝기로는 못 가른다** — 실측(196×200)에서 바탕 밝기 ≈150 인데 **인주가 90~130 으로
 *    더 어둡다.** 밝기 램프를 쓰면 바탕 카드가 통째로 남는다(첫 시도가 그래서 실패했다).
 * → **붉은 기**(`R − (G+B)/2`)로 가른다. 실측 분포가 깨끗하게 둘로 갈린다:
 *      바탕(테두리 평균) ≈ **15** · 인주 최댓값 ≈ **99**
 *    그래서 임계는 **그림마다 테두리에서 다시 잰다**(도장 사진이 바뀌어도 따라간다).
 * ⚠️ 못 그리면(캔버스 차단 등) **원본을 그대로 둔다** — 도장이 사라지는 것보다 낫다.
 */
function destampBg(img) {
  try {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const im = x.getImageData(0, 0, w, h), d = im.data;
    const redAt = o => d[o] - (d[o + 1] + d[o + 2]) / 2;

    /* 테두리 2px = 바탕이라고 본다(도장은 가운데 찍힌다). */
    let sum = 0, cnt = 0;
    for (let px = 0; px < w; px++) for (const py of [0, 1, h - 2, h - 1]) { sum += redAt((py * w + px) * 4); cnt++; }
    for (let py = 0; py < h; py++) for (const px of [0, 1, w - 2, w - 1]) { sum += redAt((py * w + px) * 4); cnt++; }
    const bgRed = cnt ? sum / cnt : 15;
    const lo = bgRed + 6, hi = bgRed + 38;   /* 실측 분포에서 뽑은 폭 */

    for (let i = 0; i < d.length; i += 4) {
      let a = (redAt(i) - lo) / (hi - lo);
      a = Math.max(0, Math.min(1, a));
      d[i + 3] = Math.round(a * 255);
      /* 남은 픽셀은 **인주색**으로 통일한다 — 스캔 얼룩이 회색으로 비치지 않게. */
      if (a > 0) { d[i] = 176; d[i + 1] = 32; d[i + 2] = 36; }
    }
    x.putImageData(im, 0, 0);
    img.src = c.toDataURL('image/png');
    img.removeAttribute('data-stamp-raw');
  } catch (e) { /* 원본 유지 */ }
}

/** A4 미리보기 높이를 **실제 내용**에 맞춘다 — 2장 이상이면 그만큼 길어진다.
 *  🔴 `transform:scale()` 은 **자리를 줄이지 않는다** — 줄어든 높이를 CSS 변수로 알려야
 *     아래에 빈 칸이 남지 않고, 2장째가 잘리지도 않는다.
 *  ⚠️ 장 수는 **297mm 배수로 올림**한다 — 종이는 반 장이 없다. */
function fitA4(out) {
  if (!out) return;
  const paper = out.querySelector('#docPaper');
  if (!paper) return;
  /* 🔴 **재기 전에 `minHeight` 를 지운다.** 안 지우면 지난번에 넣은 높이가 `scrollHeight`
     에 섞여 **잴 때마다 장이 늘어난다**(실측: 13줄짜리가 2장으로 불었다 — 되먹임).
     내용의 **순수 높이**를 먼저 재고, 그 다음에 종이 높이를 준다. */
  paper.style.minHeight = '';
  const onePx = 297 * (96 / 25.4);                        // A4 한 장 높이(px)
  const content = paper.scrollHeight;
  /* ⚠️ 1픽셀 넘쳤다고 한 장을 더 주지 않는다 — 여백 반올림으로 자주 생긴다. 2% 여유. */
  const pages = Math.max(1, Math.ceil(content / onePx - 0.02));
  paper.style.minHeight = (pages * 297) + 'mm';            // 마지막 장도 종이처럼 채운다
  out.style.setProperty('--a4h', (pages * 297) + 'mm');
  const tag = out.querySelector('#docPages');
  if (tag) tag.textContent = pages > 1 ? ('전 ' + pages + '장 — 스크롤해서 보세요') : '1장';
}

function printDoc(d) {
  const paper = document.getElementById('docPaper');
  if (!paper) return;
  const w = window.open('', '_blank', 'width=900,height=1200');
  if (!w) { toast('팝업이 막혀 있어요 — 브라우저에서 이 사이트의 팝업을 허용해 주세요.'); return; }

  /* 🔴 **미리보기의 인라인 높이를 떼고 복제한다**(실사고 2026-10-21 — 「2장인데 3장이 나온다」).
     `fitA4()` 가 미리보기를 종이처럼 보이게 하려고 `#docPaper` 에 **인라인**
     `min-height:594mm` 를 준다. `outerHTML` 로 퍼 가면 그 인라인이 **따라붙고**,
     인라인은 아래 `.a4{min-height:auto}` **스타일시트 규칙을 이긴다**(명시도).
     → 594mm 짜리 종이가 되어 265mm 짜리 인쇄면에 3장으로 잘렸다. 복제본에서 지운다. */
  const clone = paper.cloneNode(true);
  clone.style.minHeight = '';
  clone.style.height = '';

  const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
  w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8">'
    + '<title>' + esc((d.data && d.data.docName) || '서류') + '</title>'
    + '<style>' + css + '\n'
    /* 🔴 **여백을 0 으로 두고 종이 안쪽에서 패딩으로 준다.**
       `margin:16mm` 이면 한 장의 인쇄면이 297−32 = **265mm** 로 줄어, 미리보기가
       297mm 로 센 「2장」이 인쇄에서 3장이 된다(실측: 593mm 내용 ÷ 265 = 3).
       여백을 종이 안쪽 패딩으로 옮기면 **미리보기와 인쇄가 같은 297mm 자**를 쓴다. */
    + '@page{size:A4;margin:0}'
    + 'html,body{margin:0;padding:0;background:#fff;font:13px/1.7 Pretendard,-apple-system,sans-serif}'
    + '.a4{width:auto;min-height:auto;height:auto;box-shadow:none;border:0;margin:0;'
    +   'padding:16mm;box-sizing:border-box}'
    + '</style></head><body>' + clone.outerHTML + '</body></html>');
  w.document.close();

  /* 🔴 **인쇄 호출은 한 번만**(실사고 2026-10-21 — 「취소를 누르면 인쇄창이 또 뜬다」).
     예전엔 `onload` 와 400ms 타이머가 **각각** `print()` 를 불렀다. 첫 창을 취소하면
     두 번째가 그대로 떠서, 직원이 두 번 취소해야 했다.
     → 한 번만 돌도록 **빗장(once)** 을 건다. 타이머는 `onload` 가 안 걸리는 경우의
       **보험**으로만 남긴다(`document.write` 로 만든 창은 onload 가 안 오기도 한다). */
  let printed = false;
  const once = () => {
    if (printed || w.closed) return;
    printed = true;
    try { w.focus(); w.print(); } catch (e) {}
  };
  w.onload = once;
  setTimeout(once, 400);
}

/* ══════════════════════════════════════════════════════════════════════════
 * 동의서 작성 — 전체화면 오버레이 (사용자 지시 2026-10-22)
 *
 * 상세패널 문서 서랍에서 「동의서」를 고르면 뜬다. 운영 `/admin/consents/manual`

 * 추천(suggestCats)은 그 파일과 같은 규칙. 단계:

 *    (/api/consent/upload-image → DentWebFiles.TB_이미지 INSERT · 사용자 결정 2026-10-22).
 *    권한 열리기 전엔 서버가 정직하게 보류(로컬 기록은 성공). 설계: 22_동의서작성_상세패널.
 * 🔴 카카오톡 전송은 **버튼만**(실제 전송 추후).
 * ════════════════════════════════════════════════════════════════════════ */
let CB_CAT = null;   // consent-catalog.json (최초 1회 fetch)
const CB = {         // 동의서 작성 상태(상세패널·뷰어와 독립)

  name: '', phone: '', chart: '',
  plans: null, records: [], plansMsg: '', planId: null,
  teeth: new Set(), scope: '', history: new Set(), historyText: '', cost: '', costChips: new Set(),
  cats: [], suggested: [], bundles: {},   // bundles[catKey] = Set(bundleKey)
  sigData: null, saving: false,
};
/* consent-manual 과 같은 상수(포팅). */
const CB_SCOPE_CHIPS = [

const CB_COST_CHIPS = ['구두로 설명드렸습니다.', '추가 비용 발생 가능', '필요시 지혈제 4만원', '임시치아 별도', '재진료/재제작 비용', '할인이 적용된 금액입니다.'];

const CB_LOWER = [48, 47, 46, 45, 44, 43, 42, 41], CB_LOWER_L = [31, 32, 33, 34, 35, 36, 37, 38];
const CB_CAT_KEYWORDS = [

  ['ortho', ['교정', 'ortho', '브라켓', '투명교정']],

function cbSuggest(text) {
  const t = String(text || '').toLowerCase();
  return CB_CAT_KEYWORDS.filter(([, kws]) => kws.some(k => t.includes(k.toLowerCase()))).map(([k]) => k);

const cbCatLabel = k => ((CB_CAT && CB_CAT.categories || []).find(c => c.key === k) || {}).label || k;

/** 상세패널 문서 서랍의 「동의서」에서 호출 — 오버레이를 연다(환자 자동 채움). */
async function openConsentBuilder(pid) {
  /* 🔴 환자 자동 채움 — 여러 출처를 **우선순위로** 본다(패널 머리와 같은 규칙):
     보드 행(DETAIL_ROW) → offMapViewOf(검색·내원 전 포함) → 상세 캐시. 이름·차트는 보드 행이
     가장 믿을 만하고(패널 `.nm` 도 그걸 쓴다), 전화는 상세에만 있을 수 있다. */
  const det = DETAIL_CACHE.get(String(pid)) || {};
  const dp = det.patient || det;
  const row = DETAIL_ROW[String(pid)] || (offMapViewOf(pid) || {}).r || {};
  const pick = (...vs) => { for (const v of vs) { if (v != null && String(v).trim()) return String(v).trim(); } return ''; };
  Object.assign(CB, {
    open: true, step: 0, pid: String(pid),
    name: pick(row.name, dp.name, det.name, det.patientName),
    phone: pick(row.phone, dp.phone, det.phone),
    chart: pick(row.chartNumber, row.chartNo, dp.chartNumber, dp.chartNo, det.chartNumber),
    plans: null, records: [], plansMsg: '', planId: null,
    teeth: new Set(), scope: '', history: new Set(), historyText: '', cost: '', costChips: new Set(),
    cats: [], suggested: [], bundles: {}, sigData: null, saving: false,
  });
  cbEnsureOverlay();
  cbRender();
  /* 카탈로그 — 최초 1회 */
  if (!CB_CAT) {
    try { CB_CAT = await fetch('/view-v1/data/consent-catalog.json').then(r => r.json()); }
    catch (e) { CB_CAT = { categories: [], surgerySteps: [] }; }
    cbRender();
  }
  /* 치료계획 — 자동으로 받아 둔다(STEP 1 에서 고른다) */
  cbLoadPlans(pid);
}
function cbEnsureOverlay() {
  let o = document.getElementById('cb-overlay');
  if (!o) {
    o = document.createElement('div'); o.id = 'cb-overlay';
    document.body.appendChild(o);
    o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-cbx]')) cbClose(); });
  }
  requestAnimationFrame(() => o.classList.add('on'));
}
function cbClose() { const o = document.getElementById('cb-overlay'); if (o) { o.classList.remove('on'); setTimeout(() => { if (o && !o.classList.contains('on')) o.remove(); }, 180); } CB.open = false; }
if (!window.__cbEsc) { window.__cbEsc = 1; document.addEventListener('keydown', e => { if (e.key === 'Escape' && CB.open) cbClose(); }); }

async function cbLoadPlans(pid) {
  try {
    const j = await fetch(api('/api-v1/patients/' + encodeURIComponent(pid) + '/treatment-plans'),
      { headers: { accept: 'application/json' } }).then(r => r.json());
    /* 🔴 응답 키는 **`plans`** 다(consent-manual.html:490 과 같다) — `data`/`items` 로 읽으면
       치료계획이 있는데도 「없음」으로 떴다(실측 김준석 #8383: #23 레진 교합면 1건). */
    CB.plans = (j && j.plans) || [];
    /* 🔴 진료입력(TB_진료내역)도 받는다 — 오늘 넣은 진료는 치료계획이 아니라 진료입력이라
       치료계획 목록엔 안 잡힌다(사용자 지시 2026-10-23). 진료 선택에서 같이 고르게 한다. */
    CB.records = (j && j.records) || [];
    /* 🔴 연락처는 치료계획 응답의 `patient.phone` 에 있다 — 상세패널에 없던 전화를 채운다. */
    if (j && j.patient && j.patient.phone && !CB.phone) CB.phone = j.patient.phone;
    if (j && j.patient) {
      if (!CB.name && j.patient.name) CB.name = j.patient.name;
      if (!CB.chart && j.patient.chartNumber) CB.chart = j.patient.chartNumber;
    }
    CB.plansMsg = (j && j.ok === false) ? (j.error || '치료계획을 불러오지 못했습니다') : '';
  } catch (e) { CB.plans = []; CB.plansMsg = '덴트웹에 닿지 못했습니다'; }
  if (CB.open && CB.step === 0) cbRender();
}

/* ── STEP 미리보기 합치기(consent-manual buildDoc 포팅) ── */
function cbBuildDoc() {
  const steps = (CB_CAT && CB_CAT.surgerySteps) || [];
  const merged = {};
  steps.forEach(s => { merged[s.key] = []; });
  CB.cats.forEach(k => {
    const c = (CB_CAT.categories || []).find(x => x.key === k); if (!c) return;
    const all = new Map();
    Object.values(c.steps).forEach(st => [...(st.standard || []), ...(st.additional || [])].forEach(card => { if (card && card.id && !all.has(card.id)) all.set(card.id, card); }));
    const extraIds = [];
    (CB.bundles[k] ? Array.from(CB.bundles[k]) : []).forEach(bk => { const b = c.bundles.find(x => x.key === bk); if (b) extraIds.push(...(b.presetAdditionalCardIds || [])); });
    steps.forEach(s => {
      const base = (c.steps[s.key] && c.steps[s.key].standard) || [];
      const extra = s.key === 'step2' ? Array.from(new Set(extraIds)).map(id => all.get(id)).filter(Boolean) : [];
      [...base, ...extra].forEach(card => {
        const sig = String(card.title || '').trim() + '||' + String(card.body || '').trim();
        const hit = merged[s.key].find(m => m.__sig === sig);
        if (hit) { if (!hit.__cats.includes(c.label)) hit.__cats.push(c.label); return; }
        merged[s.key].push(Object.assign({}, card, { __sig: sig, __cats: [c.label] }));
      });
    });
  });
  return { steps, merged };
}
function cbTeethLine() { const t = Array.from(CB.teeth).sort((a, b) => a - b); return t.length ? '#' + t.join(', #') : '—'; }
function cbPlanName() {
  if (CB.planId === 'manual') return '직접 입력';
  if (String(CB.planId).indexOf('rec:') === 0) { const r = (CB.records || [])[+String(CB.planId).slice(4)]; return r ? (r.name || '진료입력') : ''; }
  const p = (CB.plans || []).find(x => x.planId === CB.planId); return p ? (p.name || '치료계획') : '';
}
function cbCanNext(step) {
  if (step === 0) return !!(CB.name.trim() && CB.phone.trim() && CB.scope.trim());
  if (step === 1) return CB.cats.length > 0;
  return true;
}

/* ── 렌더 ── */
function cbRender() {
  const o = document.getElementById('cb-overlay'); if (!o) return;
  const STEPS = ['환자정보 · 치료요약', '치료 카테고리', '내용 생성', '서명 받기'];
  const nav = STEPS.map((s, i) => '<span class="cb-st' + (i === CB.step ? ' on' : (i < CB.step ? ' done' : '')) + '">' + (i + 1) + '. ' + esc(s) + '</span>').join('');
  /* 🔴 **단계별 머리글**(stephd — consent-manual 과 동일 디자인): 제목 + STEP N / 4. */
  const stepHd = (t) => '<div class="cb-stephd"><div class="cb-t">' + esc(t) + '</div><div class="cb-n">STEP ' + (CB.step + 1) + ' / 4</div></div>';
  let body;
  if (!CB_CAT) body = '<div class="cb-msg">동의서 카탈로그 불러오는 중…</div>';
  else if (CB.step === 0) body = stepHd('환자 정보 · 치료 요약') + cbStep1HTML();
  else if (CB.step === 1) body = stepHd('치료 카테고리 선택') + cbStep2HTML();
  else if (CB.step === 2) body = stepHd('동의서 내용 확인 및 생성') + cbStep3HTML();
  else body = stepHd('서명 받기') + cbStep4HTML();
  /* 🔴 **푸터 — 운영 서비스와 같은 배치**(사용자 지시 2026-10-23): 왼쪽 [이전], 가운데 진행
     표시 + 안내, 오른쪽 주 버튼([다음]/[서명 받기]/[등록]). 44px 둥근 버튼. */
  const why = CB.step === 0 && !cbCanNext(0) ? '환자명 · 연락처 · 치료 범위를 채우면 다음으로 갑니다.'
    : CB.step === 1 && !cbCanNext(1) ? '카테고리를 하나 이상 고르세요.'
    : CB.step === 3 && !CB.sigData ? '환자 서명을 받으면 등록할 수 있어요.' : '';
  const prevBtn = '<button class="cb-btn" data-cbprev' + (CB.step === 0 ? ' disabled' : '') + '>이전</button>';
  let rightBtn;
  if (CB.step < 2) rightBtn = '<button class="cb-btn pri" data-cbnext' + (cbCanNext(CB.step) ? '' : ' disabled') + '>다음</button>';
  else if (CB.step === 2) rightBtn = '<button class="cb-btn pri" data-cbsign>서명 받기</button>';
  else {
    const ok = !!CB.sigData && !CB.saving;
    rightBtn = '<button class="cb-btn" disabled title="카카오톡 전송은 준비 중입니다">카카오톡 전송 (준비 중)</button>'
      + '<button class="cb-btn pri" data-cbsave' + (ok ? '' : ' disabled') + '>' + (CB.saving ? '등록 중…' : '등록') + '</button>';
  }
  const foot = prevBtn
    + '<span class="cb-pg">' + (CB.step + 1) + ' / 4' + (why ? ' · <span class="cb-why">' + esc(why) + '</span>' : '') + '</span>'
    + '<span class="cb-rbtns">' + rightBtn + '</span>';
  o.innerHTML = '<div class="cb-back"></div><div class="cb-card">'
    + '<div class="cb-head"><h2>동의서 작성' + (CB.name ? ' · ' + esc(CB.name) : '') + '</h2>'
    + '<div class="cb-nav">' + nav + '</div>'
    + '<button class="cb-x" data-cbx aria-label="닫기">✕</button></div>'
    + '<div class="cb-body" id="cb-body">' + body + '</div>'
    + '<div class="cb-foot">' + foot + '</div></div>';
  cbBind();
}
/* ── STEP 1 (consent-manual step1HTML 포팅 — 환자 검색 제거, 자동 채움) ── */
function cbStep1HTML() {
  const toothBtns = arr => '<div class="cb-tq">' + arr.map(t => '<button type="button" class="cb-th' + (CB.teeth.has(t) ? ' on' : '') + '" data-cbt="' + t + '">' + t + '</button>').join('') + '</div>';
  let plans = '';
  if (CB.plans == null) plans = '<div class="cb-msg">' + esc(CB.plansMsg || '치료계획 불러오는 중…') + '</div>';
  else {
    const items = CB.plans.map(p => {
      const its = (p.items || []).map(i => esc(i.name || '?') + ((i.teeth || []).length ? ' #' + i.teeth.join(',') : '')).join(' · ');
      const sug = cbSuggest([p.name].concat((p.items || []).map(i => i.name)).join(' '));
      /* 🔴 planId 비교는 String() 으로 — p.planId 는 숫자(3846), CB.planId 는 라디오 value 라
         문자열('3846')이다. ===(엄격) 로 비교하면 재렌더 때 checked 가 꺼져 「선택이 안 된
         것처럼」 보였다(사용자 보고 2026-10-23). 진료입력(rec:N)은 양쪽 문자열이라 멀쩡했다. */
      const on = String(CB.planId) === String(p.planId);
      return '<label class="cb-plan' + (on ? ' on' : '') + '"><input type="radio" name="cbplan" value="' + esc(p.planId) + '"' + (on ? ' checked' : '') + '>'
        + '<div><div class="cb-pt">' + esc(p.name || '치료계획') + '<span class="cb-tag' + (p.status === 3 ? ' g' : p.status === 2 ? ' b' : '') + '">' + esc(p.statusLabel || '') + '</span></div>'
        + '<div class="cb-pm">' + esc(String(p.writtenAt || '').slice(0, 10)) + ' · ' + won(p.actualAmount) + (sug.length ? ' · 추천: ' + esc(sug.map(cbCatLabel).join(', ')) : '') + '</div>'
        + (its ? '<div class="cb-pi">' + its + '</div>' : '') + '</div></label>';

/* ── 바인딩 ── */
function cbBind() {
  const o = document.getElementById('cb-overlay'); if (!o) return;
  const g = fn => e => { e.preventDefault(); e.stopPropagation(); fn(e); };
  const $$ = s => o.querySelectorAll(s);
  // 공통 네비
  const nx = o.querySelector('[data-cbnext]'); if (nx) nx.addEventListener('click', g(() => { if (cbCanNext(CB.step)) { cbReadStep1(); CB.step++; cbRender(); o.querySelector('.cb-body').scrollTop = 0; } }));
  const pv = o.querySelector('[data-cbprev]'); if (pv) pv.addEventListener('click', g(() => { CB.step--; cbRender(); }));
  const sg = o.querySelector('[data-cbsign]'); if (sg) sg.addEventListener('click', g(() => { CB.step = 3; CB.sigData = null; cbRender(); }));
  const sv = o.querySelector('[data-cbsave]'); if (sv) sv.addEventListener('click', g(() => cbSave()));
  // STEP 1 입력
  const bindInput = (id, key) => { const el = o.querySelector('#' + id); if (el) el.addEventListener('input', () => { CB[key] = el.value; const n = o.querySelector('[data-cbnext]'); if (n) n.disabled = !cbCanNext(CB.step); }); };
  bindInput('cbName', 'name'); bindInput('cbPhone', 'phone'); bindInput('cbChart', 'chart'); bindInput('cbScope', 'scope'); bindInput('cbHist', 'historyText'); bindInput('cbCost', 'cost');
  $$('[data-cbt]').forEach(b => b.addEventListener('click', g(() => { const t = +b.dataset.cbt; CB.teeth.has(t) ? CB.teeth.delete(t) : CB.teeth.add(t); cbRender(); })));
  $$('[data-cball]').forEach(b => b.addEventListener('click', g(() => {
    const v = b.dataset.cball;
    if (v === 'none') CB.teeth.clear();
    else if (v === 'all') CB.teeth = new Set([...CB_UPPER, ...CB_UPPER_L, ...CB_LOWER, ...CB_LOWER_L]);
    else if (v === 'up') [...CB_UPPER, ...CB_UPPER_L].forEach(t => CB.teeth.add(t));
    else if (v === 'low') [...CB_LOWER, ...CB_LOWER_L].forEach(t => CB.teeth.add(t));
    cbRender();
  })));
  $$('[data-cbscope]').forEach(b => b.addEventListener('click', g(() => { cbReadStep1(); CB.scope = (CB.scope ? CB.scope + '\n' : '') + b.dataset.cbscope; cbRender(); })));
  $$('[data-cbhist]').forEach(b => b.addEventListener('click', g(() => { cbReadStep1(); const v = b.dataset.cbhist; CB.history.has(v) ? CB.history.delete(v) : CB.history.add(v); cbRender(); })));
  $$('[data-cbcost]').forEach(b => b.addEventListener('click', g(() => { cbReadStep1(); const v = b.dataset.cbcost; CB.costChips.has(v) ? CB.costChips.delete(v) : CB.costChips.add(v); cbRender(); })));
  $$('input[name="cbplan"]').forEach(r => r.addEventListener('change', () => { cbPickPlan(r.value); }));
  // STEP 2 카테고리/번들
  $$('[data-cbcat]').forEach(b => b.addEventListener('click', g(() => { const k = b.dataset.cbcat; const i = CB.cats.indexOf(k); if (i >= 0) { CB.cats.splice(i, 1); delete CB.bundles[k]; } else CB.cats.push(k); cbRender(); })));
  $$('[data-cbbnd]').forEach(b => b.addEventListener('click', g(() => { const k = b.dataset.cbbcat, bk = b.dataset.cbbnd; CB.bundles[k] = CB.bundles[k] || new Set(); CB.bundles[k].has(bk) ? CB.bundles[k].delete(bk) : CB.bundles[k].add(bk); cbRender(); })));
  // STEP 4 서명 캔버스
  const cv = o.querySelector('#cbSig'); if (cv) cbBindSignature(cv);
  const sc = o.querySelector('[data-cbsigclear]'); if (sc) sc.addEventListener('click', g(() => { CB.sigData = null; cbRender(); }));
}
/* STEP1 입력칸 값을 상태에 거둬들인다(재렌더 전에 안 사라지게). */
function cbReadStep1() {
  const o = document.getElementById('cb-overlay'); if (!o) return;
  const v = id => { const el = o.querySelector('#' + id); return el ? el.value : null; };
  const n = v('cbName'); if (n != null) CB.name = n;
  const p = v('cbPhone'); if (p != null) CB.phone = p;
  const c = v('cbChart'); if (c != null) CB.chart = c;
  const s = v('cbScope'); if (s != null) CB.scope = s;
  const h = v('cbHist'); if (h != null) CB.historyText = h;
  const co = v('cbCost'); if (co != null) CB.cost = co;
}
function cbPickPlan(planId) {
  cbReadStep1();
  CB.planId = planId;
  /* 🔴 진료 선택은 「이걸 기준으로 다시 채운다」는 뜻이다 — 치아·범위·비용·추천을 **덮어쓴다**
     (consent-manual pickPlan 과 같은 규칙). 예전엔 CB.teeth.add() 로 **누적**하고 scope·cost 는
     `if(!…)` 로 **비었을 때만** 채워서, 진료입력을 골랐다가 다른 걸 고르면 앞의 치아·범위가
     그대로 남았다(사용자 보고 2026-10-23). 매번 새로 세팅한다. */
  CB.teeth = new Set();
  CB.scope = '';
  CB.cost = '';
  CB.suggested = [];
  if (String(planId).indexOf('rec:') === 0) {
    /* 진료입력(TB_진료내역) — 치아는 비트맵에서 푼 것, 범위·추천은 진료명으로. 비용은 없다. */
    const r = (CB.records || [])[+String(planId).slice(4)];
    if (r) {
      (r.teeth || []).forEach(t => CB.teeth.add(+t));
      const names = [r.name, r.diagnosisCode].filter(Boolean).join(', ');
      if (names) CB.scope = '치료대상: ' + cbTeethLine() + '\n' + names;
      CB.suggested = cbSuggest(names);
    }
  } else if (planId !== 'manual') {
    const p = (CB.plans || []).find(x => String(x.planId) === String(planId));
    if (p) {
      (p.items || []).forEach(i => (i.teeth || []).forEach(t => CB.teeth.add(+t)));
      const names = [p.name].concat((p.items || []).map(i => i.name)).filter(Boolean).join(', ');
      if (names) CB.scope = '치료대상: ' + cbTeethLine() + '\n' + names;
      if (p.actualAmount) CB.cost = '치료 비용: ' + won(p.actualAmount);
      CB.suggested = cbSuggest(names);
    }
  }
  /* 'manual' 이면 위 셋은 빈 채로 둔다 — 직접 입력하라는 뜻. */
  cbRender();
}
/* 서명 캔버스 — pointer 로 그린다. 끝나면 CB.sigData = dataURL. */
function cbBindSignature(cv) {
  const ctx = cv.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b2733';
  if (CB.sigData) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = CB.sigData; }
  let drawing = false, dirty = false;
  const pos = e => { const r = cv.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top; return { x: x * cv.width / r.width, y: y * cv.height / r.height }; };
  const down = e => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); dirty = true; };
  const up = () => { if (!drawing) return; drawing = false; if (dirty) { CB.sigData = cv.toDataURL('image/png'); const sv = document.querySelector('#cb-overlay [data-cbsave]'); if (sv) { sv.disabled = false; sv.removeAttribute('title'); } const hint = document.querySelector('#cb-overlay .cb-sighint'); if (hint) hint.textContent = '✅ 서명 완료'; } };
  cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move); window.addEventListener('pointerup', up, { once: false });
}
/* ── 등록 — 로컬 기록 + 덴트웹 이미지 ── */

       유지**(보조). 성공/보류를 정직하게 토스트. 설계: 22_동의서작성_상세패널. */
    let imgMsg = '';

      const j = await fetch(api('/api/consent/upload-image'), {

      }).then(r => r.json());
      imgMsg = j && j.ok ? (j.uploaded ? ' · 덴트웹 이미지 저장됨' : (j.dryRun ? ' · 덴트웹 이미지(드라이런)' : ''))
        : ' · 덴트웹 이미지 보류(' + ((j && (j.error || j.message)) || '미지원') + ')';

}

/* ───────────────────────────────────────────────────────────────────────────
 * 🔴 공식 양식 PDF 위에 데이터 얹기 (사용자 결정 2026-10-28)
 *   13개 보험사 공식 청구양식 PDF 를 받아 web/view-v1/data/insurer-forms/*.pdf 에 뒀다.
 *   pdf.js 로 그 PDF 를 canvas 에 렌더해 **배경**으로 깔고, 그 위에 환자 진료데이터를
 *   좌표로 얹는다. 로고·색·표가 전부 진짜 공식 양식이라 mediqr 보다 정확하고 최신판이다.
 * ─────────────────────────────────────────────────────────────────────────── */
let IB_PDFJS = null;   // pdf.js 로드 1회
function ibLoadPdfjs() {
  if (IB_PDFJS) return IB_PDFJS;
  IB_PDFJS = new Promise((res, rej) => {
    if (window.pdfjsLib) { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return res(window.pdfjsLib); }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = rej; document.head.appendChild(s);
  });
  return IB_PDFJS;
}
/* 🔴 QR 생성 — 키오스크와 같은 자립형 생성기(qr-mini.js, QRMini)를 쓴다. 외부 CDN
 *    의존이 없어 인쇄 창·오프라인에서도 동일하게 그려진다(pdf.js 처럼 CDN 을 타면
 *    인쇄 시점에 못 받아 빈 칸이 된다). 로드 1회. */
let IB_QRMINI = null;
function ibLoadQrMini() {
  if (IB_QRMINI) return IB_QRMINI;
  IB_QRMINI = new Promise((res) => {
    if (window.QRMini) return res(window.QRMini);
    const s = document.createElement('script');
    s.src = '/view-v1/pages/qr-mini.js';
    s.onload = () => res(window.QRMini || null);
    s.onerror = () => res(null);   // 못 받아도 양식은 뜬다(QR 칸만 빈다)
    document.head.appendChild(s);
  });
  return IB_QRMINI;
}
/* 라이나 등 HTML 양식의 .linaf-qr 빈 칸에 실제 QR(SVG)을 그린다. data = QR 에 담을 문자열. */
function ibFillQr(root) {
  const boxes = [...(root || document).querySelectorAll('.linaf-qr[data-qr]')].filter(b => !b._qrdone);
  if (!boxes.length) return;
  ibLoadQrMini().then(QR => {
    if (!QR) return;   // 라이브러리 없으면 그대로 둔다
    boxes.forEach(b => {
      b._qrdone = 1;
      try {
        const mods = QR.encode(b.dataset.qr);
        if (mods) b.innerHTML = QR.svg(mods, 52);   // .linaf-qr 는 52px
      } catch (e) {}
    });
  });
}
const IB_LINA_CLAIM_URL = 'https://www.lina.co.kr';   // 라이나생명 공식(양식 색띠에 인쇄된 주소)
const IB_PDF_CACHE = {};   // formKey → [{png(url/dataURL), pw, ph}] per page
let IB_PNG_MANIFEST = undefined;   // png/manifest.json 1회 로드. {} = 없음
/* 🔴 공식 양식 배경은 빌드 타임에 poppler 로 떠 둔 PNG 를 쓴다(scripts/insurer-forms-to-png.mjs).
 *    pdf.js 는 일부 공식 PDF(삼성화재 등)의 커스텀 폰트를 렌더하지 못해 글자가 통째로
 *    빠졌다(실측 2026-10-29). PNG 가 있으면 pdf.js 를 건너뛰어 모든 환경에서 동일하게 나온다.
 *    PNG manifest 에 없는 키만 pdf.js 로 폴백한다. */
async function ibLoadPngManifest() {
  if (IB_PNG_MANIFEST !== undefined) return IB_PNG_MANIFEST;
  try {
    const r = await fetch(api('/view-v1/data/insurer-forms/png/manifest.json'), { credentials: 'include' });
    IB_PNG_MANIFEST = r.ok ? await r.json() : {};
  } catch (e) { IB_PNG_MANIFEST = {}; }
  return IB_PNG_MANIFEST;
}
/* 공식 양식의 각 페이지를 {png, pw, ph} 로 캐시. (formKey=파일명 without .pdf) */
async function ibRenderPdfBg(formKey, scale) {
  if (IB_PDF_CACHE[formKey]) return IB_PDF_CACHE[formKey];
  /* ① 내장 PNG 우선 — pdf.js 폰트 문제를 피한다. */
  const man = await ibLoadPngManifest();
  const meta = man && man[formKey];
  if (meta && meta.pages > 0) {
    const pages = [];
    for (let i = 0; i < meta.pages; i++) {
      pages.push({ png: api('/view-v1/data/insurer-forms/png/' + formKey + '-' + i + '.png'), pw: meta.pw, ph: meta.ph });
    }
    IB_PDF_CACHE[formKey] = pages;
    return pages;
  }
  /* ② 폴백 — PNG 가 없으면 pdf.js 로 렌더(텍스트가 정상 렌더되는 양식용). */
  const lib = await ibLoadPdfjs();
  const url = api('/view-v1/data/insurer-forms/' + formKey + '.pdf');
  const buf = await fetch(url, { credentials: 'include' }).then(r => r.arrayBuffer());
  const pdf = await lib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: scale || 2 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const pt = page.getViewport({ scale: 1 });   // 포인트 치수(좌표 기준)
    pages.push({ png: c.toDataURL('image/png'), pw: Math.round(pt.width), ph: Math.round(pt.height) });
  }
  IB_PDF_CACHE[formKey] = pages;
  return pages;
}
/* 공식 PDF 배경 + 데이터 오버레이 HTML. 배경은 비동기라 placeholder 로 두고 ibFillPdfBg 가 채운다.
 * spec = { formKey, pw, ph, page(기본0), placements:[[x,y,key,val,kind]] }  (x,y=PDF 포인트). */
function ibPdfForm(spec, g, edit) {
  const PW = spec.pw, PH = spec.ph, pageIdx = spec.page || 0;
  const ymd = s => { const t = String(s || '').replace(/-/g, ''); return t.length >= 8 ? t.slice(0, 4) + '. ' + t.slice(4, 6) + '. ' + t.slice(6, 8) : (s || ''); };
  const data = (spec.placements || []).map(([x, y, key, val, kind]) => {
    let v = (key in IB.edit) ? IB.edit[key] : (val == null ? '' : String(val));
    if (kind === 'ymd' && v) v = ymd(v);
    if (kind === 'ck') return '<span class="ibpdf-ck" style="left:' + x + 'px;top:' + y + 'px">' + (v ? '✔' : '') + '</span>';
    return edit
      ? '<span class="ibpdf-f" contenteditable data-ibed="' + esc(key) + '" style="left:' + x + 'px;top:' + y + 'px">' + esc(v) + '</span>'
      : '<span class="ibpdf-f" style="left:' + x + 'px;top:' + y + 'px">' + esc(v) + '</span>';
  }).join('');
  const seal = (spec.stamp && IB.stampPng) ? '<img class="ibpdf-seal" src="' + esc(IB.stampPng) + '" data-stamp-raw="1" style="left:' + spec.stamp[0] + 'px;top:' + spec.stamp[1] + 'px">' : '';
  const scale = edit ? (500 / PW) : 1;
  /* 캐시에 배경 PNG 가 이미 있으면 바로 박는다(인쇄 창은 ibFillPdfBg 를 못 돌리므로 필수). */
  const cached = (IB_PDF_CACHE[spec.formKey] || [])[pageIdx];
  const bgSrc = cached ? ' src="' + cached.png + '"' : '';
  return '<div class="ibpdf" data-ibpdf="' + esc(spec.formKey) + '" data-ibpdf-page="' + pageIdx + '" data-pw="' + PW + '" data-ph="' + PH + '"'
    + ' style="width:' + PW + 'px;height:' + PH + 'px;transform:scale(' + scale + ')">'
    + '<img class="ibpdf-bg" alt=""' + bgSrc + ' style="width:' + PW + 'px;height:' + PH + 'px">' + data + seal + '</div>';
}
/* 오버레이가 그려진 뒤 — 공식 PDF 배경을 비동기로 채운다(+직인 배경 제거). */
function ibFillPdfBg(root) {
  (root || document).querySelectorAll('.ibpdf[data-ibpdf]').forEach(el => {
    if (el._bgdone) return; el._bgdone = 1;
    const key = el.dataset.ibpdf, pg = +el.dataset.ibpdfPage;
    ibRenderPdfBg(key, 2).then(pages => {
      const img = el.querySelector('.ibpdf-bg'); if (img && pages[pg]) img.src = pages[pg].png;
      el.querySelectorAll('img.ibpdf-seal[data-stamp-raw]').forEach(im => {
        if (im.complete && im.naturalWidth) { try { destampBg(im); } catch (e) {} }
        else im.addEventListener('load', () => { try { destampBg(im); } catch (e) {} }, { once: true });
      });
    }).catch(() => {});
  });
}

function ibEnsureOverlay() {
  let o = document.getElementById('ib-overlay');
  if (!o) {
    o = document.createElement('div'); o.id = 'ib-overlay';
    document.body.appendChild(o);
    o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-ibx]')) ibClose(); });
  }
  requestAnimationFrame(() => o.classList.add('on'));
}
function ibClose() { const o = document.getElementById('ib-overlay'); if (o) { o.classList.remove('on'); setTimeout(() => { if (o && !o.classList.contains('on')) o.remove(); }, 180); } IB.open = false; }
if (!window.__ibEsc) { window.__ibEsc = 1; document.addEventListener('keydown', e => { if (e.key === 'Escape' && IB.open) ibClose(); }); }

/* STEP2 로 넘어갈 때 덴트웹 데이터를 당겨 둔다(고른 문서에 따라 필요한 것만). */
async function ibLoadData() {
  if (IB.loading) return;
  IB.loading = true; ibRender();
  const pid = IB.pid;
  const from = dashYmd(IB.from), to = dashYmd(IB.to);
  const get = u => fetch(api(u), { headers: { accept: 'application/json' } }).then(r => r.json()).catch(() => null);
  try {
    /* 진료기록부 또는 **전용 양식이 있는 보험사** — 진료내역(records)이 필요하다
       (전용 양식은 records 를 공통분류로 매핑해 칸을 채운다). treatment-plans 응답이 records[] 를 같이 준다. */
    const needRecords = IB.kinds.includes('medrec') || [...IB.carriers].some(k => ibFormFor(k));
    if (needRecords) {
      const j = await get('/api-v1/patients/' + encodeURIComponent(pid) + '/treatment-plans');
      IB.records = (j && j.records) || [];
    }
    /* 영수증 */
    if (IB.kinds.includes('receipt')) {
      const j = await get('/api-v1/patient/' + encodeURIComponent(pid) + '/documents?doc=receipt&from=' + from + '&to=' + to);
      const d = j && j.data;
      IB.receipts = (d && d.data && d.data.receipts) || [];
      if (d) { IB.issuer = IB.issuer || d.issuer; IB.stampPng = IB.stampPng || d.stampPng; }
    }
    /* 내원·통원 진료확인서 */
    if (IB.kinds.includes('visit')) {
      const j = await get('/api-v1/patient/' + encodeURIComponent(pid) + '/documents?doc=visit_confirm&from=' + from + '&to=' + to);
      const d = j && j.data;
      IB.visits = (d && d.data && d.data.visits) || [];
      IB.visitCount = (d && d.data && d.data.visitCount) || IB.visits.length;
      if (d) { IB.issuer = IB.issuer || d.issuer; IB.stampPng = IB.stampPng || d.stampPng; }
    }
    /* 발급기관·도장은 아무 문서나 한 번 받아 둔다(머리에 쓴다). */
    if (!IB.issuer) {
      const j = await get('/api-v1/patient/' + encodeURIComponent(pid) + '/documents?doc=visit_confirm&from=' + from + '&to=' + to);
      const d = j && j.data; if (d) { IB.issuer = d.issuer; IB.stampPng = d.stampPng; }
    }
  } catch (e) { /* 아래에서 빈 상태로 그린다 */ }
  ibClassifyAll();
  IB.loading = false; IB.loaded = true; ibRender();
}

function ibCanNext(step) {

       (전용 양식 자체가 문서다). */

/* ───────────────────────────────────────────────────────────────────────────

const IB_TXCLASS = [

  ['pulp', '치수(신경)치료', ['치수', '신경', '근관', 'endo', 'pulp', 'rct', '근관치료']],

/* 진료명·상병을 소문자로 보고 가장 먼저 걸리는 공통 분류를 돌려준다(없으면 null). */
function ibClassify(rec) {

  for (const [key, , kws] of IB_TXCLASS) { if (kws.some(k => t.includes(k.toLowerCase()))) return key; }

/* 보험사 브랜드 색(헤더띠) — 대표색 근사치. pfx = label 의 한/영 글자. */
const IB_BRAND = {
  _def: '#2a4d7a',
  '현대해상': '#00857c', 'AIA생명': '#b01e24', '삼성생명': '#1428a0', 'AXA손해보험': '#00008f',

};
/* 보험사 양식 대부분이 공통 꼴(머리 + 결손부위? + 치료내용 구분표)이라, 선언형 spec 으로 만든다.
 * 🔴 **구분 이름·칸은 실측 양식을 그대로** 쓴다(지어내지 않음). 진료는 공통분류로 매핑해 각 구분행에. */
function ibGenericSpec(label, title, opt) {
  opt = opt || {};
  return {
    label, title,
    build(g, edit, H) {
      const C = (k, v) => ibCell(edit, k, v);
      const pfx = (label.replace(/[^a-zA-Z가-힣]/g, '').slice(0, 4)) || 'gf';
      const cols = opt.cols || ['구분', '질병분류코드', '치아번호', '치료일(장착일)'];
      const noCode = !!opt.noCode;
      /* 각 그룹 → 그 분류의 진료를 행으로(없으면 빈 1행). */
      let bodyRows = '';
      (opt.groups || []).forEach((grp, gi) => {
        const [glabel, keys] = grp;
        const items = ibByClass(...keys);
        (items.length ? items : [null]).slice(0, 4).forEach((c, i) => {
          const base = pfx + '.g' + gi + '.' + i;
          let tds = '<td>' + (i === 0 ? esc(glabel) : '') + '</td>';
          if (!noCode || cols.length === 4) tds += '<td>' + C(base + '.code', c ? c.dx : '') + '</td>';
          tds += '<td>' + C(base + '.teeth', c ? c.teeth : '') + '</td>';
          // 남은 칸(진단일/원인/치료 등)은 cols 수에 맞춰 날짜 1칸만 자동, 나머지 편집칸.
          const remain = cols.length - (noCode && cols.length !== 4 ? 2 : 3);
          for (let x = 0; x < remain; x++) tds += '<td>' + C(base + '.x' + x, x === remain - 1 && c ? c.date : '') + '</td>';
          bodyRows += '<tr>' + tds + '</tr>';
        });
      });
      const extraHead = (opt.extraHead || []).map(([l, k]) =>
        '<tr><td class="l">' + esc(l) + '</td><td colspan="5">' + C(pfx + '.' + k, '') + '</td></tr>').join('');
      /* 🔴 고품질 틀(ibf2) — 보험사 브랜드 색 헤더띠 + ■ 섹션 마커 + 치아 그리드 + 범례.
         좌표 재현(lina·kb)만큼 바이트 동일은 아니나, mediqr 디자인에 가깝게 보인다. */
      const color = IB_BRAND[label] || IB_BRAND._def;
      return '<div class="ibf2">'
        + '<div class="ibf2-band" style="background:' + color + '"><span class="ibf2-logo">' + esc(label) + '</span><span class="ibf2-url">보험회사 제출용</span></div>'
        + '<div class="ibf2-bd">'
        + '<div class="ibf2-tt">' + esc(title) + '</div>'
        + '<table><tr><td class="l">환자명</td><td>' + C('h.name', H.name) + '</td>'
        + '<td class="l">주민번호</td><td>' + C('h.rrn', H.rrn) + '</td>'
        + '<td class="l">' + esc(opt.headLabel || '초진일') + '</td><td>' + C(pfx + '.first', '') + '</td></tr>' + extraHead + '</table>'
        + (opt.grid ? '<div class="ibf2-mk">■ 초진 당시 결손부위 · 치아상태</div>' + ibTeethGrid2() : '')
        + '<div class="ibf2-mk">■ 치료내용 (진료내역 자동 매핑 · 자유 편집)</div>'
        + '<table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + bodyRows + '</tbody></table>'
        + ibFormSign2(C, H)
        + '</div></div>';
    },
  };
}

function ibRender() {
  const o = document.getElementById('ib-overlay'); if (!o) return;
  const STEPS = ['문서·보험사 선택', '자동 채움 · 편집', '미리보기 · 인쇄'];
  const nav = STEPS.map((s, i) => '<span class="cb-st' + (i === IB.step ? ' on' : (i < IB.step ? ' done' : '')) + '">' + (i + 1) + '. ' + esc(s) + '</span>').join('');
  const stepHd = t => '<div class="cb-stephd"><div class="cb-t">' + esc(t) + '</div><div class="cb-n">STEP ' + (IB.step + 1) + ' / 3</div></div>';
  let body;
  if (IB.step === 0) body = stepHd('문서 종류 · 보험사 · 기간') + ibStep1HTML();
  else if (IB.step === 1) body = stepHd('진료내역 자동 채움 · 자유 편집') + ibStep2HTML();
  else body = stepHd('미리보기 · 인쇄') + ibStep3HTML();

  const why = IB.step === 0 && !ibCanNext(0) ? '보험문서 또는 전용 양식이 있는 보험사를 하나 이상 고르세요.' : '';
  const prevBtn = '<button class="cb-btn" data-ibprev' + (IB.step === 0 ? ' disabled' : '') + '>이전</button>';
  let rightBtn;
  if (IB.step === 0) rightBtn = '<button class="cb-btn pri" data-ibnext' + (ibCanNext(0) ? '' : ' disabled') + '>자동 채움</button>';
  else if (IB.step === 1) rightBtn = '<button class="cb-btn pri" data-ibnext>미리보기</button>';
  else rightBtn = '<button class="cb-btn" disabled title="이메일 전송·AI 자동작성은 준비 중입니다">이메일 전송 (준비 중)</button>'
    + '<button class="cb-btn pri" data-ibprint>A4 인쇄</button>';
  const foot = prevBtn
    + '<span class="cb-pg">' + (IB.step + 1) + ' / 3' + (why ? ' · <span class="cb-why">' + esc(why) + '</span>' : '') + '</span>'
    + '<span class="cb-rbtns">' + rightBtn + '</span>';

  o.innerHTML = '<div class="cb-back"></div><div class="cb-card">'
    + '<div class="cb-head"><h2>보험문서 작성' + (IB.name ? ' · ' + esc(IB.name) : '') + '</h2>'
    + '<div class="cb-nav">' + nav + '</div>'
    + '<button class="cb-x" data-ibx aria-label="닫기">✕</button></div>'
    + '<div class="cb-body" id="ib-body">' + body + '</div>'
    + '<div class="cb-foot">' + foot + '</div></div>';
  ibBind();
}

  return '<div class="cb-sec"><h4>환자</h4>'

    + '<div class="cb-fld"><label>환자명</label><input type="text" id="ibName" value="' + esc(IB.name) + '"></div>'
    + '<div class="cb-fld"><label>차트번호</label><input type="text" id="ibChart" value="' + esc(IB.chart) + '"></div>'
    + '<div class="cb-fld"><label>생년월일</label><input type="text" id="ibBirth" value="' + esc(IB.birth) + '"></div></div></div>'
    + '<div class="cb-sec"><h4>① 어떤 보험문서 <span style="font-weight:500;color:var(--dim);font-size:11.5px">(여러 개 선택 가능)</span></h4>'
    + '<div class="ib-kinds">' + kinds + '</div></div>'
    + '<div class="cb-sec"><h4>② 보험사</h4>'
    + '<div class="cb-hint">환자가 청구하는 보험사를 고릅니다(신청 양식 안내에 들어갑니다). 운영 목록 28곳.</div>'
    + carriers + '</div>'
    + '<div class="cb-sec"><h4>③ 진료 기간</h4>'
    + '<div class="cb-row">'
    + '<div class="cb-fld"><label>시작일</label><input type="date" id="ibFrom" value="' + esc(IB.from) + '"></div>'
    + '<div class="cb-fld"><label>종료일</label><input type="date" id="ibTo" value="' + esc(IB.to) + '"></div></div>'
    + '<div class="cb-chips" style="margin-top:8px">'
    + ['1개월:1', '3개월:3', '6개월:6', '1년:12'].map(x => { const [l, m] = x.split(':');
        return '<button type="button" class="cb-chip sm" data-ibmon="' + m + '">' + l + '</button>'; }).join('')
    + '</div></div>';
}

/* 자유 편집 값 보관 — 키는 `docId.field`(혹은 테이블 셀). edit 에 없으면 원본을 쓴다. */
function ibEd(key, orig, cls) {
  const v = (key in IB.edit) ? IB.edit[key] : (orig == null ? '' : String(orig));
  return '<span class="' + (cls || '') + '" contenteditable data-ibed="' + esc(key) + '">' + esc(v) + '</span>';
}

function ibStep2HTML() {
  if (IB.loading) return '<div class="cb-msg">덴트웹에서 진료내역을 불러오는 중…</div>';
  const iss = IB.issuer || {};
  const head = '<div class="cb-sec"><h4>발급 기관 · 환자 (문서 공통 머리 — 편집 가능)</h4>'
    + '<div class="ib-kv">'
    + '<label>기관명</label>' + ibEd('h.inst', iss.name, 'ib-ed')
    + '<label>대표자</label>' + ibEd('h.ceo', iss.ceoName, 'ib-ed')
    + '<label>주소</label>' + ibEd('h.addr', iss.address, 'ib-ed')
    + '<label>전화</label>' + ibEd('h.tel', iss.phone, 'ib-ed')
    + '<label>환자명</label>' + ibEd('h.name', IB.name, 'ib-ed')
    + '<label>차트번호</label>' + ibEd('h.chart', IB.chart, 'ib-ed')
    + '</div>'
    + (ibCarrierLabels().length ? '<div class="cb-hint" style="margin-top:8px">보험사: <b>' + esc(ibCarrierLabels().join(', ')) + '</b></div>' : '')
    + '</div>';

  /* 🔴 보험사 전용 양식 — 고른 보험사 중 **실측 양식이 있는 것**은 그 양식을 자동 채워 보여준다
     (사용자 지시 2026-10-28: 보험사별 문서가 다르다). 진료내역을 공통분류로 매핑해 각 양식 칸에 넣고,
     모든 칸은 자유 편집. 양식 없는 보험사는 아래 공통 문서로 떨어진다. */
  let forms = '';
  const withForm = [...IB.carriers].filter(k => ibFormFor(k));
  const noForm = [...IB.carriers].filter(k => !ibFormFor(k));
  for (const k of withForm) {
    forms += '<div class="cb-sec"><h4>' + esc(ibFormFor(k).label) + ' 전용 양식 — 자동 채움 · 자유 편집</h4>'
      + '<div class="cb-hint">진료내역을 이 보험사 양식 칸에 자동 배치했습니다. 각 칸을 눌러 수정하세요. 주민번호 등 우리에게 없는 값은 빈칸입니다.</div>'
      + ibBuildForm(k, true) + '</div>';
  }

  let secs = forms;
  /* 진료기록부 */
  if (IB.kinds.includes('medrec')) {
    const rows = IB.records.map((r, i) => '<tr>'
      + '<td>' + ibEd('mr.' + i + '.date', String(r.treatedAt || '').slice(0, 10)) + '</td>'
      + '<td>' + ibEd('mr.' + i + '.teeth', (r.teeth || []).length ? '#' + r.teeth.join(', #') : '') + '</td>'
      + '<td>' + ibEd('mr.' + i + '.name', r.name) + '</td>'
      + '<td>' + ibEd('mr.' + i + '.dx', r.diagnosisCode) + '</td>'
      + '<td>' + ibEd('mr.' + i + '.note', r.note) + '</td></tr>').join('');
    secs += '<div class="cb-sec"><h4>진료기록부 — 진료내역 (자유 편집)</h4>'
      + (IB.records.length ? '<table class="ib-t"><thead><tr><th>진료일</th><th>치식</th><th>진료명</th><th>상병코드</th><th>비고</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="ib-empty">이 기간에 진료내역이 없습니다 — 기간을 넓히거나 아래에서 직접 적으세요.</div>')
      + '</div>';
  }
  /* 진료비 영수증 */
  if (IB.kinds.includes('receipt')) {
    let inner;
    if (!IB.receipts.length) inner = '<div class="ib-empty">발급된 영수증이 없습니다(덴트웹 영수증발급내역 기준). 금액을 지어내지 않습니다 — 필요하면 아래에서 직접 적으세요.</div>';
    else {
      const rows = IB.receipts.map((r, i) => '<tr>'
        + '<td>' + ibEd('rc.' + i + '.date', String(r.issuedAt || '').slice(0, 10)) + '</td>'
        + '<td>' + ibEd('rc.' + i + '.total', r.total != null ? wonN(r.total) : '') + '</td>'
        + '<td>' + ibEd('rc.' + i + '.own', r.patientTotal != null ? wonN(r.patientTotal) : (r.ownTotal != null ? wonN(r.ownTotal) : '')) + '</td>'
        + '<td>' + ibEd('rc.' + i + '.paid', r.paid != null ? wonN(r.paid) : '') + '</td></tr>').join('');
      inner = '<table class="ib-t"><thead><tr><th>발급일</th><th>총액</th><th>본인부담</th><th>수납</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
    secs += '<div class="cb-sec"><h4>진료비 계산서·영수증 (자유 편집)</h4>' + inner + '</div>';
  }
  /* 내원·통원 진료확인서 */
  if (IB.kinds.includes('visit')) {
    const rows = IB.visits.map((v, i) => '<tr>'
      + '<td>' + ibEd('vd.' + i + '.date', v.date) + '</td>'
      + '<td>' + ibEd('vd.' + i + '.tx', (v.treatments || []).join(', ')) + '</td></tr>').join('');
    secs += '<div class="cb-sec"><h4>내원·통원 진료확인서 — 내원 ' + IB.visitCount + '일 (자유 편집)</h4>'
      + (IB.visits.length ? '<table class="ib-t"><thead><tr><th>내원일</th><th>진료 내용</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="ib-empty">이 기간에 내원 기록이 없습니다.</div>')
      + '</div>';
  }
  /* 세부산정 내역서 — 빈 표(직접 작성) */
  if (IB.kinds.includes('itemized')) {
    const blank = n => Array.from({ length: n }).map((_, i) => '<tr>'
      + '<td>' + ibEd('it.' + i + '.item', '') + '</td>'
      + '<td>' + ibEd('it.' + i + '.code', '') + '</td>'
      + '<td>' + ibEd('it.' + i + '.amt', '') + '</td></tr>').join('');
    secs += '<div class="cb-sec"><h4>세부산정 내역서 <span class="ib-badge">직접 작성</span></h4>'
      + '<div class="cb-warn">라인 합이 총액과 맞지 않아(실측 5.6%) 자동작성하지 않습니다. 직접 적으세요.</div>'
      + '<table class="ib-t"><thead><tr><th>항목</th><th>코드</th><th>금액</th></tr></thead><tbody>' + blank(6) + '</tbody></table>'
      + '</div>';
  }
  /* 보험사 신청 양식 안내 + 자유 메모 */
  const noFormLabels = noForm.map(k => (IB_INSURERS || []).find(c => c.key === k) || {}).map(c => c.label).filter(Boolean);
  const carrierNote = '<div class="cb-sec"><h4>보험사 신청 안내 · 추가 메모 (자유 작성)</h4>'
    + (noFormLabels.length ? '<div class="cb-hint"><b>' + esc(noFormLabels.join(', ')) + '</b>는 전용 양식을 아직 못 구해(운영에 샘플 없음) 위 공통 문서로 제출합니다. 전용 양식이 필요하면 아래에 적어 두세요.</div>' : '')
    + '<textarea id="ibNote" placeholder="예: 보험사 제출용 추가 안내, 특이사항">' + esc(IB.note) + '</textarea></div>';

  return head + secs + carrierNote;
}

/* A4 서식 문자열 — 인쇄용. 편집한 값(IB.edit)을 반영한다. */
function ibEdGet(key, orig) { return (key in IB.edit) ? IB.edit[key] : (orig == null ? '' : String(orig)); }
function ibA4HTML() {
  const iss = IB.issuer || {};
  const g = ibEdGet;
  const kv = (l, v) => '<tr><td class="l">' + esc(l) + '</td><td>' + esc(v) + '</td></tr>';
  let docs = '';
  const headTbl = '<table class="hd"><tbody>'
    + kv('기관명', g('h.inst', iss.name)) + kv('대표자', g('h.ceo', iss.ceoName))
    + kv('주소', g('h.addr', iss.address)) + kv('전화', g('h.tel', iss.phone))
    + kv('환자명', g('h.name', IB.name)) + kv('차트번호', g('h.chart', IB.chart))
    + '</tbody></table>';
  if (IB.kinds.includes('medrec')) {
    const rows = IB.records.map((r, i) => '<tr><td>' + esc(g('mr.' + i + '.date', String(r.treatedAt || '').slice(0, 10)))
      + '</td><td>' + esc(g('mr.' + i + '.teeth', (r.teeth || []).length ? '#' + r.teeth.join(', #') : ''))
      + '</td><td>' + esc(g('mr.' + i + '.name', r.name))
      + '</td><td>' + esc(g('mr.' + i + '.dx', r.diagnosisCode))
      + '</td><td>' + esc(g('mr.' + i + '.note', r.note)) + '</td></tr>').join('');
    docs += '<h2>진료기록부</h2><table class="dt"><thead><tr><th>진료일</th><th>치식</th><th>진료명</th><th>상병코드</th><th>비고</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5">기록 없음</td></tr>') + '</tbody></table>';
  }
  if (IB.kinds.includes('receipt')) {
    const rows = IB.receipts.map((r, i) => '<tr><td>' + esc(g('rc.' + i + '.date', String(r.issuedAt || '').slice(0, 10)))
      + '</td><td class="r">' + esc(g('rc.' + i + '.total', r.total != null ? wonN(r.total) : ''))
      + '</td><td class="r">' + esc(g('rc.' + i + '.own', r.patientTotal != null ? wonN(r.patientTotal) : ''))
      + '</td><td class="r">' + esc(g('rc.' + i + '.paid', r.paid != null ? wonN(r.paid) : '')) + '</td></tr>').join('');
    docs += '<h2>진료비 계산서·영수증</h2>' + (IB.receipts.length
      ? '<table class="dt"><thead><tr><th>발급일</th><th>총액</th><th>본인부담</th><th>수납</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<p class="empty">발급된 영수증 없음</p>');
  }
  if (IB.kinds.includes('visit')) {
    const rows = IB.visits.map((v, i) => '<tr><td>' + esc(g('vd.' + i + '.date', v.date)) + '</td><td>' + esc(g('vd.' + i + '.tx', (v.treatments || []).join(', '))) + '</td></tr>').join('');
    docs += '<h2>내원·통원 진료확인서 (내원 ' + IB.visitCount + '일)</h2><table class="dt"><thead><tr><th>내원일</th><th>진료 내용</th></tr></thead><tbody>' + (rows || '<tr><td colspan="2">기록 없음</td></tr>') + '</tbody></table>';
  }
  if (IB.kinds.includes('itemized')) {
    const rows = Array.from({ length: 6 }).map((_, i) => '<tr><td>' + esc(g('it.' + i + '.item', '')) + '</td><td>' + esc(g('it.' + i + '.code', '')) + '</td><td class="r">' + esc(g('it.' + i + '.amt', '')) + '</td></tr>').join('');
    docs += '<h2>세부산정 내역서</h2><table class="dt"><thead><tr><th>항목</th><th>코드</th><th>금액</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  const note = ibEdGet('note', IB.note) || IB.note;
  const carrier = ibCarrierLabels().length ? '<p class="carrier">보험사: ' + esc(ibCarrierLabels().join(', ')) + '</p>' : '';
  const stamp = IB.stampPng ? '<img class="stamp" src="' + IB.stampPng + '" alt="">' : '';
  const today = ymdKo(docToday().replace(/-/g, ''));
  /* 🔴 보험사 전용 양식 — 각 보험사 양식을 **한 장씩** 먼저(실측 양식이 있는 것만).
     좌표 재현(coord) 양식은 자체가 A4(595×842px)라 `.a4` 패딩 래퍼 없이 페이지로 낸다. */
  let formPages = '';
  for (const k of [...IB.carriers].filter(x => ibFormFor(x))) {
    const f = ibFormFor(k);
    if (f.coord) formPages += ibBuildFormPages(k).map(p => '<div class="a4page">' + p + '</div>').join('');
    else formPages += '<div class="a4 ib-a4">' + ibBuildForm(k, false) + '</div>';
  }
  /* 공통 문서 한 장(진료기록부·영수증·내원확인서·세부산정 + 메모). */
  const commonPage = '<div class="a4 ib-a4"><div class="t">보험 청구용 서류</div>' + carrier + headTbl + docs
    + (note ? '<h2>추가 안내</h2><p class="note">' + esc(note).replace(/\n/g, '<br>') + '</p>' : '')
    + '<div class="sign">' + esc(today) + '<br>' + esc(ibEdGet('h.inst', iss.name)) + ' ' + esc(ibEdGet('h.ceo', iss.ceoName)) + ' (인) ' + stamp + '</div></div>';
  /* 공통 문서는 고른 문서(진료기록부 등)가 있거나, 전용 양식이 하나도 없을 때만 낸다. */
  const needCommon = IB.kinds.length > 0 || !formPages;
  return formPages + (needCommon ? commonPage : '');
}

function ibStep3HTML() {
  return '<div class="cb-hint" style="margin-bottom:8px">내용을 확인하고 「A4 인쇄」를 누르면 새 창에서 인쇄(또는 PDF 저장)합니다. 수정하려면 「이전」으로 돌아가세요.</div>'

}

/* A4 인쇄 — 새 창에 서식만 담아 띄운다(기존 동의서/영수증과 같은 길, 도장 배경 제거). */

  const html = ibA4HTML();
  const w = window.open('', '_blank', 'width=900,height=1200');
  if (!w) { alert('팝업이 막혀 인쇄 창을 못 열었습니다. 이 사이트의 팝업을 허용해 주세요.'); return; }
  const css = '@page{size:A4;margin:0}'
    /* 🔴 배경색·배경이미지를 인쇄에 반드시 찍는다 — 없으면 라이나 파란 색띠·표 음영·
       공식 PDF 배경·QR 이 브라우저 기본값(배경 생략)으로 인쇄물에서 통째로 사라진다. */
    + '*{-webkit-print-color-adjust:exact;print-color-adjust:exact}'

    + '.ib-a4 table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:12.5px}'
    + '.ib-a4 table.hd td{border:0;padding:3px 6px}.ib-a4 table.hd td.l{width:90px;color:#555;font-weight:600}'
    + '.ib-a4 table.dt th,.ib-a4 table.dt td{border:1px solid #999;padding:5px 7px;text-align:left}'
    + '.ib-a4 table.dt th{background:#eee;font-weight:700}'
    + '.ib-a4 td.r{text-align:right}'
    + '.ib-a4 h2{font-size:14px;font-weight:800;margin:16px 0 6px;border-bottom:1px solid #333;padding-bottom:3px}'
    + '.ib-a4 .empty{color:#777;font-size:12px}'
    + '.ib-a4 .note{white-space:pre-wrap;font-size:12.5px}'
    + '.ib-a4 .sign{margin-top:28px;text-align:right;font-size:13px;line-height:2}'
    + '.ib-a4 .stamp{width:54px;height:54px;object-fit:contain;vertical-align:middle;margin-left:6px}'
    /* 여러 장(보험사별 전용 양식 + 공통) — 장마다 새 페이지. */
    + '.a4{page-break-after:always}.a4:last-child{page-break-after:auto}'
    /* 좌표 재현 양식 — 자체가 595×842px A4. 1pt≈1.333px 라 mm 로 맞춘다. */
    + '.a4page{page-break-after:always;width:210mm;height:297mm;overflow:hidden}.a4page:last-child{page-break-after:auto}'
    + '.ibcoord{position:relative;width:595px;height:842px;transform:scale(1.323);transform-origin:top left}'

    + '.ibcoord .bandbg{position:absolute}'

    /* 공식 PDF 배경 양식 — pt→mm(1pt=0.3528mm). 595×842pt = A4. */
    + '.ibpdf{position:relative;width:595px;height:842px;transform:scale(1.323);transform-origin:top left}'

    + '.ibpdf .ibpdf-seal{position:absolute;width:38px;height:38px;object-fit:contain;transform:translate(-50%,-50%) rotate(-3.5deg);mix-blend-mode:multiply;opacity:.82}'
    /* 🔴 라이나 등 HTML 양식 — 인쇄 창은 메인 <style> 을 상속하지 않으므로 .linaf 스타일
       전체를 여기 넣어야 한다. 예전엔 .linaf{width:210mm} 한 줄뿐이라 인쇄물이 스타일
       없는 맨 텍스트로만 나왔다(실사고 2026-10-29 — 사용자 보고 「라이나가 인쇄에 안 나옴」).
