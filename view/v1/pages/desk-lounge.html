     몇 시간~며칠 전이라 「15분」 선이 **99.2%** 위치(바닥)에 찍혔다. 접수(대기)는
     경계의 몇 배 안이라 안 드러나던 문제인데, 문의·수납은 **며칠**도 된다.
     → 경계 2배에서 자른다. 그보다 오래된 사람은 **맨 위에 모인다**(「한참 지남」). */
  const maxW = Math.max(urg * 2, 10);
  const pos = m => (1 - Math.min(m, maxW) / maxW) * 100;   // 0분 = 아래, maxW = 위

  /* 겹치는 사람을 가로로 벌린다.
     🔴 **5분 단위가 아니라 「찍히는 위치」로 묶는다.** 분으로 묶으면 2시간과 5일이
        다른 칸이 되는데 **화면에서는 둘 다 맨 위**라 그대로 겹쳤다(실측: 6개가 전부
        `left:6px`, 눈에는 한두 개로 보였다). 위치(%)로 묶어야 실제 겹침을 잡는다. */
  /* 🔴 **두 번 돈다** — 먼저 「같은 줄에 몇 명인가」를 세고, 그 다음 그린다.
     한 번에 하면 첫 점을 그릴 때 그 줄의 총원을 모른다(그래서 폭을 못 나눈다). */
  const rowKey = it => Math.round(pos(it.mins || 0) / 6);   // ≈6% 간격이면 같은 줄
  const rowCount = new Map();
  items.forEach(it => { const k = rowKey(it); rowCount.set(k, (rowCount.get(k) || 0) + 1); });

  const bucket = new Map();
  const dots = items.map(it => {
    const m = it.mins || 0;
    const key = rowKey(it);
    const i = bucket.get(key) || 0;
    bucket.set(key, i + 1);
    const n = rowCount.get(key) || 1;
    return '<button class="rdot ' + it.color + (it.level ? ' l' + it.level : '')
      + (it.nohit ? ' nohit" tabindex="-1' : '')
      + '"' + (drag && !it.nohit ? ' draggable="true" data-stdrag="1"' : '')
      + ' data-pid="' + esc(it.key) + '"'
      /* 🔴 가로로 벌린다 — 간격은 **네모보다 넓어야** 한다(17px 간격 + 17px 네모는
         변이 맞닿아 실측 **겹침 5쌍**, 눈에는 한 덩어리였다).
         ⚠️ **축 밖으로 내보내지 않는다.** 칸이 좁아(문의 ≈150px) 24px 씩 벌리면
            6건째가 126px 로 삐져나갔다. `left` 대신 **%로 벌려** 칸 폭에 맞춘다 —
            몇 명이든 축 안에 들어온다(많을수록 촘촘해진다).
         ⚠️ 아래로 접는 방법은 **쓰지 않는다** — `translateY(-50%)` 와 겹쳐 천장에서
            잘리고 겹침이 되레 늘었다(실측 밖 1→4 · 겹침 0→2). */
      /* 🔴 가로 위치를 **칸 폭에 맞춰 계산**한다 — 고정 px/% 로 두면 좁은 칸에서
         축 밖으로 나가거나(24px: 밖 1개) 서로 겹친다(15%: 겹침 5쌍). 둘 다 실측으로
         겪었고, **상수를 바꾸는 방식으로는 한쪽을 고치면 다른 쪽이 났다.**
         → `--n`(같은 줄 인원)·`--i`(순번)을 넘기고 **CSS 가 남는 폭을 나눈다**.
           몇 명이든 축 안에 들어오고, 많아지면 촘촘해질 뿐 넘치지 않는다. */
      + ' style="top:' + pos(m).toFixed(1) + '%;--i:' + i + ';--n:' + n + '"'
      + ' title="' + esc(it.label) + '" aria-label="' + esc(it.label) + '"></button>';
  }).join('');

  const tick = (m, txt, cls) =>
    '<div class="rtk ' + (cls || '') + '" style="top:' + pos(m).toFixed(1) + '%"><span>' + txt + '</span></div>';
  return '<div class="rplot">'
    + tick(0, zero || '방금')
    + tick(warn, warn + '분', 'warn')
    + tick(urg, urg + '분', 'urg')
    + '<div class="rdots">' + dots + '</div>'
    + '</div>';
}

/** 접수 — 접수 후 **대기 시간** 축(백분위 경계). */
function recvPlotHTML(list) {
  const { cuts } = waitCuts(BASELINE);
  return plotHTML(list.map(v => ({
    key: v.r.patientId,
    mins: waitedMin(v.r) || 0,
    color: v.color, level: v.level,
    label: (v.r.name || '이름 없음') + ' · ' + dur(waitedMin(v.r) || 0) + ' 대기'
      + (v.r.chartNumber ? ' · #' + v.r.chartNumber : ''),
  })), cuts, '방금', true);
}

/** 수납 대기 — 진료가 **끝난 뒤** 경과 축.
 *  ⚠️ `treatEndAt` 이 비면 접수 시각으로 떨어뜨리지 **않는다** — 뜻이 다른 값을
 *     같은 축에 섞으면 「5시간 지연」 같은 거짓이 나온다. 그런 행은 0분으로 둔다. */
function payPlotHTML(list) {
  const cuts = [URGENCY.PAY_WARN_MIN, URGENCY.PAY_URG_MIN];
  return plotHTML(list.map(v => {
    const m = sinceEndMin(v.r);
    return {
      key: v.r.patientId,
      mins: m || 0,
      /* 🔴 색·크기를 **이 축으로 다시 매긴다** — `v.level` 은 대기/문의 기준이라
         수납 지연이 반영되지 않는다(그대로 쓰면 30분 밀린 사람이 회색이다). */
      color: m === null ? v.color : (m >= cuts[1] ? 's-urg' : m >= cuts[0] ? 's-warn' : 's-pay'),
      level: m === null ? 0 : (m >= cuts[1] ? 2 : m >= cuts[0] ? 1 : 0),
      label: (v.r.name || '이름 없음')
        + (m === null ? ' · 진료 종료 시각 없음' : ' · 진료 후 ' + dur(m))
        + (v.r.chartNumber ? ' · #' + v.r.chartNumber : ''),
    };
  }), cuts, '방금', true);
}

/** 문의 — 요청이 **들어온 뒤** 경과 축.
 *
 *  🔴 **점을 눌러도 안 열리는 사람이 있다 — 그게 정상이다.** 상세(`showPop`)는
 *     `VIEWS` 에서 찾는데, `VIEWS` 에는 **맵에 있는 사람**(오늘 접수한 사람)만 있다.
 *     문의는 **아직 안 온 사람도** 보여주므로(이 칸의 존재 이유다) 그 사람은 없다.
 *     실측(2026-10-16) 미처리 6건 중 **오늘 접수자는 0명** — 전부 안 열린다.
 *  ⚠️ 그래서 **누를 수 있는 것처럼 보이면 안 된다.** 맵에 없는 사람의 점은
 *     `.nohit` 로 손모양 커서를 떼고 포커스에서도 뺀다 — 눌리는데 아무 일도 안 나면
 *     「고장」으로 읽힌다(이 저장소에서 반복된 실패).
 *  ⚠️ 그래도 **점은 찍는다** — 지연이 얼마나 쌓였는지는 환자가 왔든 안 왔든 봐야 한다.
 *     누구/무슨 요청인지는 **아래 카드**에 그대로 있다. */
function inqPlotHTML(rows) {
  const cuts = [URGENCY.INQ_WARN_MIN, URGENCY.INQ_URG_MIN];
  return plotHTML(rows.map(a => {
    const m = minsSinceUtc(a.createdAt);
    return {
      key: a.patientRef == null ? '' : a.patientRef,
      /* 🔴 `patientRef` 만 있으면 **누를 수 있다**(사용자 지시 2026-10-16: 「문의
         네모를 누르면 우측 상세패널이 떠야 한다」). 맵에 없는 사람은
         `offMapViewOf` 가 합성 뷰를 만든다 — 더 이상 `VIEWS` 를 조건으로 보지 않는다. */
      nohit: a.patientRef == null,
      mins: m || 0,
      color: m === null ? 's-ok' : (m >= cuts[1] ? 's-urg' : m >= cuts[0] ? 's-warn' : 's-new'),
      level: m === null ? 0 : (m >= cuts[1] ? 2 : m >= cuts[0] ? 1 : 0),
      label: (a.patientName || '이름 없음') + ' · ' + inqLabel(a.actionType)
        + (m === null ? '' : ' · ' + dur(m) + ' 경과')
        + (a.note ? ' · ' + String(a.note).slice(0, 40) : ''),
    };
  }), cuts, '방금');
}

/** 수납완료 목록 — 🔴 **이름 + 끝난 시각**. 점이 아니라 **줄**이다(누구인지가 중요하다). */
function donePoolHTML(rows) {
  if (!rows.length) return '<div class="pool empty"></div>';
  /* 🔴 **이름 · 차트 · 시각만**(사용자 지시 2026-10-19) — 담당의 줄은 뺀다. */
  return '<div class="upgrid">' + rows.map(r => {
    const end = hhmm(r.treatEndAt) || hhmm(r.receivedAt);
    return '<div class="upbox done done-1" title="' + esc((r.treatmentDetail || r.note || '').slice(0, 60)) + '">'
      + '<div class="ub-top"><b>' + esc(r.name || '이름 없음') + '</b>'
      + (r.chartNumber ? '<span class="ub-ch">#' + esc(r.chartNumber) + '</span>' : '')
      + '<span class="ub-at">' + esc(end) + '</span></div>'
      + '</div>';
  }).join('') + '</div>';
}

function poolHTML(list) {
  if (!list.length) return '<div class="pool empty"></div>';
  return '<div class="pool">' + list.map(pplHTML).join('') + '</div>';
}
/** 사람 네모 1개. 🔴 칸(.ppl)은 **30×30 고정**, 네모(i)만 커진다 — 요구 R10. */
function pplHTML(v) {
  const r = v.r;
  const w = waitedMin(r);
  const bits = [r.name || '이름 없음'];
  if (r.chartNumber) bits.push('#' + r.chartNumber);
  if (v.level && w !== null && r.status <= 1) bits.push(dur(w) + ' 대기');
  if (v.inqs.length) bits.push('문의 ' + v.inqs.length + '건');
  const xray = XRAYS.get(String(r.patientId));
  if (xray) bits.push(xray.kinds + ' ' + xray.shots + '장');
  const label = bits.join(' · ');
  /* 🔴 드래그로 상태 변경(사용자 지시 2026-10-20) — 체어 박스도 끌 수 있다(진료 중 → 수납 대기 등). */
  return '<button class="ppl' + (v.level ? ' l' + v.level : '') + '" draggable="true" data-stdrag="1"'
    + ' data-pid="' + esc(r.patientId) + '"'
    + ' title="' + esc(label) + '" aria-label="' + esc(label) + '">'
    + '<i class="' + v.color + '"></i></button>';
}

/* ── 이동 감지 (R7) ──────────────────────────────────────────────────
 * 🔴 같은 환자가 **다른 칸**으로 옮기면 기록한다. 지금 위치만으로는 「어떻게
 *    움직이는지」에 답이 안 된다 — 「3분 전 대기실→3번체어」가 보여야 흐름이 읽힌다.
 * ⚠️ **첫 적재는 기록하지 않는다.** 그러면 화면을 열 때마다 전원이 「이동」으로 쏟아진다. */
function trackMoves() {
  const first = PLACE_PREV.size === 0;
  const next = new Map();
  for (const r of ROWS) {
    const p = placeOf(r);
    const key = p ? (p.zone === 'chair' ? 'chair:' + (p.chairId || 0) : p.zone) : 'out';
    next.set(String(r.patientId), key);
    if (first) continue;
    const prev = PLACE_PREV.get(String(r.patientId));
    if (prev && prev !== key) {
      MOVES.unshift({ at: nowHm(), name: r.name || '이름 없음', from: zoneLabel(prev), to: zoneLabel(key) });
    }
  }
  if (MOVES.length > 30) MOVES.length = 30;
  PLACE_PREV = next;
}
function zoneLabel(key) {
  if (key === 'wait') return '대기실';
  if (key === 'desk') return '수납 대기';
  if (key === 'out') return '나감(수납완료)';
  if (key.indexOf('chair:') === 0) {
    const id = key.slice(6);
    return chairName(id) || '체어';
  }
  return key;
}

/* ── 말풍선 — 🔴 토대 화면(app_v3 showPop)과 **같은 내용·동작** ──────────
 * 🔴 **호버 전용으로 만들지 않는다.** 터치 화면에는 호버가 없고, 네모가 작아 못 누르는
 *    사람이 있다 → hover(지연) + **click 고정** + **focus(키보드 Tab)** + ESC + 바깥 클릭. */
/* `i` 토글 — 🔴 **열린 상태를 기억한다.** 10초마다 다시 그리는 화면이라,
   기억하지 않으면 펼쳐 읽는 도중에 **저절로 접힌다**. */
let INFO_OPEN = false;
function bindInfo() {
  const btn = $('infoBtn'), box = $('infoBox');
  if (!btn || !box) return;
  const apply = () => {
    box.hidden = !INFO_OPEN;
    btn.setAttribute('aria-expanded', INFO_OPEN ? 'true' : 'false');
  };
  apply();                                   // 다시 그린 뒤에도 열려 있던 대로
  btn.addEventListener('click', e => {
    e.stopPropagation();
    INFO_OPEN = !INFO_OPEN;
    apply();
  });
}

/* 예약 — 펼침 기억 · 주 이동 · 시간 칸 클릭. */
function bindBook() {
  const wrap = $('bookWrap');
  if (!wrap) return;
  wrap.addEventListener('toggle', () => {
    BOOK_OPEN = wrap.open;
    // 🔴 처음 펼칠 때 **그때** 받는다 — 접혀 있는데 미리 받으면 30일 집계가 헛돈다.
    if (BOOK_OPEN && !SLOTS) loadSlots().then(render);
  });
  wrap.querySelectorAll('[data-week]').forEach(b => {
    b.addEventListener('click', async e => {
      e.preventDefault(); e.stopPropagation();
      const v = b.dataset.week;
      weekOff = (v === 'now') ? 0 : weekOff + Number(v);
      SLOTS = null;
      render();                     // 「불러오는 중…」을 먼저 보여준다
      await loadSlots();
      render();
    });
  });
  wrap.querySelectorAll('.bslot:not(.full)').forEach(el => {
    el.addEventListener('click', e => { e.preventDefault(); openBookSheet(el.dataset); });
  });
}

/** 예약 확인 창 — 🔴 **환자를 명시적으로 고른다**(드래그가 아니라).
 *  @param preselPid 예약변경에서 넘어올 때 **미리 고를** 환자 id(없으면 「고르세요」). */
function openBookSheet(ds, preselPid) {
  let docs = [];
  try { docs = JSON.parse(ds.docs || '[]'); } catch (_) { docs = []; }
  /* 🔴 환자 후보는 **지금 맵에 있는 사람**이다(수납완료 제외) — 이름을 치게 하면
     동명이인에서 틀린다. ⚠️ 접수 안 한 환자는 여기서 예약할 수 없다(의도) —
     그건 덴트웹 예약창이 할 일이다. */
  const cands = [...VIEWS.values()]
    .map(v => v.r)
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  /* 🔴 예약변경에서 넘어온 환자가 **맵에 없을 수도** 있다(미내원·예약만 있는 사람).
     그때는 후보에 **얹어 둔다** — 안 그러면 예약변경인데 그 환자를 고를 수 없다.
     DETAIL_ROW(지금 열린 환자) → offMapViewOf 순으로 찾는다. */
  if (preselPid && !cands.some(r => String(r.patientId) === String(preselPid))) {
    const extra = DETAIL_ROW[String(preselPid)]
      || (offMapViewOf(preselPid) || {}).r;
    if (extra && extra.patientId != null) cands.unshift(extra);
  }

  const back = document.createElement('div');
  back.className = 'modalback';
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'
    + '<div class="mh"><b>예약 넣기</b><button class="x" id="bx" aria-label="닫기">✕</button></div>'
    + '<div class="mb">'
    + '<div class="bkrow"><span class="k">일시</span><b>' + esc(ds.label) + ' ' + esc(ds.time) + '</b></div>'
    + '<label class="bkrow"><span class="k">환자</span><select id="bkpat">'
    + '<option value="">— 고르세요 —</option>'
    + cands.map(r => '<option value="' + esc(r.patientId) + '">' + esc(r.name || '이름 없음')
        + (r.chartNumber ? ' #' + esc(r.chartNumber) : '') + '</option>').join('')
    + '</select></label>'
    + '<label class="bkrow"><span class="k">담당</span><select id="bkdoc">'
    + '<option value="">— 고르세요 —</option>'
    + docs.map(x => '<option value="' + esc(x.id) + '">' + esc(x.n)
        + ' (' + x.b + '/' + x.c + ')</option>').join('')
    + '</select></label>'
    + '<label class="bkrow"><span class="k">소요</span><select id="bkmin">'
    + '<option value="30" selected>30분</option><option value="60">60분</option>'
    + '<option value="90">90분</option><option value="120">120분</option></select></label>'
    + '<label class="bkfield"><span class="k">예약 내용</span>'
    + '<input id="bkmemo" type="text" maxlength="500" placeholder="예: 스케일링 / #26 보철 (비워도 됩니다)"></label>'
    + '<div class="bkmsg" id="bkmsg"></div></div>'
    + '<div class="mf"><button class="btn" id="bkcancel">취소</button>'
    + '<button class="btn pri" id="bkok">예약 넣기</button></div></div>';
  document.body.appendChild(back);

  const close = () => { if (back.parentNode) back.parentNode.removeChild(back); };
  $('bx').onclick = close;
  $('bkcancel').onclick = close;
  back.addEventListener('click', e => { if (e.target === back) close(); });
  const onEsc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  /* 🔴 예약변경이면 환자를 **미리 고른 채** 연다(대상이 정해져 있다). 그러면 포커스는
     환자 칸이 아니라 **담당** 칸으로 — 거기가 다음에 고를 곳이다. */
  if (preselPid) { const ps = $('bkpat'); if (ps) ps.value = String(preselPid); }
  setTimeout(() => { const el = $(preselPid ? 'bkdoc' : 'bkpat'); if (el) el.focus(); }, 30);

  let busy = false;
  const ok = $('bkok');
  ok.onclick = async () => {
    if (busy) return;                       // 🔴 두 번 누르기 차단 — 예약이 둘 들어간다
    const msg = $('bkmsg');
    const pid = Number($('bkpat').value || 0);
    const docId = Number($('bkdoc').value || 0);
    /* 🔴 서버도 막지만 **여기서 먼저** 막는다 — 안 그러면 데스크가 「왜 안 되지」로 헤맨다. */
    if (!pid) { msg.className = 'bkmsg bad'; msg.textContent = '환자를 골라 주세요.'; $('bkpat').focus(); return; }
    if (!docId) {
      msg.className = 'bkmsg bad';
      msg.textContent = '담당을 골라 주세요 — 덴트웹 예약창의 어느 칸에 넣을지 정해야 합니다.';
      $('bkdoc').focus(); return;
    }
    busy = true; ok.disabled = true; ok.textContent = '넣는 중…';
    msg.className = 'bkmsg'; msg.textContent = '';
    try {
      // `date` YYYY-MM-DD + `time` HH:MM → 덴트웹 `YYYYMMDDHHmm` 12자리.
      const at = String(ds.date).replace(/-/g, '') + String(ds.time).replace(':', '');
      const r = await fetch(api('/api/app/booking'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patientId: pid,               // 🔴 **숫자**로 보낸다 — 문자열이면 요청이 거부된다
          at,
          doctorId: docId,
          memo: ($('bkmemo').value || '').trim(),
          minutes: Number($('bkmin').value) || 30,
        }),
      });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.ok) {
        /* 🔴 실패 이유를 **창 안에** 띄운다 — 닫아야 읽히면 방금 친 내용을 다시 쳐야 한다. */
        msg.className = 'bkmsg bad';
        msg.textContent = (j && (j.error || j.message)) || ('예약을 넣지 못했어요 (HTTP ' + r.status + ')');
        busy = false; ok.disabled = false; ok.textContent = '예약 넣기';
        return;
      }
      msg.className = 'bkmsg good';
      msg.textContent = '예약을 넣었어요 — 덴트웹 예약창에서 확인하세요.';
      ok.textContent = '완료';
      // 🔴 칸 현황이 바뀌었으므로 다시 받는다(그 의사 자리가 한 칸 찬다).
      SLOTS = null;
      setTimeout(async () => { close(); await loadSlots(); render(); }, 900);
    } catch (e) {
      msg.className = 'bkmsg bad';
      msg.textContent = '예약을 넣지 못했어요 — ' + ((e && e.message) || '알 수 없는 오류');
      busy = false; ok.disabled = false; ok.textContent = '예약 넣기';
    }
  };
}

/* ── 🔴 **+예약** 새 예약 창 (사용자 지시 2026-10-20, Monday 「새 예약」 참고) ──────────
 *   openBookSheet 와 달리 **일시·담당을 직접 고른다**(슬롯에서 들어온 게 아니다).
 *   실제 등록은 같은 `/api/app/booking` 으로 — 서버가 중복을 막고 원장에 남긴다.
 *   ⚠️ 담당(의사) 후보는 **오늘 예약표의 담당의 열 + 명부의 진료 담당**에서 모은다.
 */
const BOOK_CONTENT_CHIPS = ['스케일링', '검진 ck', '임플란트 수술', '크라운 prep', '신경치료 endo', 'perio', '충치치료 cu', '발치 ext'];
/* @param prefill {patientId,name,chartNumber,date,time,minutes,doctorId,memo} — 모두 선택.
 *   상세패널 예약 버튼·상세표 시간칸에서 넘어올 때 **고른 환자·시각**을 미리 채운다. */
function openNewBooking(prefill) {
  prefill = prefill || {};
  // 담당(의사) 후보 — 명부의 진료 담당(jobCode 1·면허·재직) + 혹시 열에만 있는 staffId.
  const docMap = new Map();
  for (const s of (ROSTER || [])) {
    if (Number(s.jobCode) === 1 && s.licenseNo && !s.resignedAt && s.name) docMap.set(String(s.staffId), s.name);
  }
  // 오늘 예약 열의 담당도 포함(명부에서 누락될 수 있다).
  for (const a of (APPTS || [])) { const k = String(a.staffId); if (k && k !== '0' && !docMap.has(k)) docMap.set(k, staffName(k) || ('담당 ' + k)); }
  const docs = [...docMap.entries()].sort((a, b) => a[1].localeCompare(b[1]));

  // 기본 날짜·시각 = prefill 또는 오늘·다음 30분.
  const now = new Date();
  const dStr = prefill.date || (now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()));
  let tStr = prefill.time;
  if (!tStr) { let mm = now.getHours() * 60 + now.getMinutes() + 30; mm = Math.ceil(mm / 30) * 30; tStr = pad2(Math.floor(mm / 60) % 24) + ':' + pad2(mm % 60); }

  // 선택된 환자 — prefill 이 있으면 바로 고정 표시, 없으면 검색.
  let selPid = prefill.patientId ? String(prefill.patientId) : '';
  let selName = prefill.name || '';
  let selChart = prefill.chartNumber || '';
  if (selPid) SEARCH_HITS.set(selPid, { name: selName, chartNumber: selChart, isNewPatient: false });

  const back = document.createElement('div');
  back.className = 'modalback';
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'
    + '<div class="mh"><b>새 예약</b><button class="x" id="nbx" aria-label="닫기">✕</button></div>'
    + '<div class="mb">'
    /* 🔴 환자 — **검색**(좌측 상단 환자 찾기와 같은 동작)으로 고른다(사용자 지시 2026-10-20).
       고르면 이름을 **잠근 칩**으로 보이고 ✕ 로 풀 수 있다. */
    + '<label class="bkfield"><span class="k">환자</span>'
    + '<div class="nbpat-wrap" id="nbpatWrap">'
    +   '<div class="nbpat-sel" id="nbpatSel"' + (selPid ? '' : ' hidden') + '>'
    +     '<span class="nm" id="nbpatSelNm">' + esc(selName) + (selChart ? ' <em>#' + esc(selChart) + '</em>' : '') + '</span>'
    +     '<button type="button" class="nbpat-x" id="nbpatX" aria-label="환자 선택 해제">✕</button>'
    +   '</div>'
    +   '<input id="nbpatSearch" type="search" autocomplete="off" placeholder="이름·차트·전화로 찾기"' + (selPid ? ' hidden' : '') + '>'
    +   '<div class="nbpat-list" id="nbpatList" hidden></div>'
    + '</div></label>'
    + '<div class="bkrow2">'
    +   '<label><span class="k">날짜</span><input id="nbdate" type="date" value="' + esc(dStr) + '"></label>'
    +   '<label><span class="k">시작</span><input id="nbtime" type="time" step="300" value="' + esc(tStr) + '"></label>'
    +   '<label><span class="k">소요</span><select id="nbmin">'
    +     ['30', '60', '90', '120'].map(v => '<option value="' + v + '"' + (String(prefill.minutes || 30) === v ? ' selected' : '') + '>' + v + '분</option>').join('')
    +   '</select></label>'
    + '</div>'
    /* 🔴 **시간표에서 고르기**(사용자 지시 2026-10-20) — 상세패널의 예약 슬롯 표(bookGridHTML)를
       띄워 날짜·시각을 **눈으로 골라** 위 날짜·시작 칸에 채운다. 환자를 먼저 골라야 한다. */
    + '<button type="button" class="nb-pick" id="nbPick">📅 시간표에서 날짜·시각 고르기</button>'
    + '<label class="bkrow"><span class="k">담당</span><select id="nbdoc">'
    + '<option value="">— 고르세요 —</option>'
    + docs.map(([id, nm]) => '<option value="' + esc(id) + '"' + (String(prefill.doctorId || '') === id ? ' selected' : '') + '>' + esc(nm) + '</option>').join('')
    + '</select></label>'
    + '<label class="bkfield"><span class="k">예약 내용</span>'
    + '<input id="nbmemo" type="text" maxlength="500" value="' + esc(prefill.memo || '') + '" placeholder="예: 스케일링 / #26 보철 (비워도 됩니다)"></label>'
    + '<div class="chips" id="nbchips">' + BOOK_CONTENT_CHIPS.map(c => '<button type="button" class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>'
    + '<div class="bkmsg" id="nbmsg"></div></div>'
    + '<div class="mf"><button class="btn" id="nbcancel">취소</button>'
    + '<button class="btn pri" id="nbok">예약 넣기</button></div></div>';
  document.body.appendChild(back);

  const close = () => { if (back.parentNode) back.parentNode.removeChild(back); };
  $('nbx').onclick = close;
  $('nbcancel').onclick = close;
  back.addEventListener('click', e => { if (e.target === back) close(); });
  const onEsc = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);

  // ── 환자 검색(모달 안) — 좌측 상단 환자 찾기와 같은 동작 ──
  const psInput = $('nbpatSearch'), psList = $('nbpatList'), psSel = $('nbpatSel');
  const setPatient = (p) => {
    selPid = String(p.patientId); selName = p.name || '이름 없음'; selChart = p.chartNumber || '';
    SEARCH_HITS.set(selPid, { name: selName, chartNumber: selChart, isNewPatient: false });
    $('nbpatSelNm').innerHTML = esc(selName) + (selChart ? ' <em>#' + esc(selChart) + '</em>' : '');
    psSel.hidden = false; psInput.hidden = true; psList.hidden = true; psList.innerHTML = '';
  };
  const clearPatient = () => {
    selPid = ''; selName = ''; selChart = '';
    psSel.hidden = true; psInput.hidden = false; psInput.value = ''; psList.hidden = true; psList.innerHTML = '';
    psInput.focus();
  };
  $('nbpatX').onclick = e => { e.preventDefault(); clearPatient(); };
  let nbSeq = 0, nbT = null, nbRes = [];
  const nbRun = async (q) => {
    q = (q || '').trim();
    if (!q) { nbRes = []; psList.hidden = true; psList.innerHTML = ''; return; }
    const seq = ++nbSeq;
    try {
      const j = await (await fetch(api('/api/dw/patients?q=' + encodeURIComponent(q)), { headers: { accept: 'application/json' } })).json();
      if (seq !== nbSeq) return;
      nbRes = (j && j.ok && Array.isArray(j.data)) ? j.data : [];
      psList.hidden = false;
      psList.innerHTML = nbRes.length
        ? nbRes.slice(0, 20).map((p, i) => '<button type="button" class="ps-row' + (i === 0 ? ' first' : '') + '" data-np="' + esc(p.patientId) + '">'
            + '<span class="ps-nm">' + esc(p.name || '이름 없음') + '</span>'
            + (p.chartNumber ? '<span class="ps-ch">#' + esc(p.chartNumber) + '</span>' : '')
            + (p.lastVisitDate ? '<span class="ps-lv">최종 ' + esc(fmtYmd(p.lastVisitDate)) + '</span>' : '') + '</button>').join('')
        : '<div class="ps-none">일치하는 환자가 없어요.</div>';
      psList.querySelectorAll('.ps-row[data-np]').forEach(r => r.addEventListener('click', () => {
        const p = nbRes.find(x => String(x.patientId) === r.dataset.np); if (p) setPatient(p);
      }));
    } catch (_) { if (seq === nbSeq) { psList.hidden = false; psList.innerHTML = '<div class="ps-none">검색에 실패했어요.</div>'; } }
  };
  if (psInput) {
    psInput.addEventListener('input', () => { clearTimeout(nbT); nbT = setTimeout(() => nbRun(psInput.value), 220); });
    psInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (nbRes.length) setPatient(nbRes[0]); } });
  }
  setTimeout(() => { const el = selPid ? $('nbdoc') : psInput; if (el) el.focus(); }, 30);

  // 빠른 선택 chip → 예약 내용 칸에 넣는다(이어 붙인다).
  back.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', () => {
    const inp = $('nbmemo'); if (!inp) return;
    inp.value = inp.value ? (inp.value + ', ' + b.dataset.chip) : b.dataset.chip; inp.focus();
  }));

  /* 🔴 「시간표에서 고르기」 → 슬롯 표를 띄우고, 고른 날짜·시각(·담당)을 **이 모달에** 채운다
     (사용자 지시 2026-10-20). 모달을 숨겼다가 다시 보여 준다 — 새 모달을 띄우지 않는다. */
  const pickBtn = $('nbPick');
  if (pickBtn) pickBtn.addEventListener('click', e => {
    e.preventDefault();
    back.style.display = 'none';   // 모달을 잠시 숨긴다(슬롯 서랍이 가린다)
    openSlotPicker(
      sel => {                     // 고르면: 날짜·시각(·담당) 채우고 모달 다시 보여 준다
        back.style.display = '';
        if (sel.date) $('nbdate').value = sel.date;
        if (sel.time) $('nbtime').value = sel.time;
        if (sel.doctorId && !$('nbdoc').value) $('nbdoc').value = String(sel.doctorId);
        const msg = $('nbmsg'); if (msg) { msg.className = 'bkmsg'; msg.textContent = ''; }
      },
      () => { back.style.display = ''; }   // 안 고르고 닫으면: 그냥 모달 다시 보여 준다
    );
  });

  let busy = false;
  const ok = $('nbok');
  ok.onclick = async () => {
    if (busy) return;
    const msg = $('nbmsg');
    const pid = Number(selPid || 0);
    const docId = Number($('nbdoc').value || 0);
    const date = $('nbdate').value, time = $('nbtime').value;
    if (!pid) { msg.className = 'bkmsg bad'; msg.textContent = '환자를 찾아 골라 주세요.'; if (psInput) psInput.focus(); return; }
    if (!date || !time) { msg.className = 'bkmsg bad'; msg.textContent = '날짜·시작 시각을 정해 주세요.'; return; }
    if (!docId) { msg.className = 'bkmsg bad'; msg.textContent = '담당을 골라 주세요 — 덴트웹 예약창의 어느 칸에 넣을지 정합니다.'; $('nbdoc').focus(); return; }
    busy = true; ok.disabled = true; ok.textContent = '넣는 중…';
    msg.className = 'bkmsg'; msg.textContent = '';
    try {
      const at = String(date).replace(/-/g, '') + String(time).replace(':', '');   // YYYYMMDDHHmm
      const r = await fetch(api('/api/app/booking'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ patientId: pid, at, doctorId: docId,
          memo: ($('nbmemo').value || '').trim(), minutes: Number($('nbmin').value) || 30 }),
      });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.ok) {
        msg.className = 'bkmsg bad';
        msg.textContent = (j && (j.error || j.message)) || ('예약을 넣지 못했어요 (HTTP ' + r.status + ')');
        busy = false; ok.disabled = false; ok.textContent = '예약 넣기'; return;
      }
      msg.className = 'bkmsg good';
      msg.textContent = '예약을 넣었어요 — 덴트웹 예약창에서 확인하세요.';
      ok.textContent = '완료';
      setTimeout(async () => { close(); try { await load(); } catch (_) {} render(); }, 900);
    } catch (e) {
      msg.className = 'bkmsg bad';
      msg.textContent = '예약을 넣지 못했어요 — ' + ((e && e.message) || '알 수 없는 오류');
      busy = false; ok.disabled = false; ok.textContent = '예약 넣기';
    }
  };
}

/* ── 네모를 누르면 상세 — **문서 한 곳에서 위임**한다 ────────────────────
 *
 * 🔴 **왜 호버를 버렸나** (사용자 보고 2026-10-16: 「접수·진료실·수납 대기에 마우스를
 *    올리면 포인터가 반짝반짝거리고 상세패널이 안 뜬다」)
 *
 *    화면은 10초마다 `$('app').innerHTML = h` 로 **통째로 다시 그린다**(POLL_MS).
 *    그래서 마우스 아래 있던 네모가 **사라지고 새 네모로 바뀐다**:
 *      · 60ms 짜리 호버 타이머가 **대상이 사라진 채** 깨어나 아무것도 못 띄운다
 *      · 포인터가 올라간 요소가 교체되니 커서 모양이 **깜빡인다**(=「반짝반짝」)
 *      · 띄워 놔도 다음 폴링에 `mouseleave` 없이 요소가 사라져 패널이 남거나 사라진다
 *    즉 **호버는 이 화면 구조에서 안정될 수 없다.** 폴링을 멈추면 현황이 멈추고,
 *    호버 중 폴링을 건너뛰는 식은 **방어막일 뿐**이다(ops 입력칸과 같은 함정).
 *    → 사용자 선택지 둘 중 **「클릭해야만 뜬다」**를 택했다.
 *
 * 🔴 **요소마다 묶지 않고 `document` 에 한 번만 묶는다.** 다시 그려도 리스너가
 *    살아 있다 — 예전에는 `bindPpl()` 이 매 렌더마다 수백 개를 다시 묶었고,
 *    그 사이에 눌린 클릭은 **아무 리스너도 없는 새 DOM** 에 떨어졌다.
 * ⚠️ `.upbox`(문의·내원 전 카드)는 `data-pid` 가 없어 여기 걸려도 그냥 지나간다 —
 *    그 칸들은 자기 그래프의 `.rdot` 으로 상세를 연다.
 */
function bindPpl() {
  /* 🔴 **한 번만** 묶는다. render() 가 매번 부르므로 가드가 없으면 10초마다
     리스너가 하나씩 쌓여, 한 번 누를 때 showPop 이 수십 번 돈다. */
  if (bindPpl._done) return;
  bindPpl._done = true;

  /* `.ppl`(접수·진료실·수납 네모) · `.rdot`(그래프 점) 둘 다 `data-pid` 를 갖는다.
     🔴 capture 가 아니라 **버블**로 받는다 — 칸(`.zone`)에도 클릭 리스너가 있어
        capture 로 가로채면 칸 목록이 안 열린다. */
  document.addEventListener('click', e => {
    const el = e.target.closest('.ppl, .rdot');
    if (!el || !el.dataset.pid) return;
    /* 🔴 칸(`.zone`)의 「목록 열기」와 **바깥 클릭=닫기**(document) 양쪽으로
       번지지 않게 막는다. 안 막으면 열자마자 닫힌다. */
    e.stopPropagation();
    showPop(el, true);
  });

  /* 키보드로도 연다 — `.ppl`·`.rdot` 은 `<button>` 이라 Enter/Space 가 click 으로
     바뀌므로 위 리스너가 그대로 받는다. 따로 묶지 않는다. */

  /* 🦷 **치아 차트** — 같은 이유로 여기서 위임한다(상세패널은 열 때마다 새로 그린다).
     🔴 `.side-detail` 안에서만 받는다 — 패널 밖에는 `.tc-t` 가 없다.
     ⚠️ 패널을 **다시 그리지 않고** 그 섹션만 갈아끼운다 — 전체를 다시 그리면
        스크롤이 맨 위로 튀어 누른 자리를 잃는다. */
  document.addEventListener('click', e => {
    const t = e.target.closest('.side-detail .tooth');
    if (!t || !t.dataset.tooth) return;
    e.stopPropagation();
    const n = Number(t.dataset.tooth);
    TOOTH_SEL = (TOOTH_SEL === n) ? null : n;    // 같은 이를 다시 누르면 접는다
    const panel = t.closest('.side-detail');
    const pid = panel && panel.dataset.pid;
    const d = pid && DETAIL_CACHE.get(String(pid));
    if (!d) return;
    /* 차트 섹션만 다시 그린다(전체를 다시 그리면 스크롤·영상이 튄다).
       🔴 영상이 날아가지 않게 치아 차트 영역(.arch 와 그 뒤 범례·상세)만 교체한다. */
    const scroll = panel.querySelector('.pscroll');
    if (!scroll) return;
    // 차트는 pscroll 의 맨 앞 블록들(arch + legend + tc-det)이다 — 통째로 교체.
    const frag = document.createElement('div');
    frag.innerHTML = toothChartHTML(d);
    // 기존 arch/legend/tc-det 제거 후 맨 앞에 새로 삽입
    scroll.querySelectorAll(':scope > .arch, :scope > .legend, :scope > .tc-det').forEach(el => el.remove());
    while (frag.lastChild) scroll.insertBefore(frag.lastChild, scroll.firstChild);
  });

  /* 🦷 치주 이력 접기/펴기 — .sec.perio 만 다시 그린다. */
  document.addEventListener('click', e => {
    const tog = e.target.closest('.side-detail [data-perio-toggle]');
    if (!tog) return;
    e.stopPropagation();
    const panel = tog.closest('.side-detail');
    const pid = panel && panel.dataset.pid;
    const d = pid && DETAIL_CACHE.get(String(pid));
    if (!d) return;
    PERIO_OPEN = !PERIO_OPEN;
    const sec = panel.querySelector('.sec.perio');
    if (sec) { const frag = document.createElement('div'); frag.innerHTML = perioHTML(d.perio); if (frag.firstChild) sec.replaceWith(frag.firstChild); }
  });

  /* 🔖 **우측 탭 전환** — Monday .ptab / .thread[data-pane]. */
  document.addEventListener('click', e => {
    const tab = e.target.closest('.side-detail .ptab');
    if (!tab) return;
    e.stopPropagation();
    const panel = tab.closest('.side-detail');
    if (!panel) return;
    const key = tab.dataset.tab;
    panel.querySelectorAll('.ptab').forEach(b => b.classList.toggle('on', b === tab));
    panel.querySelectorAll('.thread[data-pane]').forEach(pn => { pn.hidden = (pn.dataset.pane !== key); });
  });

  /* 📄 머리 액션 토글(문서·메시지·차팅) → 우측 서랍(.mw-sheet) 을 연다/닫는다. */
  document.addEventListener('click', e => {
    const b = e.target.closest('.side-detail .atbtn');
    if (!b) return;
    e.stopPropagation();
    const panel = b.closest('.side-detail');
    const nm = panel ? (panel.querySelector('.nm') || {}).textContent : '';
    const kind = b.dataset.sheet;
    const already = b.classList.contains('on');
    panel.querySelectorAll('.atbtn').forEach(x => x.classList.remove('on'));
    if (already) { closeActSheet(); }   // 같은 버튼 다시 누르면 닫는다
    else { b.classList.add('on'); openActSheet(kind, nm); }
  });

  /* 🖼 파노라마 과거/최근 · 구내사진 쪽 넘기기 (data-img-nav="pano:±1" / "photo:±1"). */
  document.addEventListener('click', e => {
    const nav = e.target.closest('.side-detail [data-img-nav]');
    if (!nav) return;
    e.stopPropagation();
    const panel = nav.closest('.side-detail');
    const pid = panel && panel.dataset.pid;
    const st = pid && IMG_STATE[String(pid)];
    if (!st) return;
    const [kind, dir] = nav.dataset.imgNav.split(':');
    if (kind === 'pano') {
      st.pIdx = Math.max(0, Math.min(st.pIdx + Number(dir), st.pano.length - 1));
      paintImg(pid, 'pano');
    } else {
      /* 구내사진은 **세션(촬영 한 판)** 단위로 넘긴다. ◀ 과거 = 인덱스 증가(오래된 세션). */
      const n = (st.photoSessions || []).length;
      st.phIdx = Math.max(0, Math.min((st.phIdx || 0) - Number(dir), n - 1));
      paintImg(pid, 'photo');
    }
  });

  /* 🔍 구내사진 칸 클릭 → 파노라마 칸에 크게 보기(새 창 대신 패널 안에서). */
  document.addEventListener('click', async e => {
    const cell = e.target.closest('.side-detail .pcell[data-photo]');
    if (!cell) return;
    e.stopPropagation();
    const panel = cell.closest('.side-detail');
    try {
      const url = await loadXrayImage(cell.dataset.photo);
      const frame = panel.querySelector('#panoFrame');
      if (frame) {
        const img = document.createElement('img');
        img.className = 'panoimg'; img.id = 'panoFrame'; img.alt = '구내 사진'; img.src = url;
        frame.replaceWith(img);
        const at = panel.querySelector('#panoAt');
        if (at) at.textContent = '구내 사진 확대';
      }
    } catch (_) {}
  });
}
/* ── 환자 상세 (api-v1) ────────────────────────────────────────────────
 * `GET /api-v1/patient/:id/detail` 한 번으로 치아기록·남은진료·상담·메모·미수·
 * 성향·촬영·다음예약을 받는다(서버가 모아 준다).
 *
 * 🔴 **열 때 한 번만** 받는다 — 폴링에 태우면 10초마다 환자 차트를 긁는다.
 * ⚠️ 받는 동안 패널이 **비어 보이면 안 된다** — 「불러오는 중」을 먼저 띄운다.
 * ⚠️ 응답이 와도 **그 사이 패널이 닫혔거나 다른 환자로 바뀌었을 수 있다** —
 *    `data-pid` 로 **지금 보고 있는 환자가 맞는지** 확인하고 그린다.
 *    (안 하면 A 를 닫고 B 를 열었을 때 A 의 상세가 B 위에 그려진다.)
 */
let DETAIL_CACHE = new Map();        // patientId → data (패널을 다시 열 때 재사용)
const DETAIL_AT = new Map();         // patientId → 받은 시각(ms) — 60초 지나면 새로 받는다

async function loadDetail(pid) {
  const key = String(pid);
  const paint = d => {
    const box = $('sdMore');
    // 🔴 지금 열린 패널이 **그 환자**일 때만 그린다.
    if (!box || box.closest('.side-detail')?.dataset.pid !== key) return;
    const panel = box.closest('.side-detail');
    fillSummary(panel, d);            // 헤더 4칸(.l2) 채우기
    box.innerHTML = detailHTML(d);    // .pbody (좌·우 .pane)
    // 🔴 파노라마·구내사진을 **그린 뒤** 받아 끼운다(fetch→blob).
    paintImg(key, 'pano');
    paintImg(key, 'photo');
  };
  /* 🔴 캐시는 **60초**만 믿는다 — 예전엔 지우는 곳이 없어 수납·예약·상태 변경 뒤에도 옛 미수·다음 예약이
     페이지를 새로 고칠 때까지 보였다(리뷰 2026-10-20). 오래됐으면 먼저 그리고 새로 받아 다시 그린다. */
  if (DETAIL_CACHE.has(key)) {
    const c = DETAIL_CACHE.get(key);
    /* 🔴 **발송 이력이 아직 안 붙은 캐시면 일찍 끝내지 않는다**(실측 2026-10-21).
       캐시는 상세만 담고 있어서, 그대로 `return` 하면 메신저에 보낸 문자가
       **60초 동안 안 뜬다** — 「또 안 나온다」로 읽힌다. 이력이 있을 때만 믿는다. */
    paint(c);
    if (c && c.msgHistory && Date.now() - (DETAIL_AT.get(key) || 0) < 60000) return;
  }
  try {
    /* 🔴 상세와 **발송 이력을 같이** 받는다 — 메신저 탭이 보낸 문자를 흘려야 한다.
       ⚠️ 이력이 실패해도 상세는 그린다(`loadMsgHistory` 가 빈 배열을 준다). */
    const [j, msgs] = await Promise.all([
      (await fetch(api(detailPath(pid)), { headers: { accept: 'application/json' } })).json(),
      loadMsgHistory(pid),
    ]);
    if (!j || !j.ok || !j.data) throw new Error((j && j.error) || '조회 실패');
    j.data.msgHistory = msgs;
    DETAIL_CACHE.set(key, j.data);
    DETAIL_AT.set(key, Date.now());
    paint(j.data);
  } catch (e) {
    const box = $('sdMore');
    if (box && box.closest('.side-detail')?.dataset.pid === key) {
      /* 🔴 **실패를 숨기지 않는다** — 빈 화면이면 「기록이 없다」로 읽힌다. */
      box.innerHTML = '<section class="pane"><div class="sd-err">상세를 불러오지 못했어요 — ' + esc(String(e.message || e)) + '</div></section>';
    }
  }
}

/** 금액 — 🔴 **원 단위**로 적는다(만원으로 줄이면 23만원과 23.4만원이 같아 보인다). */
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
/** `YYYYMMDD…` → `M/D`. */
function md(s) {
  const t = String(s || '').replace(/\D/g, '');
  return t.length >= 8 ? (+t.slice(4, 6)) + '/' + (+t.slice(6, 8)) : '';
}
const PLAN_STATUS = { 2: '상담', 3: '진행', 4: '완료' };

/* 열린 환자의 보드 행 — 메신저에 **상태 이벤트**(도착·진료실 배정 등)를 흘리려면 필요하다.
   showPop 이 채운다(patientId → 보드 r). 상세 응답엔 접수 시각·체어가 없어서다. */
const DETAIL_ROW = {};

/* ── 치주 카드 — Monday 의 .sec.perio (서버 d.perio) ──────────────────────
   {fullMouth, quadrants{1,2,3,4}, history[], lastDeep{at,name}, program} */
let PERIO_OPEN = false;
const QUAD_NAME = { 1: '상악 우측', 2: '상악 좌측', 3: '하악 좌측', 4: '하악 우측' };
/* 치식 십자(+) 글리프 — 네 사분면에 동그라미(채운 것 = 그 분면에 처치). Monday quadGlyph 와 같다.
   자리: 1=우상 2=좌상 4=우하 3=좌하 (환자 보는 방향 차트와 같게). */
function quadGlyphHTML(quads) {
  const on = new Set((quads || []).map(Number));
  const pos = { 1: [6.5, 6.5], 2: [17.5, 6.5], 4: [6.5, 17.5], 3: [17.5, 17.5] };
  const title = quads && quads.length === 4 ? '전악' : (quads || []).map(k => QUAD_NAME[k]).filter(Boolean).join(' · ');
  const circles = [1, 2, 3, 4].map(k => {
    const [cx, cy] = pos[k]; const f = on.has(k) ? 'currentColor' : 'none';
    return '<circle cx="' + cx + '" cy="' + cy + '" r="3.4" fill="' + f + '" stroke="' + f + '"></circle>';
  }).join('');
  return '<svg viewBox="0 0 24 24" width="22" height="22" class="qglyph"><title>' + esc(title) + '</title>'
    + '<path d="M12 2v20" stroke="currentColor" stroke-width="1.4"></path>'
    + '<path d="M2 12h20" stroke="currentColor" stroke-width="1.4"></path>' + circles + '</svg>';
}
function perioHTML(p) {
  if (!p || typeof p !== 'object') return '';   // 치주 기록 없으면 섹션 생략
  let h = '<div class="sec perio"><h3>치주</h3>';
  const ld = p.lastDeep;
  const hasHist = (p.history || []).length;
  h += '<div class="' + (ld ? 'ti plink' : 'muted') + '" data-perio-toggle="1">'
    + (ld ? '마지막 치주소파/치근활택 · ' + esc(ymdFull(ld.at)) + (ld.name ? ' (' + esc(ld.name) + ')' : '')
          + (hasHist ? (PERIO_OPEN ? ' ▾' : ' ▸') : '')
        : '치주소파·치근활택 기록 없음')
    + '</div>';
  if (PERIO_OPEN && hasHist) {
    /* 🔴 이력 각 줄에 **날짜 · 사분면 글리프 · 치료명**(Monday 와 동일 — 직관 아이콘). */
    h += '<div class="phist">' + (p.history || []).map(e =>
      '<div class="li"><span class="d">' + esc(ymdFull(e.at)) + '</span>'
      + quadGlyphHTML(e.quadrants)
      + '<span class="ti">' + esc(e.name || '') + '</span></div>').join('') + '</div>';
  }
  /* 사분면 4칸(.pq) + 전악 완료/ n/4 배지. 1=우상 2=좌상 4=우하 3=좌하 (Monday pq 순서). */
  const q = p.quadrants || {};
  let n = 0;
  const cells = [['1', '우상'], ['2', '좌상'], ['4', '우하'], ['3', '좌하']].map(([k, lbl]) => {
    const d = q[k]; if (d) n++;
    return '<i class="pq-c' + (d ? ' on' : '') + '" title="' + esc(lbl + '(' + k + ')' + (d ? ' · ' + d : ' · 기록 없음')) + '"></i>';
  }).join('');
  h += '<div class="pq-row"><div class="pq">' + cells + '</div>'
    + '<span class="badge' + (p.fullMouth ? ' pq-full' : '') + '">' + (p.fullMouth ? '전악 완료' : n + '/4 분면') + '</span></div>';
  if (p.program) {
    h += '<div class="li"><div class="ti">치주 프로그램 ' + esc(p.program.total) + '회 중 ' + esc(p.program.remaining) + '회 남음</div></div>';
  }
  h += '</div>';
  return h;
}

/* ── 메신저 한 줄 — record 카드 또는 말풍선 (Monday makeMsg) ──
   kind 별 머리 라벨. 🔴 여정(journey) 단계는 **색 라벨**(접수/진료실/수납…)로 Monday 와 같게. */
const MSG_KIND_KO = { 접수: '접수', 영상: '영상', 진료: '진료', 상담: '상담', 메모: '메모',
  room: '진료실', 수납: '수납 대기', done: '완료', arrived: '도착', 다음예약: '다음예약', 알림톡: '알림톡', 예약: '예약' };
function msgCardHTML(x) {
  const when = hhmm(x.at) || (x.at ? esc(String(x.at).slice(0, 10)) : '');
  const who = x.who ? ' <span class="rwho">' + esc(x.who) + '</span>' : '';
  /* 환자/병원 말풍선 — 도착 등 환자 쪽 여정도 여기로. */
  if (x.side === 'clinic' || x.side === 'patient') {
    const head = x.kind === 'arrived' ? '도착' : (x.side === 'patient' ? '환자' : '병원');
    return '<div class="msg ' + x.side + '"><div class="meta">'
      + esc(head) + (when ? ' · ' + when : '') + (x.journey ? ' <span class="jtag">여정</span>' : '') + '</div>'
      + '<div class="bub">' + (x.title ? '<div class="bt">' + esc(x.title) + '</div>' : '')
      + (x.text ? esc(x.text) : '') + '</div></div>';
  }
  const teeth = (x.teeth || []).length
    ? '<div class="tchips">' + x.teeth.map(t => '<span class="tchip">#' + esc(t) + '</span>').join('') + '</div>' : '';
  /* 여정(journey) 단계 카드는 머리 라벨을 **초록(.rk.jr)** 으로 강조 — Monday 처럼. */
  const rkCls = x.journey ? 'rk jr' : 'rk';
  return '<div class="rec' + (x.journey ? ' jr' : '') + '"><div class="rh"><span class="' + rkCls + '">'
    + esc(MSG_KIND_KO[x.kind] || x.kind || '기록') + '</span>'
    + (when ? ' · ' + when : '') + who + (x.journey ? ' <span class="jtag">여정</span>' : '') + '</div>'
    + (x.title ? '<div class="rt">' + esc(x.title) + '</div>' : '')
    + (x.text ? '<div class="rx">' + esc(String(x.text).slice(0, 200)) + '</div>' : '')
    + teeth + '</div>';
}

/* ── 헤더 요약 4칸(.l2) 채우기 — Monday 와 **동일** ──────────────────────
   showPop 이 「불러오는 중」으로 둔 `#sdSum` 을 상세 데이터가 오면 채운다. */
/** 상세 응답의 조각별 실패(`errors`) — 0건과 실패를 구분하려고 칸마다 묻는다. */
function dErr(d, key) { return !!(d && Array.isArray(d.errors) && d.errors.includes(key)); }
function fillSummary(panel, d) {
  const box = panel && panel.querySelector('#sdSum');
  if (!box) return;
  const due = d.due || {};
  const nv = d.nextVisit || {};
  const pmh = d.pmh || [];
  const nextCell = nv.at
    ? '<div class="cell next"><h3>다음 할 일</h3>'
        + '<div class="lab">다음 예약</div>'
        + '<div class="why">' + esc(md(nv.at) + ' ' + hhmm(nv.at) + (nv.note ? ' · ' + String(nv.note).slice(0, 20) : '')) + '</div></div>'
    : '<div class="cell next"><h3>다음 할 일</h3>'
        /* 🔴 조회 실패를 「예약 없음」으로 읽히게 두지 않는다(리뷰 2026-10-20) */
        + '<div class="lab">' + (dErr(d, 'nextVisit') ? '못 불러옴' : '다음 예약 없음') + '</div>'
        + '<div class="why">' + esc(String(nv.note || '—').slice(0, 30)) + '</div></div>';
  const careCell = '<div class="cell"><h3>주의 (전신병력)</h3><div class="chips">'
    + (pmh.length ? pmh.map(x => '<span class="achip red">' + esc(x) + '</span>').join(' ')
                  : '<span class="muted">기록 없음</span>') + '</div></div>';
  /* 🔴 「오늘 미수」 — 서버(payment_due)가 **오늘 진료비만** 본다(sz진료일 LIKE 오늘%). 그냥 「미수」라 적으면
     지난 진료 미수가 있는 환자도 0원으로 읽혔다(리뷰 2026-10-20). 조회 실패면 「못 불러옴」. */
  const dueCell = '<div class="cell"><h3>오늘 미수</h3>'
    + (dErr(d, 'due') ? '<div class="big muted">못 불러옴</div></div>' : '<div class="big' + (due.due ? ' warn' : '') + '">' + won(due.due || 0)
    + (due.unpaidCount ? ' · ' + due.unpaidCount + '건' : '') + '</div></div>');
  /* 🔴 다음 예약 — 날짜뿐 아니라 **예약 메모**(sz예약내용)도 보여준다(Monday 와 동일:
     「다음 예약 메모 · 1w ck, vip perio /dr.조/지영」). 메모만 있고 날짜가 없을 수도 있다. */
  const up = d.upcoming || null;
  const apptAt = (up && up.scheduledAt) || nv.at || '';
  const apptNote = (up && up.note) || nv.note || '';
  const nextApptCell = '<div class="cell"><h3>다음 예약</h3>'
    + '<div class="big">' + (apptAt ? esc(md(apptAt) + ' ' + hhmm(apptAt)) : (apptNote ? '메모' : '—')) + '</div>'
    + (apptNote ? '<div class="why">' + esc(String(apptNote).slice(0, 40)) + '</div>' : '')
    + '</div>';
  /* 🔴 상태 토글 — 다음 예약 **오른쪽**에 **상하(세로)** 로. 접수·진료 중·수납 대기·수납 완료.
     🔴 **누르면 실제로 덴트웹 상태를 바꾼다**(사용자 지시 2026-10-20) — POST /api/app/reception/stage.
     현재 status 에 해당하는 버튼이 켜진다(.on). 매핑: 접수=0·1 / 진료 중=2 / 수납 대기=3 / 수납 완료=4. */
  const row = DETAIL_ROW[String(d.patientId)] || {};
  const st = row.status;
  const STATUS_TOGGLES = [['recv', '접수', [0, 1], 0], ['room', '진료 중', [2], 2], ['pay', '수납 대기', [3], 3], ['done', '수납 완료', [4], 4]];
  /* 🔴 오늘 접수가 없는 환자(내원 전·검색으로 연 환자)는 바꿀 상태가 없다 — 버튼 대신 안내(누르면 오류만 나던 것). */
  const hasRecv = String(row.receivedAt || '').replace(/\D/g, '').length === 14;
  const statusToggle = !hasRecv
    ? '<div class="cell statcell"><h3>상태</h3><div class="why muted">오늘 접수 전</div></div>'
    : '<div class="cell statcell"><h3>상태</h3>'
    + '<div class="statog" role="group" aria-label="환자 상태 변경">'
    + STATUS_TOGGLES.map(([k, label, vals, code]) =>
        '<button class="stbtn' + (vals.includes(st) ? ' on' : '') + '" data-status="' + k + '" data-code="' + code + '"'
        + ' title="눌러서 상태를 바꿉니다">' + label + '</button>').join('')
    + '</div><div class="statmsg" hidden></div></div>';
  box.innerHTML = nextCell + careCell + dueCell + nextApptCell + statusToggle;
  // 🔴 상태 버튼 → 실제 변경. row 에 receivedAt·patientId 가 있어야 바꿀 수 있다.
  box.querySelectorAll('.stbtn[data-code]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      changeStatusFromDetail(row, Number(b.dataset.code), box.querySelector('.statmsg'));
    });
  });
}

/* ── 🔴 환자 상태 변경(덴트웹 쓰기) — 상세패널 버튼·드래그가 **같이 쓴다** ────────────
 * POST /api/app/reception/stage {receivedAt(14),patientId,patientName,status,chairId?}.
 * 서버가 ① 상태값 검증 ② 진료 중이면 체어 필수 ③ 같은 체어 진료중 충돌(409) ④ 원장 기록·롤백.
 * 🔴 성공해야 「바꿨다」고 말한다 — 실패는 실패라 말한다(거짓말 금지). 성공 후 load()+render().
 * @return {ok:boolean, error?:string}
 */
async function changePatientStatus(row, statusCode, chairId) {
  if (!row || !row.patientId) return { ok: false, error: '환자 정보가 없어요.' };
  const recv = String(row.receivedAt || '').replace(/\D/g, '');
  if (recv.length !== 14) return { ok: false, error: '오늘 접수한 환자만 상태를 바꿀 수 있어요(접수 시각 없음).' };
  /* 🔴 진료 중 + 체어 0 = **체어 없음**(사용자 지시 2026-10-19) — 전용 주소로 보낸다.
     기존 stage 는 「진료 중은 체어 필수」라 400 을 준다(실수로 칸 여백에 떨군 것을 막는 규칙). */
  if (statusCode === 2 && chairId === 0) {
    try {
      const r = await fetch(api('/api-v1/reception/no-chair'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ receivedAt: recv, patientId: Number(row.patientId), patientName: row.name || undefined }),
      });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.ok) return { ok: false, error: (j && (j.error || j.message)) || ('변경 실패 (HTTP ' + r.status + ')') };
      return { ok: true, changed: j.data && j.data.changed };
    } catch (e) { return { ok: false, error: (e && e.message) || '알 수 없는 오류' }; }
  }
  try {
    const r = await fetch(api('/api/app/reception/stage'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        receivedAt: recv, patientId: Number(row.patientId), patientName: row.name || undefined,
        status: statusCode, chairId: (statusCode === 2 ? (chairId || undefined) : undefined),
      }),
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) return { ok: false, error: (j && (j.error || j.message)) || ('변경 실패 (HTTP ' + r.status + ')') };
    return { ok: true, changed: j.data && j.data.changed };
  } catch (e) { return { ok: false, error: (e && e.message) || '알 수 없는 오류' }; }
}

/* 상세패널 상태 버튼에서 호출 — 진료 중(2)은 **체어를 먼저 고르게** 한다(없으면 서버가 막는다). */
async function changeStatusFromDetail(row, statusCode, msgEl) {
  const setMsg = (cls, txt) => { if (msgEl) { msgEl.hidden = false; msgEl.className = 'statmsg ' + cls; msgEl.textContent = txt; } };
  if (row && Number(row.status) === statusCode) { setMsg('', '이미 그 상태예요.'); return; }
  if (statusCode === 2) {
    // 진료 중 → 체어 선택 창. 고른 뒤 변경.
    pickChairThen(row, chairId => doChangeFromDetail(row, 2, chairId, setMsg));
    return;
  }
  doChangeFromDetail(row, statusCode, null, setMsg);
}
async function doChangeFromDetail(row, statusCode, chairId, setMsg) {
  setMsg('wait', '바꾸는 중…');
  const res = await changePatientStatus(row, statusCode, chairId);
  if (!res.ok) { setMsg('bad', res.error); return; }
  setMsg('good', '상태를 바꿨어요.');
  if (row) row.status = statusCode;   // 패널 즉시 반영
  try { await load(); } catch (_) {}
  render();
  // 패널은 닫지 않는다 — 바뀐 상태로 다시 그려 준다(showPop 유지).
  const el = { dataset: { pid: String(row.patientId) } };
  setTimeout(() => showPop(el, true), 50);
}

/* 🔴 진료 중으로 보낼 때 체어를 고르는 작은 창 — 빈 체어 우선. 고르면 onPick(chairId). */
function pickChairThen(row, onPick) {
  const rooms = (CHAIRS || []).filter(c => !isXray(c)).slice().sort(byOrder);
  const busy = new Set((ROWS || []).filter(r => r.status === 2 && r.chairId).map(r => String(r.chairId)));
  const back = document.createElement('div');
  back.className = 'modalback';
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" style="max-width:340px">'
    + '<div class="mh"><b>진료 중 — 체어 고르기</b><button class="x" id="pcx" aria-label="닫기">✕</button></div>'
    + '<div class="mb"><div class="q" style="font-size:13px;color:var(--dim);margin-bottom:8px">'
    + esc((row && row.name) || '환자') + ' 님을 어느 체어에 앉힐까요?</div>'
    + '<div class="chairpick">' + rooms.map(c => {
        const b = busy.has(String(c.chairId));
        return '<button type="button" class="cp' + (b ? ' busy' : '') + '" data-cid="' + esc(c.chairId) + '"'
          + (b ? ' disabled title="진료 중인 환자가 있어요"' : '') + '>' + esc(c.name) + '</button>';
      }).join('')
    /* 🔴 맨 마지막 **한 줄 양옆으로 넓게** 「체어 없음」(사용자 지시 2026-10-19) —
       체어를 비운 채 진료 중으로(POST /api-v1/reception/no-chair). 다른 환자와 겹칠 일이 없어 막지 않는다. */
    + '<button type="button" class="cp cp-none" data-cid="0" title="체어를 고르지 않고 진료 중으로">체어 없음</button>'
    + '</div></div></div>';
  document.body.appendChild(back);
  const close = () => { if (back.parentNode) back.parentNode.removeChild(back); };
  $('pcx').onclick = close;
  back.addEventListener('click', e => { if (e.target === back) close(); });
  back.querySelectorAll('.cp:not(.busy)').forEach(b => b.addEventListener('click', () => {
    const cid = Number(b.dataset.cid); close(); onPick(cid);
  }));
}

function detailHTML(d) {
  /* ── Monday 데스크(192.168.0.N2:8790/patient-panel.*)와 **동일한 구조**로 그린다
     (사용자 지시 2026-10-19: 「동일하게 구현하시오」). 라이브 DOM 에서 뜬 클래스·중첩을
     그대로 쓴다: .pbody > (좌 .pane / 우 .pane). 색은 Monday 팔레트(스코프 CSS).
     🔴 데이터 출처는 그대로 — api-v1(덴트웹 DB) · /api/dw/xray-image. */
  const recs = (d.records || []);
  const recentTx = (d.recentTx || []);
  const plansLeft = (d.plans || []).filter(p => p.status !== 4);
  const due = d.due || {};

  /* ── 좌 .pane : 치아 기록(차트 + 영상 + 치주 + 최근 진료) ── */
  let ps = '';
  ps += toothChartHTML(d);          // .arch + .legend (분류는 서버 d.teeth)
  ps += imagingHTML(d);             // .sec.pano + .sec.photo (덴트웹 DB)
  ps += perioHTML(d.perio);         // .sec.perio (치주 이력 + 전악 완료)
  /* 최근 진료 — 🔴 서버가 치주·검진을 뺀 **recentTx** 를 준다(Monday 규칙). 없으면 「없음」. */
  ps += '<div class="sec"><h3>최근 진료</h3>'
    + (recentTx.length
        ? recentTx.map(r => '<div class="li"><div class="d">' + esc(r.at || '') + '</div>'
            + '<div class="ti">' + esc(r.name || '') + '</div>'
            + ((r.teeth || []).length ? '<div class="tchips">' + r.teeth.map(t => '<span class="tchip">#' + esc(t) + '</span>').join('') + '</div>' : '')
            + '</div>').join('')
        : '<div class="muted">없음</div>')
    + '</div>';
  if (!ps) ps = '<div class="empty">기록이 없어요</div>';
  const leftPane = '<section class="pane"><h2>치아 기록</h2><div class="pscroll">' + ps + '</div></section>';

  /* ── 우 .pane : 탭(메신저·메모·남은 진료·성향·상담) ── */
  const TABS = [['msg', '메신저'], ['memo', '메모'], ['plan', '남은 진료'], ['trait', '성향'], ['consult', '상담']];
  const ptabs = TABS.map(([k, label]) =>
    '<button class="ptab' + (k === 'msg' ? ' on' : '') + '" data-tab="' + k + '">' + label + '</button>').join('');

  /* 메신저 = **상태 이벤트 + 진료 + 상담 + 메모**를 시각순 타임라인으로 (카카오톡 모양).
     🔴 사용자 지시 2026-10-19: 접수(도착 시각)·진료실 배정·진료시간 등 **상태정보도** 흘러야 한다.
     상태 이벤트는 보드 행(DETAIL_ROW)에서 만든다 — 서버 thread 가 아직 없으므로 지금 가진 걸로. */
  const row = DETAIL_ROW[String(d.patientId)] || null;
  const stream = [];
  /* ── 🔴 **환자 여정(journey)** — 오늘 방문의 단계 이동을 카카오톡처럼 카드로 흘린다
     (사용자 지시 2026-10-19: 스크린샷의 도착·진료 시작·진료실 배정·수납 처럼).
     Monday 는 자기 이동 로그로 그린다("Monday 기록"). 우리는 가진 것으로 최대한 복원한다:
       · 도착 = 접수 시각(receivedAt)  · 진료 시작 = **오늘 첫 진료 기록 시각**
       · 진료실 = chairId  · 수납/귀가 = 현재 status.
     ⚠️ 각 단계의 **정확한 전환 시각**은 덴트웹에 없다(접수·진료 시각만 있다) — 지어내지
        않고 **아는 시각만** 쓴다. */
  const todayKey = (S => S)(ymdFull(row && row.receivedAt) || ymdFull(recs[0] && recs[0].treatedAt));
  const todayRecs = recs.filter(r => ymdFull(r.treatedAt) === todayKey);
  const firstTx = todayRecs.length ? todayRecs[todayRecs.length - 1] : null;   // recs 는 DESC → 마지막이 오늘 첫 진료
  if (row) {
    // 도착 · 접수 — 환자 쪽(왼쪽)
    if (row.receivedAt) stream.push({ at: row.receivedAt, kind: 'arrived', side: 'patient', journey: true,
      title: '도착 · 접수', text: (row.treatmentDetail || row.note || '접수 · 대기') });
    // 진료 시작 — 오늘 첫 진료 시각에. 담당의·담당
    /* 🔴 **아는 시각만**(리뷰 2026-10-20) — 접수 행의 실제 진료 시작·종료(treatStartAt·treatEndAt)를 쓴다.
       예전엔 진료실·수납 대기·귀가 카드에 오늘 첫 진료나 접수 시각을 넣어 시각을 지어냈다.
       모르면 시각 없이(맨 위 「오늘」 묶음) 둔다. */
    const tStart = row.treatStartAt || (firstTx && firstTx.treatedAt) || '';
    const tEnd = row.treatEndAt || '';
    if (row.status >= 2) {
      const who = [staffName(row.doctorId), staffName(row.staffId)].filter(Boolean).join(' · ');
      const cn = chairName(row.chairId);
      stream.push({ at: tStart, kind: 'room', side: 'record', journey: true,
        title: '진료 시작', text: cn || '체어 없음', who });
    }
    if (row.status === 3) stream.push({ at: tEnd, kind: '수납', side: 'record', journey: true, title: '진료 끝 · 수납 대기', text: '' });
    if (row.status === 4) stream.push({ at: tEnd, kind: 'done', side: 'record', journey: true, title: '귀가 · 수납 완료', text: '' });
  }
  /* 🔴 진료 기록 **전부**를 타임라인에 흘린다(Monday 처럼) — 치식 chip 포함. recentTx(3개)로
     줄이지 않는다. 사용자 지시: 「진료실 들어간 기록 등등 카카오톡처럼」. */
  for (const r of recs) stream.push({ at: r.treatedAt, kind: '진료', side: 'record',
    title: r.name || '', text: '', teeth: r.teeth });   // 🔴 담당의를 붙이지 않는다 — 오늘 담당의 이름을 과거 기록 전부에 붙이던 것(지어냄)
  for (const c of (d.consults || [])) stream.push({ at: c.at, kind: '상담', side: 'record',
    title: String(c.title || ''), text: String(c.text || '') });
  for (const m of (d.memos || [])) if (m.preview) stream.push({ at: m.date, kind: '메모', side: 'record',
    title: '', text: String(m.preview) });
  /* 🔴 **보낸 알림톡·문자** — 참고 화면에 있는데 우리에겐 없던 것(사용자 지시 2026-10-21).
     출처가 둘이라 **구분해서** 적는다(지어내지 않는다):
       · `dentweb` = 덴트웹이 보낸 문자·알림톡 — **본문이 있다**
       · `morning` = 모닝앱이 메센트로 보낸 알림톡 — 메센트가 본문을 주지 않아 **본문이 없다**
     ⚠️ 「전송 성공」은 **보냈다는 기록**이지 환자가 읽었다는 뜻이 아니다 — 라벨에 그대로 쓴다.
     ⚠️ `step:'booked'`(예약 확정)는 발송이 아니라 예약 사건이라 여기서 뺀다 — 이미 다음예약 카드가 있다. */
  /* 🔴 덴트웹 발송은 **상세의 `messages`(지난 1년)** 를 쓴다(사용자 보고 2026-10-22 — 「Monday 메신저엔
       문자가 있는데 우리는 안 뜬다」). `msgHistory`(= `/api-v1/lounge/messages` 의 history)는 라운지 **표**용이라
       **최근 7일**만 읽고, 오늘 예약이 있으면 **예약을 잡은 시각 이후**만 남긴다 — 지난 문자가 거의 다 빠졌다.
       → 거기서는 덴트웹에 없는 **모닝앱(메센트)** 건만 가져온다. 둘을 다 쓰면 덴트웹 건이 두 번 뜬다.
     ⚠️ 서버가 옛 빌드라 `messages` 가 없으면 예전처럼 `msgHistory` 의 덴트웹 건으로 떨어진다(비우지 않는다). */
  const hasDwMsgs = Array.isArray(d.messages);
  const sentList = (hasDwMsgs ? d.messages.map(m => Object.assign({ step: 'sent' }, m)) : [])
    .concat((d.msgHistory || []).filter(m => !hasDwMsgs || m.source === 'morning'));
  for (const m of sentList) {
    if (m.step !== 'sent') continue;
    const from = m.source === 'morning' ? '모닝앱' : '덴트웹';
    const okTxt = m.ok === false ? ' · 전송 실패' : (m.ok === true ? ' · 전송 성공' : '');
    stream.push({
      at: m.at, kind: '알림톡', side: 'clinic',
      /* ⚠️ 「병원 · 시각」은 말풍선 머리(meta)가 이미 찍는다 — 여기서 또 쓰면 겹친다. */
      title: (m.label || '문자') + ' · ' + from + okTxt,
      /* 🔴 본문이 없으면 **없다고 적는다** — 빈 말풍선은 「빈 문자를 보냈다」로 읽힌다. */
      text: m.text ? String(m.text) : '(본문은 메센트가 주지 않아 표시할 수 없어요 — 전송 기록만 있습니다)',
    });
  }
  /* 다음 예약 메모 — Monday 의 「다음예약」 카드. */
  const nv = d.nextVisit || {};
  if (nv.at || nv.note) stream.push({ at: nv.at || '', kind: '다음예약', side: 'record',
    title: '다음 예약 메모', text: String(nv.note || '') });
  stream.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  /* 날짜 구분선(.day) 을 날짜가 바뀔 때 끼운다 — Monday 처럼. 최신 먼저. */
  let msgPane = '';
  if (stream.length) {
    let lastDay = null;
    for (const x of stream.slice(0, 120)) {
      const dk = ymdFull(x.at);
      if (dk && dk !== lastDay) { lastDay = dk; msgPane += '<div class="day">' + esc(dk) + '</div>'; }
      msgPane += msgCardHTML(x);
    }
  } else {
    msgPane = '<div class="empty">기록이 없어요</div>';
  }

  /* 🔴 🔒 메모 = **전자차트 히든메모(TB_진료기타내용 n기록종류=7)만**. 종류를 안 가려 「다음 할 치료」(15) 등이
     히든 메모로 보였다(리뷰 2026-10-20 · CLAUDE.md 상세패널 규칙). 날짜는 연도까지 — 여러 해 전 기록이 올해로 읽혔다. */
  const memos = (d.memos || []).filter(m => m.preview && Number(m.kind) === 7);
  const memoPane = dErr(d, 'memos') ? '<div class="empty">메모를 못 불러왔어요</div>' : memos.length
    ? '<div class="msec hid"><h3>🔒 메모</h3>' + memos.slice(0, 20).map(m =>
        '<div class="mi"><div class="d">' + esc(ymdFull(m.date)) + '</div><div class="x">' + esc(String(m.preview).slice(0, 200)) + '</div></div>').join('') + '</div>'
    : '<div class="empty">메모가 없어요</div>';

  const planPane = plansLeft.length
    ? plansLeft.map(p => {
        const leftAmt = Math.max(0, (p.contractAmount || 0) - (p.paidAmount || 0));
        return '<div class="fl"><span class="fk">' + esc(p.displayName || '계획') + '</span>'
          + '<span class="fv">' + (p.contractAmount ? won(leftAmt) + ' 남음' : '견적')
          + ' <span class="muted">· ' + esc(PLAN_STATUS[p.status] || p.status) + '</span></span></div>';
      }).join('')
    : '<div class="empty">남은 진료가 없어요</div>';

  /* 🔴 성향 탭 = 「준비 중」만(CLAUDE.md 상세패널 규칙). 미수 0원을 여기 다시 보이면 사실로 읽힌다. */
  const traitPane = '<div class="empty">성향(문자·전화·취소 경향)은 준비 중이에요.</div>';

  /* 🔴 최신 10건 — 서버는 오름차순이라 그대로 자르면 **가장 오래된** 10건이었다. */
  const consultPane = dErr(d, 'consults') ? '<div class="empty">상담 기록을 못 불러왔어요</div>' : (d.consults || []).length
    ? (d.consults || []).slice().sort((a, b) => String(b.at || '').localeCompare(String(a.at || ''))).slice(0, 10).map(c =>
        '<div class="mi"><div class="d">' + esc(ymdFull(c.at)) + (c.by ? ' · ' + esc(c.by) : '') + '</div><div class="x">' + esc(String(c.text || c.title || '').slice(0, 200)) + '</div></div>').join('')
    : '<div class="empty">상담 기록이 없어요(최근 18개월)</div>';

  const panes = '<div class="thread" data-pane="msg">' + msgPane + '</div>'
    + '<div class="thread" data-pane="memo" hidden>' + memoPane + '</div>'
    + '<div class="thread" data-pane="plan" hidden>' + planPane + '</div>'
    + '<div class="thread" data-pane="trait" hidden>' + traitPane + '</div>'
    + '<div class="thread" data-pane="consult" hidden>' + consultPane + '</div>';

  const rightPane = '<section class="pane tabpane"><h2><div class="ptabs">' + ptabs + '</div></h2>' + panes + '</section>';

  const ERR_KO = { records: '진료 기록', due: '오늘 미수', plans: '남은 진료', memos: '메모', consults: '상담',
    nextVisit: '다음 예약', messages: '문자·알림톡', pmh: '전신병력', xrays: '영상', teeth: '치아 차트', perio: '치주' };
  const errLine = (d.errors || []).length
    ? '<div class="day">⚠️ 못 불러온 항목: ' + esc((d.errors || []).map(k => ERR_KO[k] || k).join(', ')) + '</div>' : '';

  return leftPane + rightPane + errLine;
}
/* ── 치아 차트 28칸 ────────────────────────────────────────────────────
 * Monday 데스크(`192.168.0.N2:8790`)와 **같은 모양**으로 그린다(사용자 지시 2026-10-16).
 *
 * 🔴 **번호는 치과 표기 순서다** — 오름차순이 아니다:
 *      윗줄  18…11 │ 21…28     (오른쪽 → 가운데 → 왼쪽)
 *      아랫줄 48…41 │ 31…38
 *    가운데가 정중선이다. `sort()` 로 그리면 **좌우가 뒤집힌다.**
 * 🔴 **기록 없는 치아(흰색)와 「기타」(회색)는 다르다.** 같게 칠하면 「기록이 있는지」가
 *    사라진다 — 직원이 «이 이는 한 번도 안 봤다»를 못 읽는다.
 * ⚠️ 유치(51~85)는 **아직 그리지 않는다** — Monday 는 차팅 서랍에서만 쓴다(§9).
 */
/* Monday 치식 번호판 — 반(half) 단위 2분할(오른쪽 8 · 왼쪽 8) + 유치(P). */
const UPPER = [[18,17,16,15,14,13,12,11],[21,22,23,24,25,26,27,28]];
const LOWER = [[48,47,46,45,44,43,42,41],[31,32,33,34,35,36,37,38]];
const UPPER_P = [[55,54,53,52,51],[61,62,63,64,65]];
const LOWER_P = [[85,84,83,82,81],[71,72,73,74,75]];
/* 분류 키(서버가 준다) → Monday CSS `cat-*` 클래스(글자 임/신/보/충/발/주/검/기). */
const CAT_CSS = {
  implant:'cat-implant', endo:'cat-endo', prosth:'cat-prosth', restore:'cat-restore',
  extract:'cat-extract', perio:'cat-perio', exam:'cat-exam', other:'cat-other',
};
const CAT_LABEL = {
  implant:'임플란트', endo:'신경치료', prosth:'보철', restore:'보존·충전',
  extract:'발치', perio:'잇몸', exam:'검진', other:'기타',
};
/* 🔴 분류는 **서버가** 준다(d.teeth[n].category) — 화면이 이름 regex 로 가르지 않는다.
   그렇게 했더니 전부 기타가 됐다(차트 7788 의 15번 발치). 분류기는 서버
   `dentweb::tooth_category` 한 곳. 화면은 받은 category 를 그대로 cat-* 로 쓴다. */
function toothOf(d, n) {
  const t = d.teeth || {};
  return t[String(n)] || null;   // {category, last, items[]} | null
}
/* Monday 의 .trow = 두 개의 .half(오른쪽 8 · 왼쪽 8). 각 .half 안에 .tooth. */
function toothHalfHTML(d, nums) {
  return '<div class="half">' + nums.map(n => {
    const g = toothOf(d, n);
    const cls = 'tooth' + (g ? ' ' + (CAT_CSS[g.category] || 'cat-other') : '') + (TOOTH_SEL === n ? ' on' : '');
    return '<button class="' + cls + '" data-tooth="' + n + '"'
      + (g ? ' title="' + esc((CAT_LABEL[g.category] || '기타') + (g.last ? ' · 최근 ' + g.last : '')) + '"' : ' title="기록 없음"')
      + '>' + n + '</button>';
  }).join('') + '</div>';
}
function toothRowHTML(d, halves) {
  return '<div class="trow">' + halves.map(h => toothHalfHTML(d, h)).join('') + '</div>';
}
/* 유치(P) 행이 하나라도 기록 있으면 그릴지 — Monday 의 hasAny(). */
function toothHasAny(d, halves) {
  return halves.some(h => h.some(n => toothOf(d, n)));
}

let TOOTH_SEL = null;     // 지금 누른 치식번호(없으면 null)

/* ── 파노라마 · 구내사진 — 🔴 **덴트웹 DB** 에서 가져온다 (사용자 지시 2026-10-19) ──────
 *
 * 🔴 **왜 덴트웹인가**: api-v1 이 보는 그 내부망 덴트웹 DB 에 영상이 다 있다
 *    (`DentWebFiles.dbo.TB_이미지` · `PUB_P엑스레이`/`PUB_GETImage`). prod.cleancode 아니다.
 *    detail 응답의 `xrays[]` 가 목록(fileName·modality·capturedAt), 바이너리는
 *    `/api/dw/xray-image/<fileName>` 가 내린다(이미 있는 라우트).
 * 🔴 modality: **2=파노라마 · 1=구내(IO) · 0=일반사진 · 4=CT.**
 * ⚠️ `<img src>` 로 직접 못 건다 — 로그인 게이트가 토큰을 요구하는데 img 는 헤더를 못 붙인다.
 *    그래서 **fetch(Bearer)→blob URL** 로 받아 건다(페이지 fetch 래퍼가 토큰을 붙인다).
 * 🔴 **한 장만** 받는다(보는 것). 목록 전부를 미리 받으면 패널이 느려진다(수백 장일 수 있다). */
const IMG_STATE = {};   // pid → { pano:[...], photo:[...], pIdx, phIdx }

/* 구내 사진은 Monday 처럼 **9칸 그리드**로 **촬영 한 판(세션)씩** 본다(.pgrid 3×3). */
const PHOTO_PAGE = 9;
/* 🔴 구내 9분할 **격자 자리(pos 0~8)** 의 라벨. 왼→오, 위→아래 순. */
const PHOTO_LABELS9 = ['10번대', '상악 전치', '20번대', '우측', '정면', '좌측', '40번대', '하악 전치', '30번대'];
/* 🔴 **촬영 순서 → 격자 자리(pos)** 매핑. Monday 실측 permutation(환자 8838 두 세션 동일):
   촬영 0→pos0(10번대) · 1→pos6(40번대) · 2→pos8(30번대) · 3→pos2(20번대) · 4→pos1(상악전치)
   · 5→pos7(하악전치) · 6→pos4(정면) · 7→pos3(우측) · 8→pos5(좌측).
   임상 표준 촬영 순서가 격자와 **순서대로가 아니다** — identity 로 걸면 자리가 어긋난다. */
const PHOTO_CAPTURE_TO_POS = [0, 6, 8, 2, 1, 7, 4, 3, 5];

/* 구내사진을 **촬영일(세션)별로** 묶는다. 최신 세션 먼저.
   9장이면 **촬영 순서→pos permutation** 으로 격자에 배치(Monday 「촬영 순서 가정」). */
function groupPhotoSessions(photos) {
  const by = new Map();   // dateKey → [photos]
  for (const p of photos) {
    const k = String(p.capturedAt || '').slice(0, 8);   // YYYYMMDD
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }
  const sessions = [];
  for (const [date, list] of by) {
    // 세션 안은 촬영 순서(시각)대로.
    list.sort((a, b) => String(a.capturedAt).localeCompare(String(b.capturedAt)));
    const nine = list.length === PHOTO_PAGE;   // 정확히 9장이면 표준 9분할
    // byPos[pos] = 그 격자 자리에 올 사진. 9장이면 permutation 으로, 아니면 순서대로.
    const byPos = {};
    list.forEach((p, i) => {
      const pos = nine ? PHOTO_CAPTURE_TO_POS[i] : i;
      byPos[pos] = p;
    });
    sessions.push({ date, byPos, count: list.length, labels: nine ? PHOTO_LABELS9 : [] });
  }
  sessions.sort((a, b) => String(b.date).localeCompare(String(a.date)));   // 최신 먼저
  return sessions;
}

function imagingHTML(d) {
  const xr = (d.xrays || []).filter(x => x.fileName);
  const pano  = xr.filter(x => x.modality === 2).sort((a,b)=>String(a.capturedAt).localeCompare(b.capturedAt));
  const photoAll = xr.filter(x => x.modality === 0 || x.modality === 1);
  const sessions = groupPhotoSessions(photoAll);
  IMG_STATE[String(d.patientId)] = { pano, photoSessions: sessions, pIdx: pano.length - 1, phIdx: 0 };
  let h = '';
  /* ── 파노라마 — Monday .sec.pano : .panoh(제목+◀과거/날짜/최근▶) · .panoimg · .panobar ── */
  h += '<div class="sec pano">';
  if (pano.length) {
    h += '<div class="panoh"><h3>파노라마</h3>'
      + '<div class="panonav">'
      +   (pano.length > 1 ? '<button class="pbtn" data-img-nav="pano:-1">◀ 과거</button>' : '')
      +   '<span class="panoat" id="panoAt"></span>'
      +   (pano.length > 1 ? '<button class="pbtn" data-img-nav="pano:1">최근 ▶</button>' : '')
      + '</div></div>'
      + '<div class="panoload" id="panoFrame">불러오는 중…</div>'
      + '<div class="panobar" id="panoBar">' + pano.map((_, i) =>
          '<i class="' + (i === pano.length - 1 ? 'on' : '') + '"></i>').join('') + '</div>';
  } else {
    h += '<div class="panoh"><h3>파노라마</h3></div><div class="muted">파노라마 없음</div>';
  }
  h += '</div>';
  /* ── 구내 사진 — Monday .sec.photo : .panoh(제목+세션날짜) · .pgrid(.pcell×9) · .panobar(세션) ── */
  h += '<div class="sec photo">';
  if (sessions.length) {
    h += '<div class="panoh"><h3>구내 사진</h3>'
      + (sessions.length > 1 ? '<div class="panonav"><button class="pbtn" data-img-nav="photo:-1">◀ 과거</button>'
          + '<span class="panoat" id="photoAt"></span>'
          + '<button class="pbtn" data-img-nav="photo:1">최근 ▶</button></div>'
          : '<span class="panoat" id="photoAt"></span>')
      + '</div>'
      + '<div class="pgrid" id="photoGrid"></div>'
      + (sessions.length > 1 ? '<div class="panobar" id="photoBar">' + sessions.map((_, i) =>
          '<i class="' + (i === 0 ? 'on' : '') + '"></i>').join('') + '</div>' : '');
  } else {
    h += '<div class="panoh"><h3>구내 사진</h3></div><div class="muted">구내 사진 없음</div>';
  }
  h += '</div>';
  return h;
}

/* blob 캐시 — 같은 파일을 다시 안 받는다. 패널을 닫으면 revoke 한다. */
const IMG_BLOB = new Map();
async function loadXrayImage(fileName) {
  if (IMG_BLOB.has(fileName)) return IMG_BLOB.get(fileName);
  const r = await fetch(api('/api/dw/xray-image/' + encodeURIComponent(fileName)), { cache: 'force-cache' });
  if (!r.ok) throw new Error('이미지 ' + r.status);
  const url = URL.createObjectURL(await r.blob());
  IMG_BLOB.set(fileName, url);
  return url;
}

/* 파노라마/구내사진을 Monday 모양으로 그린다.
   kind='pano' → 한 장(.panoimg) + 날짜 + 막대. kind='photo' → 현재 쪽 9칸 그리드. */
async function paintImg(pid, kind) {
  const st = IMG_STATE[String(pid)];
  if (!st) return;
  const panel = document.querySelector('.side-detail[data-pid="' + pid + '"]');
  if (!panel) return;

  if (kind === 'pano') {
    const list = st.pano;
    if (!list.length) return;
    const idx = Math.max(0, Math.min(st.pIdx, list.length - 1));
    const item = list[idx];
    const frame = panel.querySelector('#panoFrame');
    const at = panel.querySelector('#panoAt');
    const bar = panel.querySelector('#panoBar');
    /* 🔴 **연도까지** 적는다(Monday: 2026-09-03). md() 는 「9/3」이라 연도가 빠진다. */
    if (at) at.textContent = ymdFull(item.capturedAt) + ' · ' + (list.length - idx) + '/' + list.length
      + (idx === list.length - 1 ? ' (최근)' : '') + (item.note ? ' · ' + item.note : '');
    if (bar) [...bar.children].forEach((el, i) => el.classList.toggle('on', i === idx));
    if (!frame) return;
    try {
      const url = await loadXrayImage(item.fileName);
      if (panel.dataset.pid !== String(pid)) return;
      const img = document.createElement('img');
      img.className = 'panoimg'; img.alt = '파노라마'; img.src = url;
      img.id = 'panoFrame';
      frame.replaceWith(img);
    } catch (e) {
      frame.className = 'panoerr'; frame.id = 'panoFrame'; frame.textContent = '파노라마를 불러오지 못했어요';
    }
    return;
  }

  /* 구내 사진 — **촬영 한 판(세션)**의 9칸. 9장이면 표준 자리(permutation)·라벨, 아니면 순서대로. */
  const sessions = st.photoSessions || [];
  if (!sessions.length) return;
  const grid = panel.querySelector('#photoGrid');
  if (!grid) return;
  const si = Math.max(0, Math.min(st.phIdx || 0, sessions.length - 1));
  const sess = sessions[si];
  const byPos = sess.byPos || {}, labels = sess.labels;
  const slots = labels.length ? PHOTO_PAGE : Math.min(PHOTO_PAGE, Math.max(3, Math.ceil(sess.count / 3) * 3));
  const cells = [];
  for (let pos = 0; pos < slots; pos++) {
    const it = byPos[pos];
    if (it) cells.push('<div class="pcell" data-photo="' + esc(it.fileName) + '">'
      + (labels[pos] ? '<span class="plb">' + esc(labels[pos]) + '</span>' : '') + '</div>');
    else cells.push('<div class="pcell empty">' + (labels[pos] ? '<span class="plb">' + esc(labels[pos]) + '</span>' : '') + '</div>');
  }
  grid.innerHTML = cells.join('');
  /* 세션 날짜(연도까지)·장수 · (9장 아니면 「칸 미분류」) */
  const at = panel.querySelector('#photoAt');
  if (at) at.textContent = (sess.date ? ymdFull(sess.date) : '') + ' · ' + (sessions.length - si) + '/' + sessions.length
    + (si === 0 ? ' (최근)' : '') + (labels.length ? '' : ' · ' + sess.count + '장 (칸 미분류)');
  const bar = panel.querySelector('#photoBar');
  if (bar) [...bar.children].forEach((el, i) => el.classList.toggle('on', i === si));
  /* 각 칸 이미지는 lazy 로 받아 끼운다 — 격자 자리(pos)에 그 자리 사진을. */
  for (let pos = 0; pos < slots; pos++) {
    const it = byPos[pos];
    if (!it) continue;
    const cellPos = pos;
    loadXrayImage(it.fileName).then(url => {
      if (panel.dataset.pid !== String(pid)) return;
      const cell = grid.children[cellPos];
      if (!cell) return;
      cell.classList.remove('empty');
      const img = document.createElement('img');
      img.alt = labels[cellPos] || '구내 사진'; img.src = url;
      cell.insertBefore(img, cell.firstChild);
    }).catch(() => {});
  }
}

/* `YYYYMMDD…`(또는 ISO `YYYY-MM-DD…`) → `YYYY-MM-DD`. 🔴 **연도 포함**(md 는 연도 뺌). */
function ymdFull(s) {
  const t = String(s || '').replace(/\D/g, '');
  return t.length >= 8 ? t.slice(0, 4) + '-' + t.slice(4, 6) + '-' + t.slice(6, 8) : String(s || '');
}

function toothChartHTML(d) {
  const teeth = d.teeth || {};
  if (!Object.keys(teeth).length) return '';   // 🔴 기록이 하나도 없으면 차트를 안 그린다
  /* Monday 의 .arch — 위 라벨 / [유치위] / 윗니 / 아랫니 / [유치아래] / 아래 라벨. */
  let h = '<div class="arch tc-host">'
    + '<div class="lbl">위 (오른쪽 ← → 왼쪽)</div>'
    + (toothHasAny(d, UPPER_P) ? toothRowHTML(d, UPPER_P) : '')
    + toothRowHTML(d, UPPER)
    + toothRowHTML(d, LOWER)
    + (toothHasAny(d, LOWER_P) ? toothRowHTML(d, LOWER_P) : '')
    + '<div class="lbl">아래</div>'
    + '</div>'
    /* 범례 — Monday 의 .legend(글자 칸 .sw.cat-*). perio·exam 은 범례에서 뺀다(Monday 규칙). */
    + '<div class="legend">'
    + ['implant', 'endo', 'prosth', 'restore', 'extract', 'other'].map(c =>
        '<span><i class="sw cat-' + c + '"></i>' + (CAT_LABEL[c]) + '</span>').join('')
    + '</div>';
  /* 🔴 누른 치아의 이력을 **그 자리에** 펼친다(Monday 와 같다). */
  const sel = TOOTH_SEL !== null ? teeth[String(TOOTH_SEL)] : null;
  if (sel) {
    const items = sel.items || [];
    h += '<div class="sec tc-det"><h3>#' + TOOTH_SEL + ' 치아 기록 <span class="muted">' + items.length + '건</span></h3>'
      + items.slice(0, 8).map(r => '<div class="li"><div class="d">' + esc(r.at || '') + '</div>'
          + '<div class="ti">' + esc(r.name || '') + '</div>'
          + '<div class="de">' + esc(CAT_LABEL[r.category] || '기타') + '</div></div>').join('')
      + '</div>';
  }
  return h;
}

function hidePop() {
  closeActSheet();
  const p = document.querySelector('.side-detail');
  if (p) p.remove();
  // 🔴 blob URL 을 **되돌린다**(메모리 누수 방지) — 패널을 닫으면 그 이미지는 안 쓴다.
  try { for (const u of IMG_BLOB.values()) URL.revokeObjectURL(u); IMG_BLOB.clear(); } catch (_) {}
}
document.addEventListener('click', e => {
  // 🔴 서랍(.mw-sheet) 안을 눌러도 패널을 닫지 않는다 — 서랍은 패널 밖 DOM 이다.
  if (pinned && !e.target.closest('.side-detail') && !e.target.closest('.mw-sheet')) { pinned = null; hidePop(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.querySelector('.mw-sheet')) { closeActSheet(); return; }  // 서랍 먼저 닫는다
    if (pinned) { pinned = null; hidePop(); }
  }
});

/* ── 문서·메시지·차팅 서랍(.sheet) — Monday 와 **같은 내용**을 보여준다 ─────────
   🔴 지금은 **표기/안내 위주**다 — 실제 발급·발송·저장(write)은 추후(write API 필요).
   사용자 지시 2026-10-19: 「각 버튼이 어떤 기능·내용을 표기할지 파악하고 추가」. */
const ACT_SHEETS = {
  /* 🔴 **문서 — 실제로 만든다**(사용자 지시 2026-10-21). 전엔 전부 `disabled` 였다.
     지금 되는 것은 **둘뿐**이고, 나머지는 왜 안 되는지 그 자리에 적는다(숨기지 않는다).
     수수료는 4prism-basics(모닝플러스3) 실측 캡처값. */
  doc: { custom: true, title: '문서' },
  msg: {
    title: '메시지', steps: ['문안', '채우기', '승인'], q: '어떤 문안을 쓸까요?',

/** YYYYMMDD → YYYY-MM-DD (input[type=date] 용) */
const ymdDash = s => { const t = String(s || '').replace(/\D/g, ''); return t.length === 8 ? t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8) : ''; };
const dashYmd = s => String(s || '').replace(/\D/g, '').slice(0, 8);
/** YYYYMMDD → 2026년 10월 21일 */
function ymdKo(s) {
  const t = String(s || '').replace(/\D/g, '');
  return t.length >= 8 ? (+t.slice(0,4)) + '년 ' + (+t.slice(4,6)) + '월 ' + (+t.slice(6,8)) + '일' : '';
}
/* 금액 — 기존 `won()`(4469줄, 「원」 포함)을 그대로 쓴다. 쉼표만 필요하면 `wonN`. */
const wonN = n => (Number(n) || 0).toLocaleString('ko-KR');

function bindDocSheet(sheet) {
  const pid = DETAIL_ROW_PID;
  const redraw = () => { const sb = sheet.querySelector('.sb'); if (sb) { sb.innerHTML = docSheetHTML(); wire(); } };
  /* 🔴 **클릭이 문서까지 올라가면 패널이 닫힌다**(실측 버그 2026-10-21).
     바깥 클릭 핸들러는 `e.target.closest('.mw-sheet')` 로 서랍 안을 걸러내는데,
     `redraw()` 가 `.sb` 를 통째로 갈아끼우면 **눌린 버튼이 DOM 에서 떨어져 나가** 그
     판정이 실패한다 → 라운지로 튕겼다.
     → ① `stopPropagation()` 으로 **올려보내지 않고** ② `preventDefault()` 로 기본동작도 막고
       ③ 버튼에 `type="button"` 을 달아 submit 가능성도 없앤다. 셋 다 한다. */
  const guard = fn => e => { e.preventDefault(); e.stopPropagation(); fn(); };
  const wire = () => {
    sheet.querySelectorAll('[data-dockind]').forEach(b => b.addEventListener('click', guard(() => {
      const kind = b.dataset.dockind;
      /* 🔴 동의서 — 서랍 안에 ②③ 을 그리지 않고 **전체화면 작성 오버레이**를 띄운다
         (사용자 지시 2026-10-22). 서랍은 닫는다. */
      if (kind === 'consent') { closeActSheet(); openConsentBuilder(pid); return; }
      if (kind === 'insurance') { closeActSheet(); openInsuranceBuilder(pid); return; }
      DOC_STATE.kind = kind; DOC_STATE.picked = true; DOC_STATE.data = null; redraw();
    })));
    /* 기간 단축(1·3·6·12개월) — 종료일은 오늘로 두고 시작일만 당긴다. */
    sheet.querySelectorAll('[data-docmon]').forEach(b => b.addEventListener('click', guard(() => {
      /* ⚠️ `|| 1` 로 적지 않는다 — **「당일」의 0 이 1개월로 둔갑**한다. */
      const m = Number(b.dataset.docmon);
      const t = new Date();
      const a = m > 0 ? new Date(t.getFullYear(), t.getMonth() - m, t.getDate()) : t;
      const f = x => x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
      DOC_STATE.from = f(a); DOC_STATE.to = f(t); DOC_STATE.data = null; redraw();
    })));
    const mk = sheet.querySelector('#docMake');
    if (mk) mk.addEventListener('click', guard(() => makeDoc(sheet, pid)));
    /* 실행 줄의 「A4 인쇄」 — 미리보기 안쪽 버튼과 **같은 일**을 한다. */
    const pr2 = sheet.querySelector('#docPrint2');
    if (pr2) pr2.addEventListener('click', guard(() => { if (DOC_STATE.data) printDoc(DOC_STATE.data); }));
  };
  wire();
}

async function makeDoc(sheet, pid) {
  const out = sheet.querySelector('#docOut');
  if (!out) return;
  const f = sheet.querySelector('#docFrom'), t = sheet.querySelector('#docTo');

      /* 🔴 도장 배경을 먼저 지우고(크기 안 바뀜) 높이를 잰다. */
