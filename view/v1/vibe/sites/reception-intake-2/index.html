<!--
  ⚠️ **생성물이다. 손으로 고치지 마라.**
     원본  src-tauri/src/server/app_v3.html
     생성  python3 docs/local/vibe/build.py   (scripts 는 clinic-v2-app 저장소)

  vibe-deploy(:4000) 업로드용 **단일 HTML** — 빌드 없이 그대로 서빙된다.
  그래서 원본의 외부 자산(`/app-shared.css` 등)을 **전부 인라인**했다.

  🔴 API 는 **다른 호스트**(https://192.168.0.236) 로 나간다. 이 파일이 서빙되는 곳은 :4000 이고
     접수·문진 API 는 서버 앱(:7331 / :443)에 있다. 상대 경로로 두면 :4000 을
     때려 전부 404 가 되므로, `fetch()` 앞에 베이스를 붙였다.
     CORS 는 `access-control-allow-origin: *` 로 열려 있다(실측 2026-10-12).

  ⚠️ 주소를 바꾸려면 아래 `window.__API_BASE__` 한 줄만 고치면 된다.
-->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>접수·문진 V3 도트 보드 — 모닝</title>
<script>
/* ── vibe-deploy 전용 덧댐 — 원본에는 없다 ──────────────────────────────
   🔴 이 HTML 은 **:4000** 에서 서빙되는데 접수·문진 API 는 **서버 앱**에 있다.
      상대 경로로 부르면 :4000 을 때려 전부 404 다 — 그래서 베이스를 붙인다.
   ⚠️ 주소가 다른 치과면 **이 한 줄만** 고치면 된다. */
window.__API_BASE__ = window.__API_BASE__ || 'https://192.168.0.236';
function API(p){
  // 이미 절대 URL 이면 그대로 둔다(토큰페이지 링크 등).
  if(/^https?:\/\//i.test(p)) return p;
  return window.__API_BASE__.replace(/\/+$/,'') + p;
}
</script>

<!-- 🔴 CDN 없음 — 병원 내부망은 인터넷이 없을 수 있다. -->
<style>
/* ── 인라인: /app-shared.css ── */
/* 접수·문진 화면 공통 껍데기 — 좌측 탭 · 헤더 · 모달 · 토스트.
 *
 * 🔴 CDN 없음 — 병원 내부망은 인터넷이 없을 수 있다.
 * 🔴 이 파일은 **여러 버전 화면(/app-v2 … /app-v6)이 공유**한다. 보드(가운데
 *    본문)만 버전마다 다르고 껍데기는 같아야 버전을 오가도 길을 잃지 않는다.
 *    그래서 보드 전용 규칙은 여기 두지 않는다 — 각 HTML 안에 둔다.
 */

:root{
  --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --tx:#191f28;
  /* 🔴 보조 글자색. 예전 #8b95a1 은 흰 바탕 대비 2.9:1 로 WCAG AA(4.5:1) 미달이었다.
     체어사이드는 조명이 밝고 화면을 비스듬히 본다 — 4.7:1 로 올린다. */
  --dim:#6b7785;
  --dim2:#8b95a1;          /* 장식용(아이콘·구분선). 글자에는 쓰지 않는다. */
  --blue:#3182f6; --blue-d:#1b64da; --blue-bg:#eff6ff;
  --red:#f04452; --red-bg:#fff4f4; --red-d:#c9303c;
  --green:#00875a; --green-bg:#e7f7f0;
  --amber:#b45309; --amber-bg:#fff6e5;
  --purple:#7c3aed; --purple-bg:#f3efff;
  --nav:196px;
  --hdr:56px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);
  font:14px/1.6 Pretendard,-apple-system,system-ui,"Segoe UI",sans-serif;
  /* 🔴 숫자 폭을 **전역으로** 고정한다(2026-10-07 사용자 지시).
     이 화면은 10초마다 다시 그린다 — 환자 수·시각·경과 분이 바뀔 때 숫자마다
     폭이 달라지면(1 은 좁고 0 은 넓다) 글자가 좌우로 흔들려 읽는 눈이 따라간다.
     ⚠️ 선택자마다 따로 붙이지 말 것. 예전엔 14곳에 흩어져 있었고, 그래서 새로
        만든 자리는 늘 빠졌다 — 여기 한 번 걸면 전부 적용된다.
     ⚠️ 한글·영문 폭은 건드리지 않는다(`tabular-nums` 는 숫자 자형만 바꾼다). */
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}

/* 🔴 폼 요소는 글꼴을 **상속하지 않는다**(브라우저 기본값). body 에 건 숫자 폭
     고정이 버튼·입력칸 안에서만 풀려, 「지금」·시간대 이동처럼 숫자가 든 버튼이
     갱신될 때마다 흔들린다. 여기서 다시 걸어 준다.
     ⚠️ `font:` **단축 속성도 같은 효과**를 낸다(쓰지 않은 하위 속성을 initial 로
        되돌린다). 그래서 화면 쪽 버튼의 `font:600 12.5px …` 는 전부
        `font-weight`+`font-size` 로 풀어 뒀다 — 다시 단축으로 합치지 말 것. */
button,input,select,textarea{font-family:inherit;font-variant-numeric:tabular-nums}

/* ── 좌측 탭 ─────────────────────────────────────────────────────────── */
nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);background:var(--card);
  border-right:1px solid var(--line);padding:16px 8px;overflow-y:auto;z-index:500}
nav .brand{display:flex;flex-direction:column;gap:1px;padding:4px 8px 14px}
nav .brand b{font-size:17px;letter-spacing:-.5px}
nav .brand span{font-size:12px;color:var(--dim)}
/* 그룹 이름(진료 · 환자관리 / 리콜 업무 / 관리 / 프로토타입) — **네 개가 모두 같다**.
   예전엔 'WORKSPACE' 같은 작은 라벨용이라 11px 였는데, 이제 메뉴 묶음의 제목이라
   서브탭(13px)보다 또렷해야 어디까지가 한 묶음인지 한눈에 잡힌다. */
nav .grp{font-size:12.5px;color:var(--tx);font-weight:800;padding:14px 9px 6px;
  letter-spacing:-.1px}
nav .grp:first-of-type{padding-top:4px}
nav a{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:9px;
  color:var(--tx);text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer}
nav a:hover{background:#f7f8f9}
/* 🔴 `a.parent` 규칙은 **없앴다**(2026-10-07). 그룹 이름이 전부 `.grp` 로 통일돼
   누를 수 있는 부모 링크 자체가 사라졌다. 「하위가 켜지면 부모는 굵게만」이라는
   예전 규칙도 함께 불필요해졌다 — 이제 켜지는 건 서브탭 하나뿐이다. */
nav a.on{background:var(--blue-bg);color:var(--blue-d)}
/* 서브탭 — 접수·문진 / 예약 가능 시간 / 운영 점검 / API 문서 / 프로토타입 전부
   **같은 크기·굵기·들여쓰기**다. 줄마다 달라 보이면 같은 층인지 매번 다시 읽게 된다. */
nav a.sub{padding-left:20px;font-size:13px;font-weight:500;position:relative}
nav a.sub:before{content:'';position:absolute;left:10px;width:4px;height:4px;
  border-radius:50%;background:var(--line)}
nav a.sub.on:before{background:var(--blue)}
/* 버전 목록 — 접수·문진 아래 한 단 더 들어간다. */
nav a.ver{padding-left:32px;font-size:12.5px;font-weight:500;color:#4e5968}
nav a.ver:before{content:'';position:absolute;left:22px;width:3px;height:3px;
  border-radius:50%;background:var(--line)}
nav a.ver.on{background:var(--blue-bg);color:var(--blue-d);font-weight:700}
nav a.ver.on:before{background:var(--blue)}
nav a.ver .vt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--dim2);
  letter-spacing:.02em}
nav a.ver.on .vt{color:var(--blue-d)}
nav a .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:#f2f4f6;
  color:var(--dim);border-radius:999px;padding:1px 7px}
nav a.on .cnt{background:var(--blue);color:#fff}
nav a.off{color:#aeb6bf;cursor:not-allowed} nav a.off:hover{background:transparent}
nav .navx{display:none;border:0;background:#f2f4f6;border-radius:50%;
  width:30px;height:30px;cursor:pointer;font-size:15px;color:#4e5968;
  position:absolute;right:10px;top:12px;padding:0}

.burger{display:none;border:1px solid var(--line);background:#fbfcfd;border-radius:9px;
  width:34px;height:34px;cursor:pointer;font-size:16px;color:#4e5968;padding:0;flex:0 0 auto}
.burger:hover{background:#f2f4f6;color:var(--tx)}
.scrim{display:none;position:fixed;inset:0;background:rgba(17,20,24,.42);z-index:480}
.scrim.show{display:block}
body.navlock{overflow:hidden}

/* ── 본문 껍데기 ─────────────────────────────────────────────────────── */
.main{margin-left:var(--nav)}
/* 🔴 헤더는 **고정**이다. 완료 카드가 쌓이면 본문이 1만 px 를 넘어가는데
     그때 연결 상태·새로고침·갱신 시각이 화면 밖으로 사라지면,
     10초마다 갱신되는 화면인지 멈춘 화면인지 구분할 길이 없어진다. */
header{position:sticky;top:0;z-index:400;
  background:var(--card);border-bottom:1px solid var(--line);
  padding:0 18px;min-height:var(--hdr);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .crumb{color:var(--dim);font-size:13px}
header .sp{flex:1}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--green-bg);color:var(--green);white-space:nowrap}
.chip.no{background:var(--red-bg);color:var(--red-d)}
.chip.ro{background:#f2f4f6;color:#4e5968}
/* 마지막 갱신 시각 — 화면이 살아 있다는 유일한 증거다. */
.freshen{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.freshen b{font-weight:700;color:#4e5968}
.tool{display:flex;align-items:center;gap:6px}
.btn2{border:1px solid var(--line);background:#fbfcfd;border-radius:9px;height:34px;
  padding:0 11px;cursor:pointer;font-weight:600;font-size:12.5px;color:#4e5968}
.btn2:hover{background:#f2f4f6;color:var(--tx)}
.btn2.on{background:var(--blue-bg);border-color:#cfe1fd;color:var(--blue-d)}
.iconbtn{border:1px solid var(--line);background:#fbfcfd;border-radius:9px;
  width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--dim);padding:0}
.iconbtn:hover{background:#f2f4f6;color:var(--tx)}
.iconbtn.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

main{padding:16px 18px 56px}
.title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin:2px 0 2px}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:14px}

/* 버전 안내 띠 — 어떤 실험인지 한 줄로 밝힌다. */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;margin-bottom:14px}
.vbar .vn{font-size:12px;font-weight:800;letter-spacing:.04em;color:#fff;
  background:var(--purple);border-radius:6px;padding:2px 7px;flex:0 0 auto}
.vbar .vd{font-size:12.5px;color:#4e5968;min-width:0}
.vbar .vd b{color:var(--tx)}

/* 공통 태그 */
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:7px;
  background:#f2f4f6;color:#4e5968;white-space:nowrap}
.tag.new{background:var(--blue-bg);color:var(--blue-d)}
.tag.no{background:var(--red-bg);color:var(--red-d)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.wait{background:var(--amber-bg);color:var(--amber)}

.err{background:var(--red-bg);border:1px solid #ffd0d0;color:#8a1c24;
  border-radius:13px;padding:14px 16px;font-size:13.5px}
.err a{color:#8a1c24}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;
  border:1px dashed var(--line);border-radius:12px}

/* ── 중앙 경고(토스트) ───────────────────────────────────────────────── */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(25,31,40,.94);color:#fff;padding:18px 26px;border-radius:14px;
  font-size:15px;font-weight:600;z-index:999;pointer-events:none;
  box-shadow:0 12px 40px rgba(0,0,0,.28);text-align:center;line-height:1.5;
  opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.toast .s{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:5px}

/* ── 히스토리 모달(카카오톡 단체방 형태) ─────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(17,20,24,.5);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:28px}
.modal .sheet{background:#b2c7da;border-radius:18px;width:100%;max-width:760px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{background:var(--card);padding:16px 20px;display:flex;align-items:center;
  gap:10px;border-bottom:1px solid var(--line)}
.modal .mh b{font-size:17px;letter-spacing:-.3px}
.modal .mh .sp{flex:1}
.modal .x{border:0;background:#f2f4f6;border-radius:50%;width:32px;height:32px;
  cursor:pointer;font-size:16px;color:#4e5968}
.modal .mb{padding:18px;overflow-y:auto;flex:1}
.day{text-align:center;margin:12px 0}
.day span{background:rgba(0,0,0,.25);color:#fff;font-size:11.5px;font-weight:600;
  padding:3px 11px;border-radius:999px}
.bub{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.bub.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:11px;background:#5a6572;color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
/* ⚠️ `.av` 는 11px 을 **그대로 둔다**(2026-10-07 글자 키우기에서 제외). 32×32 원
     안에 이름 두 글자가 들어가야 한다 — 12px 로 올리면 넘쳐 잘린다. */
.bub.me .av{background:var(--blue)}
.bub.dw .av{background:#00875a}
.wrap2{max-width:72%}
.who{font-size:11.5px;color:#2f3a46;margin-bottom:3px}
.bub.me .who{text-align:right}
.msg2{background:#fff;border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:13.5px;
  line-height:1.55;word-break:break-all;white-space:pre-wrap}
.bub.me .msg2{background:#fef01b;border-radius:14px 4px 14px 14px}
.tm2{font-size:10.5px;color:#3f4a55;margin-top:3px}
.bub.me .tm2{text-align:right}
.kindtag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;
  border-radius:5px;background:rgba(0,0,0,.07);margin-right:5px}
.noitem{text-align:center;color:#34414e;font-size:13.5px;padding:40px 0}

/* ── 모바일 ──────────────────────────────────────────────────────────── */
@media(max-width:720px){
  .main{margin-left:0}
  .burger{display:block}
  nav .navx{display:block}
  nav{width:min(272px,82vw);z-index:490;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:none;padding-top:14px}
  nav.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.18)}
  nav .brand{padding-right:42px}
  nav a{padding:11px 11px;font-size:14.5px}
  nav a.sub{padding-left:22px;font-size:14px}
  nav a.ver{padding-left:34px;font-size:13.5px}
  main{padding:12px 12px 56px}
  header{padding:0 12px}
}
/* 넓어지면 서랍 상태가 남아 있어도 평소 탭으로 돌아간다 — 폭 판정은 CSS 가 쥔다.
   JS 의 resize 에만 맡기면 이벤트가 안 오는 웹뷰에서 바탕이 화면을 덮은 채 남는다. */
@media(min-width:721px){
  nav{transform:none}
  .scrim,.scrim.show{display:none}
  body.navlock{overflow:auto}
}

/* 접근성 — 포커스가 어디 있는지 보이게. 10초 폴링으로 DOM 이 갈아끼워지는
   화면이라 키보드 사용자는 특히 길을 잃기 쉽다. */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 히스토리: 진료 기록 줄 · 병력 띠 ─────────────────────────────────
 * 🔴 운영본 /app 에서 쓰던 스타일을 공용으로 올렸다(2026-10-06). 말풍선만
 *    쓰면 「수납 3,900원」·「발치 #18,48」까지 카톡처럼 떠서 환자가 한 말인지
 *    우리가 한 처치인지 구분이 안 된다. */
.rec{display:flex;gap:10px;background:#fff;border-radius:11px;padding:9px 12px;
  margin-bottom:7px;align-items:flex-start}
.rec .rtm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap;padding-top:2px;flex:0 0 38px}
.rec .rbody{min-width:0;flex:1}
.rec .rhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.rec .rhead b{font-weight:700;letter-spacing:-.2px}
.rec .rtext{font-size:13px;color:#4e5968;margin-top:3px;line-height:1.55;
  white-space:pre-wrap;word-break:break-all}
.rec .tooth{font-size:11.5px;font-weight:700;color:var(--blue-d);
  background:var(--blue-bg);border-radius:6px;padding:1px 6px}
.rec .rmeta{font-size:11.5px;color:var(--dim)}
/* 진료 시작·끝은 흐름의 매듭 — 왼쪽에 선을 세워 눈에 걸리게 한다. */
.rec.flow{background:#f7f9fa;border-left:3px solid var(--blue)}
/* 종류별 색 — 돈·병력은 특히 눈에 띄어야 한다. */
.rec.k-수납 .kindtag{background:var(--green-bg);color:var(--green)}
.rec.k-병력{background:var(--red-bg)}
.rec.k-병력 .kindtag{background:#ffd9d9;color:var(--red)}
.rec.k-진료 .kindtag{background:var(--blue-bg);color:var(--blue-d)}
/* 전화(콜백·리콜 노트)와 상담(치료계획)은 **사람이 말을 건 기록**이라 따로 세운다. */
.rec.k-전화 .kindtag{background:#f3e8ff;color:#7e22ce}
.rec.k-상담 .kindtag{background:#fff6e5;color:var(--amber)}
.rec.k-다음예약 .kindtag,.rec.k-예약 .kindtag{background:#e8f3ff;color:#1b64da}
/* 🔴 미수(안 받은 돈)는 눈에 걸려야 한다 — 수납과 같은 초록이면 낸 줄로 읽힌다. */
.rec.k-수납 .rhead b{color:var(--green)}
.rec.k-수납.unpaid{background:var(--amber-bg)}
.rec.k-수납.unpaid .kindtag{background:#ffe4b5;color:var(--amber)}
.rec.k-수납.unpaid .rhead b{color:var(--amber)}

/* 🔴 병력 띠 — 맨 위에 **붙어 따라온다**(sticky). 스크롤하면 사라지는 자리에 두면
   긴 이력에서는 못 본 것과 같다. 발치·수술 전에 눈에 걸려야 하는 값이다. */
.pmhbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;
  background:var(--red-bg);border:1px solid #ffd0d0;border-radius:11px;
  padding:9px 11px;margin-bottom:10px}
.pmhbar:before{content:'병력';font-size:12px;font-weight:700;color:var(--red);
  align-self:center;margin-right:2px}
.pmhchip{font-size:12.5px;font-weight:600;color:#8a1c24;background:#fff;
  border-radius:7px;padding:2px 8px}

/* ─── 할 일 띠 ─── /app-alerts.js 가 그린다. V2(/clinic/reception)·V3 공용.
   🔴 화면 쪽 <style> 로 되돌리지 말 것 — 두 화면이 같은 띠를 쓰므로 모양이
      갈라진다(2026-10-07 사용자 지시로 V2 에서 여기로 옮겼다). */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:#cfd6dd;background:#fbfcfd}
.kpi.sel{border-color:var(--blue);background:var(--blue-bg)}
/* 🔴 누를 수 없는 박스(거를 대상이 아닌 값)는 **손 모양을 주지 않는다** —
     눌러도 안 바뀌는데 커서만 바뀌면 고장으로 읽힌다.
     `.flat` 은 아예 <div> 로 그린 것(V3 처럼 필터가 없는 화면).
     ⚠️ `.kpi:hover` **뒤에** 와야 덮어쓴다(CSS 는 나중 규칙이 이긴다). */
.kpi[data-f=""],.kpi.flat{cursor:default}
.kpi[data-f=""]:hover,.kpi.flat:hover{border-color:var(--line);background:var(--card)}
/* 아직 셀 수 없는 값 — 0 과 **반드시 달라 보여야** 한다. */
.kpi .unk{color:var(--dim2);font-weight:700}
.kpi .n{font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--dim);margin-top:1px}
.kpi.warn{border-color:#f6c9cd;background:var(--red-bg)}
.kpi.warn .n{color:var(--red-d)}
.kpi.calm .n{color:var(--dim2)}      /* 0 건이면 경고가 아니다 — 색을 뺀다 */

</style>
<style>
/* 🔴 표식 모서리 — **원이 아니라 네모에 가까운 둥근 네모**다(사용자 지시 2026-10-07).
 *    점·범례·칸 제목 표식·빈 체어 구멍이 **전부 이 값 하나**를 쓴다. 여기만 고치면
 *    화면의 모든 표식이 같이 바뀐다 — 한 군데라도 `50%` 로 남으면 원과 네모가
 *    섞여 「다른 뜻인가」로 읽힌다.
 *    sm = 9px 이하 작은 표식(비율상 더 작은 반경이라야 네모로 보인다).
 */
:root{--mark-r:5px;--mark-r-sm:3px}

/* ── V3 : 「환자 1명 = 점 1개」 ─────────────────────────────────────────
 *
 * 생각의 출발: 데스크 직원이 지나가며 1초 보는 화면과, 앉아서 찾는 화면은
 * 다른 물건이다. 카드는 후자에 맞춰져 있다 — 91명이면 1만 px 가 된다.
 * 1초짜리 질문은 셋뿐이다.
 *      「많아? 적어?」 「급한 사람 있어?」 「어디가 막혔어?」
 * 셋 다 **개수와 색**이면 답이 된다. 글자는 필요할 때만 꺼낸다.
 *
 * 그래서: 점의 **양** = 혼잡도, 점의 **색** = 그 환자의 상태,
 *         마우스를 올리면 그 점만 **펼쳐서** 누구인지 보여준다.
 *
 * ⚠️ 점은 작아서 **못 누르는 사람이 생긴다.** 그래서 (1) 점을 14px 이상으로 두고
 *    (2) 호버 말고 **클릭으로도** 같은 내용이 열리게 하고 (3) 키보드 Tab 으로
 *    점을 지나갈 수 있게 한다. 호버 전용으로 만들면 터치 화면에서 죽는다.
 */

/* ── 혼잡도 띠 — 화면 맨 위, 전체를 한 줄로 ───────────────────────── */
.gauge{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gcard{flex:1 1 170px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;min-width:0;position:relative;overflow:hidden}
.gcard .gt{font-size:12px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
/* 🔴 표식은 **모서리 둥근 네모**다(사용자 지시 2026-10-07). 원(50%)이 아니다.
   한 화면에 원과 네모가 섞이면 「다른 뜻인가」로 읽힌다 — 모양을 한 벌로 맞춘다.
   값은 `--mark-r` 하나로 묶어 둔다. 여기만 고치면 점·범례·표식이 같이 바뀐다. */
.gcard .gt .dotmark{width:8px;height:8px;border-radius:var(--mark-r-sm)}
.gcard .gn{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:2px;
  font-variant-numeric:tabular-nums;line-height:1.2}
.gcard .gs{font-size:11.5px;color:var(--dim)}
/* 혼잡도 막대 — 숫자만 있으면 「12명」이 많은지 적은지 알 수 없다.
   오늘 가장 붐빈 단계를 100 으로 두고 상대 높이를 보여 준다. */
.gbar{height:4px;border-radius:99px;background:#eef1f4;margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px}
.gcard.alert{border-color:#f6c9cd;background:var(--red-bg)}
.gcard.alert .gn{color:var(--red-d)}

/* ── 단계 패널 ──────────────────────────────────────────────────────── */
/* 🔴 네 칸은 **2×2**로 놓는다(사용자 지시 2026-10-07). 한 줄에 넷을 세우면
 *    칸마다 폭이 좁아 점이 세로로 길게 쌓이고, 진료 중 체어는 이름이 잘린다
 *    (예전 1×4 때 「1층엑스레이」가 12칸 중 7칸 잘렸다 — 그래서 진료 중 칸만
 *    1.9배로 넓혀 두었었다. 2×2 면 그 요령이 필요 없다).
 *    ⚠️ 1×4 로 되돌리지 말 것.
 *    🔴 **같은 줄끼리 키를 맞춘다**(`align-items:stretch` = 기본값). 예전엔
 *       `min-content`+`start` 로 칸마다 제 내용만큼만 차지하게 했는데, 그러면
 *       체어 12개가 든 「진료 중」만 혼자 길어지고 옆의 「접수·대기」는 쪼그라들어
 *       키가 안 맞는다 — 사용자 지적 2026-10-07.
 *    🔴 행 비율은 **2:1** 이다. 윗줄(접수·대기 / 진료 중)은 체어 2줄이 들어가야
 *       하고, 아랫줄(수납 대기 / 완료 및 문의)은 점 몇 개와 숫자뿐이다. 1:1 로
 *       나누면 아래가 텅 빈 채로 커진다.
 *    ⚠️ `columns:2` 로 바꾸지 말 것. 빈 자리는 없어지지만 칸이 **세로로 흘러**
 *       접수→진료→수납→완료 순서가 깨진다(수납이 우측 위로 올라갔다 — 실측).
 *       데스크는 이 순서를 왼쪽부터 읽는다. */
.panels{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr;gap:12px}
@media(max-width:760px){.panels{grid-template-columns:1fr;grid-template-rows:none}}
/* 칸은 늘어난 키를 받아 **내용을 위에서부터** 쌓는다. 가운데로 뜨면 허전하다. */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;
  display:flex;flex-direction:column;min-height:0}
.panel .ph{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.panel .ph .dotmark{width:9px;height:9px;border-radius:var(--mark-r-sm);flex:0 0 auto}
.panel .ph .t{font-size:14px;font-weight:700}
.panel .ph .c{margin-left:auto;font-size:18px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.panel .ph .c small{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:2px}

/* 점밭 — 간격을 좁게 둬야 **덩어리의 크기**가 혼잡도로 읽힌다.
   넓게 띄우면 10개도 많아 보여 「많다/적다」 판단이 망가진다. */
/* 칸이 늘어난 키를 받으면 점밭도 같이 늘어나되, 넘치면 **칸 안에서** 스크롤한다.
   🔴 `overflow:auto` 를 빼지 말 것 — 환자가 몰리는 날 점이 칸을 뚫고 나가
      아래 예약 영역을 밀어낸다. */
.dots{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;
  flex:1 1 auto;overflow-y:auto;min-height:28px}
.dot{width:16px;height:16px;border-radius:var(--mark-r);border:0;padding:0;cursor:pointer;
  position:relative;flex:0 0 auto;
  transition:transform .09s ease, box-shadow .09s ease}
.dot:hover,.dot:focus-visible{transform:scale(1.45);z-index:20;
  box-shadow:0 0 0 3px #fff, 0 2px 10px rgba(0,0,0,.22)}
/* 색 = 그 환자의 지금 상태.
   🔴 색만으로 뜻을 전하지 않는다 — 색각이상이면 빨강·초록이 같아 보인다.
      급한 점에는 **테두리 고리**를 둘러 모양으로도 구분되게 한다. */
.dot.d-ok   {background:#7f8c9b}                       /* 특별할 것 없음 */
.dot.d-new  {background:var(--blue)}                   /* 신환 */
.dot.d-noint{background:#f0a73a}                       /* 문진 없음(진료 전) */
.dot.d-urg  {background:var(--red);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(240,68,82,.35)}
.dot.d-done {background:#c3cbd4}                       /* 끝난 사람 — 뒤로 물린다 */
.dot.d-in   {background:var(--green)}
/* 숨 — 20분 넘게 기다린 점은 천천히 깜빡인다. 가만히 있는 화면에서
   움직이는 것 하나는 눈이 반드시 찾아낸다. */
@keyframes bre{0%,100%{opacity:1}50%{opacity:.45}}
.dot.d-urg{animation:bre 1.9s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.dot.d-urg{animation:none}}

/* 10명 단위 자리 — 세어 보지 않고도 개수를 읽게 한다.
   점 10개마다 한 칸 띄우면 「세 덩어리 반 = 35명」이 눈으로 세진다. */
.dots .gap{flex-basis:100%;height:0}
.dots .sp10{width:7px;height:16px;flex:0 0 auto}

/* 완료 칸 — 점 대신 **제목 줄 인원수 왼쪽의 회색 네모**(사용자 지시 2026-10-07).
   🔴 칸 아래에 네모+인원수를 따로 놓지 말 것. 올리면 명단이 펼쳐진다. */
.donec{display:inline-flex;align-items:center;gap:7px}
.donebox{width:17px;height:17px;border-radius:var(--mark-r-sm);background:#c3cbd4;
  border:0;padding:0;cursor:pointer;flex:0 0 auto;
  transition:transform .09s ease, box-shadow .09s ease}
.donebox:hover,.donebox:focus-visible{transform:scale(1.18);
  box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.2);outline:none}

/* 완료 명단 — 🔴 **본문 폭을 꽉 채운다**(사용자 지시). 칸 안에 가두면
   50명이 세로로 길어져 또 스크롤이 된다. 가로로 펼쳐야 한눈에 들어온다.
   ⚠️ `left/right:0` 으로 **화면 전체**를 덮지 않는다. 좌측 탭(`#nav`) 위로 올라가
      이름이 사이드바에 잘려 들어간다(실측 2026-10-07). 폭은 본문 기준으로 잡는다.
   ⚠️ 명단이 길면 **세로 스크롤**은 허용하되 화면 높이를 넘지 않게 묶는다 —
      넘치면 아래쪽 이름이 화면 밖으로 나가 영영 안 보인다. */
.donelist{position:fixed;z-index:60;background:var(--card);
  border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);padding:12px 16px 14px}
.donelist .dh{font-size:12.5px;color:var(--dim);margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.donelist .dh b{font-size:13.5px;color:var(--fg)}
.donelist .dl{display:flex;flex-wrap:wrap;gap:6px;
  max-height:46vh;overflow-y:auto}
.donelist .di{border:1px solid var(--line);border-radius:9px;background:#fbfcfd;
  padding:5px 9px;font-size:12px;line-height:1.45;min-width:0;
  display:flex;align-items:baseline;gap:6px}
.donelist .di .dn{font-weight:700;white-space:nowrap}
.donelist .di .dc{color:var(--dim2);font-size:12px;white-space:nowrap}
.donelist .di .dt{color:var(--dim);font-size:12px;white-space:nowrap}

.legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px;font-size:11.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:var(--mark-r-sm);display:inline-block}

/* ── 체어 혼잡도 — 「어디가 막혔나」 ───────────────────────────────── */
.chairs{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 13px}
.chairs .ph{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.chairs .ph .sub2{font-size:12px;font-weight:500;color:var(--dim)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.chbox{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:#fbfcfd;
  min-width:0}
.chbox.busy{background:var(--green-bg);border-color:#bfe6d4}
.chbox.room{opacity:.62}                 /* 엑스레이실 — 진료 체어가 아니다 */
.chbox .cn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.chbox .cs{font-size:11.5px;color:var(--dim);margin-top:2px}
.chbox .cd{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
/* ⚠️ 빈 체어 칸은 **점이 들어갈 자리를 비워 두지 않는다.** 비워 두면 12칸이
     각각 세로 24px 씩, 합쳐 290px 를 아무것도 없이 차지한다(실측 2026-10-06).
     「비어 있음」 한 줄이면 할 말은 이미 다 했다. */
.chbox:not(.busy) .cd{display:none}
.nodots{font-size:12.5px;color:var(--dim2);padding:4px 0}

/* ── 진료 중 — 체어를 둥근 네모로 깔고 쓰는 자리에 초록 동그라미 ────────── */
/* 🔴 **2줄로 맞춘다**(사용자 지시 2026-10-07). 체어 12개 ÷ 6열 = 정확히 2줄.
 *
 * ⚠️ **「진료 중」 칸 안에 넣으면 2줄이 안 된다.** 그 칸은 4칸 격자의 1/4 —
 *    실측 330px 이라 6열이면 한 칸 50px 인데, 「1층엑스레이」는 56px 이 필요해
 *    12개 전부 잘렸다(실측 2026-10-07). 폰트를 10.5px 까지 줄여도 안 들어간다.
 *    → 체어 격자는 **패널 아래 전체 폭**을 쓴다(`.panel.seats` 가 격자 한 줄을
 *      통째로 차지). 1400px 급에서 한 칸 ~220px 이라 이름이 온전히 들어간다. */
.chairrow{display:grid;grid-template-columns:repeat(var(--seat-cols,6),minmax(0,1fr));
  gap:6px;padding:2px 0;align-content:start}
/* 좁아지면 2줄을 포기하고 접는다 — 글자가 뭉개지는 것보다 줄이 느는 편이 낫다. */
@media(max-width:900px){.chairrow{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.chairrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* 🔴 체어 한 칸은 **2줄**이다(사용자 지시 2026-10-07) — 위에 이름, 아래에 사람.
 *    예전엔 3줄(이름/상태/점)이었다가 1줄(이름 옆에 점)로 줄였는데, 1줄은 점이
 *    늘면 이름을 밀어내 잘린다. 2줄이면 이름은 이름대로 온전하고, 점은 아래에서
 *    옆으로 번진다. ⚠️ 1줄로 되돌리지 말 것. */
.seat{border:1.5px solid var(--line);border-radius:11px;padding:6px 9px;background:#fbfcfd;
  min-width:0;display:flex;flex-direction:column;gap:5px}
